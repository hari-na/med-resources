          'stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>' +
          'Back</button>'
        : '') +
      '<span class="spacer"></span>' +
      (inGuide ? '' : '<button class="ghost" id="themeBtn" title="Switch theme" ' +
      'aria-label="Theme: ' + THEME_LABEL[t] + '">' + ICONS[t] + THEME_LABEL[t] + '</button>');

    var b = document.getElementById("navBack");
    if (b) b.addEventListener("click", function () { if (backTo) backTo(); });
    var tb = document.getElementById("themeBtn");
    if (tb) tb.addEventListener("click", function () {
      setTheme(THEMES[(THEMES.indexOf(currentTheme()) + 1) % THEMES.length]);
    });
  }

  var stack = [];

  function paint() {
    var render = stack[stack.length - 1];
    var wasGuide = inGuide;
    inGuide = (render === screenGuide);
    // The reader's rail, studio, bubble, note editor and source pane are appended to
    // document.body, while this swaps #app.innerHTML. Leaving a guide therefore removed
    // the guide and left its chrome behind: the source pane covering the case list, the
    // tool rail pinned over the viva with the pen still armed, and twelve tool buttons in
    // the tab order of every screen.
    if (wasGuide && !inGuide && window.Reader && window.Reader.unmount) {
      window.Reader.unmount();
    }
    document.body.setAttribute("data-screen", inGuide ? "guide" : "app");
    backTo = stack.length > 1 ? back : null;
    renderTopbar();
    render();
    window.scrollTo(0, 0);
  }

  function go(render)      { stack.push(render); paint(); }
  function replace(render) { stack[stack.length - 1] = render; paint(); }
  function reset(render)   { stack = [render]; paint(); }
  function back()          { if (stack.length > 1) { stack.pop(); paint(); } }

  // ------------------------------------------------------------------ helpers

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function on(id, ev, fn) { var el = document.getElementById(id); if (el) el.addEventListener(ev, fn); }
  function when(iso) {
    var d = new Date(iso), now = new Date();
    var days = Math.floor((now - d) / 86400000);
    if (days === 0) return "today";
    if (days === 1) return "yesterday";
    if (days < 7) return days + " days ago";
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }

  // ------------------------------------------------------------------ state

  var student = { key: "", name: "" };
  var db = null, dbReady = false;
  var queue = [], idx = 0, results = [], level = 1;

  // ------------------------------------------------------------------ index

  function tilesFor(kind) {
    return CASES.filter(function (c) { return c.kind === kind; }).map(function (c) {
      return '<button class="tile" id="case-' + c.id + '">' +
             '<span class="ico">' + c.num + '</span>' +
             '<span class="t-name">' + esc(c.name) + '</span>' +
             '<span class="t-desc">' + (c.kind === "long" ? "Long case" : "Short case") +
             '. Study guide and printable PDF' + (bankFor(c).length ? ', plus the scored viva drill' : '') +
             '.</span><span class="t-go">&rarr;</span></button>';
    }).join("");
  }

  function screenIndex() {
    app.innerHTML =
      '<div class="who"><span>Signed in as <b>' + esc(student.name) + '</b></span>' +
      '<button class="btn" id="swapWho" style="padding:.25rem .6rem;font-size:.75rem">Switch</button></div>' +
      '<p class="eyebrow">' + esc(SUBJECT) + ' · MBBS final year</p>' +
      '<h1>Surgery Case Files</h1>' +
      '<p class="sub">History and examination with the reasoning attached to every step, ' +
      'management with the rationale for every decision, and a viva drill that tracks what you ' +
      'keep getting wrong. Built from S Das, Bailey &amp; Love and SRB.</p>' +
      '<div class="tiles">' + tilesFor("long") + '</div>' +
      '<h2 style="margin-top:1.6rem">Short cases</h2>' +
      '<div class="tiles">' + tilesFor("short") + '</div>' +
      '<div class="srckey">' +
        '<span><i style="background:#005f73"></i> S Das 13e: clinical method</span>' +
        '<span><i style="background:#5b4a8a"></i> Bailey &amp; Love 28e: mechanism and management</span>' +
        '<span><i style="background:#1f6b5c"></i> SRB 6e: exam framework</span>' +
      '</div>';
    CASES.forEach(function (c) {
      on("case-" + c.id, "click", function () { CASE = c; go(screenCase); });
    });
    on("swapWho", "click", function () { reset(screenWelcome); });
  }

  // ------------------------------------------------------------------ case hub

  function screenCase() {
    var studs = allStudents();
    var totalSessions = studs.reduce(function (n, s) { return n + s.sessions.length; }, 0);
    var line = totalSessions
      ? '<b>' + totalSessions + '</b> viva session' + (totalSessions === 1 ? '' : 's') +
        ' recorded on this device across <b>' + studs.length + '</b> ' +
        (studs.length === 1 ? 'person' : 'people') + '.'
      : 'Nothing drilled yet. The viva marks itself against your own honesty, so answer out loud first.';

    var blurb = BLURB[CASE.id] ||
      ("Full case with the reasoning attached to every history question, examination finding, " +
       "investigation and treatment decision, and the amber boxes wherever S Das, Bailey & Love " +
       "and SRB disagree.");

    app.innerHTML =
      '<p class="eyebrow">' + (CASE.kind === "long" ? "Long case " : "Short case ") + CASE.num +
      '</p>' +
      '<h1>' + esc(CASE.name) + '</h1>' +
      '<p class="sub">' + esc(blurb) + '</p>' +
      '<div class="tiles">' +
        '<button class="tile" id="goGuide">' +
          '<span class="ico">READ</span><span class="t-name">Study guide</span>' +
          '<span class="t-desc">Full case with rationale on every history question, examination ' +
          'finding, investigation and treatment decision. Set it up how you like to read, and ' +
          'highlight, annotate or write on it.</span>' +
          '<span class="t-go">&rarr;</span></button>' +
        (bankFor(CASE).length
          ? '<button class="tile" id="goViva">' +
            '<span class="ico">VIVA</span><span class="t-name">Viva drill</span>' +
            '<span class="t-desc">' + bankFor(CASE).length + ' questions across three levels. Tracks ' +
            'which kinds of question you miss and tells you what to revise.</span>' +
            '<span class="t-go">&rarr;</span></button>'
          : '<div class="tile muted">' +
            '<span class="ico">VIVA</span><span class="t-name">Viva drill</span>' +
            '<span class="t-desc">No scored drill for this case yet. The study guide ends with ' +
            'its own viva section: the questions are there with the answers hidden until you tap ' +
            'them, so answer out loud first.</span>' +
            '<span class="t-go">&middot;</span></div>') +
        '<button class="tile" id="goProgress">' +
          '<span class="ico">STATS</span><span class="t-name">Your progress</span>' +
          '<span class="t-desc">Everything drilled so far: coverage, accuracy by topic, and ' +
          'every past session.</span>' +
          '<span class="t-go">&rarr;</span></button>' +
        '<button class="tile" id="goPdf">' +
          '<span class="ico">PDF</span><span class="t-name">Printable PDF</span>' +
          '<span class="t-desc" id="pdfDesc">The whole study guide laid out for paper, with ' +
          'every answer opened.</span>' +
          '<span class="t-go">&darr;</span></button>' +
      '</div>' +
      '<p class="meta-line">' + line + '</p>';

    on("goGuide", "click", function () { go(screenGuide); });
    on("goPdf", "click", savePdf);
    if (bankFor(CASE).length) on("goViva", "click", function () { go(screenLevels); });
    on("goProgress", "click", function () { go(screenProgress); });
  }

  // ------------------------------------------------------------------ sign in


  // ------------------------------------------------------------------ levels

  function screenLevels() {
    // A case with no bank cannot be drilled. Without this, "Start a session" on such a case
    // ran another case's questions and filed them under this one's id.
    if (!bankFor(CASE).length) {
      app.innerHTML =
        '<div class="who"><span>' + esc(CASE.name) + '</span></div>' +
        '<h2>No scored drill yet</h2>' +
        '<p class="sub">This case has its study guide and its PDF. The scored viva, with ' +
        'levels and progress, has not been written for it yet.</p>' +
        '<div class="row"><button class="btn primary" id="read">Open the study guide</button>' +
        '<button class="btn" id="back2">Back</button></div>' + askHtml();
      on("read", "click", function () { replace(screenGuide); });
      on("back2", "click", function () { back(); });
      wireAsk();
      return;
    }
    var rec = studentRec(student.key);
    var hist = rec ? rec.sessions : [];
    var mine = hist.filter(function (s) { return s.caseId === CASE.id; });

    var html =
      '<div class="who"><span>Drilling as <b>' + esc(student.name) + '</b></span></div>' +
      '<h2>Choose your level</h2>' +
      '<p class="sub">Answer out loud, then mark yourself honestly, the summary is only useful ' +
      'if the marking is.</p><div class="levels">';

    LEVELS.forEach(function (L) {
      var n = bankFor(CASE).filter(function (q) { return q.lv === L.n; }).length;
      var past = mine.filter(function (s) { return s.level === L.n; });
      var meta = n + " questions";
      if (past.length) {
        meta += " · best " + Math.max.apply(null, past.map(function (s) { return s.pct; })) +
                "% · " + past.length + " attempt" + (past.length === 1 ? "" : "s");
      }
      html += '<button class="level" data-lv="' + L.n + '">' +
              '<span class="lv-name">' + esc(L.name) + '</span>' +
              '<span class="lv-desc">' + esc(L.desc) + '</span>' +
              '<span class="lv-meta">' + meta + '</span></button>';
    });
    html += '</div><div class="row"><button class="btn" id="seeProgress">Your progress</button>' +
            '<button class="btn" id="switch">Switch person</button></div>';

    app.innerHTML = html;
    [].forEach.call(app.querySelectorAll(".level"), function (b) {
      b.addEventListener("click", function () { startDrill(+b.dataset.lv); });
    });
    on("switch", "click", function () { reset(screenWelcome); });
    on("seeProgress", "click", function () { go(screenProgress); });
  }

  // ------------------------------------------------------------------ drill

  function startDrill(lv, inPlace) {
    level = lv;
    queue = shuffle(bankFor(CASE).filter(function (q) { return q.lv === lv; }).slice());
    idx = 0; results = []; results.recorded = false;
    // back from any question returns to the level list, not the previous question
    if (inPlace) replace(screenQuestion); else go(screenQuestion);
  }

  function head(q) {
    var pct = Math.round(idx / queue.length * 100);
    return '<div class="progress"><span>' + esc(LEVELS[level-1].name) + '</span>' +
           '<span>' + (idx + 1) + ' / ' + queue.length + '</span></div>' +
           '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
           '<span class="qtag">' + esc(q.type) + '</span>' +
           '<p class="question">' + esc(q.q) + '</p>';
  }

  function screenQuestion() {
    if (idx >= queue.length) { replace(screenSummary); return; }
    var q = queue[idx];
    app.innerHTML = head(q) +
      '<div class="row end"><button class="btn primary" id="reveal">Show the answer</button></div>';
    on("reveal", "click", function () { revealAnswer(q); });
  }

  function revealAnswer(q) {
    app.innerHTML = head(q) +
      '<div class="answer"><span class="tag">Answer</span>' + esc(q.a) +
      '<span class="ref">' + esc(q.ref) + '</span></div>' +
      '<div class="grade">' +
      '<button class="btn missed" id="no">I missed this</button>' +
      '<button class="btn got" id="yes">I had it</button></div>';
    on("yes", "click", function () { mark(q, true); });
    on("no", "click", function () { mark(q, false); });
  }

  function mark(q, ok) {
    results.push({ id: q.id, type: q.type, correct: ok });
    recordAnswer(q, ok);     // durable, before anything can navigate away
    idx++;
    screenQuestion();
  }

  // ------------------------------------------------------------------ summary

  function screenSummary() {
    var total = results.length;
    var score = results.filter(function (r) { return r.correct; }).length;
    var pct = total ? Math.round(score / total * 100) : 0;

    var byType = {};
    results.forEach(function (r) {
      if (!byType[r.type]) byType[r.type] = { ok: 0, n: 0 };
      byType[r.type].n++;
      if (r.correct) byType[r.type].ok++;
    });
    var types = Object.keys(byType).sort(function (a, b) {
      return (byType[a].ok / byType[a].n) - (byType[b].ok / byType[b].n);
    });
    var weakest = types.filter(function (t) { return byType[t].ok / byType[t].n < 0.7; });

    var rec = {
      studentKey: student.key, studentName: student.name,
      subject: SUBJECT, caseId: CASE.id, caseName: CASE.name,
      level: level, levelName: LEVELS[level-1].name,
      score: score, total: total, pct: pct,
      byType: byType, weakest: weakest,
      missed: results.filter(function (r) { return !r.correct; }).map(function (r) { return r.id; }),
      seen: results.map(function (r) { return r.id; }),
      at: new Date().toISOString()
    };
    // screenSummary is a render function and Back re-runs it, so recording here without a
    // guard wrote the same session again on every return, inflating attempts and the
    // completed-levels list and posting a duplicate row each time.
    if (!results.recorded) {
      results.recorded = true;
      recordSession(rec);
    }

    var html =
      '<div class="who"><span>Session complete · <b>' + esc(student.name) + '</b></span></div>' +
      '<h2>' + esc(LEVELS[level-1].name) + '</h2>' +
      '<p class="score">' + pct + '%<small> &nbsp;' + score + ' of ' + total + '</small></p>' +
      '<div class="breakdown">';
    types.forEach(function (t) {
      var d = byType[t], p = Math.round(d.ok / d.n * 100);
      html += '<div class="brow"><span class="bname">' + esc(t) + '</span>' +
              '<span class="bval">' + d.ok + '/' + d.n + '</span>' +
              '<span class="btrack"><i style="width:' + p + '%;background:' +
              (p >= 70 ? "var(--good)" : "var(--miss)") + '"></i></span></div>';
    });
    html += '</div>';
    html += weakest.length
      ? '<div class="verdict weak"><b>Work on ' + esc(weakest.join(", ")) + '.</b> Go back to ' +
        'those sections of the study guide before the next session.</div>'
      : '<div class="verdict strong"><b>Solid across every category.</b> Move up a level, or come ' +
        'back in a few days to test retention rather than recall.</div>';
    html += '<div class="row"><button class="btn" id="retry">Retry this level</button>' +
            '<button class="btn" id="levels">Another level</button>' +
            '<button class="btn primary" id="prog">Your progress</button></div>';

    app.innerHTML = html;
    on("retry", "click", function () { level = level; startDrill(level, true); });
    on("levels", "click", function () { replace(screenLevels); });
    on("prog", "click", function () { go(screenProgress); });

    syncSession(rec);
  }

  // ------------------------------------------------------------------ progress

  function screenProgress() {
    // a pull may still be in flight from sign-in; repaint once it lands
    if (SYNC && student.key && screenProgress._pulled !== student.key && !answersReady()) {
      // keyed by student, and only counted as done once the pull has actually succeeded,
      // so a failed pull no longer leaves the page showing "nothing drilled yet" forever
      screenProgress._pulled = student.key;
      pullAnswers(function () {
        if (!answersReady()) screenProgress._pulled = "";
        if (stack[stack.length - 1] === screenProgress) paint();
      });
    }

    var rec = studentRec(student.key);
    var sessions = (rec ? rec.sessions : []).filter(function (s) { return s.caseId === CASE.id; });
    sessions = sessions.slice().sort(function (a, b) { return new Date(b.at) - new Date(a.at); });

    var html = '<div class="who"><span>Progress for <b>' + esc(student.name) + '</b> · ' +
               esc(CASE.name) + '</span></div><h2>Where you stand</h2>';

    // Everything below is built from the per-question history rather than from finished
    // sessions. A single answered question counts, which is the whole point: this page used
    // to say "nothing here" to someone who had just answered three.
    var qs = answersForCase(student.key);
    var qids = Object.keys(qs);

    if (!qids.length && !sessions.length) {
      html += '<div class="empty">Nothing drilled yet for this case. Answer a single question ' +
              'and it is kept, so this page fills in as you go, even if you stop part way.</div>' +
              '<div class="row"><button class="btn primary" id="start">Start a session</button>' +
              '<button class="btn" id="switch">Switch person</button></div>' + askHtml();
      app.innerHTML = html;
      on("start", "click", function () { go(screenLevels); });
      on("switch", "click", function () { reset(screenWelcome); });
      wireAsk();
      return;
    }

    var agg = {}, totalQ = 0, totalOk = 0, wrongNow = [];
    qids.forEach(function (id) {
      var r = qs[id], t = r.t || "Uncategorised";
      if (!agg[t]) agg[t] = { ok: 0, n: 0 };
      agg[t].ok += r.ok; agg[t].n += r.n;
      totalQ += r.n; totalOk += r.ok;
      if (!r.last) wrongNow.push(id);
    });

    var seenCount = qids.length;
    var bankSize = bankFor(CASE).length;
    var coverage = bankSize ? Math.round(seenCount / bankSize * 100) : 0;
    var overall = totalQ ? Math.round(totalOk / totalQ * 100) : 0;
    var best = sessions.length
      ? Math.max.apply(null, sessions.map(function (s) { return s.pct; })) : null;

    html += '<div class="stats">' +
      '<div class="stat"><div class="sv">' + seenCount +
        '<span style="font-size:.6em;color:var(--ink-soft)">/' + bankSize + '</span></div>' +
        '<div class="sl">questions met (' + coverage + '%)</div></div>' +
      '<div class="stat"><div class="sv">' + overall + '%</div>' +
        '<div class="sl">answered right, all attempts</div></div>' +
      '<div class="stat"><div class="sv">' + wrongNow.length + '</div>' +
        '<div class="sl">wrong last time</div></div>' +
      '<div class="stat"><div class="sv">' + (best === null ? '&mdash;' : best + '%') + '</div>' +
        '<div class="sl">' + (best === null ? 'no full level yet' : 'best full level') + '</div></div>' +
      '</div>';

    if (wrongNow.length) {
      var byTypeWrong = {};
      wrongNow.forEach(function (id) {
        var t = qs[id].t || "Uncategorised";
        byTypeWrong[t] = (byTypeWrong[t] || 0) + 1;
      });
      var parts = Object.keys(byTypeWrong).sort(function (a, b) {
        return byTypeWrong[b] - byTypeWrong[a];
      }).map(function (t) { return byTypeWrong[t] + " in " + t.toLowerCase(); });
      html += '<div class="verdict weak"><b>' + wrongNow.length + ' question' +
              (wrongNow.length === 1 ? '' : 's') + ' you got wrong the last time you met ' +
              (wrongNow.length === 1 ? 'it' : 'them') + ':</b> ' + esc(parts.join(", ")) +
              '. These are the ones worth going back to first.</div>';
    }

    if (bankSize && seenCount >= bankSize) {
      html += '<div class="verdict info"><b>You have been through every question in this case.</b> ' +
              'Repeating them now tests retention rather than recall, which is the more useful ' +
              'thing this close to an exam. If you want more, ask for the bank to be extended, ' +
              'your results are kept, so new questions slot in alongside these.</div>';
    }

    // cumulative accuracy by topic
    var types = Object.keys(agg).sort(function (a, b) {
      return (agg[a].ok / agg[a].n) - (agg[b].ok / agg[b].n);
    });
    html += '<h3>Accuracy by topic, every attempt</h3><div class="breakdown">';
    types.forEach(function (t) {
      var d = agg[t], p = Math.round(d.ok / d.n * 100);
      html += '<div class="brow"><span class="bname">' + esc(t) + '</span>' +
              '<span class="bval">' + d.ok + '/' + d.n + ' · ' + p + '%</span>' +
              '<span class="btrack"><i style="width:' + p + '%;background:' +
              (p >= 70 ? "var(--good)" : "var(--miss)") + '"></i></span></div>';
    });
    html += '</div>';

    var weak = types.filter(function (t) { return agg[t].ok / agg[t].n < 0.7; });
    if (weak.length) {
      html += '<div class="verdict weak"><b>Consistently weak: ' + esc(weak.join(", ")) + '.</b> ' +
              'These are the sections of the study guide to reread before the next session.</div>';
    }

    html += '<h3>Completed levels</h3><div class="hist">';
    if (!sessions.length) {
      html += '<div class="empty" style="margin:0">No level finished end to end yet. Your ' +
              'answers so far are all kept either way, this list is just the full runs.</div>';
    }
    sessions.forEach(function (s) {
      html += '<div class="hrow"><span class="hl">' + esc(s.levelName || ("Level " + s.level)) + '</span>' +
              '<span class="hd">' + esc(when(s.at)) + '</span>' +
              '<span class="hp ' + (s.pct >= 70 ? 'ok' : 'bad') + '">' + s.pct + '%</span></div>';
    });
    html += '</div>';

    html += '<div class="row" style="margin-top:1.4rem">' +
            '<button class="btn primary" id="again">Drill again</button>' +
            '<button class="btn" id="switch">Switch person</button></div>';

    html += askHtml();

    app.innerHTML = html;
    on("again", "click", function () { replace(screenLevels); });
    on("switch", "click", function () { reset(screenWelcome); });
    wireAsk();
  }

  // ------------------------------------------------- the brownie debt
  //
  // Hitha said she would make brownies and cookies if this got built. It got built. This
  // says so, once per sign-in, in a different way each time, and will not repeat a line
  // until it has worked through all hundred of them. Clicking it turns it into a brownie,
  // which then goes the way of all brownies.

  var BROWNIE_LINES = [
    "Brownies were mentioned. Brownies have not arrived.",
    "This is your periodic brownie reminder.",
    "Somewhere, harnar is still waiting for brownies.",
    "A deal is a deal. The deal was brownies.",
    "No pressure. Just brownies.",
    "Differential diagnosis for a sad harnar: hunger. Treatment: brownies.",
    "Rapid-fire viva: who owes whom brownies?",
    "Indication for brownies: absolute.",
    "Brownies: the only intervention with a 100% success rate.",
    "Investigation of choice: open the oven.",

  function brownieLine() {
    var s = store();
    var seen = Array.isArray(s.brownieSeen) ? s.brownieSeen : [];
    if (seen.length >= BROWNIE_LINES.length) seen = [];     // been through them all, start again
    var pool = [];
    for (var i = 0; i < BROWNIE_LINES.length; i++) {
      if (seen.indexOf(i) === -1) pool.push(i);
    }
    var pick = pool[Math.floor(Math.random() * pool.length)];
    seen.push(pick);
    s.brownieSeen = seen;
    save(s);
    return BROWNIE_LINES[pick];
  }

  var BROWNIE_SVG =
    '<svg viewBox="0 0 40 30" width="40" height="30" aria-hidden="true">' +
    '<rect x="1" y="4" width="38" height="24" rx="4" fill="#5a3620"></rect>' +
    '<rect x="1" y="4" width="38" height="7" rx="4" fill="#6b422a"></rect>' +
    '<circle cx="11" cy="15" r="2.4" fill="#2f1b10"></circle>' +
    '<circle cx="24" cy="12" r="2" fill="#2f1b10"></circle>' +
    '<circle cx="30" cy="20" r="2.6" fill="#2f1b10"></circle>' +
    '<circle cx="17" cy="22" r="1.8" fill="#2f1b10"></circle>' +
    '</svg>';

  function showBrownieNote() {
    if (student.key !== "hitha") return;
    if (document.querySelector(".brownie")) return;

    var box = document.createElement("div");
    box.className = "brownie";
    box.setAttribute("role", "button");
    box.tabIndex = 0;
    box.innerHTML = '<span class="brownie-txt"></span>';
    box.querySelector(".brownie-txt").textContent = brownieLine();
    document.body.appendChild(box);
    setTimeout(function () { box.classList.add("in"); }, 16);

    var done = false;
    function dismiss() {
      if (done) return;
      done = true;
      box.classList.add("paid");
      box.innerHTML = BROWNIE_SVG;
      setTimeout(function () { box.classList.add("gone"); }, 1500);
      setTimeout(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 2100);
    }
    box.addEventListener("click", dismiss);
    box.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); dismiss(); }
    });
  }

  // ------------------------------------------------- asking for better questions
  //
  // The viva bank was written without the people who use it, so nothing in the system knows
  // whether a level is pitched right, which case needs more questions, or which question is
  // wrong. This is the only channel that can say so. It is stored locally first and retried,
  // like everything else here, because a request typed on ward wifi should not evaporate.

  function askHtml() {
    return '<div class="ask"><h3>Ask for different questions</h3>' +
           '<textarea id="askbox" rows="3" placeholder="Harder anatomy. More on complications. ' +
           'This question is wrong."></textarea>' +
           '<div class="row end"><button class="btn" id="asksend">Send</button></div>' +
           '<p class="asknote" id="asknote"></p></div>';
  }

  function wireAsk() {
    var box = document.getElementById("askbox");
    var note = document.getElementById("asknote");
    if (!box) return;

    on("asksend", "click", function () {
      var text = box.value.trim();
      if (!text) { box.focus(); return; }

      var rec = {
        id: newId(), studentKey: student.key, subject: SUBJECT, caseId: CASE.id,
        body: text.slice(0, 4000), at: new Date().toISOString(), sent: false
      };
      var s = store();
      s.asks = (s.asks || []).concat([rec]).slice(-200);
      save(s);
      // save() swallows a storage failure, so check rather than assume: if the record did
      // not land, sendAsks has nothing to read and the message is gone.
      var kept = ((store().asks || []).filter(function (a) { return a.id === rec.id; })).length > 0;

      box.value = "";
      note.textContent = "Sending...";
      // Say it has been sent when it has been sent, not when the button was pressed. This
      // said "Noted, thank you" before the request left, and said it just the same when
      // storage had failed and nothing was ever sent at all.
      sendAsk(rec).then(function (ok) {
        if (ok) note.textContent = "Thank you. It goes into the next revision of this case.";
        else if (kept) note.textContent = "No connection just now. It is saved and will go when you are back online.";
        else { note.textContent = "That did not save. Please try again."; box.value = rec.body; }
      });
    });
  }

  // Takes the record itself rather than re-reading storage, so a message still goes out
  // when the browser refused to store it. Resolves true only when the worker accepted it.
  function sendAsk(a) {
    if (!SYNC || !a || !a.studentKey) return Promise.resolve(false);
    return fetch(SYNC + "/api/feedback?student=" + encodeURIComponent(a.studentKey), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ id: a.id, subject: a.subject, caseId: a.caseId,
                             body: a.body, at: a.at })
    }).then(function (r) {
      if (!r.ok) return false;
      var s2 = store();
      (s2.asks || []).forEach(function (x) { if (x.id === a.id) x.sent = true; });
      save(s2);
      return true;
    }).catch(function () { return false; });   // offline; it goes on the next open
  }

  function sendAsks() {
    if (!SYNC) return;
    var s = store();
    var pending = (s.asks || []).filter(function (a) { return a && !a.sent && a.studentKey; });
    pending.slice(-20).forEach(sendAsk);
  }

  // ------------------------------------------------------------------ sync

  // Saving is not something the reader needs told. It happens on every mark, it happens
  // again on leaving, and saying so in a footer only suggests it might not have.
  function syncSession(rec) {
    if (!dbReady || !db) return;        // the website path; recordSession has already stored it
    var id = rec.at.replace(/[^0-9]/g, "") + "-" + Math.random().toString(36).slice(2, 7);
    db.collection("sessions").doc(id).set(rec).catch(function () {});
  }

  // ------------------------------------------------------------------ study guide

  var guideCache = {};   // keyed by case id: the hub keeps every guide the student has opened

  function screenGuide() {
    app.innerHTML = '<div class="loading">Opening the study guide…</div>';

    function mount(html) {
      app.innerHTML = '<div class="readerwrap"><div class="guide" id="guideRoot">' + html + '</div></div>';
      var root = document.getElementById("guideRoot");
      var opts = { guide: root, doc: CASE.id, student: student.key || "_",
                   syncRoot: true, onTheme: function () { renderTopbar(); } };
      if (window.ReaderBoot) window.ReaderBoot(opts);
      else if (window.Reader && window.Reader.remount) window.Reader.remount(opts);
    }

    var id = CASE.id;
    if (guideCache[id]) { mount(guideCache[id]); return; }

    fetch(guideBodyFile(CASE))
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (txt) { guideCache[id] = txt; return txt; })
      // mount separately: chaining it meant any error it threw was reported as "the request
      // did not come back", which sent me hunting a network fault for a plain ReferenceError
      .then(function (txt) { mount(txt); })
      .catch(function (err) {
        if (window.console && console.error) console.error("guide failed to open:", err);
        app.innerHTML =
          '<h2>The study guide could not load</h2>' +
          '<p class="sub">It is published alongside this page but the request did not ' +
          'come back. Reloading usually fixes it. The PDF on the case page has the same ' +
          'content and does not depend on this.</p>' +
          '<div class="row"><button class="btn primary" id="retry">Try again</button></div>';
        on("retry", "click", function () { go(screenGuide); });
      });
  }

  // ------------------------------------------------------------------ pdf

  var IN_ARTIFACT = !!(window.claude && window.claude.use);

  function savePdf() {
    var d = document.getElementById("pdfDesc");
    function say(msg) { if (d) d.textContent = msg; }

    // On the web the sandbox restrictions do not apply, so just open it.
    var file = pdfFile(CASE);

    if (!IN_ARTIFACT) {
      window.open(file, "_blank", "noopener");
      return;
    }

    say("Fetching the PDF…");
    fetch(file)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
      .then(function (blob) {
        return window.claude.use("downloads").then(function (dl) {
          if (!dl) throw new Error("not granted");
          return dl.save({ filename: file, data: blob });
        });
      })
      .then(function () { say("Saved. The whole study guide laid out for paper."); })
      .catch(function () {
        say("Could not save it here, open the study guide above and print it instead, " +
            "which produces the same pages.");
      });
  }

  // ------------------------------------------------------------------ welcome

  function screenWelcome() {
    var others = allStudents();
    var last = store().lastStudent;
    var saved = (last && studentRec(last)) ? studentRec(last).name : "";

    var html =
      '<p class="eyebrow">' + esc(SUBJECT) + ' · MBBS final year</p>' +
      '<h1>Surgery Case Files</h1>' +
      '<label class="fld" for="nm">Your name</label>' +
      '<input type="text" id="nm" autocomplete="off" placeholder="Name" value="' + esc(saved) + '">';

    if (others.length) {
      html += '<div class="known">' + others.map(function (o) {
        return '<button data-k="' + esc(o.key) + '">' + esc(o.name) + '</button>';
      }).join("") + '</div>';
    }
    html += '<div class="row end" style="margin-top:1.3rem">' +
            '<button class="btn primary" id="go">Continue</button></div>';
    app.innerHTML = html;

    function enter(name) {
      var v = String(name).trim();
      if (!v) { document.getElementById("nm").focus(); return; }
      student = { key: keyOf(v), name: v };
      var st = store();
      st.students = st.students || {};
      if (st.students[student.key]) student.name = st.students[student.key].name;
      else st.students[student.key] = { name: student.name, sessions: [] };
      st.lastStudent = student.key;
      save(st);
      if (window.Reader && window.Reader.setStudent) window.Reader.setStudent(student.key);
      // take what the server already has before this device writes anything, so a fresh or
      // evicted browser cannot push its empty counters over a real history
      pullAnswers();
      sendAsks();
      reset(screenIndex);
      showBrownieNote();
    }
    on("go", "click", function () { enter(document.getElementById("nm").value); });
    document.getElementById("nm").addEventListener("keydown", function (e) {
      if (e.key === "Enter") enter(this.value);
    });
    [].forEach.call(app.querySelectorAll(".known button"), function (b) {
      b.addEventListener("click", function () {
        var r = studentRec(b.dataset.k);
        enter(r ? r.name : b.dataset.k);
      });
    });
    document.getElementById("nm").focus();
  }

  // ------------------------------------------------------------------ boot

  reset(screenWelcome);

  // Anything finished while offline goes up now. Deliberately after the first paint, so a
  // slow or failing network never delays the screen the reader is waiting for.
  setTimeout(flushSessions, 1200);
  setTimeout(pushAnswers, 1400);
  setTimeout(sendAsks, 1600);

  // A phone does not reliably fire unload, but it does fire this when the tab is hidden or
  // the app is backgrounded, which is how a session on a phone actually ends.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") { pushAnswers(); flushSessions(); sendAsks(); }
  });

  if (window.claude && window.claude.use) {
    window.claude.use("db").then(function (d) { db = d; dbReady = true; })
                           .catch(function () { db = null; dbReady = true; });
  } else { dbReady = true; }
})();
