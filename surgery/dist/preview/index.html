     a:"B&L: at presentation more than 85% of patients with ductal adenocarcinoma are unsuitable for resection because of advanced disease. SRB's numbers agree and break it down: only 10 to 15% of pancreatic head carcinomas are operable, 40 to 50% are locally advanced, and another 40 to 50% have distant spread to liver or lungs.", ref:"B&L 72 p.1284 · SRB 14 p.699"},
    {id:"obj47", lv:3, type:"Management", q:"What contraindicates resection, and what does not?",
     a:"Contraindications: hepatic or peritoneal metastases; lymph node metastases distant from the pancreatic head; encasement of the superior mesenteric, hepatic or coeliac artery; and complete encasement and occlusion of the portal or superior mesenteric vein, as well as any degree of arterial involvement. Not contraindications, which is the list that separates a candidate who has read the chapter: tumour size; continuous invasion of the duodenum, stomach or colon; lymph node metastases within the operative field; and a tumour that abuts or minimally invades the portal or superior mesenteric vein, since part of the vein can be resected.", ref:"B&L 72 p.1283"},
    {id:"obj48", lv:3, type:"Management", q:"Give the four categories of pancreatic cancer and the treatment of each.",
     a:"Resectable: surgery followed by adjuvant chemotherapy, with some centres suggesting neoadjuvant chemotherapy first, though the evidence is not strong. Borderline resectable, usually from significant venous occlusion or arterial abutment: neoadjuvant chemotherapy with or without chemoradiotherapy, then resection if downstaged, then adjuvant therapy. Locally advanced and unresectable: systemic chemotherapy, with surgery possible later in a small downstaged cohort. Metastatic: systemic chemotherapy.", ref:"B&L 72 p.1284"},
    {id:"obj49", lv:3, type:"Procedure", q:"What is a Whipple's operation, and is it still what you would do?",
     a:"B&L: the original pancreatoduodenectomy as proposed by Whipple included resection of the gastric antrum. Preserving the antrum and pylorus gives a more physiological outcome with no difference in survival or recurrence rates, so the Whipple procedure is now reserved for situations in which the entire duodenum has to be removed. The standard operation today is the pylorus-preserving pancreatoduodenectomy, and calling it a Whipple is loose usage.", ref:"B&L 72 p.1284"},
    {id:"obj50", lv:3, type:"Investigation", q:"Would you get a tissue diagnosis before operating?",
     a:"B&L: histological confirmation of malignancy is desirable but not essential, particularly if the imaging clearly demonstrates a resectable tumour, and the lack of a tissue diagnosis should not delay appropriate surgical therapy. In patients judged unresectable a tissue diagnosis should be obtained before starting palliative therapy. And percutaneous transperitoneal biopsy of a potentially resectable pancreatic tumour should be avoided as far as possible, because of seeding, which is why the endoscopic ultrasound route is preferred when tissue is needed.", ref:"B&L 72 p.1283"},
    {id:"obj51", lv:3, type:"Pathology", q:"Give the risk factors for cholangiocarcinoma.",
     a:"B&L groups them by mechanism, and they are mostly things that inflame the duct chronically. Chronic inflammatory: primary sclerosing cholangitis, Oriental cholangiohepatitis, hepatitis C. Parasitic: Opisthorchis viverrini, Clonorchis sinensis. Congenital: choledochal cysts, Caroli's disease. Chemical: Thorotrast, vinyl chloride, dioxin, asbestos. Post-surgical: a biliary-enteric anastomosis. And non-alcoholic fatty liver disease.", ref:"B&L 71 p.1256"},
    {id:"obj52", lv:3, type:"Diagnosis", q:"A young woman with jaundice, right hypochondrial pain and a mass. What should you think of?",
     a:"A choledochal cyst. SRB: females 4 to 1, common in Japan, presenting in infants, children and adults, with obstructive jaundice in 80%, pain in the right hypochondrium, cholangitis, and a mass. B&L: most patients present before adulthood, with abdominal pain, cholangitis or end-stage liver disease, and after surgery bacterial cholangitis occurs in 40% of patients, repeated attacks leading to hepatic fibrosis, so timely referral for surgery is critical. It is also a risk factor for cholangiocarcinoma.", ref:"SRB 12 p.629 · B&L 71 p.1241, p.1256"},
    {id:"obj53", lv:3, type:"Treatment", q:"The disease is unresectable. What are you trying to achieve, and how?",
     a:"B&L: in locally advanced or metastatic disease the primary objective should be to relieve symptoms, improve quality of life and extend survival, rather than achieve a cure. Relieve the jaundice, usually by endoscopic stenting, which also allows brush cytology or biopsy to confirm the diagnosis, with percutaneous drainage when the stricture cannot be reached endoscopically. Relieve the itch with cholestyramine or colestipol, remembering that they bind bile salts and worsen fat-soluble vitamin deficiency, so give vitamin K alongside. And in deciding what a frail patient can stand, B&L's rule is that biological rather than chronological age should be the consideration.", ref:"B&L 72 p.1284, p.1283 · B&L 71 p.1238 · SRB 12 p.647"},
    {id:"obj54", lv:3, type:"Complications", q:"What is sump syndrome?",
     a:"The problem with choledochoduodenostomy, done for common bile duct stones: the blind distal segment of duct below the anastomosis collects debris, which SRB illustrates on the technique figure as the site of possible occurrence. SRB's note alongside is that a Roux-en-Y choledochojejunostomy is equally good as choledochoduodenostomy.", ref:"SRB 12 p.646, p.645"},
  ],

  "lymphoedema": [
    {id:"lym01", lv:1, type:"Pathology", q:"Define lymphoedema.",
     a:"SRB: accumulation of lymph in the extracellular and extravascular fluid compartment, commonly in subcutaneous tissue, primarily due to defective lymphatic drainage; it is increased protein-rich interstitial fluid. S Das: accumulation of lymph within the tissues, mainly the subcutaneous tissues of the limbs, from stagnation of lymph within the lymphatics. The three words that matter are protein rich, because protein in the interstitium drives fibrosis, fibrosis makes the oedema non-pitting, and non-pitting oedema does not respond to elevation.", ref:"SRB 1 p.241 · Das 8 p.114"},
    {id:"lym02", lv:1, type:"Examination", q:"What is Stemmer's sign, and why does it work?",
     a:"SRB: the skin over the dorsum of the foot cannot be pinched, because of subcutaneous fibrosis. It works because in any other oedema the subcutaneous tissue is water-logged but loose, so a fold of skin lifts at the base of the second toe, while in lymphoedema the protein-rich fluid has driven subdermal fibrosis so that skin and subcutis are welded together. It is a test of fibrosis, not of fluid, which is why it is positive in lymphoedema and negative in cardiac, renal and hepatic oedema.", ref:"SRB 1 p.244"},
    {id:"lym03", lv:1, type:"Examination", q:"Describe the shape of a lymphoedematous leg.",
     a:"SRB's descriptors, worth learning as phrases: a tree trunk pattern leg, the swelling starting in the foot and extending progressively up the leg with loss of the normal perimalleolar shape, so the ankle becomes a column rather than a waist; a buffalo hump on the dorsum of the foot; and squaring of the toes. Venous oedema spares the toes and the dorsum and leaves the perimalleolar hollows, so if the toes are square and the ankle has no waist it is lymphatic.", ref:"SRB 1 p.244"},
    {id:"lym04", lv:1, type:"Classification", q:"Classify lymphoedema.",
     a:"Kinmonth's, which is the one to open with: primary, without any identifiable lymphatic disease, and secondary, acquired due to a definite cause, which SRB notes is the most common form, contrary to what candidates assume. Primary is then subdivided by age of onset: lymphoedema congenita, from birth to under two years, 10%; lymphoedema praecox, at puberty up to about 35 years, 80%, so much the commonest primary form; and lymphoedema tarda, after 35.", ref:"SRB 1 p.242"},
    {id:"lym05", lv:1, type:"Classification", q:"Name the familial forms of primary lymphoedema.",
     a:"Nonne-Milroy's disease, the familial form of lymphoedema congenita: type I familial, autosomal dominant, chromosome 5 related, with bilateral upper and lower limbs, genitalia and face possibly involved, and an incidence of 1 in 6000 live births. Letessier-Meige's syndrome is the familial form of lymphoedema praecox, type II familial. Primary lymphoedema can also be syndromic: Turner's, Klinefelter's, Down's and Klippel-Trenaunay-Weber.", ref:"SRB 1 p.242"},
    {id:"lym06", lv:1, type:"Pathology", q:"Give the causes of secondary lymphoedema.",
     a:"SRB's list, commonest first: surgery, specifically inguinal or axillary block dissection and post-mastectomy axillary clearance; filarial, due to Wuchereria bancrofti, the common cause in coastal regions; advanced malignancy with hard fixed nodes in the axilla or groin; post-radiotherapy; infection, tuberculosis, syphilis, fungal and bacterial; trauma; and rarely rheumatoid arthritis, snake and insect bites, deep vein thrombosis and chronic venous insufficiency. S Das's illustration is lymphoedema of the arm following radical mastectomy.", ref:"SRB 1 p.242 · Das 8 p.114"},
    {id:"lym07", lv:1, type:"Examination", q:"Is the oedema pitting or non-pitting, and why must you say which?",
     a:"S Das: in the early stage this oedema pits on pressure, but gradually the subcutaneous tissue becomes fibrosed and the skin becomes keratotic, that is elephantiasis. SRB: initially pitting oedema occurs, which later becomes non-pitting. It is not a detail but the treatment decision: pitting oedema is fluid and can be moved by elevation, compression and massage, while non-pitting oedema is fibrosis and deposited protein and nothing short of excision will shift it.", ref:"Das 8 p.114 · SRB 1 p.244"},
    {id:"lym08", lv:1, type:"Classification", q:"Grade this lymphoedema.",
     a:"SRB's grading, which is SRB's alone. Latent or subclinical: no clinically apparent lymphoedema. Grade I: pitting oedema which more or less disappears on elevation of the limb, due to excess deposition of interstitial fluid. Grade II: non-pitting oedema which does not reduce on elevation. Grade III: oedema with irreversible skin changes such as fibrosis, papillae and fissuring. There is also a volumetric scale: mild under 20% excess limb volume, moderate 20 to 40%, severe over 40%.", ref:"SRB 1 p.245"},
    {id:"lym09", lv:1, type:"Examination", q:"What do you look for in the skin?",
     a:"Eczema, fissuring, papillae formation, ulceration, lymph ooze and elephantiasis, with athlete's foot, joint pain and disability. And look between the toes, because interdigital fungal infection is the portal of entry for the next attack of cellulitis. B&L explains why the skin thickens before the limb looks huge: obstruction to the cutaneous lymphatics causes skin thickening, not unlike the peau d'orange appearance in breast cancer, thus exacerbating the limb swelling.", ref:"SRB 1 p.244 · B&L 6 p.72"},
    {id:"lym10", lv:1, type:"History", q:"Which three questions settle primary against secondary?",
     a:"How old was the patient when it started, because primary lymphoedema reveals itself young and secondary mostly presents in middle and old age. Has there been an operation, radiotherapy or a cancer, because the cause of secondary disease is almost always in the history rather than on examination. And where does the patient live, because filariasis is geographical. SRB adds the timing clue: secondary lymphoedema develops rapidly, while primary is slowly progressive and may take years.", ref:"Das 8 p.114 · SRB 1 p.242"},
    {id:"lym11", lv:1, type:"Diagnosis", q:"Which sites other than the leg are affected?",
     a:"The lower limb is commonest. Then the upper limb; the scrotum and penis, SRB's phrase for the penile form being ram's horn penis; the breast, which requires reduction mammoplasty; the labia; the eyelid; and localised lymphoedema.", ref:"SRB 1 p.244, p.245"},
    {id:"lym12", lv:1, type:"Examination", q:"What do you do before you examine this patient's limb?",
     a:"Hand hygiene, introduce yourself and check the name and date of birth, explain what you are going to do, obtain verbal consent, and make the patient comfortable. Expose both limbs for comparison and keep the rest covered.", ref:"B&L 35 p.472 · B&L 21 p.285"},

    {id:"lym20", lv:2, type:"Pathology", q:"Why does the skin change in lymphoedema?",
     a:"SRB's chain, worth reciting in order: decreased lymphatic contractility, valvular insufficiency, or obliteration by infection, tumour or surgery leads to lymphatic hypertension and dilatation, causing lymph stasis and accumulation of proteins, glycosamines, growth factors and bacteria; then more collagen formation and deposition of proteins, fibroblasts and ground substance, causing fibrosis in the subcutaneous tissue and outside the deep fascia; then activation of collagens and keratinocytes, dermal thickening and dermal proliferation, cracks, ulceration, abscess, and finally elephantiasis. The detail examiners like: the muscles are normal without oedema but may hypertrophy, because the disease is outside the deep fascia, which is why the limb is heavy but not weak.", ref:"SRB 1 p.242, p.244"},
    {id:"lym21", lv:2, type:"Anatomy", q:"Why does the limb swell when the deep lymphatics are healthy?",
     a:"SRB states it explicitly: disease in the limb is confined to skin and subcutaneous tissue, so often only the superficial lymphatics are involved and the deep lymphatics are not, and superficial and deep lymphatics do not communicate with each other, unlike the veins of the limb where superficial and deep veins communicate freely. That single fact explains the swelling and it is also the premise of every physiological operation, each of which tries to build the missing connection.", ref:"SRB 1 p.244"},
    {id:"lym22", lv:2, type:"Classification", q:"What is Browse's classification, and how does it help at the bedside?",
     a:"A lymphangiographic classification, by what the lymphangiogram shows rather than when the swelling started. Congenital hyperplasia, 10%: common in males, the entire leg involved, one or both sides, often a family history, progressive, with an increased number of lymphatics and nodes, associated with chylous ascites, chylothorax and protein-losing enteropathy. Distal obliteration, 80%: common in females, starting at puberty, calf and ankle involved, often bilateral, often familial, slowly progressive, with aplasia or hypoplasia of lymphatics. Proximal obliteration, 10%: any age, equal in both sexes, leg and thigh involved, unilateral, rapidly progressive, from a proximal aortoiliac nodal block. At the bedside: distal disease is bilateral, slow, starts at the ankle and affects young women; proximal disease is unilateral, rapid, involves the thigh, and is the one in which you must look hard for a pelvic malignancy.", ref:"SRB 1 p.241"},
    {id:"lym23", lv:2, type:"History", q:"The patient has repeated attacks of fever with a red painful limb. Why does that matter?",
     a:"Because recurrent lymphangitis is both a symptom of lymphoedema and the engine that worsens it. B&L: in the acute presentation there are episodic attacks of fever with lymphadenitis and lymphangitis, and recurrent attacks of lymphangitis cause fibrosis of the lymph channels, resulting in a grossly swollen limb with thickened skin, producing elephantiasis; secondary streptococcal infection is common. SRB lists minor trauma and lymphoedema as the precipitating factors for acute lymphangitis and development of lymphoedema as one of its complications. Say the vicious circle out loud: stasis invites infection, infection scars the remaining lymphatics, more scarring means more stasis, which is why skin care and prompt antibiotics are the main long-term treatment.", ref:"B&L 6 p.72 · SRB 1 p.241"},
    {id:"lym24", lv:2, type:"History", q:"Is lymphoedema painful?",
     a:"In half of patients, yes. SRB: dull ache, severe pain, burning, bursting, cramps, and 50% of patients will have pain, along with debility, immobility, obesity, muscle wasting, and psychological and social discomfort causing severe morbidity. S Das, by contrast, says not many complaints are associated with the disease, particularly primary lymphoedema. B&L's judgement on advanced disease is blunt: gross forms of the disease cause a great deal of disability and misery.", ref:"SRB 1 p.244 · Das 8 p.114 · B&L 6 p.73"},
    {id:"lym25", lv:2, type:"Diagnosis", q:"Separate lymphoedema from lipoedema.",
     a:"SRB's distinguishing list: lipoedema occurs exclusively in females, begins at puberty, is bilateral and symmetrical, the trunk may be involved, the feet are not involved, it is not pitting, it is not related to elevation or compression, and MRI shows only fat without fluid. The feet are the discriminator: lymphoedema involves the toes and the dorsum of the foot, squares the toes and builds a buffalo hump, while lipoedema spares them.", ref:"SRB 1 p.246, p.244"},
    {id:"lym26", lv:2, type:"Diagnosis", q:"Give the differential diagnosis of a swollen limb.",
     a:"Cardiac, renal or hepatic oedema: bilateral, pitting, resolves on elevation, spares the toes, with systemic findings, and SRB lists cardiac causes, hypoproteinaemia, malnutrition, nephrotic syndrome and liver failure. Venous disease, deep vein thrombosis or chronic venous insufficiency: dilated veins, pigmentation, lipodermatosclerosis in the gaiter area, an ulcer above the medial malleolus, toes and dorsum spared, settled by venous Doppler, and remembering that both are themselves listed causes of secondary lymphoedema. Lipoedema. Myxoedema, non-pitting but with the features of hypothyroidism. Arterial disease and arteriovenous malformation. Drug-induced oedema from steroids, oestrogens or nifedipine. Gigantism, and external venous compression by an abdominal tumour.", ref:"SRB 1 p.245, p.246, p.242"},
    {id:"lym27", lv:2, type:"Investigation", q:"How would you investigate this swollen limb?",
     a:"Let the clinical picture decide. In an obvious filarial elephantiasis in an endemic area the diagnosis is clinical, and B&L says investigations in the full-blown case are superfluous: do a nocturnal peripheral blood smear for microfilariae and look for eosinophilia. In an unexplained swollen limb, particularly a unilateral one of rapid onset involving the thigh, investigate to find the cause: venous Doppler to exclude deep venous disease, ultrasound or CT of the abdomen and pelvis for a mass obstructing the aortoiliac nodes, MRI where needed, and isotope lymphoscintigraphy to confirm lymphatic failure.", ref:"B&L 6 p.73 · SRB 1 p.246, p.241"},
    {id:"lym28", lv:2, type:"Investigation", q:"Why would you do a venous Doppler in a case of lymphoedema?",
     a:"Two reasons, and both are good answers: to exclude deep venous disease, which is the main differential for a swollen limb, and because chronic venous insufficiency and deep vein thrombosis are themselves listed causes of secondary lymphoedema, so the two can coexist.", ref:"SRB 1 p.246, p.242"},
    {id:"lym29", lv:2, type:"Treatment", q:"How do you treat lymphoedema?",
     a:"Conservatively, lifelong, and mostly by skin care and compression. Physical treatment has four components: elevation, exercise and weight reduction, with SRB specifying that static isometric activities like prolonged standing or carrying weights should be avoided while rhythmic isotonic movements like swimming or massage should be encouraged, because rhythmic muscle contraction pumps lymph and static loading does not; compression, with multilayered lymphoedema bandaging, preferably non-elastic, graded stockings, and intermittent pneumatic compression at pressures over 50 mmHg; complex decongestive therapy, a two-phase programme of intensive therapy then maintenance; and manual lymphatic drainage. B&L endorses only one of these, and twice: in the early stages of limb swelling intermittent pneumatic compression helps, but the treatment has to be repeated over a prolonged period, and it gives some relief.", ref:"SRB 1 p.246 · B&L 6 p.73"},
    {id:"lym30", lv:2, type:"Treatment", q:"What must you check before you bandage the limb?",
     a:"The ankle-brachial pressure index. SRB: ABPI should be assessed prior to using multilayered lymphoedema bandaging, because compressing a limb with arterial disease causes ischaemia. Saying it unprompted is one of the most reliable marks in this case.", ref:"SRB 1 p.246"},
    {id:"lym31", lv:2, type:"Treatment", q:"What does skin care consist of, and why is it the treatment rather than an adjunct?",
     a:"SRB's list, each item with a target: keratolytics such as 5% salicylic acid for the hyperkeratosis; a bland emollient, soft or liquid paraffin, for the cracking; avoidance of skin sensitisers such as some soaps; topical steroids and control of allergy for the eczema; fluconazole and 3% benzoic acid ointment to prevent athlete's foot, which is the fungal portal of entry; control of lymphorrhoea; and regular washing to keep the limb clean. It is the treatment because every attack of cellulitis destroys more lymphatics, so preventing the next attack is the only intervention that changes the trajectory of the disease.", ref:"SRB 1 p.246"},
    {id:"lym32", lv:2, type:"Treatment", q:"Which drugs would you use, and which two would you avoid?",
     a:"Use: antibiotics, flucloxacillin, erythromycin or long-acting penicillins, for every attack of cellulitis; antifungals, topical 1% clotrimazole and systemic griseofulvin 250 to 1000 mg; diethylcarbamazine citrate 100 mg three times a day for three weeks for filariasis; and benzopyrones, coumarin derivatives with no anticoagulant effect, which increase lymphatic peristalsis and pumping along with proteolysis. Avoid diuretics, which SRB calls controversial and says more often cause electrolyte imbalance than benefit, because the fluid is in the interstitium with its protein and a diuretic cannot move it. And avoid NSAIDs, which SRB says may precipitate necrotising fasciitis in lymphoedema.", ref:"SRB 1 p.246"},

    {id:"lym40", lv:3, type:"Treatment", q:"Is there any surgery worth doing for a lymphoedematous limb?",
     a:"Lead with the conservative programme, then name the operations, then give B&L's verdict before the examiner does. SRB classifies them into three families. Excisional: Charles' operation, excising the lymphoedematous tissue and covering the area with a skin graft, and Homans' operation, excising it under raised skin flaps which are trimmed and sutured primarily, the medial and lateral sides done at separate sittings six months apart. Physiological: omentoplasty, since the omentum contains plenty of lymphatics; the nodovenous shunt of Nielubowicz, anastomosing an inguinal node to the long saphenous vein; O'Brien's lymphovenous shunt, with at least four lymphatics anastomosed using 7 or 11 zero prolene under the operating microscope; Kinmonth's ileal mucosal patch; Baumeister lymphatic grafting; and free lymphatic flap autotransplantation of Trevidic and Cormier for post-mastectomy lymphoedema. Combined: Sistrunk's operation, excision with window cuts in the deep fascia to allow communication into the normal deep lymphatics, and Thompson's Swiss-roll operation, where the shaved dermis of one skin flap is buried deep to the deep fascia under the opposite flap. Then B&L: operations for reducing the size of the limb are hardly ever done these days because the procedures are so rarely successful, and the value of various surgical procedures is largely unproven, hence they are rarely performed. The honest reasons: excisional operations work but leave a grafted, cosmetically poor, often ulcerated leg, and by the time a limb is bad enough to operate on the superficial lymphatics are fibrosed, so there is little patent left to anastomose.", ref:"SRB 1 p.246, p.247 · B&L 6 p.73"},
    {id:"lym41", lv:3, type:"Treatment", q:"Which lymphoedema operation do all three books endorse?",
     a:"The one on the scrotum. B&L: a hydrocele is treated by the usual operation of excision and eversion of the sac, with excision of redundant scrotal skin if necessary. SRB illustrates scrotal reduction for extensive scrotal lymphoedema of filarial origin, and reduction with reconstruction for a lymphoedematous penis, otherwise it may cause urinary problems and sexual dysfunction. The genitalia are the exception because the swelling causes a functional problem that excision reliably fixes and the skin cover is redundant and easy to tailor.", ref:"B&L 6 p.73 · SRB 1 p.245"},
    {id:"lym42", lv:3, type:"Complications", q:"A new bluish nodule appears in a chronically swollen arm after a mastectomy.",
     a:"Lymphangiosarcoma, the Stewart-Treves syndrome, until a biopsy says otherwise. SRB: 0.5%, occurring after 10 years, presenting as multiple bluish satellite nodules in the skin of the limb, often with ulceration and haemorrhage; skin or nodule biopsy is confirmatory; chemotherapy, radiotherapy and even radical amputation are used, and the prognosis is very poor; it is usually seen in the upper limb after mastectomy. B&L's version is in its skin chapter: the lymphangiosarcoma variant of angiosarcoma arises from lymphatic endothelium and can develop in lymphoedematous tissue, particularly an extremity, with rapid proliferation and early systemic spread. It is the answer to why a post-mastectomy lymphoedema needs following up.", ref:"SRB 1 p.246 · B&L 45 p.661 · B&L 58 p.942"},
    {id:"lym43", lv:3, type:"Pathology", q:"Give the parasite, the vector and the periodicity in filarial lymphoedema.",
     a:"B&L: filariasis is mainly caused by Wuchereria bancrofti, transmitted by the mosquito, with the variants Brugia malayi and Brugia timori responsible in about 10% of those infected. SRB names the Indian vector, Culex fatigans, with man the definitive host and the female mosquito the intermediate host, and no known animal or reservoir host. Nocturnal periodicity, from 10 pm to 4 am in India, Asian countries and China, is related to the night-biting habits of the vector and the sleeping habits of the host, which is why the blood smear must be taken at night.", ref:"B&L 6 p.72 · SRB 1 p.242 · Das 8 p.115"},
    {id:"lym44", lv:3, type:"Pathology", q:"Why does filarial elephantiasis take years to develop?",
     a:"Because the load builds by repeated bites, not by multiplication. SRB says it twice: microfilaria never multiplies in the mosquito nor in the human, and one microfilaria forms one infective larva. Maturation to an adult worm takes almost a year after the bite, which is why the disease appears long after exposure; in the mosquito it takes 20 days for microfilaria to develop into the infective third-stage larva; the lifespan of microfilaria in human blood is 3 months; and a gravid female releases up to 50 000 microfilariae a day into the lymph. So filarial elephantiasis is a disease of long residence in an endemic area.", ref:"SRB 1 p.243 · B&L 6 p.72"},
    {id:"lym45", lv:3, type:"Investigation", q:"How does isotope lymphoscintigraphy work, and what are its numbers?",
     a:"SRB: radioactive technetium-labelled sulphide colloid particles, or radioiodinated human albumin, are injected into the web space with a fine needle, and these particles are specifically taken up by lymphatics; radioactivity in the inguinal nodes is measured at 30 and 60 minutes. Normal uptake is 0.6 to 1.6%; under 0.3% at 30 minutes is diagnostic of lymphoedema; over 2% suggests rapid abnormal clearance, that is oedema from venous disease. SRB calls it the test of choice, simple and safe, with 90% sensitivity and 100% specificity, and it shows the thoracic duct, other nodes and the liver and allows comparison with the other limb. Note that the over-2% result is the only finding here that separates lymphoedema from venous oedema positively, by showing too fast a clearance rather than too slow.", ref:"SRB 1 p.241"},
    {id:"lym46", lv:3, type:"Investigation", q:"Describe lymphangiography and the appearances it gives.",
     a:"S Das: patent blue dye is injected into the web between the toes to show the lymphatics on the dorsum of the foot, one is cannulated, and ultrafluid lipiodol is injected to visualise the main lymphatic channels of the leg and then the nodes; SRB adds the rate, 1 ml in 8 minutes to a total of 7 ml, reaching iliac and para-aortic nodes over 24 hours. S Das's appearances: an irregular filling defect in a node means secondary metastasis; a soap bubble or foamy appearance is seen in Hodgkin's disease; a coarse nodular storage pattern in lymphosarcoma; and a marginal sunburst appearance in reticulum cell sarcoma. SRB's disadvantages are why it has been displaced: technically difficult, extravasation of dye can occur, the dye may not reach the required area, and it is time-consuming and invasive.", ref:"Das 8 p.116 · SRB 1 p.241"},
    {id:"lym47", lv:3, type:"Diagnosis", q:"What is podoconiosis?",
     a:"SRB: endemic elephantiasis or podoconiosis, common in Africa, seen in barefoot workers, due to destruction of lymphatics by silica derived from soil containing alkaline volcanic rocks. Non-infective, non-filarial elephantiasis from walking barefoot on volcanic soil.", ref:"SRB 1 p.244"},
    {id:"lym48", lv:3, type:"Examination", q:"Which patient with filarial lymphoedema is more likely to be a man, and why?",
     a:"The filarial one. B&L: it is mainly males who are affected, because females generally cover a greater part of their bodies with clothing, thus making them less prone to mosquito bites. Primary lymphoedema runs the other way: SRB says it commonly affects females and is common in the lower limb and on the left side, and S Das says females are more affected than males in primary lymphoedema and also in secondary lymphoedema after radical mastectomy or from iliac and inguinal nodal involvement by uterine or ovarian tumours.", ref:"B&L 6 p.72 · SRB 1 p.242 · Das 8 p.114"},
    {id:"lym49", lv:3, type:"Complications", q:"What are the chylous manifestations, and what do they mean?",
     a:"Chyluria, chylous ascites, chylothorax, protein-losing diarrhoea and lymphorrhoea, which confirm lymphatic obstruction beyond the limb. B&L: chyluria and chylous ascites may occur, bilateral lower limb filariasis is often associated with scrotal and penile elephantiasis, and early on there may be a hydrocele underlying scrotal filariasis; the parasite may also be seen in chylous urine, ascites and hydrocele fluid, and eosinophilia is common. B&L also names a respiratory form, tropical pulmonary eosinophilia, a mild form of the disease affecting the respiratory tract and causing a dry cough.", ref:"SRB 1 p.244 · B&L 6 p.72, p.73"},
    {id:"lym50", lv:3, type:"Examination", q:"What else would you examine, and what might you feel that is unique to filariasis?",
     a:"The regional nodes, for a cause, since hard fixed nodes mean malignant obstruction; the scars of a previous mastectomy or block dissection and the skin changes of radiotherapy; the abdomen and pelvis in proximal-obliteration disease, for a mass blocking the aortoiliac nodes; and the lymphatics themselves for subcutaneous nodules, which S Das says occur in malignant melanoma, where they are deep brown to black, and in carcinoma. The finding unique to filariasis is B&L's: occasionally, adult worms may be felt subcutaneously.", ref:"Das 8 p.114 · B&L 6 p.72 · SRB 1 p.241"},
    {id:"lym51", lv:3, type:"Treatment", q:"In what order is manual lymphatic drainage performed, and why that order?",
     a:"SRB: a specialised technique to stimulate the contractility of the lymph-collecting vessels, done first on the opposite normal side, then the trunk, then the same-side trunk, then the same side proximally, then the same side distally, and later in a distal-to-proximal fashion, so as to redirect the lymph towards functioning lymphatic territories. The order is not arbitrary: you clear the receiving territory before you push lymph into it.", ref:"SRB 1 p.246"},
  ],

  "carcinoma-penis": [
    {id:"pen01", lv:1, type:"Pathology", q:"What is the relationship between circumcision and carcinoma of the penis?",
     a:"B&L: circumcision soon after birth confers immunity against carcinoma of the penis; later circumcision does not seem to have the same benefit, with the assumption that smegma is in some way carcinogenic. SRB says circumcision during infancy confers total immunity. Give the direction rather than a boundary you cannot defend: neonatal circumcision confers near-total immunity, circumcision later in life does not confer the same protection, and that supports retained smegma under a non-retractile prepuce as the carcinogenic stimulus. The books differ on where exactly the line falls, so do not volunteer that early infancy fails to protect, because SRB says the opposite.", ref:"B&L 85 p.1551 · SRB 26 p.1052 · Das 40 p.638"},
    {id:"pen02", lv:1, type:"Pathology", q:"Give the risk factors and premalignant conditions.",
     a:"Phimosis and chronic balanoposthitis as contributory factors; HPV types 16 and 18; smoking; and the precancerous states, leukoplakia of the glans, which B&L says is similar to the condition on the tongue, penile intraepithelial neoplasia, and lichen sclerosus. SRB adds long-standing genital warts, condyloma acuminata, Paget's disease of the penis, erythroplasia of Queyrat, which it defines as persistent rawness of the glans, and balanitis xerotica obliterans, which is lichen sclerosus under another name. S Das's list is chronic balanoposthitis, leukoplakia, papillomas, Paget's disease and erythroplasia of Queyrat. Do not confuse the HPV types: 16 and 18 cause cancer, 6 and 11 cause genital warts.", ref:"B&L 85 p.1551, p.1552, p.1546 · SRB 26 p.1052 · Das 40 p.638"},
    {id:"pen03", lv:1, type:"Pathology", q:"What is the cell type, and where does it arise?",
     a:"B&L: most typically a squamous cell carcinoma arising in the skin of the glans penis or the prepuce. SRB: the glans is the commonest site, and 80% are low-grade tumours. S Das adds the rarity: only rarely a columnar variety may develop, arising from Tyson's glands, which are situated on either side of the frenum.", ref:"B&L 85 p.1552 · SRB 26 p.1053 · Das 40 p.638"},
    {id:"pen04", lv:1, type:"Examination", q:"Describe the lesion.",
     a:"S Das's two forms with the words to use: a lump, which is a sessile cauliflower growth with an indurated base, or an ulcer, with the same indurated base, a rolled-out and everted margin, and a floor formed by necrosed tissue. Three words in order: indurated base, everted margin, necrotic floor. Then palpate proximally along the shaft for induration, because that is what decides partial against total amputation.", ref:"Das 40 p.638 · SRB 26 p.1053"},
    {id:"pen05", lv:1, type:"Examination", q:"The prepuce will not retract. What do you do?",
     a:"Split it. S Das: one must be clever enough to suspect this to be a case of carcinoma, and a dorsal slit must be performed for proper inspection. B&L says the same, that in many the prepuce is non-retractile and must be split to view the lesion. You cannot diagnose what you have not seen, and a purulent preputial discharge treated as balanoposthitis without retracting or splitting the prepuce is how these cancers are missed.", ref:"Das 40 p.638 · B&L 85 p.1552"},
    {id:"pen06", lv:1, type:"Examination", q:"Is it painful?",
     a:"Characteristically not, which is part of why it presents late. B&L: there is typically little or no pain. S Das calls it a painless condition. SRB explains when it does hurt: the lesion is painless initially but later becomes painful due to secondary infection, often with a foul-smelling, purulent, irritating discharge, and fixed inguinal nodes cause severe excruciating pain and lymphoedema. So pain in this disease is a sign of a complication, not of the tumour.", ref:"B&L 85 p.1552 · Das 40 p.638 · SRB 26 p.1053"},
    {id:"pen07", lv:1, type:"Examination", q:"What proportion of enlarged groin nodes are malignant?",
     a:"About half. B&L: around 50% have inguinal lymph node enlargement at presentation, but the nodal enlargement often reflects infection. S Das: about half the enlargement is due to sepsis and the other half to secondary deposits. SRB: only 50% of palpable inguinal nodes are involved by metastatic spread. All three books say the same thing, and it is the single most important fact in the management.", ref:"B&L 85 p.1552 · Das 40 p.638 · SRB 26 p.1054"},
    {id:"pen08", lv:1, type:"Pathology", q:"How does carcinoma of the penis spread?",
     a:"Locally, slowly, for months or years, and S Das explains why: direct spread to the body of the penis is prevented by a fascial sheath for many months. Then by lymphatics, which is the whole prognosis: earliest spread to the inguinal nodes, N1 and N2 disease, then to the iliac nodes, N3, with distant metastatic deposits infrequent. SRB calls it a locoregional malignant disease with blood spread rare, which is why surgery to the primary and the nodes still cures even in advanced local disease.", ref:"B&L 85 p.1552 · Das 40 p.638 · SRB 26 p.1053"},
    {id:"pen09", lv:1, type:"Pathology", q:"How do patients die of this disease?",
     a:"All three books give the same mechanism. B&L: the inguinal nodes can erode the skin of the groin and, in rare cases, death can result from erosion of the femoral or external iliac vessels. S Das: death may occur due to bleeding from the external iliac or femoral vessel from erosion by metastatic lymph nodes. SRB: once the nodes are fixed it may erode into the femoral vessels causing torrential haemorrhage and death. It is also the reason for palliative radiotherapy to fixed nodes, which SRB gives to palliate pain, fungation and anticipated erosion into the femoral vessels.", ref:"B&L 85 p.1552 · Das 40 p.638 · SRB 26 p.1053, p.1055"},
    {id:"pen10", lv:1, type:"Investigation", q:"How do you confirm the diagnosis?",
     a:"Biopsy the primary, which B&L says twice is not optional. SRB specifies a wedge biopsy from the lesion, showing squamous cell carcinoma with epithelial pearls. For the nodes, FNAC and never an open biopsy, ultrasound-guided for palpable nodes.", ref:"B&L 85 p.1552, p.1553 · SRB 26 p.1053"},
    {id:"pen11", lv:1, type:"Examination", q:"What do you do before you examine this patient?",
     a:"Hand hygiene, introduce yourself and check the name and date of birth, explain what you are going to do and why, obtain verbal consent, and make the patient comfortable. The examination is intimate, so offer a chaperone, which B&L says should be especially for intimate examinations and part of a local guideline or policy; say you have offered and would record it. If consent is refused, explain again, offer a chaperone, document the refusal and do not proceed.", ref:"B&L 21 p.285 · B&L 35 p.472"},
    {id:"pen12", lv:1, type:"History", q:"Why do these patients present late?",
     a:"B&L: many patients present late as a fungating or ulcerative growth, either because of embarrassment or because of misdiagnosis. S Das describes the misdiagnosis: in an uncircumcised man, mild irritation and purulent discharge from under the prepuce are often the first symptoms, with blood-stained foul discharge later, and at this stage the condition may be misdiagnosed as balanoposthitis.", ref:"B&L 85 p.1552 · Das 40 p.638"},

    {id:"pen20", lv:2, type:"Diagnosis", q:"A man of fifty has developed phimosis recently. What is the diagnosis?",
     a:"SRB's sentence: in an adult, recent onset of phimosis should raise the suspicion of carcinoma penis. A prepuce that has always been tight is phimosis; a prepuce that has recently become tight in a man of fifty is a carcinoma growing underneath it. SRB also lists carcinoma of the penis later among the problems of phimosis, alongside recurrent balanoposthitis, calculus formation from smegma and retention of urine.", ref:"SRB 26 p.1053, p.1048"},
    {id:"pen21", lv:2, type:"Pathology", q:"What is penile intraepithelial neoplasia, and what are its two eponyms?",
     a:"B&L: PeIN is typically seen as a red cutaneous patch on the penis; when it occurs on the glans penis it is known as erythroplasia of Queyrat, and when it occurs on the shaft it is called Bowen's disease. So the eponym is decided by the site, not the histology. B&L's practical caution: there are several other benign causes of red patches on the penis, and when there is clinical doubt as to the underlying diagnosis a biopsy is indicated.", ref:"B&L 85 p.1552"},
    {id:"pen22", lv:2, type:"Classification", q:"Give the macroscopic types.",
     a:"SRB's three: infiltrating, which occurs in a pre-existing leukoplakia and presents as an indurated area; papilliferous, which eventually attains a large size forming a fungating foul-smelling lesion that often gets infected; and ulcerative. B&L gives two and ties each to its precursor: it may be flat and infiltrating or warty in appearance, the former often starting as leukoplakia or PeIN and the latter resulting from an existing papilloma.", ref:"SRB 26 p.1053 · B&L 85 p.1552"},
    {id:"pen23", lv:2, type:"Examination", q:"How do you examine the nodes, and which ones do candidates forget?",
     a:"Palpate both groins, then the iliac nodes. S Das is explicit that one must palpate the iliac group to exclude secondaries, and he illustrates doing it with the thigh flexed to relax the abdominal muscles; SRB says the external iliac nodes are felt above and on the medial aspect of the inguinal ligament. Flexing the hip and saying why you are doing it is a free mark. Metastatic nodes are nodular and hard and later fixed, and SRB notes that fixed nodal status indicates advancement of the disease, while tender, softer, mobile nodes with a foul infected primary are more likely septic.", ref:"Das 40 p.637, p.638 · SRB 26 p.1053"},
    {id:"pen24", lv:2, type:"Anatomy", q:"Why is a groin dissection for this disease bilateral?",
     a:"Because the lymphatics of the penis cross the midline, so nodes on both sides can be involved and a positive node on one side mandates a bilateral dissection. SRB adds two further routes: from the glans it also spreads to Cloquet's node in the femoral canal, and carcinoma of the shaft can spread directly to the external iliac nodes, so impalpable groins do not exclude nodal disease in a shaft tumour.", ref:"SRB 26 p.1053 · B&L 85 p.1553"},
    {id:"pen25", lv:2, type:"Investigation", q:"Why never an open biopsy of a groin node?",
     a:"Because an incision in the groin before a block dissection contaminates the field, compromises the skin flaps on which the dissection depends, and risks seeding a wound already at high risk of necrosis. SRB states the rule flatly, FNAC of lymph nodes and no open biopsy, and B&L's guidance is that for palpable nodes ultrasound-guided fine-needle aspiration will confirm the diagnosis. A needle gives the same answer without any of that.", ref:"SRB 26 p.1053 · B&L 85 p.1553"},
    {id:"pen26", lv:2, type:"Investigation", q:"The groins are impalpable. How do you decide whether to dissect them?",
     a:"By sentinel node biopsy. B&L: management of patients where the nodes are not palpable involves the use of sentinel lymph node biopsy followed by inguinal node dissection if it is positive. SRB gives the anatomy and the name: Cabana's sentinel node is located above and medial to the junction of the saphenous and femoral veins and is the first node to be involved, and biopsy after isosulphan blue dye injection into the primary decides the necessity for ilioinguinal block dissection. So: palpable nodes, FNAC then block dissection; impalpable nodes, sentinel node biopsy then block dissection only if positive.", ref:"B&L 85 p.1553 · SRB 26 p.1053"},
    {id:"pen27", lv:2, type:"Investigation", q:"How would you stage this patient radiologically?",
     a:"B&L: MRI is performed for local staging, and assessment of locoregional lymph node status is essential; CT is used for the pelvic nodes when deciding on pelvic lymphadenectomy. SRB adds ultrasound of the abdomen to look for involvement of the external iliac nodes. MRI is used for the primary because the T stage is about which erectile body the tumour has entered, and that measurement decides glansectomy against partial penectomy.", ref:"B&L 85 p.1552, p.1553 · SRB 26 p.1053"},
    {id:"pen28", lv:2, type:"Classification", q:"Give the T and N stages.",
     a:"B&L, compactly: T1 confined to the skin, T2 invading the corpus spongiosum or corpus cavernosum, T3 invading the urethra, T4 invading adjacent structures; inguinal nodes are N1 and N2 and iliac nodes N3. SRB reproduces the AJCC 8th edition of 2018, which splits the erectile bodies: T2 invades the corpus spongiosum, T3 the corpora cavernosa, each with or without urethral invasion, T4 adjacent structures such as prostate, scrotum or pubic bone, with T1a and T1b separated by lymphovascular or perineural invasion and grade. SRB's clinical N: cN1 one palpable mobile unilateral inguinal node, cN2 two or more, cN3 a fixed inguinal nodal mass or pelvic lymphadenopathy. Use SRB's version for an Indian paper, since it is the current AJCC.", ref:"B&L 85 p.1552 · SRB 26 p.1054"},
    {id:"pen29", lv:2, type:"Treatment", q:"How is carcinoma in situ treated?",
     a:"Both books agree. B&L: topical 5-fluorouracil cream, CO2 laser ablation or surgical excision. SRB: topical 5-FU cream, or imiquimab, or Mohs surgery, or limited wide excision, or Nd:YAG laser photoirradiation.", ref:"B&L 85 p.1552 · SRB 26 p.1055"},
    {id:"pen30", lv:2, type:"Treatment", q:"How do you decide between glansectomy, partial penectomy and total penectomy?",
     a:"By how far proximally the tumour extends. B&L's ladder: small lesions of low grade and low stage are treated with organ-preserving surgery, limited excision, Mohs' surgery or laser ablation; tumours affecting the glans require glansectomy; more advanced tumours require partial penectomy; and in advanced cases total penectomy with formation of a perineal urethrostomy. SRB: if the growth involves the glans without extending into the proximal shaft, partial amputation, and if the tumour involves the proximal body of the penis or is anaplastic or poorly differentiated, total amputation with perineal urethrostomy. Note B&L's last point: these techniques are indicated even in advanced metastatic disease, for reasons of local control.", ref:"B&L 85 p.1553 · SRB 26 p.1054"},
    {id:"pen31", lv:2, type:"Treatment", q:"How do you treat the nodes, and when?",
     a:"Treat the primary first, give antibiotics, wait, then reassess, because only about half the palpable nodes are metastatic. B&L: treatment of enlarged inguinal nodes should be delayed until at least 3 weeks after local treatment of the primary lesion, enlargement caused by infection will usually show signs of subsiding with antibiotics, and for palpable nodes ultrasound-guided FNAC will confirm the diagnosis and a block dissection of both groins should be undertaken. SRB waits 4 to 6 weeks and names the timings: a primary inguinal block is done within 4 weeks of the surgery for the primary, a secondary inguinal block after 4 weeks. Give the reason first and the number as a range.", ref:"B&L 85 p.1553 · SRB 26 p.1054, p.1055"},
    {id:"pen32", lv:2, type:"Complications", q:"What are the complications of an ilioinguinal block dissection?",
     a:"SRB, twice: flap necrosis, which it marks as common, lymphoedema of the lower limb, femoral blow-out, infection, lymphorrhoea and haemorrhage. Say flap necrosis first because it is the commonest, and note that femoral blow-out is the one that kills, following skin loss over an exposed, irradiated or dissected femoral vessel. Catalona's modified dissection, with a small incision, limited dissection and preservation of the saphenous vein, exists to reduce exactly these.", ref:"SRB 26 p.1054, p.1055"},

    {id:"pen40", lv:3, type:"Treatment", q:"How much penis do you take?",
     a:"State the principle, give SRB's measurements, then the modern qualification. The decision is how far proximally the tumour extends. SRB: if the growth involves the glans without extending into the proximal shaft, partial amputation with a 2 cm clearance from the proximal extent of the tumour and a 2.5 cm stump retained, the stump length chosen so that proper streaming of urine is possible. B&L names the old rule in order to retire it: for most primary tumours surgical excision is the mainstay, with the traditional view that a 2 cm margin of normal tissue be removed being superseded by a more recent, more conservative view, such that penis-preserving surgery with excision of much lower margins is now accepted. The reason is biological: the tumour grows slowly and is held up by Buck's fascia, so 2 cm was always more than necessary, and Mohs' micrographic surgery, sequential tissue excision under repeat microscopic control, exists to preserve the uninvolved tissue. For an Indian paper write SRB's numbers and add B&L's sentence at the end. Never omit the proximal-extent rule: it is the actual decision, and the margin is only a number attached to it.", ref:"SRB 26 p.1054 · B&L 85 p.1553 · Das 40 p.638"},
    {id:"pen41", lv:3, type:"Treatment", q:"Is there a curative role for radiotherapy to the primary?",
     a:"In SRB, yes, in a narrow group: carcinoma in situ, a T1 lesion of the glans, or a well-differentiated tumour in a young man, with circumcision first and then 6000 cGy by radioactive tantalum wire implantation over 7 days, a radium penile mould over 7 days, or linear accelerator external beam over 5 weeks, with nodal involvement in these patients under 10%. SRB's wider indications add a small lesion under 2 cm, advanced inoperable disease, palliation of inoperable groin nodes, and post-operative radiotherapy. B&L offers no radiotherapy to the primary at all, and its summary box says surgery is the mainstay of treatment; it mentions radiotherapy only as an option for pelvic nodes. The two books are competing for the same patient: the reason to irradiate a small glans tumour was organ preservation, and once glansectomy, Mohs' surgery and laser ablation with small margins became available, radiotherapy lost its advantage and kept its late effects. Both books still use radiotherapy to palliate fixed inguinal nodes.", ref:"SRB 26 p.1054, p.1055 · B&L 85 p.1553"},
    {id:"pen42", lv:3, type:"Classification", q:"Give Jackson's staging with its survival figures.",
     a:"SRB's version: stage I, tumour involving only the glans, prepuce or both, 90% five-year survival; stage II, tumour extending into the body of the penis, 70%; stage III, tumour with mobile inguinal nodes, 50%; stage IV, tumour spreading to adjacent structures or fixed nodes, 5%. It is worth knowing because it is clinical: you can stage the patient with your hands and quote a prognosis. Jackson does not appear in B&L at all, which gives two figures grouped by nodal status instead: over 80% five-year survival for tumours confined to the penis, falling to around 40% with nodal involvement. Those are consistent, because B&L's groups average Jackson's pairs; SRB simply resolves the nodal group into mobile and fixed, which is the distinction that matters.", ref:"SRB 26 p.1053 · B&L 85 p.1553"},
    {id:"pen43", lv:3, type:"Treatment", q:"The groins are impalpable but the primary is poorly differentiated and T2. What do you do?",
     a:"A prophylactic dissection, or its staged equivalent. SRB gives the threshold: if the primary tumour is poorly differentiated and the tumour is T2 or above, the chance of inguinal nodal spread is more than 50%, so a prophylactic inguinal nodal dissection is done, with the high-risk group being invasive carcinoma, T2 and T3 tumours, and vascular invasion. Its elegant alternative is a superficial lymph node block, dissection superficial to the fascia lata in N0 disease, sent for frozen section, with formal block dissection only if the nodes are positive. SRB's vocabulary: a therapeutic inguinal block is done whenever FNAC of a node is positive.", ref:"SRB 26 p.1055"},
    {id:"pen44", lv:3, type:"Procedure", q:"What is Dresler's quadrangle?",
     a:"SRB's definition of the area a groin dissection must clear: the upper border is the line joining the anterosuperior iliac spine and the pubic tubercle; laterally, the line joining the anterosuperior iliac spine and a point 20 cm below it; medially, the pubic tubercle and a point 15 cm below it. Nodal block dissection for carcinoma of the penis should cover this area adequately. It appears nowhere in B&L.", ref:"SRB 26 p.1055"},
    {id:"pen45", lv:3, type:"Treatment", q:"What is done about the pelvic nodes?",
     a:"Both books agree that pelvic dissection is staging rather than therapy. SRB: removal of iliac nodes does not alter the outcome; it is done to confirm the spread so that further therapy can be planned and prognosis predicted. B&L: management of the pelvic nodes is controversial, and when they are involved on CT surgery probably has little role, while when the iliac nodes are not enlarged in the presence of N2 disease the options are observation, pelvic lymphadenectomy or radiotherapy.", ref:"SRB 26 p.1055 · B&L 85 p.1553"},
    {id:"pen46", lv:3, type:"Procedure", q:"What is Young's operation, and what is the Sir Piersey Gold operation?",
     a:"Both are SRB's and neither appears in B&L. Young's operation is partial amputation of the penis with bilateral ilioinguinal lymph node block dissection. The Sir Piersey Gold operation is total scrotectomy with orchidectomy along with total amputation of the penis; SRB's stated rationale is that it prevents the frequent dermatitis of scrotal skin caused by the perineal urethrostomy and also reduces sexual desire.", ref:"SRB 26 p.1054"},
    {id:"pen47", lv:3, type:"Complications", q:"What are the problems with a perineal urethrostomy, and how do you prevent them?",
     a:"SRB: scrotal ammoniacal dermatitis and stricture at the urethrostomy site. The dermatitis is prevented by asking the patient to urinate in the sitting position, lifting the scrotum upwards; the stricture needs dilatation. Sit to void and lift the scrotum is the instruction that prevents the commoner of the two.", ref:"SRB 26 p.1054"},
    {id:"pen48", lv:3, type:"Treatment", q:"What is the place of chemotherapy?",
     a:"The weakest arm in this disease. B&L: chemotherapy is relatively ineffective and currently is reserved for palliation in those with metastatic disease, and its summary box says surgery is the mainstay of treatment. SRB gives the agents, 5-FU, methotrexate, bleomycin, cisplatin and vincristine, and adds a useful pharmacological point: bleomycin is a radiosensitiser and so beneficial if radiotherapy is planned later.", ref:"B&L 85 p.1553 · SRB 26 p.1055"},
    {id:"pen49", lv:3, type:"Investigation", q:"How does SRB grade the tumour, and why does the grade matter?",
     a:"By epithelial pearls on the wedge biopsy: very well differentiated, 75% epithelial pearls; well differentiated, 50 to 75%; moderately differentiated, 25 to 50%; undifferentiated, under 25%. The grade matters because SRB uses it twice, to decide the extent of amputation, since an anaplastic or poorly differentiated tumour means total amputation, and to decide whether to do a prophylactic groin dissection.", ref:"SRB 26 p.1053, p.1054, p.1055"},
    {id:"pen50", lv:3, type:"History", q:"How many of these patients are under forty?",
     a:"The books differ threefold and neither qualifies its figure: S Das says that although the majority are above 40, 30% are under 40, while B&L says about 10% of patients are under 40. Both are compatible with the same clinical rule, which is the thing to say: this is a disease of men over forty, and youth does not exclude it, so a penile lesion in a young man still needs a biopsy.", ref:"Das 40 p.638 · B&L 85 p.1552"},
    {id:"pen51", lv:3, type:"Examination", q:"Why does an altered urinary stream matter?",
     a:"Because it tells you the meatus or urethra is involved, which changes the T stage. SRB lists altered urinary stream among the clinical features and notes that the urethral meatus may be involved, causing alteration in the stream; in B&L's scheme urethral invasion is T3.", ref:"SRB 26 p.1053 · B&L 85 p.1552"},
  ],

  "peripheral-vascular-disease": [
    {id:"pvd01", lv:1, type:"History", q:"Define intermittent claudication.",
     a:"B&L: claudication occurs as a result of anaerobic muscle metabolism and is a debilitating cramp-like pain felt in the muscles that is brought on by walking, is not present on taking the first step, unlike osteoarthritis, and is relieved by rest in both the standing and sitting positions, usually within 5 minutes, unlike nerve compression from a lumbar disc prolapse, spinal osteoarthritis or spinal stenosis, which are typically relieved only on resting in the sitting position for longer than 5 minutes. And the claudication distance varies only slightly from day to day.", ref:"B&L 61 p.998"},
    {id:"pvd02", lv:1, type:"History", q:"What do the distance and the site of the pain tell you?",
     a:"The distance stages the disease: Fontaine 2a is well compensated, able to walk more than 200 metres, and 2b poorly compensated, under 200 metres. The site localises the lesion: calf claudication means superficial femoral disease, thigh and buttock claudication means aortoiliac disease, and with impotence that is Leriche syndrome, aortoiliac disease with sexual impotence secondary to arterial insufficiency.", ref:"SRB 1 p.163 · B&L 61 p.998"},
    {id:"pvd03", lv:1, type:"History", q:"What does rest pain mean?",
     a:"That the limb is threatened, not merely that the claudication is worse. B&L: as disease progression occurs the claudication distance decreases and perfusion may be so severely compromised that anaerobic respiration occurs even at rest. The history that confirms it is the patient hanging the leg out of bed or sleeping in a chair, because dependency improves perfusion.", ref:"B&L 61 p.998, p.999 · Das 6 p.80"},
    {id:"pvd04", lv:1, type:"Diagnosis", q:"Who gets which arterial disease?",
     a:"S Das's discriminators, which narrow the case before you touch the patient. Atherosclerosis: old age, men more than women, lower limbs, more often unilateral. Buerger's disease, thromboangiitis obliterans: men between 20 and 40, lower limbs, usually bilateral. Raynaud's disease: young women, upper limbs, usually bilateral. Diabetic arteriopathy: middle age.", ref:"Das 6 p.80"},
    {id:"pvd05", lv:1, type:"Classification", q:"Give the causes of limb ischaemia.",
     a:"SRB's list: atherosclerosis; embolism, which is acute; the arteriopathies, that is Buerger's disease, Raynaud's disease and Takayasu's disease; diabetes; scleroderma; and physical agents such as trauma, tourniquet and radiation injury.", ref:"SRB 1 p.163"},
    {id:"pvd06", lv:1, type:"Classification", q:"Stage this patient by Fontaine's classification.",
     a:"Stage 1: no clinical symptoms. Stage 2: intermittent claudication, 2a well compensated with a walking distance over 200 metres and 2b poorly compensated under 200 metres. Stage 3: rest pain. Stage 4: gangrene or ischaemic ulcer. Fontaine appears nowhere in B&L 28e, so it is SRB's, but it is the shorthand an Indian examiner asks for.", ref:"SRB 1 p.163"},
    {id:"pvd07", lv:1, type:"Examination", q:"Describe Buerger's postural test and the angle.",
     a:"Lie the patient on his back and raise the leg slowly, watching the sole. SRB: in normal individuals the plantar aspect of the foot remains pink even above 90 degrees. An ischaemic limb shows marked pallor and empty veins, and the angle at which pallor develops is Buerger's angle of vascular insufficiency; an angle of less than 30 degrees indicates severe ischaemia. Then let the limb hang: the pallor is replaced by dependent rubor, the sunset foot sign. Elevation for pallor and dependency for rubor are the two halves of the test.", ref:"SRB 1 p.166 · Das 6 p.82 · B&L 61 p.999"},
    {id:"pvd08", lv:1, type:"Investigation", q:"Give the ankle-brachial pressure index and its thresholds.",
     a:"The ratio of the systolic pressure at the ankle to that in the ipsilateral arm, measured with a Doppler probe. Normal resting ABI is 0.9 to 1.4. Under 0.9 indicates a haemodynamically significant lesion. Under 0.4 suggests chronic limb-threatening ischaemia. A drop of more than 20% in the resting index after exercise is indicative of flow-limiting arterial disease. And B&L's caveat, which is the clause to say aloud: values are merely a guide and normal values may be present with intermittent claudication.", ref:"B&L 61 p.1001"},
    {id:"pvd09", lv:1, type:"Examination", q:"Which pulses do you feel, and what else do you listen for?",
     a:"Femoral, popliteal, posterior tibial and dorsalis pedis in the lower limb, and brachial and radial in the upper, on both sides every time. Then auscultate: SRB notes a systolic bruit may be heard over a stenosed artery, such as the subclavian, femoral, carotid, iliac or renal artery. And examine the abdomen, for an aortic aneurysm and because aortoiliac disease is where buttock claudication and impotence come from.", ref:"SRB 1 p.166 · B&L 61 p.998"},
    {id:"pvd10", lv:1, type:"Examination", q:"What do you look for on inspection?",
     a:"Colour, remembering that static colour deceives, so do the dynamic tests. Trophic changes: loss of hair, shiny atrophic skin, thickened brittle nails, wasted muscle, and ulceration at the pressure points and the tips of the toes. Gangrene, and whether it is wet or dry, since superadded infection often makes the gangrene wet, which is a surgical emergency, while dry gangrene usually is not. And look at the other limb and the fingers, because Buerger's and Raynaud's are usually bilateral.", ref:"B&L 61 p.999 · Das 6 p.83, p.80"},
    {id:"pvd11", lv:1, type:"Classification", q:"What is chronic limb-threatening ischaemia?",
     a:"B&L: patients with ischaemic rest pain with or without ulceration or gangrene, that is tissue loss, are termed to have chronic limb-threatening ischaemia; these patients should be considered to have an imminently threatened leg and require urgent vascular assessment and revascularisation to prevent major amputation. It replaces the older term critical limb ischaemia, which SRB still uses, and it is broader, because it includes tissue loss without rest pain.", ref:"B&L 61 p.999 · SRB 1 p.172"},
    {id:"pvd12", lv:1, type:"Pathology", q:"Why does a patient with claudication need his heart and brain examined?",
     a:"Because B&L's organising principle is that arterial disease produces symptoms relating to the organ supplied: lower limb, claudication, rest pain and gangrene; brain, transient ischaemic attacks and stroke; myocardium, angina and myocardial infarction; intestine, abdominal pain and infarction. The patient with claudication is at greater risk of dying of a myocardial infarction than of losing the leg, which is why the medical management matters as much as the operation.", ref:"B&L 61 p.997"},
    {id:"pvd13", lv:1, type:"Examination", q:"What do you do before you examine this patient's legs?",
     a:"Hand hygiene, introduce yourself and check the name and date of birth, explain what you are going to do, obtain verbal consent, and make the patient comfortable. Expose both legs fully for comparison, and warm your hands before you assess temperature.", ref:"B&L 35 p.472 · B&L 21 p.285"},

    {id:"pvd20", lv:2, type:"History", q:"Which single question best separates vascular from neurogenic claudication?",
     a:"When the pain comes, does standing still relieve it, or do you have to sit down? Claudication is relieved by rest in both standing and sitting positions, usually within 5 minutes, while neurogenic claudication from a lumbar disc prolapse, spinal osteoarthritis or spinal stenosis is typically relieved only on resting in the sitting position for longer than 5 minutes, because sitting flexes the spine. Spinal stenosis is the commonest mimic, so ask it in exactly those words.", ref:"B&L 61 p.998"},
    {id:"pvd21", lv:2, type:"Examination", q:"The foot is warm, red and swollen. Can it still be ischaemic?",
     a:"Yes, and this is the trap B&L warns about. Unlike an acutely ischaemic foot, which is often cold, white, paralysed and insensate, a chronically ischaemic limb tends to equilibrate with the temperature of its surroundings and may feel quite warm under the bedclothes, and chronic ischaemia does not produce paralysis, with sensation usually intact. Patients with CLTI who have been waiting with the leg dependent may have a red swollen foot that may be mistaken for cellulitis by the unwary clinician. The way out is to elevate the limb, which reveals the severity with venous guttering and pallor that changes to red or purple on dependency, the dependent rubor or sunset foot sign.", ref:"B&L 61 p.999"},
    {id:"pvd22", lv:2, type:"Examination", q:"How do you test capillary refilling?",
     a:"S Das: the tip of the nail or the pulp of a toe or finger is pressed for a few seconds and released, and delay in refilling indicates impaired perfusion. B&L measures the same thing as the capillary refill time.", ref:"Das 6 p.83 · B&L 61 p.999"},
    {id:"pvd23", lv:2, type:"Diagnosis", q:"Give the exam answer for Buerger's disease.",
     a:"A young male smoker, between 20 and 40, with bilateral lower limb ischaemia, migratory thrombophlebitis, and distal small-vessel disease with a normal-calibre proximal artery. B&L: thromboangiitis obliterans is characterised by occlusive disease of small and medium-sized vessels. SRB's pathology: vasospasm, then intimal panarteritis, then obliteration, with tender cord-like veins and superficial migratory thrombophlebitis in 30%, nerve involvement from vasa nervorum block or spasm, and the arterial lumen blocked but not thickened as in atherosclerosis. Treatment is absolute smoking cessation; there is usually no vessel to bypass.", ref:"B&L 61 p.1024 · SRB 1 p.172 · Das 6 p.80"},
    {id:"pvd24", lv:2, type:"Investigation", q:"What does the hand-held Doppler waveform add?",
     a:"B&L: a normal artery has a triphasic signal whereas a diseased artery does not. The progression is triphasic to biphasic to monophasic as disease advances, and the quality of the signal is information in itself, separate from the pressure.", ref:"B&L 61 p.1001"},
    {id:"pvd25", lv:2, type:"Investigation", q:"How would you investigate this patient?",
     a:"ABPI first, with exercise if the resting value is normal and the history typical. Hand-held Doppler for the waveform. Duplex ultrasound to localise and grade stenoses and assess the vessels for reconstruction. CT or MR angiography to plan intervention, and catheter angiography where intervention will be done at the same sitting. Then the rest of the patient, because this is systemic arterial disease: blood glucose and HbA1c, lipid profile, renal function, full blood count, ECG and echocardiography where indicated, which is also SRB's general vascular workup.", ref:"B&L 61 p.1001 · SRB 1 p.211"},
    {id:"pvd26", lv:2, type:"Treatment", q:"How do you treat claudication?",
     a:"With the things that change the natural history. Stop smoking, which is the single most effective measure. Supervised exercise to the onset of pain, which works by the mechanism SRB describes, increased flow in the muscle and opening of collaterals. Antiplatelet therapy, a statin, and control of diabetes and hypertension, because the greatest risk is the coronary and cerebral circulations rather than the leg. And foot care, particularly in diabetes. Revascularisation is selective in claudication.", ref:"B&L 61 p.997 · SRB 1 p.162"},
    {id:"pvd27", lv:2, type:"Treatment", q:"When would you revascularise, and how?",
     a:"Urgently in chronic limb-threatening ischaemia, which is rest pain with or without tissue loss, because B&L says the leg is imminently threatened and the patient requires urgent vascular assessment and revascularisation to prevent major amputation. Selectively in claudication. The options are angioplasty with or without stenting for shorter, more proximal lesions, and bypass grafting for long occlusions and distal disease, with the choice depending on the lesion, the quality of the inflow and outflow vessels, the availability of vein for a graft, and the patient's fitness.", ref:"B&L 61 p.999"},
    {id:"pvd28", lv:2, type:"Management", q:"Which patients cannot be revascularised, and why?",
     a:"Those with small-vessel disease, because there is no target vessel to bypass. B&L groups obstruction in small peripheral vessels, that is diabetes, Buerger's disease, Raynaud's disease and inadvertent intra-arterial injection, separately from large-vessel atherosclerotic or embolic occlusion. Management is then medical: pain control, foot care, treatment of infection, and amputation of non-viable tissue.", ref:"B&L 61 p.1014 · SRB 1 p.163"},
    {id:"pvd29", lv:2, type:"Examination", q:"Give the Ps of acute limb ischaemia.",
     a:"B&L's text gives five: pain, pallor, paraesthesia, paralysis and pulselessness. SRB gives a sixth, poikilothermia, change in the temperature, that is cold, and B&L supports the finding by saying the skin is initially cold and pale. Note the sequence, because it decides salvageability: neurological function deteriorates with time, progressing from paraesthesia to eventual complete loss of sensory and motor function, causing an insensate and paralysed limb, which is a poor prognostic sign.", ref:"B&L 61 p.1011 · SRB 1 p.184"},
    {id:"pvd30", lv:2, type:"Diagnosis", q:"Embolus or thrombosis, and how do you tell?",
     a:"By the past history rather than the present. B&L: acute arterial occlusion due to an embolus differs from occlusion due to thrombosis on pre-existing atheroma, where a collateral circulation has often built up over time, and it is essential to differentiate between the two as they require different management; patients with embolism typically give no history of prior claudication and complain of sudden severe pain or numbness. So no claudication history plus sudden onset plus a cardiac source means embolus, while years of claudication then sudden worsening means thrombosis on plaque, with collaterals already present. SRB adds that embolism is the commonest cause in a developing country while graft thrombosis is common in western countries.", ref:"B&L 61 p.1011 · SRB 1 p.183"},
    {id:"pvd31", lv:2, type:"Management", q:"How long have you got in acute limb ischaemia?",
     a:"Six hours. B&L: ischaemia beyond 6 hours is usually irreversible and results in limb loss, and clinicians reviewing a patient with sudden onset leg pain should have a high index of suspicion, as an incorrect diagnosis can be catastrophic. SRB: irreversible ischaemia occurs in 6 hours, and the golden period is 1 to 6 hours.", ref:"B&L 61 p.1011 · SRB 1 p.183"},
    {id:"pvd32", lv:2, type:"Examination", q:"What are the three aims of the bedside assessment in acute ischaemia, and which pulse misleads?",
     a:"B&L's three aims: confirming the diagnosis of acute limb ischaemia, assessing the severity of the limb ischaemia, and identifying the underlying cause including an embolic source, which means examining the heart for atrial fibrillation and recent myocardial infarction, and the other limb for the chronic disease that would make this a thrombosis. The misleading pulse: pulses are absent distally but the femoral pulse may be palpable, even thrusting, as distal occlusion results in forceful expansion of the artery with each pressure wave despite the lack of flow.", ref:"B&L 61 p.1011, p.1012"},

    {id:"pvd40", lv:3, type:"Classification", q:"Classify this limb by Rutherford. Which Rutherford do you mean?",
     a:"Say which, because there are two and the books carry one each. SRB's Rutherford classification of chronic limb ischaemia: grade 0 asymptomatic, 1 mild claudication, 2 moderate, 3 severe, 4 ischaemic rest pain, 5 minor tissue loss, 6 major tissue loss. B&L's Rutherford categories of acute limb ischaemia: class I viable, class IIa marginally threatened, class IIb immediately threatened, class III irreversible, and B&L instructs that following thorough clinical examination the limb should be classified accordingly, because the management options and urgency of treatment depend on the categorisation. Saying Rutherford with no qualifier to an examiner who means the other one is how this goes wrong.", ref:"SRB 1 p.163 · B&L 61 p.1012"},
    {id:"pvd41", lv:3, type:"Examination", q:"Buerger's test or the ankle-brachial index?",
     a:"Do the test, name it, then quantify. S Das and SRB both teach the angle with a threshold, less than 30 degrees meaning severe ischaemia, and S Das uses the test to characterise disease, saying Buerger's test will be positive in Buerger's disease. Neither Buerger's test nor the phrase vascular angle appears in B&L 28e, which describes the same physiology, elevation pallor and dependent rubor, and then quantifies with the ABPI instead, with thresholds tied to outcomes and an added toe pressure, an absolute hallux pressure under 50 mmHg indicating severe ischaemia likely to prevent healing of ulceration. The two are not disagreeing about physiology, only about what you measure with: the angle is an estimate by eye, the index is a reproducible number. In an Indian clinical examination you will be asked to perform Buerger's test, so do it and know the 30-degree figure, then offer the index.", ref:"Das 6 p.82 · SRB 1 p.166 · B&L 61 p.999, p.1001"},
    {id:"pvd42", lv:3, type:"Treatment", q:"Would you do a lumbar sympathectomy?",
     a:"Know it, give SRB's indications, then say where it stands. SRB: a preganglionic sympathectomy, with ganglia L2 and L3 supplying the leg below the knee, which increases cutaneous blood supply and so promotes healing of ulcers and of skin flaps in amputation; its indications are peripheral vascular disease like thromboangiitis obliterans, promoting healing of cutaneous ulcers, changing the level of amputation and helping flaps heal, causalgia of the lower limb, and hyperhidrosis. SRB is honest about the magnitude: it increases blood flow for 2 to 4 weeks and produces a transient small increase in distal perfusion, and elsewhere SRB says plainly that lumbar sympathectomy and omentoplasty are not much use in an atherosclerotic limb. B&L says it in one word: lumbar sympathectomy was used to treat lower limb ischaemia in the past but has also become obsolete, keeping sympathectomy only for palmar and axillary hyperhidrosis, and calling it ineffective or short-lived in Raynaud's. So do not offer it for claudication or for an atherosclerotic limb.", ref:"SRB 1 p.181, p.170 · B&L 61 p.1024"},
    {id:"pvd43", lv:3, type:"Examination", q:"Paraesthesia or complete anaesthesia: which matters in acute ischaemia?",
     a:"Both, in this order. Paraesthesia is the early sign and the one you must not miss, because that limb is salvageable: sensory loss confined to the toes with no audible Doppler signal but preserved venous flow is the marginally threatened class IIa limb. Complete anaesthesia with paralysis is not a worse grade of the same thing, it is the irreversible class III limb. B&L's text lists paraesthesia among the five Ps while its own figure caption says that the fifth feature, anaesthesia, is often stated to be paraesthesia, but in truth complete loss of sensation in the toes and feet is characteristic: that caption is about what an established embolus feels like, not permission to discount paraesthesia. A candidate who leads with anaesthesia will send home the one patient whose leg could have been saved.", ref:"B&L 61 p.1011 · SRB 1 p.185"},
    {id:"pvd44", lv:3, type:"Treatment", q:"What are the first two things you do in acute limb ischaemia?",
     a:"Heparin and analgesia, in that order, and both books agree. SRB: immediate infusion of 5000 to 10 000 units of intravenous heparin and relief of pain are needed first. B&L: the immediate administration of 5000 units of heparin intravenously can reduce extension of thrombus and maintain patency of the surrounding, particularly the distal, vessels until the embolus can be treated, and relief of pain is essential because it is severe and constant.", ref:"SRB 1 p.185 · B&L 61 p.1012"},
    {id:"pvd45", lv:3, type:"Procedure", q:"Describe an embolectomy.",
     a:"B&L: the femoral artery is exposed, a Fogarty catheter is passed beyond the clot, the balloon is inflated and the catheter withdrawn slowly together with any obstructing material, and the procedure is repeated until bleeding occurs, with a completion angiogram. SRB names the instrument and the year, interventional balloon 5 French Fogarty, 1963, or the open method, and calls embolectomy the standard treatment for arterial embolism.", ref:"B&L 61 p.1012 · SRB 1 p.185"},
    {id:"pvd46", lv:3, type:"Treatment", q:"When is thrombolysis appropriate, and when is it not?",
     a:"B&L opens with the condition rather than the technique: if ischaemia is not so severe that immediate operation is essential, it may be possible to treat either embolus or thrombosis by intra-arterial thrombolysis, with lysis achieved within 24 hours in successful cases and abandoned if there is no progression of clot dissolution; the most important contraindications are recent stroke, bleeding diathesis and pregnancy, and results over the age of 80 are poor. SRB makes it a class rule: thrombolysis is useful only for class I and IIa acute ischaemia, with a 25% failure rate, and it is mainly for acute thrombus, used for embolus only as an adjunct alongside embolectomy. Put the two together and the rule is short: a class IIb limb needs immediate revascularisation and lysis takes up to 24 hours, so a IIb limb is not lysed.", ref:"B&L 61 p.1013 · SRB 1 p.186"},
    {id:"pvd47", lv:3, type:"Complications", q:"The pulses are palpable after revascularisation but the pain is worse. What is happening?",
     a:"Compartment syndrome, and a palpable pulse does not exclude it. B&L: in limbs subject to sudden ischaemia followed by revascularisation, oedema is likely, muscles swell within confined fascial compartments, and this can itself cause tissue ischaemia with local muscle necrosis, nerve damage and systemic effects such as renal failure from muscle breakdown products; the picture is severe pain out of proportion to the clinical findings that worsens despite appropriate analgesia, with a tense compartment and pain on passive flexion and extension. Treatment is urgent compartment fasciotomy, usually of the calf and especially the anterior tibial compartment, and B&L advises liberal concomitant calf with or without thigh fasciotomies after revascularising a prolonged ischaemic limb. SRB's numbers: a compartment pressure over 40 mmHg, or over 30 mmHg for 3 hours, or above the mean arterial pressure, with the anterior compartment commonest and pain aggravated by dorsiflexion of the toes.", ref:"B&L 61 p.1013 · SRB 1 p.186, p.183"},
    {id:"pvd48", lv:3, type:"Complications", q:"Why is revascularising a dead limb dangerous?",
