<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Surgery Case Files</title>
<style>:root{color-scheme:light dark}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: an index that opens into one case, and a case page offering four ways in,
   read it, drill it, see where you stand, or take it away. One column throughout,
   because it is used on a phone between postings as often as at a desk. */

:root {
  --bg:       #f4f1ec;
  --card:     #ffffff;
  --ink:      #1a1e21;
  --ink-soft: #5c646b;
  --rule:     #e0dad0;
  --accent:   #005f73;
  --accent-dim:#e0ecef;
  --good:     #2f6b45;
  --good-dim: #e2efe7;
  --miss:     #9a4228;
  --miss-dim: #f7e8e2;


  /* The reader's floating chrome, the rail, studio, note editor, bubble and source pane, is
     appended to document.body rather than inside .guide, so it cannot see the tokens the
     stylesheet defines on .guide. In the hub that left every panel painting var(--paper, #fff)
     white while its text used the dark --ink, measured at 1.24:1. These aliases give the
     chrome the same palette the hub is already using. */
  --paper:       var(--card);
  --accent-soft: var(--accent-dim);
  --flag:        #8a5a2b;
  --flag-soft:   #f6ece0;
  --cite:        var(--ink-soft);
  /* The note editor's Save button reads var(--on-accent). That token is defined on .guide,
     and the editor is appended to document.body, so it fell back to white on the pale
     accent the dark themes use: 2.02:1. */
  --on-accent:   #fff;
  --mark:        #fff3bf;
  --bl:          #5b4a8a;
  --srb:         #1f6b5c;

  --serif: "Spectral", Georgia, "Times New Roman", serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111416; --card: #1a1e21; --ink: #e9e7e2; --ink-soft: #a0a8ae;
    --rule: #2d3338; --accent: #6fc3d2; --accent-dim: #16292f;
    --good: #7fc79b; --good-dim: #16281d; --miss: #e09a7c; --miss-dim: #2a1b15;
    --flag: #d8a46a; --flag-soft: #2a1f14; --mark: #6b5b1f;
    --on-accent: #06191e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111416; --card: #1a1e21; --ink: #e9e7e2; --ink-soft: #a0a8ae;
  --rule: #2d3338; --accent: #6fc3d2; --accent-dim: #16292f;
  --good: #7fc79b; --good-dim: #16281d; --miss: #e09a7c; --miss-dim: #2a1b15;
  --flag: #d8a46a; --flag-soft: #2a1f14; --mark: #6b5b1f;
  --on-accent: #06191e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}

.shell {
  max-width: 40rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 1rem 4rem;
}

/* ---------- top bar: back on the left, theme on the right ---------- */

.topbar {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  min-height: 2.2rem;
  margin-bottom: 0.9rem;
}

.topbar .spacer { flex: 1; }

button.ghost {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--ink-soft);
  background: none;
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 0.3rem 0.55rem;
  cursor: pointer;
}
button.ghost:hover { color: var(--accent); border-color: var(--rule); }
button.ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.ghost svg { width: 15px; height: 15px; flex: none; }

.card {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 1.5rem;
}

h1 {
  font-family: var(--serif);
  font-size: 1.9rem; font-weight: 600; letter-spacing: -0.015em;
  margin: 0 0 0.4rem; text-wrap: balance;
}
h2 {
  font-family: var(--serif);
  font-size: 1.3rem; font-weight: 600; margin: 0 0 0.5rem; text-wrap: balance;
}
h3 {
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--accent);
  margin: 1.8rem 0 0.7rem;
}
.eyebrow {
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.13em;
  text-transform: uppercase; color: var(--accent); margin: 0 0 0.55rem;
}
.sub { color: var(--ink-soft); margin: 0 0 1.6rem; font-size: 0.95rem; }

/* ---------- entry tiles ---------- */

.tiles { display: grid; gap: 0.8rem; margin-top: 1.4rem; }

.tile {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 0.25rem 1rem;
  align-items: start;
  text-align: left;
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 9px;
  padding: 1.05rem 1.15rem;
  cursor: pointer;
  text-decoration: none;
  transition: border-color 0.12s, transform 0.12s;
}
.tile:hover { border-color: var(--accent); transform: translateY(-1px); }
.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tile .ico {
  grid-column: 1; grid-row: 1 / span 2;
  width: 34px; height: 34px; border-radius: 7px;
  background: var(--accent-dim); color: var(--accent);
  display: grid; place-items: center;
  font-size: 0.62rem; font-weight: 700; letter-spacing: 0.03em;
}
.tile .t-name { grid-column: 2; grid-row: 1; font-weight: 650; font-size: 1.02rem; }
.tile .t-desc { grid-column: 2; grid-row: 2; font-size: 0.85rem; color: var(--ink-soft); line-height: 1.45; }
.tile .t-go { grid-column: 3; grid-row: 1 / span 2; color: var(--ink-soft); font-size: 1.1rem; align-self: center; }
.tile:hover .t-go { color: var(--accent); }

.tile.muted { opacity: 0.5; cursor: default; }
.tile.muted:hover { border-color: var(--rule); transform: none; }

.meta-line {
  font-size: 0.78rem; color: var(--ink-soft);
  margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--rule);
}
.meta-line b { color: var(--ink); }

.srckey { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; font-size: 0.74rem; color: var(--ink-soft); margin-top: 0.8rem; }
.srckey span { display: inline-flex; align-items: center; gap: 0.35rem; }
.srckey i { width: 9px; height: 9px; border-radius: 2px; flex: none; }

/* ---------- buttons ---------- */

button.btn {
  font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px;
  border: 1px solid var(--rule); background: var(--card); color: var(--ink);
  padding: 0.6rem 1rem;
}
button.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] button.btn.primary { color: #06191e; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) button.btn.primary { color: #06191e; }
}
button.btn.primary:hover:not(:disabled) { opacity: 0.9; }

.row { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.row.end { justify-content: flex-end; }

input[type="text"] {
  width: 100%; font: inherit; font-size: 1rem; color: var(--ink);
  background: var(--bg); border: 1px solid var(--rule);
  border-radius: 6px; padding: 0.6rem 0.75rem;
}
input[type="text"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.fld {
  display: block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 0.4rem;
}
.hint { font-size: 0.8rem; color: var(--ink-soft); margin-top: 0.5rem; }

.known { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.8rem; }
.known button {
  font: inherit; font-size: 0.82rem; font-weight: 600;
  color: var(--accent); background: var(--accent-dim);
  border: 1px solid transparent; border-radius: 999px;
  padding: 0.25rem 0.7rem; cursor: pointer;
}
.known button:hover { border-color: var(--accent); }

/* ---------- viva ---------- */

.levels { display: grid; gap: 0.7rem; margin: 1.2rem 0 1.4rem; }
.level { text-align: left; display: grid; gap: 0.2rem; padding: 0.9rem 1rem; width: 100%;
         font: inherit; color: var(--ink); background: var(--card);
         border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; }
.level:hover { border-color: var(--accent); }
.level:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.level .lv-name { font-weight: 650; font-size: 1rem; }
.level .lv-desc { font-size: 0.85rem; color: var(--ink-soft); line-height: 1.45; }
.level .lv-meta { font-size: 0.75rem; color: var(--accent); font-weight: 600; }

.progress { display: flex; justify-content: space-between; align-items: baseline;
            font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em;
            text-transform: uppercase; color: var(--ink-soft); margin-bottom: 0.5rem; }
.bar { height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; margin-bottom: 1.4rem; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width 0.25s; }

.qtag { display: inline-block; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.09em;
        text-transform: uppercase; color: var(--accent); background: var(--accent-dim);
        border-radius: 3px; padding: 0.2rem 0.45rem; margin-bottom: 0.8rem; }

.question { font-family: var(--serif); font-size: 1.28rem; line-height: 1.4;
            font-weight: 600; margin: 0 0 1.3rem; text-wrap: balance; }

.answer { border-left: 3px solid var(--accent); background: var(--accent-dim);
          border-radius: 0 6px 6px 0; padding: 0.9rem 1rem; margin-bottom: 1.3rem; font-size: 0.95rem; }
.answer .tag { display: block; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em;
               text-transform: uppercase; color: var(--accent); margin-bottom: 0.35rem; }
.answer .ref { display: block; margin-top: 0.6rem; font-size: 0.72rem; color: var(--ink-soft); }

.grade { display: flex; gap: 0.6rem; }
.grade button { flex: 1; }
/* These were coloured on hover only, so on a phone the two buttons were byte-identical
   and the hover colour could stick to whichever was tapped last. Colour them always. */
.grade .got { border-color: var(--good); color: var(--good); background: var(--good-dim); }
.grade .missed { border-color: var(--miss); color: var(--miss); background: var(--miss-dim); }
.grade .got:hover { background: var(--good); color: var(--paper); }
.grade .missed:hover { background: var(--miss); color: var(--paper); }
@media (hover: none) {
  .grade .got:hover { background: var(--good-dim); color: var(--good); }
  .grade .missed:hover { background: var(--miss-dim); color: var(--miss); }
}

.score { font-family: var(--serif); font-size: 3rem; font-weight: 600; line-height: 1;
         margin: 0.4rem 0 0.2rem; font-variant-numeric: tabular-nums; }
.score small { font-size: 1.05rem; color: var(--ink-soft); font-weight: 400; }

.breakdown { margin: 1.4rem 0; display: grid; gap: 0.5rem; }
.brow { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem 0.8rem; align-items: center;
        padding-bottom: 0.5rem; border-bottom: 1px solid var(--rule); }
.brow .bname { font-size: 0.9rem; font-weight: 600; min-width: 0; }
.brow .bval { font-size: 0.82rem; font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
.brow .btrack { grid-column: 1 / -1; height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.brow .btrack > i { display: block; height: 100%; }

.verdict { padding: 0.9rem 1rem; border-radius: 6px; font-size: 0.92rem;
           margin: 1.2rem 0; border-left: 3px solid; }
.verdict.weak { background: var(--miss-dim); border-color: var(--miss); }
.verdict.strong { background: var(--good-dim); border-color: var(--good); }
.verdict.info { background: var(--accent-dim); border-color: var(--accent); }

.saved { font-size: 0.78rem; color: var(--ink-soft); margin-top: 1.1rem;
         padding-top: 0.9rem; border-top: 1px solid var(--rule); }

.ask { margin-top: 1.8rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); }
.ask h3 { margin: 0 0 0.6rem; font-size: 0.92rem; }
.ask textarea {
  width: 100%; box-sizing: border-box; resize: vertical; min-height: 4.2rem;
  font: inherit; font-size: 1rem;            /* 16px, so iOS does not zoom on focus */
  color: var(--ink); background: var(--card);
  border: 1px solid var(--rule); border-radius: 8px; padding: 0.7rem 0.8rem;
}
.ask textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ask .row { margin-top: 0.6rem; }
.asknote { font-size: 0.8rem; color: var(--ink-soft); margin: 0.6rem 0 0; min-height: 1.1em; }

.storagewarn {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
  background: var(--miss-dim); color: var(--ink);
  border-top: 2px solid var(--miss);
  padding: 0.8rem 1rem; font-size: 0.85rem; line-height: 1.45;
  padding-bottom: max(0.8rem, env(safe-area-inset-bottom, 0px));
}

.who { display: flex; justify-content: space-between; align-items: center; gap: 0.8rem;
       font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 1rem; }

/* ---------- progress view ---------- */

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: 0.8rem; margin: 1.2rem 0; }
.stat { border: 1px solid var(--rule); border-radius: 8px; padding: 0.8rem 0.9rem; }
.stat .sv { font-family: var(--serif); font-size: 1.6rem; font-weight: 600; line-height: 1.1;
            font-variant-numeric: tabular-nums; }
.stat .sl { font-size: 0.72rem; color: var(--ink-soft); margin-top: 0.15rem; line-height: 1.35; }

.hist { margin: 0.6rem 0 0; display: grid; gap: 0; }
.hrow { display: grid; grid-template-columns: 1fr auto auto; gap: 0.8rem; align-items: baseline;
        padding: 0.55rem 0; border-bottom: 1px solid var(--rule); font-size: 0.86rem; }
.hrow .hl { font-weight: 600; min-width: 0; }
.hrow .hd { color: var(--ink-soft); font-size: 0.78rem; white-space: nowrap; }
.hrow .hp { font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
.hrow .hp.ok { color: var(--good); }
.hrow .hp.bad { color: var(--miss); }

.empty { color: var(--ink-soft); font-size: 0.9rem; padding: 1.2rem 0; }

/* ---------- the study guide, rendered inside this page ---------- */

/* The guide carries its own measure, and the shell's 40rem was clamping it: Narrow fitted
   inside the shell and every wider setting came out identical, so the control looked
   broken. In the guide the shell follows whatever width the reader chose, a little wider
   than the guide's own measure so that the guide stays the binding constraint. */
/* In the guide the shell steps out of the way entirely and the guide's own measure
   decides the width. Having both constrain it is what made Wide and Full identical:
   whichever was smaller won, and on most windows that was the shell. */
body[data-screen="guide"] .shell {
  max-width: none;
  padding-left: 0;
  padding-right: 0;
}
body[data-screen="guide"] .readerwrap { margin: 0; }
body[data-screen="guide"] .topbar {
  max-width: 60rem;
  margin-left: auto;
  margin-right: auto;
  padding: 0 max(16px, env(safe-area-inset-left, 0px));
}

.readerwrap { margin: 0 -1.5rem -1.5rem; }
.readerwrap .guide { border-radius: 0 0 10px 10px; }
.readerwrap .guide .wrap { padding-block: 1.5rem 3rem; }
/* The brownie debt. Sits out of the way, waits to be tapped, and turns into what it is
   actually about. */
.brownie {
  position: fixed;
  left: 50%;
  bottom: 1.1rem;
  transform: translate(-50%, 14px);
  z-index: 70;
  max-width: min(27rem, calc(100vw - 2rem));
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0.68rem 1rem;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--card);
  color: var(--ink);
  box-shadow: 0 6px 22px rgba(0, 0, 0, 0.14);
  font-family: var(--sans);
  font-size: 0.86rem;
  line-height: 1.35;
  text-align: center;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.28s ease, transform 0.28s ease;
}
.brownie.in { opacity: 1; transform: translate(-50%, 0); }
.brownie.paid {
  min-height: 0;
  padding: 0.5rem 0.9rem;
  border-color: transparent;
  background: none;
  box-shadow: none;
}
.brownie.gone { opacity: 0; transform: translate(-50%, -10px) scale(0.86); }
.brownie:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  .brownie, .brownie.gone { transition: opacity 0.2s ease; transform: translate(-50%, 0); }
}

.loading { color: var(--ink-soft); font-size: 0.9rem; padding: 2rem 0; text-align: center; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style id="guideCss">/* Stylesheet for the surgery reference documents.

   Every rule is scoped under .guide, so the same sheet works in two places: the standalone
   document (where <body class="guide">) and inside the Claude artifact (where the guide is a
   <div class="guide"> alongside the app's own interface).

   Everything a reader might want to change is a token on .guide, switched by data attributes.
   Students read very differently from one another, line length, type size and contrast are
   not decoration here, they decide whether someone can sit with a document for an hour. */

/* ============================== tokens ============================== */

.guide {
  /* colour: light is the base; the themes below redefine these */
  --paper:       #fbfaf7;
  --ink:         #1b1f22;
  --ink-soft:    #5a6269;
  --rule:        #ddd8ce;
  --accent:      #005f73;
  --on-accent:   #fff;
  --accent-soft: #e3eef0;
  --flag:        #8a5a2b;
  --flag-soft:   #f6ece0;
  --cite:        #7d8891;
  --mark:        #fff3bf;
  --bl:          #5b4a8a;
  --srb:         #1f6b5c;

  /* typography */
  --face-body: "Spectral", Georgia, "Times New Roman", serif;
  --face-ui:  "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs:       17px;
  --lh:       1.62;
  --track:    0em;

  /* measure */
  --measure: 42rem;

  font-family: var(--face-body);
  font-size: var(--fs);
  line-height: var(--lh);
  letter-spacing: var(--track);
  color: var(--ink);
  background: var(--paper);
  position: relative;          /* the ink canvas anchors to this */
}

/* ---------- reader: line width ---------- */
/* Each step is also a share of the window, not only a fixed measure. With fixed measures
   alone the steps collapsed into each other on anything but a large screen: below about
   900px Wide and Full were the same width, and below about 730px Medium, Wide and Full
   were all the same, so picking a wider setting did nothing at all. The fixed value still
   wins on a big screen, which keeps the comfortable reading measure there. */
.guide[data-width="narrow"] { --measure: min(34rem, 64vw); }
.guide[data-width="medium"] { --measure: min(42rem, 78vw); }
.guide[data-width="wide"]   { --measure: min(54rem, 90vw); }
.guide[data-width="full"]   { --measure: 100%; }

/* On a phone the window is the measure, so the control is hidden rather than offered and
   left to do nothing. */
@media (max-width: 640px) {
  .guide[data-width] { --measure: 100%; }
  .rdr-widthrow { display: none; }
}

/* ---------- reader: type size ---------- */
.guide[data-size="1"] { --fs: 15px; }
.guide[data-size="2"] { --fs: 16px; }
.guide[data-size="3"] { --fs: 17px; }
.guide[data-size="4"] { --fs: 19px; }
.guide[data-size="5"] { --fs: 21px; }
.guide[data-size="6"] { --fs: 24px; }

/* ---------- reader: line spacing ---------- */
.guide[data-leading="tight"]  { --lh: 1.42; }
.guide[data-leading="normal"] { --lh: 1.62; }
.guide[data-leading="loose"]  { --lh: 1.9; }

/* ---------- reader: typeface ----------
   Hyperlegible is included because it was drawn for low-vision readers; it also suits
   anyone who finds a serif tiring on a screen. Mono suits people who read code all day. */
.guide[data-face="serif"] { --face-body: "Spectral", Georgia, "Times New Roman", serif; }
.guide[data-face="sans"]  { --face-body: "Inter", system-ui, -apple-system, sans-serif;
                            --face-ui: "Inter", system-ui, -apple-system, sans-serif; }
.guide[data-face="hyper"] { --face-body: "Atkinson Hyperlegible", system-ui, sans-serif;
                            --face-ui: "Atkinson Hyperlegible", system-ui, sans-serif;
                            --track: 0.005em; }
.guide[data-face="mono"]  { --face-body: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
                            --fs: 15px; }

/* ---------- reader: colour themes ---------- */

.guide[data-theme="sepia"] {
  --paper: #f4ecd8; --ink: #433422; --ink-soft: #6f5f4a; --rule: #ddd0b4;
  --accent: #7a4a1e; --on-accent: #fff; --accent-soft: #ece0c8; --flag: #8a5a2b; --flag-soft: #ece0c8;
  --cite: #8a7b63; --mark: #f5d98a; --bl: #6a4a7a; --srb: #3f6b4a;
  color-scheme: light;
}

.guide[data-theme="dark"] {
  --paper: #15181a; --ink: #e8e6e1; --ink-soft: #a3abb2; --rule: #2e3338;
  --accent: #6fc3d2; --on-accent: #0b1416; --accent-soft: #1b2a2e; --flag: #d9a36a; --flag-soft: #2a2119;
  --cite: #78828a; --mark: #4a4120; --bl: #a893dd; --srb: #6fc3a8;
  color-scheme: dark;
}

.guide[data-theme="contrast"] {
  --paper: #000000; --ink: #ffffff; --ink-soft: #d8d8d8; --rule: #6a6a6a;
  --accent: #6fe3ff; --on-accent: #000; --accent-soft: #10242b; --flag: #ffc46b; --flag-soft: #2a2008;
  --cite: #bdbdbd; --mark: #4a4a00; --bl: #d0b8ff; --srb: #7fe8c0;
  color-scheme: dark;
}

/* follow the operating system when the reader has not chosen */
@media (prefers-color-scheme: dark) {
  .guide[data-theme="auto"] {
    --paper: #15181a; --ink: #e8e6e1; --ink-soft: #a3abb2; --rule: #2e3338;
    --accent: #6fc3d2; --on-accent: #0b1416; --accent-soft: #1b2a2e; --flag: #d9a36a; --flag-soft: #2a2119;
    --cite: #78828a; --mark: #4a4120; --bl: #a893dd; --srb: #6fc3a8;
    color-scheme: dark;
  }
}

/* ============================== layout ============================== */

.guide * { box-sizing: border-box; }

.guide .wrap {
  max-width: var(--measure);
  margin: 0 auto;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: 2.5rem 5rem;
}

body.guide { margin: 0; -webkit-text-size-adjust: 100%; }

/* ============================== masthead ============================== */

.guide .eyebrow {
  font-family: var(--face-ui);
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--accent); margin: 0 0 0.6rem;
}

.guide h1 {
  font-family: var(--face-body);
  font-size: 2.1rem; font-weight: 600; line-height: 1.15;
  letter-spacing: -0.015em; text-wrap: balance; margin: 0 0 0.7rem;
  overflow-wrap: break-word; hyphens: auto;
}

.guide .standfirst { font-size: 1.02rem; color: var(--ink-soft); margin: 0 0 1.6rem; }

.guide .masthead {
  border-bottom: 2px solid var(--ink);
  padding-bottom: 1.4rem; margin-bottom: 2.2rem;
}

/* ============================== structure ============================== */

.guide h2 {
  font-family: var(--face-ui);
  font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink);
  margin: 3.2rem 0 0.2rem; padding-bottom: 0.45rem;
  border-bottom: 1px solid var(--rule);
}
.guide h2 .n { color: var(--accent); margin-right: 0.5rem; }

.guide h3 {
  font-family: var(--face-body);
  font-size: 1.22rem; font-weight: 600; margin: 2.1rem 0 0.1rem; text-wrap: balance;
}

.guide h4 {
  font-family: var(--face-ui);
  font-size: 0.86rem; font-weight: 650; margin: 1.5rem 0 0.4rem; color: var(--ink);
}

.guide p { margin: 0.75rem 0; }
.guide a { color: var(--accent); }

/* ---------- reader: emphasise headings ---------- */
.guide[data-hl-head="on"] h2 {
  background: var(--accent-soft);
  border-bottom-color: var(--accent);
  padding: 0.5rem 0.6rem;
  border-radius: 3px 3px 0 0;
}
.guide[data-hl-head="on"] h3 {
  border-left: 3px solid var(--accent);
  padding-left: 0.6rem;
}

/* ============================== step + rationale ============================== */

.guide .step {
  margin: 1.35rem 0; padding-left: 0.95rem; border-left: 2px solid var(--rule);
}
.guide .step > .ask { font-weight: 600; }

.guide .step > .why {
  display: block;
  font-family: var(--face-ui);
  font-size: 0.88em; line-height: 1.55;
  color: var(--ink-soft); margin-top: 0.35rem;
}
.guide .why b, .guide .why strong { color: var(--ink); font-weight: 650; }

.guide .why .label {
  font-size: 0.68em; font-weight: 700; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--accent); margin-right: 0.4rem;
}
.guide .why .label.out { color: var(--flag); }

/* ---------- reader: emphasise the reasoning ----------
   The rationale is the point of this document, so some readers want it to dominate
   rather than sit quietly under each step. */
.guide[data-hl-why="on"] .step {
  border-left-color: var(--accent);
  background: var(--accent-soft);
  padding: 0.75rem 0.9rem;
  border-radius: 0 4px 4px 0;
}
.guide[data-hl-why="on"] .step > .why { color: var(--ink); }

/* ---------- reader: recall mode ----------
   Hides every answer and rationale until tapped, which turns the reference into a
   self-test without needing a separate deck. */
.guide[data-recall="on"] .step > .why,
.guide[data-recall="on"] dl.findings dd,
.guide[data-recall="on"] .viva .ans {
  background: var(--rule);
  color: transparent;
  border-radius: 3px;
  cursor: pointer;
  user-select: none;
}
.guide[data-recall="on"] .step > .why *,
.guide[data-recall="on"] dl.findings dd *,
.guide[data-recall="on"] .viva .ans * { visibility: hidden; }
.guide[data-recall="on"] .revealed,
.guide[data-recall="on"] .revealed * {
  background: none !important;
  color: inherit !important;
  visibility: visible !important;
  user-select: auto;
}
.guide[data-recall="on"] .revealed .label { color: var(--accent) !important; }
.guide[data-recall="on"] .revealed .label.out { color: var(--flag) !important; }

/* ============================== finding lists ============================== */

.guide dl.findings { margin: 1.1rem 0; }
.guide dl.findings dt { font-weight: 600; margin-top: 1rem; }
.guide dl.findings dd {
  margin: 0.2rem 0 0 0;
  font-family: var(--face-ui);
  font-size: 0.88em; line-height: 1.55; color: var(--ink-soft);
}

/* ---------- reader: emphasise key terms ---------- */
.guide[data-hl-term="on"] b,
.guide[data-hl-term="on"] strong {
  background: var(--mark);
  padding: 0 0.15em;
  border-radius: 2px;
}
.guide[data-hl-term="on"] .why b,
.guide[data-hl-term="on"] dl.findings dd b { color: var(--ink); }

/* ============================== callouts ============================== */

.guide .pearl {
  background: var(--accent-soft); border-left: 3px solid var(--accent);
  padding: 0.85rem 1rem; margin: 1.6rem 0; font-size: 0.95em;
}
.guide .pearl .tag {
  display: block; font-family: var(--face-ui);
  font-size: 0.66em; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 0.3rem;
}

.guide .unverified {
  background: var(--flag-soft); border-left: 3px solid var(--flag);
  padding: 0.85rem 1rem; margin: 1.6rem 0;
  font-family: var(--face-ui); font-size: 0.86em; line-height: 1.55;
}
.guide .unverified .tag {
  display: block; font-size: 0.66em; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--flag); margin-bottom: 0.3rem;
}

/* ============================== viva ============================== */

.guide .viva { margin: 1.2rem 0; }
.guide .viva details { border-bottom: 1px solid var(--rule); padding: 0.7rem 0; }
.guide .viva summary {
  cursor: pointer; font-weight: 600; font-size: 0.98em;
  list-style: none; display: flex; gap: 0.6rem; align-items: baseline;
}
.guide .viva summary::-webkit-details-marker { display: none; }
.guide .viva summary::before {
  content: "Q"; font-family: var(--face-ui);
  font-size: 0.64em; font-weight: 700; letter-spacing: 0.08em;
  color: var(--accent); border: 1px solid var(--accent); border-radius: 2px;
  padding: 0.08rem 0.3rem; flex: none; transform: translateY(-0.1em);
}
.guide .viva details[open] summary { color: var(--accent); }
.guide .viva .ans {
  font-family: var(--face-ui); font-size: 0.89em; line-height: 1.6;
  color: var(--ink-soft); margin: 0.55rem 0 0.2rem 1.9rem;
}

/* ============================== contents =============================== */

/* A long case runs to eight or ten sections and seventeen thousand words, and the viva
   is at the bottom of all of it. Collapsed by default so it costs nothing to a reader
   going straight through. */
.guide .rdr-toc { margin: 0 0 1.8rem; }
.guide .rdr-toc summary {
  cursor: pointer; list-style: none;
  font-family: var(--face-ui); font-size: 0.72em; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent);
  padding: 0.5rem 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
}
.guide .rdr-toc summary::-webkit-details-marker { display: none; }
.guide .rdr-toc summary::after { content: " +"; }
.guide .rdr-toc[open] summary::after,
.guide .rdr-toc details[open] summary::after { content: " 2"; }
.guide .rdr-toc ol {
  list-style: none; margin: 0.7rem 0 0; padding: 0;
  display: grid; gap: 0.1rem;
}
.guide .rdr-toc li { margin: 0; }
.guide .rdr-toc a {
  display: flex; gap: 0.6rem; align-items: baseline;
  font-family: var(--face-ui); font-size: 0.82em; line-height: 1.45;
  color: var(--ink); text-decoration: none;
  padding: 0.42rem 0.3rem; border-radius: 4px;
}
.guide .rdr-toc a b {
  flex: none; min-width: 1.1em; color: var(--accent); font-weight: 700;
}
.guide .rdr-toc a:hover { background: var(--accent-soft); }
@media (hover: none) { .guide .rdr-toc a:hover { background: none; } }
@media (pointer: coarse) {
  .guide .rdr-toc a { padding: 0.62rem 0.3rem; }
  /* the generated contents summary was 37px, under the 44px minimum */
  .guide .rdr-toc summary { padding: 0.78rem 0; }
}

/* so a linked section is not hidden under anything, and lands with a little air */
.guide h2[id] { scroll-margin-top: 1rem; }

@media print { .guide .rdr-toc { display: none; } }

/* ============================== citations ============================== */

.guide cite.src {
  font-family: var(--face-ui); font-style: normal;
  font-size: 0.66em; font-weight: 600; letter-spacing: 0.02em;
  color: var(--cite);
  /* The chip stays on one line. build.py puts a zero-width space before each one,
     which is what lets a chip that will not fit move to the next line whole
     instead of widening the page past the phone. */
  white-space: nowrap; max-width: 100%;
  border: 1px solid var(--rule); border-radius: 2px;
  padding: 0.05rem 0.28rem; margin-left: 0.3rem; vertical-align: 0.12em;
}
.guide cite.src.das { border-color: var(--accent); color: var(--accent); }
.guide cite.src.bl  { border-color: var(--bl);     color: var(--bl); }
.guide cite.src.srb { border-color: var(--srb);    color: var(--srb); }

.guide[data-cite="off"] cite.src { display: none; }

/* ============================== discrepancies ============================== */

.guide details.conflict {
  border: 1px solid var(--rule); border-left: 3px solid var(--flag);
  border-radius: 0 4px 4px 0; background: var(--flag-soft); margin: 1.5rem 0;
}
.guide details.conflict > summary {
  cursor: pointer; list-style: none; display: flex; gap: 0.55rem; align-items: baseline;
  padding: 0.7rem 0.9rem; font-family: var(--face-ui);
  font-size: 0.82em; line-height: 1.45; color: var(--ink);
  flex-wrap: wrap;
}
/* A flex item defaults to min-width:auto and so refuses to shrink below its own
   content width; a long source line in the summary then widened the whole page. */
.guide details.conflict > summary > * { min-width: 0; overflow-wrap: break-word; }
.guide details.conflict > summary::-webkit-details-marker { display: none; }
.guide details.conflict > summary::before {
  content: "*"; color: var(--flag); font-size: 1em; font-weight: 700;
  line-height: 1; flex: none; transform: translateY(0.22em);
}
.guide details.conflict > summary::after {
  content: "expand"; margin-left: auto; flex: none;
  font-size: 0.66em; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--flag); border: 1px solid var(--flag); border-radius: 3px; padding: 0.1rem 0.35rem;
}
.guide details.conflict[open] > summary::after { content: "close"; }
.guide details.conflict > summary:hover { color: var(--flag); }
.guide details.conflict .what { font-weight: 650; }
.guide details.conflict .who { color: var(--ink-soft); font-weight: 400; }
.guide details.conflict .body {
  padding: 0 0.9rem 0.9rem 2.05rem; border-top: 1px solid var(--rule);
  margin-top: -1px; padding-top: 0.8rem;
}
.guide details.conflict dl { margin: 0; }
.guide details.conflict dt {
  font-family: var(--face-ui); font-size: 0.76em; font-weight: 700;
  color: var(--ink); margin-top: 0.65rem;
}
.guide details.conflict dt:first-child { margin-top: 0; }
.guide details.conflict dd {
  margin: 0.15rem 0 0; font-family: var(--face-ui);
  font-size: 0.86em; line-height: 1.55; color: var(--ink-soft);
}
.guide details.conflict .ruling {
  display: block; margin-top: 0.85rem; padding-top: 0.7rem;
  border-top: 1px solid var(--rule); font-family: var(--face-ui);
  font-size: 0.86em; line-height: 1.55; color: var(--ink-soft);
}
.guide details.conflict .ruling b { color: var(--ink); }

.guide[data-conflicts="off"] details.conflict { display: none; }

/* ============================== source key ============================== */

.guide .srckey {
  display: flex; flex-wrap: wrap; gap: 0.5rem 1.1rem;
  font-family: var(--face-ui); font-size: 0.74em; color: var(--ink-soft);
  margin: 1.2rem 0 0; padding-top: 0.9rem; border-top: 1px solid var(--rule);
}
.guide .srckey span { display: inline-flex; align-items: center; gap: 0.35rem; }
.guide .srckey i { width: 9px; height: 9px; border-radius: 2px; flex: none; }

/* ============================== tables ============================== */

.guide .scroll { overflow-x: auto; margin: 1.4rem 0; }
.guide table {
  border-collapse: collapse; width: 100%;
  font-size: 0.9em; font-family: var(--face-ui); min-width: 0;
}
.guide th, .guide td {
  text-align: left; vertical-align: top;
  padding: 0.5rem 0.7rem 0.5rem 0; border-bottom: 1px solid var(--rule);
}
.guide th {
  font-size: 0.68em; font-weight: 700; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--accent); border-bottom: 1px solid var(--ink);
}

/* ============================== figures ============================== */

.guide figure { margin: 1.8rem 0; padding: 0; }
.guide figure img {
  display: block; max-width: 100%; height: auto;
  border: 1px solid var(--rule); border-radius: 2px; background: #fff;
}
.guide figcaption {
  font-family: var(--face-ui); font-size: 0.78em; line-height: 1.5;
  color: var(--ink-soft); margin-top: 0.5rem;
}

/* ============================== colophon ============================== */

.guide .colophon {
  margin-top: 4rem; padding-top: 1.2rem; border-top: 1px solid var(--rule);
  font-family: var(--face-ui); font-size: 0.76em; line-height: 1.6; color: var(--ink-soft);
}

/* ============================== print ============================== */

@media print {
  .guide {
    --paper: #fff; --ink: #000; --ink-soft: #333; --rule: #bbb;
    --accent: #004c5c; --on-accent: #fff; --accent-soft: #eef4f5; --cite: #666;
    --measure: none; --fs: 10.5pt; --lh: 1.45;
    --face-body: "Spectral", Georgia, serif;
    --face-ui: "Inter", system-ui, sans-serif;
  }
  .guide .wrap { max-width: none; padding: 0; }

  /* Watermark on the printed copy.
   *
   * It sits on z-index -1, behind the body text, so it can never punch a light hole through
   * a glyph the way an overlaid watermark does. That only works if the paper itself stops
   * painting a background over it, hence the background: none; the sheet is white anyway.
   *
   * It is text rather than a background image on purpose: headless Chrome's --print-to-pdf
   * does not print backgrounds by default, and text is also still text in the finished PDF,
   * so the watermark can be verified page by page instead of being eyeballed once.
   *
   * position: fixed is what repeats it on every sheet. */
  .guide { background: none; }
  .guide::before {
    content: "rx.harnar.in";
    position: fixed;
    top: 50%;
    left: 50%;
    z-index: -1;
    transform: translate(-50%, -50%) rotate(-32deg);
    font-family: var(--face-ui);
    font-size: 54pt;
    font-weight: 600;
    letter-spacing: 0.1em;
    white-space: nowrap;
    color: #ebe8e3;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .guide h2 {
    margin-top: 26pt;
    padding-top: 9pt;
    padding-bottom: 7pt;
    border-top: 3pt solid #555;
    border-bottom: 1pt solid #999;
    font-size: 10pt;
    letter-spacing: 0.16em;
    break-after: avoid;
    break-before: auto;
  }
  .guide h2 .n {
    color: #000;
    font-size: 13pt;
    margin-right: 0.6em;
  }
  /* the first section should not push a near-empty first page */
  .guide h2:first-of-type { margin-top: 14pt; }

  /* subheads hang off the section rule so it is obvious what belongs to what */
  .guide h3 {
    border-left: 2.5pt solid #777;
    padding-left: 7pt;
    margin-top: 15pt;
    break-after: avoid;
  }
  .guide h4 { margin-top: 11pt; break-after: avoid; }
  .guide .step, .guide dl.findings dt, .guide dl.findings dd,
  .guide .pearl, .guide figure, .guide .viva details { break-inside: avoid; }
  .guide a { color: #000; text-decoration: none; }
  .guide .colophon { break-before: avoid; }

  /* reader preferences are for the screen; paper gets the designed layout */
  .guide[data-recall="on"] .step > .why,
  .guide[data-recall="on"] dl.findings dd,
  .guide[data-recall="on"] .viva .ans { background: none; color: var(--ink-soft); }
  .guide[data-recall="on"] .step > .why *,
  .guide[data-recall="on"] dl.findings dd *,
  .guide[data-recall="on"] .viva .ans * { visibility: visible; }
  .guide[data-hl-head="on"] h2 { background: none; padding: 0 0 0.45rem; }
  .guide[data-hl-term="on"] b, .guide[data-hl-term="on"] strong { background: none; }
  .guide[data-conflicts="off"] details.conflict { display: block; }
  .guide[data-cite="off"] cite.src { display: inline; }

  /* discrepancies print as small asterisked footnotes, not as boxes */
  .guide details.conflict {
    background: none; border: none; border-left: 2px solid #999;
    margin: 0.8rem 0; break-inside: avoid;
  }
  .guide details.conflict > summary { padding: 0 0 0 0.5rem; font-size: 8.5pt; font-weight: 700; }
  .guide details.conflict > summary::after,
  .guide details.conflict[open] > summary::after { content: none; border: none; padding: 0; }
  .guide details.conflict .body {
    padding: 0.2rem 0 0 0.5rem; border-top: none; margin-top: 0; font-size: 8.5pt;
  }
  .guide details.conflict dt { font-size: 8pt; margin-top: 0.3rem; }
  .guide details.conflict dd { font-size: 8.5pt; line-height: 1.35; }
  .guide details.conflict .ruling {
    font-size: 8.5pt; line-height: 1.35; margin-top: 0.4rem;
    padding-top: 0.3rem; border-top: 1px dotted #bbb;
  }
}

@media (prefers-reduced-motion: reduce) {
  .guide * { animation: none !important; transition: none !important; }
}

/* ===================================================================
   Reader interface, the rail, selection bubble, studio panel, notes
   and ink canvas. These sit OUTSIDE .guide (they are chrome, not
   document), so they are deliberately unscoped and self-contained.
   =================================================================== */

.rdr-rail {
  position: fixed;
  right: max(10px, env(safe-area-inset-right, 0px));
  top: 50%;
  transform: translateY(-50%);
  z-index: 40;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 6px;
  border-radius: 10px;
  background: var(--paper, #fff);
  border: 1px solid var(--rule, #ddd);
  box-shadow: 0 4px 18px rgba(0,0,0,.12);
}

.rdr-rail button {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border: 1px solid transparent; border-radius: 7px;
  background: none; color: var(--ink-soft, #666);
  cursor: pointer; padding: 0;
}
.rdr-rail button svg { width: 18px; height: 18px; }
.rdr-rail button:hover { color: var(--accent, #005f73); border-color: var(--rule, #ddd); }
.rdr-rail button:focus-visible { outline: 2px solid var(--accent, #005f73); outline-offset: 1px; }
.rdr-rail button.on {
  color: var(--accent, #005f73);
  background: var(--accent-soft, #e3eef0);
  border-color: var(--accent, #005f73);
}

.rdr-pal { display: flex; flex-direction: column; gap: 4px; margin-top: 4px;
           padding-top: 6px; border-top: 1px solid var(--rule, #ddd); }
.rdr-pal .rdr-sw {
  width: 22px; height: 22px; margin: 0 auto;
  border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0;
}
.rdr-pal .rdr-sw.on { border-color: var(--ink, #222); }

/* ---------- the rail on a phone ----------
   The row of tools plus the colour palette comes to about 416px of content. Centring that
   with left:50% and translateX(-50%) on a 375px screen pushed the Reading settings button off
   the left edge and the last swatches off the right, so the one control that reaches text
   size, theme and backup was unreachable on exactly the devices this is read on.
   It is pinned to both edges now, and scrolls horizontally if the tools still do not fit. */
@media (max-width: 640px) {
  .rdr-rail {
    right: max(8px, env(safe-area-inset-right, 0px));
    left: max(8px, env(safe-area-inset-left, 0px));
    top: auto;
    bottom: max(8px, env(safe-area-inset-bottom, 0px));
    transform: none;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 2px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .rdr-rail::-webkit-scrollbar { display: none; }
  .rdr-rail button { flex: 0 0 auto; }
  .rdr-pal { flex-direction: row; margin: 0 0 0 4px; flex: 0 0 auto;
             padding: 0 0 0 6px; border-top: none; border-left: 1px solid var(--rule, #ddd); }
}

/* A landscape phone is wider than 640px, so it used to get the tall vertical rail: about
   416px of buttons in a 390px-high window, with the top and bottom items simply unreachable.
   Height, not width, is what decides this. */
@media (max-height: 520px) and (orientation: landscape) {
  .rdr-rail {

<script>/* Reader: study settings and annotation for the surgery guides.

   Attaches to an element with class "guide". Used in two places: the standalone document,
   where it is loaded with a <script src>, and inside the Claude artifact, where the same
   source is inlined. Everything it stores is keyed by person, so two students sharing a
   tablet keep separate settings, highlights, notes and ink.

   window.ReaderConfig may be set before this runs:
     { student: "hita", doc: "inguinal-hernia", storage: <object with get/set> }
*/

(function () {
  "use strict";

  var cfg = window.ReaderConfig || {};
  var DOC = cfg.doc || "guide";
  var guide = document.querySelector(".guide");

  // ------------------------------------------------------------------ storage

  var student = (cfg.student || "").trim().toLowerCase() || "_";
  function key() { return "reader:" + student + ":" + DOC; }

  function load() {
    if (cfg.storage && cfg.storage.get) { return cfg.storage.get(key()) || {}; }
    try { return JSON.parse(localStorage.getItem(key()) || "{}"); } catch (e) { return {}; }
  }
  function persist(state) {
    if (cfg.storage && cfg.storage.set) { cfg.storage.set(key(), state); return; }
    try { localStorage.setItem(key(), JSON.stringify(state)); } catch (e) {}
  }

  var DEFAULTS = {
    width: "medium", size: "3", leading: "normal", face: "serif", theme: "auto",
    cite: "on", conflicts: "on",
    hlHead: "off", hlWhy: "off", hlTerm: "off", recall: "off",
    marks: [], notes: [], ink: [], inkLayout: null, updatedAt: 0
  };

  // How the page is set is a property of the reader, not of the case. These lived in the
  // per-case record, so a student who had chosen Hyperlegible at XL with loose spacing got
  // Georgia at 17px back on the next case, and on the next, twenty-five times over.
  // Marks, notes and ink stay per case: those really are about this document.
  var PREFS = ["width", "size", "leading", "face", "theme", "cite", "conflicts",
               "hlHead", "hlWhy", "hlTerm", "recall"];

  function prefsKey() { return "reader:" + student + ":prefs"; }

  function loadPrefs() {
    if (cfg.storage && cfg.storage.get) { return cfg.storage.get(prefsKey()) || {}; }
    try { return JSON.parse(localStorage.getItem(prefsKey()) || "{}") || {}; }
    catch (e) { return {}; }
  }

  function savePrefs(at) {
    var out = { updatedAt: at || Date.now() };
    PREFS.forEach(function (k) { out[k] = state[k]; });
    if (cfg.storage && cfg.storage.set) { cfg.storage.set(prefsKey(), out); return; }
    try { localStorage.setItem(prefsKey(), JSON.stringify(out)); } catch (e) {}
  }

  // overlay the reader's own settings on top of whatever this document's record holds
  function applyPrefsTo(target) {
    var p = loadPrefs();
    PREFS.forEach(function (k) { if (p[k] !== undefined) target[k] = p[k]; });
    return p;
  }

  // DEFAULTS holds literal arrays for marks, notes and ink. Assigning DEFAULTS[k] handed
  // every student who had no stored record *the same array object*, so the first
  // highlight pushed into it belonged to everyone afterwards: a second person signing in
  // on the same tablet saw the first person's highlights and notes, and their next edit
  // uploaded that work to the server under their own name. Copy, never share.
  function defaultFor(k) {
    var v = DEFAULTS[k];
    return Array.isArray(v) ? v.slice() : v;
  }

  var state = (function () {
    var s = load(), out = {}, p = loadPrefs();
    Object.keys(DEFAULTS).forEach(function (k) {
      out[k] = (s[k] === undefined) ? defaultFor(k) : s[k];
      // the reader's own settings win over whatever this case last recorded
      if (PREFS.indexOf(k) >= 0 && p[k] !== undefined) out[k] = p[k];
    });
    return out;
  })();

  function save() {
    state.updatedAt = Date.now();
    persist(state);
    savePrefs(state.updatedAt);
    syncLater();
    prefsLater();
  }


  // ------------------------------------------------------------------ sync
  // Optional, and off until an endpoint is set. The local copy is authoritative: sync
  // pulls once on open and pushes after changes settle, and anything that goes wrong is
  // swallowed, because a reader halfway through a chapter should never see a network
  // error about their highlights.

  // The deployed worker, so every case picks sync up without each page having to opt in.
  // A page can still override it with ReaderConfig.sync, and setting that to "" turns sync
  // off entirely, which is how you get a purely local copy.
  var SYNC_DEFAULT = "https://rx-sync.harnar.workers.dev";
  var SYNC_ENDPOINT = (window.ReaderConfig && window.ReaderConfig.sync !== undefined)
    ? window.ReaderConfig.sync
    : SYNC_DEFAULT;
  // syncedAt is the newest stamp the worker has confirmed. Anything newer than it locally is
  // work the server has not got yet, which is what makes a retry possible at all: without it
  // a push that failed, or one that was overtaken while in flight, was simply lost from the
  // remote copy with nothing left to say so.
  // Sync state belongs to one (student, document) pair, not to the module.
  //
  // It used to be three globals. Open guide A, go back, open guide B before A's GET returns,
  // and A's response was applied to B: B's notes were replaced by A's, written to storage,
  // and pushed to the server as B. That was reproduced, not theorised. syncedAt leaking the
  // other way was quieter but worse, because B could read as "already synced" on a value that
  // described A, and B's real work then never left the device.
  //
  // So every request captures the pair it was issued for and drops its own result if the
  // reader has moved on.
  var syncTimer = null;
  var sync = { key: "", syncing: false, syncedAt: 0, retryMs: 4000 };

  var pullTimer = null;

  function syncOn() { return !!SYNC_ENDPOINT && student && student !== "_"; }

  function syncKey() { return student + "::" + DOC; }

  function syncCtx() {
    if (sync.key !== syncKey()) {
      // pulled stays false until the server has given a definite answer for this
      // document. Until then nothing may be pushed: a push before the first successful
      // pull overwrites whatever the server holds with whatever this device happens to
      // have, which on a new or cleared browser is nothing at all.
      sync = { key: syncKey(), syncing: false, syncedAt: 0, serverAt: 0,
               pulled: false, retryMs: 4000, pullMs: 1000 };
      clearTimeout(syncTimer);
      clearTimeout(pullTimer);
    }
    return sync;
  }

  function backupHint() {
    var el = document.getElementById("rdrBackupHint");
    if (!el) return;
    el.textContent = syncOn()
      ? "Your highlights, notes and drawings are kept on this device and copied to your name, "
        + "so they follow you to another phone or browser. A file copy is still worth having."
      : "Your highlights, notes and drawings are kept in this browser only. Save a copy if you "
        + "clear your browsing data or change device.";
  }

  function syncSay(msg) {
    var el2 = document.getElementById("rdrSyncSay");
    if (el2) el2.textContent = msg || "";
  }

  // pull once when a guide opens, and adopt the remote copy only if it is newer
  function syncPull() {
    if (!syncOn()) return Promise.resolve(false);
    var c = syncCtx(), mine = c.key;
    var u = SYNC_ENDPOINT + "/api/state?student=" + encodeURIComponent(student) +
            "&doc=" + encodeURIComponent(DOC);
    return fetch(u, { method: "GET" })
      .then(function (r) {
        // A 503 is not an answer. Reading any non-OK response as "the worker has nothing"
        // is what let a slow or failing server be mistaken for an empty one, after which
        // the first local edit was pushed over the real notes and marks.
        if (!r.ok) throw new Error("sync pull " + r.status);
        return r.json();
      })
      .then(function (j) {
        if (mine !== syncKey()) return false;          // the reader moved on; not ours to apply
        c.pulled = true;                               // the server has answered for this doc
        c.pullMs = 1000;
        if (!j || !j.found || !j.state) {
          // the worker really does have nothing, so everything local is unsent
          syncLater(600);
          return false;
        }
        c.serverAt = j.updatedAt || 0;
        c.syncedAt = j.updatedAt || 0;                 // what the server demonstrably holds
        var local = state.updatedAt || 0;
        if (!(j.updatedAt > local)) {
          // ours is the same or newer: push anything it has not seen, instead of sitting on
          // work that would otherwise only leave this device at the next edit
          syncLater(600);

    c.style.top = top + "px";

    var s = inkScale(w, h);
    c.width = Math.max(1, Math.round(w * s));
    c.height = Math.max(1, Math.round(h * s));
    c.inkScale = s;
    // The canvas covers a window onto the page, not the whole page, so shift the context
    // by where that window starts. Strokes stay in guide coordinates throughout.
    c.inkOriginY = originY || 0;
    var g = c.getContext("2d");
    if (g) g.setTransform(s, 0, 0, s, 0, -c.inkOriginY * s);
    return s;
  }

  // clearRect runs through the transform, so clearing has to be done in untransformed space
  function wipe(c, g) {
    if (!c || !g) return;
    g.save();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, c.width, c.height);
    g.restore();
  }

  // How much page above and below the viewport the ink canvas also covers, so that an
  // ordinary scroll does not need a new canvas on every frame.
  var INK_MARGIN = 600;

  // The ink canvases used to span the whole document. On a long case that is a canvas
  // 48,000px tall, which does two bad things on an iPad. The browser caps a canvas at
  // about 16 million pixels, so the backing store was forced below screen resolution and
  // the ink came out soft and blotchy. And every pointermove cleared the whole of it,
  // fifteen million pixels at a time, which is why writing skipped. A canvas the size of
  // the viewport is sharp at full device pixel ratio and costs almost nothing to clear.
  function layoutInk() {
    if (!canvas || !guide) return;
    var wrap = guide.querySelector(".wrap") || guide;
    var r = wrap.getBoundingClientRect();
    var w = Math.round(r.width);
    var pageH = Math.round(wrap.scrollHeight || r.height);
    var view = window.innerHeight || 800;

    // where the visible slice starts, measured from the top of the wrap
    var originY = Math.max(0, Math.round(-r.top) - INK_MARGIN);
    var h = Math.min(pageH - originY, view + INK_MARGIN * 2);
    if (h < 1) { originY = Math.max(0, pageH - 1); h = Math.min(pageH, view); }

    sizeCanvas(canvas, w, h, wrap.offsetLeft, wrap.offsetTop + originY, originY);
    sizeCanvas(live, w, h, wrap.offsetLeft, wrap.offsetTop + originY, originY);
    redrawInk();
  }

  // Re-aim the canvases when the page has scrolled far enough that the window they cover
  // is about to run out. Never while a stroke is in progress: moving the canvas would
  // wipe what is being drawn.
  function inkFollowScroll() {
    if (!canvas || !guide || drawing) return;
    var wrap = guide.querySelector(".wrap") || guide;
    var r = wrap.getBoundingClientRect();
    var want = Math.max(0, Math.round(-r.top) - INK_MARGIN);
    var have = canvas.inkOriginY || 0;
    var slack = INK_MARGIN / 2;
    if (Math.abs(want - have) > slack) layoutInk();
  }

  function pathStroke(c, s) {
    if (!s.pts.length) return;
    c.save();
    c.globalAlpha = INK[s.k || "pen"].alpha;
    c.strokeStyle = s.c;
    c.lineWidth = s.w;
    c.lineCap = "round";
    c.lineJoin = "round";
    c.beginPath();
    c.moveTo(s.pts[0][0], s.pts[0][1]);
    for (var i = 1; i < s.pts.length; i++) c.lineTo(s.pts[i][0], s.pts[i][1]);
    if (s.pts.length === 1) c.lineTo(s.pts[0][0] + 0.01, s.pts[0][1]);
    c.stroke();
    c.restore();
  }

  function strokeBox(s) {
    if (s.__box && s.__n === s.pts.length) return s.__box;
    var lo = Infinity, hi = -Infinity;
    for (var i = 0; i < s.pts.length; i++) {
      if (s.pts[i][1] < lo) lo = s.pts[i][1];
      if (s.pts[i][1] > hi) hi = s.pts[i][1];
    }
    s.__box = [lo, hi];
    s.__n = s.pts.length;
    return s.__box;
  }

  function inWindow(c, s) {
    if (!s.pts || !s.pts.length) return false;
    var box = strokeBox(s), pad = (s.w || 2) + 4;
    var top = c.inkOriginY || 0;
    return box[1] + pad >= top && box[0] - pad <= top + (parseFloat(c.style.height) || 0);
  }

  // Draw only the tail of a stroke, from `from` onwards. Opaque ink can be extended in
  // place like this; translucent ink cannot, because the overlap would darken.
  function pathTail(c, s, from) {
    if (s.pts.length - from < 2) return;
    c.save();
    c.globalAlpha = INK[s.k || "pen"].alpha;
    c.strokeStyle = s.c;
    c.lineWidth = s.w;
    c.lineCap = "round";
    c.lineJoin = "round";
    c.beginPath();
    c.moveTo(s.pts[from][0], s.pts[from][1]);
    for (var i = from + 1; i < s.pts.length; i++) c.lineTo(s.pts[i][0], s.pts[i][1]);
    c.stroke();
    c.restore();

  // Clear just the rectangle a stroke covers, rather than the whole canvas.
  function clearStrokeBox(c, g, s) {
    if (!s.pts.length) return;
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (var i = 0; i < s.pts.length; i++) {
      var pt = s.pts[i];
      if (pt[0] < x0) x0 = pt[0];
      if (pt[0] > x1) x1 = pt[0];
      if (pt[1] < y0) y0 = pt[1];
      if (pt[1] > y1) y1 = pt[1];
    }

    g.clearRect(x0 - pad, y0 - pad, (x1 - x0) + pad * 2, (y1 - y0) + pad * 2);

  function redrawInk() {
    if (!ctx) return;
    wipe(canvas, ctx);
    // highlighter first, so pen marks sit on top of it rather than under
    for (var i = 0; i < state.ink.length; i++) {
      if (state.ink[i].k === "hl" && inWindow(canvas, state.ink[i])) {
        pathStroke(ctx, state.ink[i]);
      }
    }
    for (var j = 0; j < state.ink.length; j++) {
      if (state.ink[j].k !== "hl" && inWindow(canvas, state.ink[j])) {
        pathStroke(ctx, state.ink[j]);
      }
    }

  function queueRedraw() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () { rafPending = false; redrawInk(); });
  }

  function penPoint(ev) {
    var r = live.getBoundingClientRect();
    // the canvas is a window onto the page now, so add where that window starts
    return [ev.clientX - r.left, ev.clientY - r.top + (live.inkOriginY || 0)];

  // ---- erasing -------------------------------------------------------------

  function near(pt, x, y, r) {
    var dx = pt[0] - x, dy = pt[1] - y;
    return dx * dx + dy * dy <= r * r;
  }

  // distance from (x,y) to the segment a-b, so a thin stroke is still easy to hit
  function segNear(a, b, x, y, r) {
    var vx = b[0] - a[0], vy = b[1] - a[1];
    var wx = x - a[0], wy = y - a[1];
    var len = vx * vx + vy * vy;
    var tt = len ? Math.max(0, Math.min(1, (wx * vx + wy * vy) / len)) : 0;
    var px = a[0] + tt * vx, py = a[1] + tt * vy;
    var dx = x - px, dy = y - py;
    return dx * dx + dy * dy <= r * r;
  }

  function strokeHit(s, x, y, r) {
    var pad = r + s.w / 2;
    if (s.pts.length === 1) return near(s.pts[0], x, y, pad);
    for (var i = 1; i < s.pts.length; i++) {
      if (segNear(s.pts[i - 1], s.pts[i], x, y, pad)) return true;
    }
    return false;
  }

  function eraseAt(x, y) {
    var r = ERASE_R[eraseMode];
    var next = [], changed = false;

    for (var i = 0; i < state.ink.length; i++) {
      var s = state.ink[i];

      if (eraseMode === "whole") {
        if (strokeHit(s, x, y, r)) { changed = true; continue; }
        next.push(s);
        continue;
      }

      // part: drop points under the eraser, keeping whatever runs survive
      if (!strokeHit(s, x, y, r)) { next.push(s); continue; }
      var pad = r + s.w / 2;
      var run = [], runs = [];
      for (var j = 0; j < s.pts.length; j++) {
        if (near(s.pts[j], x, y, pad)) {
          if (run.length > 1) runs.push(run);
          run = [];
        } else {
          run.push(s.pts[j]);
        }
      }
      if (run.length > 1) runs.push(run);
      changed = true;
      for (var k = 0; k < runs.length; k++) {
        next.push({ id: s.id + "-" + k, k: s.k, pts: runs[k], c: s.c, w: s.w });
      }
    }

    if (changed) { state.ink = next; queueRedraw(); }
    return changed;
  }

  // ---- drawing -------------------------------------------------------------

  function penDown(ev) {
    if (tool.kind !== "pen" && tool.kind !== "ink-hl" && tool.kind !== "erase") return;
    ev.preventDefault();
    // Aim the ink window before the stroke starts rather than trusting that a scroll
    // event arrived. If the canvas is stale the pointer coordinates are offset by the
    // scroll, and the stroke lands somewhere else entirely.
    inkFollowScroll();
    drawing = true;
    // setPointerCapture throws on a pointer the element does not currently own, and an
    // exception here would abort the rest of the handler, so the stroke never starts
    try { live.setPointerCapture && live.setPointerCapture(ev.pointerId); } catch (e) {}

    if (tool.kind === "erase") {
      var p = penPoint(ev);

    stroke = {
      id: "s" + Date.now() + Math.random().toString(36).slice(2, 5),

    if (!drawing) return;
    ev.preventDefault();
    var pts = (ev.getCoalescedEvents ? ev.getCoalescedEvents() : [ev]).map(penPoint);
    if (!pts.length) pts = [penPoint(ev)];

    if (tool.kind === "erase") {
      for (var i = 0; i < pts.length; i++) eraseAt(pts[i][0], pts[i][1]);
      return;
    }
    if (!stroke) return;          // a move with no stroke in progress
    var from = Math.max(0, stroke.pts.length - 1);
    stroke.pts.push.apply(stroke.pts, pts);

    if (INK[stroke.k || "pen"].alpha >= 1) {
      // Opaque ink: extend the line in place and draw only the new piece. Clearing the
      // canvas and re-drawing the whole stroke on every pointer event made the cost grow
      // with the length of the stroke, and an Apple Pencil sends events at 120Hz, which
      // is why writing skipped and broke up.
      pathTail(lctx, stroke, from);
    } else {
      // Translucent ink has to be redrawn whole or the overlaps darken, but only the
      // rectangle it covers needs clearing, not the whole canvas.
      clearStrokeBox(live, lctx, stroke);
      pathStroke(lctx, stroke);
    }
  }

  function penUp() {
    if (!drawing) return;
    drawing = false;
    if (tool.kind === "erase") { save(); updateLock(); return; }
    if (stroke && stroke.pts.length) {
      state.ink.push(stroke);
      state.inkLayout = layoutSignature();
      save();
      updateLock();
    }
    stroke = null;
    wipe(live, lctx);
    redrawInk();
  }

  function setPenMode(on) {
    guide.classList.toggle("rdr-pen-on", on);
    if (live) live.style.pointerEvents = on ? "auto" : "none";
    if (on && !state.inkLayout) { state.inkLayout = layoutSignature(); save(); }
    updateLock();
  }

  function updateLock() {
    var locked = state.ink.length > 0;
    [].slice.call(document.querySelectorAll("[data-locks-layout]")).forEach(function (el) {
      el.disabled = locked;
      el.title = locked ? "Locked while there is ink on the page; erase it to change layout" : "";
    });
    var warn = document.getElementById("rdrLock");
    if (warn) warn.hidden = !locked;
  }

  // ------------------------------------------------------------------ recall mode

  function bindGuide() {
    if (!guide || guide.__rdrBound) return;
    guide.__rdrBound = true;

    // citations: first tap fetches the excerpts, then opens the pane
    guide.addEventListener("click", function (ev) {
      var c = ev.target.closest("cite.src");
      if (!c || tool.kind === "pen" || tool.kind === "ink-hl" || tool.kind === "erase") return;
      ev.preventDefault();
      ev.stopPropagation();
      var k = citeKeyOf(c);
      if (!k) return;
      if (citesState === "ready") { openCite(k); return; }
      loadCites().then(function (j) { if (j) openCite(k); });
    });

    guide.addEventListener("keydown", function (ev) {
      if (ev.key !== "Enter" && ev.key !== " ") return;
      // not cite.src[data-cite-key]: that attribute is only set once the excerpts have
      // loaded, and they only loaded on a mouse click, so a keyboard-only reader could
      // never open the first citation and therefore never got any of them.
      var c = ev.target.closest && ev.target.closest("cite.src");
      if (!c) return;
      ev.preventDefault();
      var k = citeKeyOf(c);
      if (!k) return;
      if (citesState === "ready") { openCite(k); return; }
      loadCites().then(function (j) { if (j) openCite(k); });
    });

    // recall mode: tap a hidden answer to show it
    guide.addEventListener("click", function (ev) {
      if (state.recall !== "on") return;
      // A drag to select text inside a revealed answer ends in a click, which hid it
      // again, so the answer could not be highlighted or copied.
      var sel = window.getSelection && window.getSelection();
      if (sel && !sel.isCollapsed) return;
      var t = ev.target.closest(RECALL_SEL);
      if (t && guide.contains(t)) toggleRecall(t);
    });

    guide.addEventListener("keydown", function (ev) {
      if (state.recall !== "on") return;
      if (ev.key !== "Enter" && ev.key !== " ") return;
      var t = ev.target.closest && ev.target.closest(RECALL_SEL);
      if (!t || !guide.contains(t)) return;
      ev.preventDefault();
      toggleRecall(t);
    });

    // tapping a highlight removes it; tapping a note opens it
    guide.addEventListener("click", function (ev) {
      var n = ev.target.closest(".rdr-note");
      if (n) { openNoteEditor(null, n.getAttribute("data-nid")); return; }
      var m = ev.target.closest(".rdr-mark");
      if (m && tool.kind !== "pen" && tool.kind !== "ink-hl" && tool.kind !== "erase") {
        removeMarkAt(m);
      }
    });
  }


  // ------------------------------------------------------------------ source pane
  // Tapping a citation shows what the book actually said, in a pane over the guide rather
  // than a new tab, so the reader keeps their place. The excerpts live in citations.json,
  // fetched once on the first tap; without it the chips stay inert rather than erroring.

  var CITES = null, citesState = "idle";   // idle | loading | ready | failed
  var citePane = null;

  // The book id is the class beside "src"; the rest of the key is every number in the chip,
  // in order. That covers the simple case, comma lists, page ranges, and the one chip that
  // carries two chapters, and it matches the rule the extractor used to name its entries.
  function citeKeyOf(el) {
    var book = null;
    for (var i = 0; i < el.classList.length; i++) {
      if (el.classList[i] !== "src") { book = el.classList[i]; break; }
    }
    if (!book) return null;
    var nums = (el.textContent || "").match(/[0-9]+/g);
    if (!nums || !nums.length) return null;
    return book + "-" + nums.join("-");
  }

  var citesPromise = null;

  function loadCites() {
    if (citesPromise) return citesPromise;
    citesState = "loading";
    citesPromise = fetch("citations.json")
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { CITES = j; citesState = "ready"; markCitesClickable(); return j; })
      .catch(function () {
        // Drop the cached promise as well as the state. Keeping it meant one bad moment
        // on a ward connection killed every citation in the guide for the life of the
        // page, and the only way back was a reload, which costs the reader their place.
        citesState = "failed";
        citesPromise = null;
        return null;
      });
    return citesPromise;
  }

  // A long case is eight to ten numbered sections and up to seventeen thousand words,
  // with no way to reach the viva at the bottom but scrolling. This gives every section
  // an id and puts a collapsed contents list under the standfirst.
  function slugOf(text) {
    return String(text).toLowerCase()
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
  }

  function buildContents() {
    if (!guide || guide.querySelector(".rdr-toc")) return;
    var hs = [].slice.call(guide.querySelectorAll("h2"));
    if (hs.length < 3) return;

    var items = hs.map(function (h, i) {
      var n = h.querySelector(".n");
      // "<span class=n>1</span>The case in one breath" is read aloud as "1The case in
      // one breath", and the number is already in the link beside it
      if (n) n.setAttribute("aria-hidden", "true");
      var label = (h.textContent || "").replace(/^\s*\d+\s*/, "").trim();
      if (!h.id) h.id = "s" + (i + 1) + "-" + slugOf(label);
      return '<li><a href="#' + h.id + '"><b>' + (n ? escHtml(n.textContent) : (i + 1)) +
             '</b>' + escHtml(label) + "</a></li>";
    }).join("");

    var nav = document.createElement("nav");
    nav.className = "rdr-toc";
    nav.setAttribute("aria-label", "Sections");
    nav.innerHTML = "<details><summary>Sections</summary><ol>" + items + "</ol></details>";

    var after = guide.querySelector(".standfirst") || guide.querySelector("header");
    if (after && after.parentNode) after.parentNode.insertBefore(nav, after.nextSibling);
    else guide.insertBefore(nav, guide.firstChild);
  }

  // The chips only became focusable once the excerpts had loaded, and the excerpts only
  // loaded on a mouse click, so a keyboard-only reader could not reach a single one. They
  // are controls from the moment the guide mounts; the keydown handler loads on demand.
  function armCites() {
    if (!guide) return;
    [].forEach.call(guide.querySelectorAll("cite.src"), function (c) {
      c.tabIndex = 0;
      c.setAttribute("role", "button");
      if (!c.getAttribute("aria-label")) {
        c.setAttribute("aria-label", "Source: " + (c.textContent || "").trim() +
                                     ". Opens the passage it cites.");
      }
    });
  }

  function markCitesClickable() {
    if (!guide || !CITES) return;
    [].forEach.call(guide.querySelectorAll("cite.src"), function (c) {
      var k = citeKeyOf(c);
      if (k && CITES.citations && CITES.citations[k]) {
        c.setAttribute("data-cite-key", k);
        c.tabIndex = 0;
      }
    });
  }

  function openCite(key) {
    if (!CITES) return;
    var c = CITES.citations[key];
    if (!c) return;
    var book = (CITES.books || {})[c.book] || { title: c.book, edition: "" };

    var body = (c.pages || []).map(function (pid) {
      var pg = (CITES.pages || {})[pid];
      if (!pg) return "";
      return '<div class="rdr-src-page">' +
        '<div class="rdr-src-pno">page ' + pg.page + '</div>' +
        (pg.before ? '<p class="rdr-src-ctx">' + escHtml(pg.before) + '</p>' : "") +
        '<p class="rdr-src-main">' + escHtml(pg.text) + '</p>' +
        (pg.after ? '<p class="rdr-src-ctx">' + escHtml(pg.after) + '</p>' : "") +
        '</div>';
    }).join("");

    citePane.querySelector(".rdr-src-book").textContent = book.title;
    citePane.querySelector(".rdr-src-meta").textContent =
      [book.edition, "chapter " + c.chapter].filter(Boolean).join(" · ");
    // S Das is the worst scanned of the three books, and its passages come through with
    // real OCR damage: broken words, spliced columns, numbers turned into letters. Saying
    // so is better than letting a reader conclude the guide is quoting carelessly, or
    // worse, trusting a mangled number.
    var note = (c.book === "das")
      ? '<p class="rdr-src-ctx">This book scans poorly, so the text below has OCR errors: ' +
        'broken words, and columns that run into each other. The quotation in the guide is ' +
        'what the printed page says. Check a number here against your own copy.</p>'
      : "";
    citePane.querySelector(".rdr-src-body").innerHTML = (note + body) ||
      '<p class="rdr-src-ctx">That page was not extracted.</p>';
    citePane.hidden = false;
    citePane.querySelector(".rdr-src-close").focus();
  }

  function closeCite() { if (citePane) citePane.hidden = true; }

  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
    });
  }

  function buildCitePane() {
    citePane = el("aside", "rdr-srcpane");
    citePane.hidden = true;
    citePane.setAttribute("aria-label", "Source text");
    citePane.innerHTML =
      '<header class="rdr-src-head">' +
        '<div><div class="rdr-src-book"></div><div class="rdr-src-meta"></div></div>' +
        '<button class="rdr-src-close" aria-label="Close">&times;</button>' +
      '</header><div class="rdr-src-body"></div>' +
      '<footer class="rdr-src-foot">Quoted for study. The surrounding paragraphs are shown ' +
      'for context.</footer>';
    document.body.appendChild(citePane);
    citePane.querySelector(".rdr-src-close").addEventListener("click", closeCite);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeCite();
    });
  }


  // ------------------------------------------------------------------ backup
  // localStorage is the only copy of any of this, and Safari drops it for sites left
  // unvisited for a week. Export writes one file holding every person's settings,
  // highlights, notes, ink and viva results; restore puts them back.

  var BACKUP_FORMAT = "rx-backup";

  function backupKeys() {
    var out = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && (k.indexOf("reader:") === 0 || k.indexOf("surgery-case-files") === 0)) {
          out.push(k);
        }
      }
    } catch (e) {}
    return out;
  }

  function collectBackup() {
    var data = {};
    backupKeys().forEach(function (k) {
      try { data[k] = JSON.parse(localStorage.getItem(k)); }
      catch (e) { data[k] = localStorage.getItem(k); }
    });
    return {
      format: BACKUP_FORMAT,
      version: 1,
      exportedAt: new Date().toISOString(),
      keys: data
    };
  }

  // a plain-English summary, so a restore is not a leap of faith
  function describeBackup(b) {
    var people = {}, marks = 0, notes = 0, ink = 0, sessions = 0, docs = {};
    Object.keys(b.keys || {}).forEach(function (k) {
      var v = b.keys[k];
      if (k.indexOf("reader:") === 0) {
        var bits = k.split(":");
        if (bits[1] && bits[1] !== "_") people[bits[1]] = true;
        if (bits[2]) docs[bits[2]] = true;
        if (v && v.marks) marks += v.marks.length;
        if (v && v.notes) notes += v.notes.length;
        if (v && v.ink) ink += v.ink.length;
      } else if (v && v.students) {
        Object.keys(v.students).forEach(function (s) {
          people[s] = true;
          sessions += (v.students[s].sessions || []).length;
        });
      }
    });
    return {
      people: Object.keys(people),
      docs: Object.keys(docs).length,
      marks: marks, notes: notes, ink: ink, sessions: sessions
    };
  }

  function backupFilename() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return "rx-backup-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + ".json";
  }

  function exportBackup(say) {
    var json = JSON.stringify(collectBackup(), null, 1);
    var blob = new Blob([json], { type: "application/json" });
    var name = backupFilename();
    var size = Math.max(1, Math.round(json.length / 1024));

    // inside an artifact a download link does nothing, so ask the host to save it
    if (window.claude && window.claude.use) {
      window.claude.use("downloads").then(function (dl) {
        if (!dl) throw new Error("not granted");
        return dl.save({ filename: name, data: blob });
      }).then(function () {
        say("Saved " + name + ", " + size + " KB.");
      }).catch(function () {
        say("Could not save the file here. Open the guide on the website and export from there.");
      });
      return;
    }

    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    say("Saved " + name + ", " + size + " KB.");
  }

  var pendingRestore = null;

  function readBackupFile(file, say, onReady) {
    var fr = new FileReader();
    fr.onload = function () {
      var b;
      try { b = JSON.parse(fr.result); } catch (e) { b = null; }
      if (!b || b.format !== BACKUP_FORMAT || !b.keys) {
        say("That does not look like a backup from this site.");
        return;
      }
      pendingRestore = b;
      onReady(describeBackup(b), b);
    };
    fr.onerror = function () { say("Could not read that file."); };
    fr.readAsText(file);
  }

  function applyRestore(say) {
    if (!pendingRestore) return;
    var n = 0;
    Object.keys(pendingRestore.keys).forEach(function (k) {
      var v = pendingRestore.keys[k];
      try {
        localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v));
        n++;
      } catch (e) {}
    });
    pendingRestore = null;
    say("Restored " + n + " record" + (n === 1 ? "" : "s") + ". Reloading…");
    setTimeout(function () { location.reload(); }, 900);
  }

  // ------------------------------------------------------------------ interface

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function swatches(kind) {
    return PALETTE.map(function (p) {
      return '<button class="rdr-sw" data-colour="' + p.id + '" title="' + p.label + '" ' +
             'style="background:' + (kind === "ul" ? p.ul : p.hl) + '"></button>';
    }).join("");
  }

  function seg(name, opts, current) {
    return '<div class="rdr-seg" data-setting="' + name + '">' + opts.map(function (o) {
      return '<button data-v="' + o[0] + '"' + (current === o[0] ? ' class="on"' : '') +
             (o[2] ? ' data-locks-layout="1"' : '') + '>' + o[1] + '</button>';
    }).join("") + '</div>';
  }

  function buildUI() {
    // floating rail
    var rail = el("div", "rdr-rail");
    rail.innerHTML =
      '<button id="rdrStudio" title="Reading settings" aria-label="Reading settings">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h7"/></svg></button>' +
      '<button class="rdr-tool" data-tool="hl" title="Highlighter">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-4 4v2h4l10-10a2.8 2.8 0 10-4-4L5 16"/></svg></button>' +
      '<button class="rdr-tool" data-tool="ul" title="Underline">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 4v6a5 5 0 0010 0V4M5 20h14"/></svg></button>' +
      '<button class="rdr-tool" data-tool="pen" title="Pen, write on the page">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7-4-4-7 7-1 5z"/><path d="M15 8l1-1a2 2 0 013 3l-1 1"/></svg></button>' +
      '<button class="rdr-tool" data-tool="ink-hl" title="Freehand highlighter">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M7 16l9-9 3 3-9 9H7z" fill="currentColor" fill-opacity=".22"/></svg></button>' +
      '<button class="rdr-tool" data-tool="note" title="Leave a note">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H9l-5 4z"/></svg></button>' +
      '<button class="rdr-tool" data-tool="erase" title="Eraser">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20H4l9-9 7 7-5 2z"/><path d="M13 11l-6-6 4-4 6 6z"/></svg></button>' +
      '<div class="rdr-pal" id="rdrPal">' + swatches("hl") + '</div>' +
      '<div class="rdr-erase-modes" id="rdrEraseModes" hidden>' +
        '<button data-erase="part" class="on" title="Rub out part of a stroke">part</button>' +
        '<button data-erase="whole" title="Remove a whole stroke">whole</button>' +
      '</div>';
    document.body.appendChild(rail);

    // selection bubble
    bubble = el("div", "rdr-bubble");
    bubble.hidden = true;
    bubble.innerHTML =
      '<button data-act="hl">Highlight</button>' +
      '<button data-act="ul">Underline</button>' +
      '<button data-act="note">Note</button>';
    document.body.appendChild(bubble);

    // note editor
    noteEditor = el("div", "rdr-noteedit");
    noteEditor.hidden = true;
    noteEditor.innerHTML =
      '<div class="rdr-ne-head">Note</div>' +
