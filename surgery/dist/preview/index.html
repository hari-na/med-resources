     a:"S Das's four, and each reveals a different sign. Sitting with arms by the side, the baseline, comparing the level of the nipples and noting position, size, shape and any puckering or dimpling. Arms raised straight above the head, which puts Cooper's ligaments on stretch so a shortened one shows. Hands on hips, pressing and relaxing to command, because contracting pectoralis major moves anything tethered to its fascia. And bending forwards from the waist so the breasts fall away from the body, where any failure of one nipple to fall away indicates abnormal fibrosis behind it; S Das says retraction due to carcinoma is very well detected in this position, and it is the one candidates omit.", ref:"Das 30 p.412"},
    {id:"brl07", lv:1, type:"Examination", q:"How do you palpate the lump, and what do you record?",
     a:"Begin on the normal side so you have something to compare against, then palpate the four quadrants systematically and do not miss the axillary tail. Record the situation, which quadrant; the consistency, with an encapsulated tumour firm or globular, a carcinoma stony hard, and a sarcoma varying from place to place; fluctuation; transillumination; and then the relations, to skin, to breast tissue, to pectoralis major and to the chest wall. B&L's technique within that is the pads of three fingers working round the dial of a clock.", ref:"Das 30 p.416, p.418 · B&L 58 p.916"},
    {id:"brl08", lv:1, type:"Examination", q:"How do you test fixity to pectoralis major?",
     a:"In steps, and verifying the muscle is actually contracted is the step candidates skip. Ask the patient to place her hand on her hip lightly, and move the lump along the direction of the pectoralis major fibres and then at right angles to them: it should be mobile both ways. Then ask her to press on the hip as hard as she can, and feel the anterior axillary fold to verify the muscle is taut. Move the lump again in the same two directions and compare the range. Restriction indicates fixity to the pectoral fascia and muscle, and if truly fixed there is total restriction along the line of the fibres with perhaps slight movement at right angles. For a lump in the outer and lower quadrant, test serratus anterior by asking her to push against a wall with the outstretched hand of that side.", ref:"Das 30 p.418"},
    {id:"brl09", lv:1, type:"Examination", q:"In what order do you palpate the axilla, and why that order?",
     a:"S Das's order, which is the order the disease takes. Pectoral or anterior group, just behind the anterior axillary fold, supporting the patient's arm on your forearm so the fold relaxes: these are the sentinel nodes in most patients. Then the central group, in the fat of the axilla against the chest wall. Then subscapular or posterior, on the posterior axillary fold, palpated from behind. Then lateral or brachial, along the medial side of the upper arm against the humerus up to the axillary vein. Then apical, above and medial to the pectoralis minor tendon, and then the supraclavicular fossa, both sides. Spread goes first to the pectoral, then central, then apical, with subscapular and lateral involved later.", ref:"Das 30 p.419, p.420, p.421 · B&L 58 p.915"},
    {id:"brl10", lv:1, type:"History", q:"How does age shape this case?",
     a:"S Das's map: fibroadenoma usually below 35; fibroadenosis at any age but more in middle age; intramammary abscess most commonly in young lactating women; carcinoma usually above 40, though it rarely occurs earlier, so age should not be the criterion to exclude the diagnosis of breast carcinoma. And age changes the imaging: ultrasound is the primary modality in young women with dense breast tissue, while mammography should be the first investigation in older women. In India the median presenting age is around 48 rather than 60.", ref:"Das 30 p.410 · B&L 58 p.915, p.916, p.931"},
    {id:"brl11", lv:1, type:"History", q:"Is the lump painful, and what does the answer mean?",
     a:"S Das puts it in italics: carcinoma of the breast is a painless condition, and all breast neoplasms, benign or malignant, are painless to start with, so a painless lump found accidentally while washing may be a carcinoma and the clinician must be more particular in examining that case rather than ignoring it. Absence of pain is a reason to worry, not to relax. Cyclical pain worse before menstruation in a young woman suggests ANDI, and throbbing pain means pus has formed in an acute mastitis. But SRB notes pain in the lump occurs in 10% of carcinomas, so neither its presence nor its absence decides anything alone.", ref:"Das 30 p.410 · SRB 8 p.527"},
    {id:"brl12", lv:1, type:"Examination", q:"What do you do before you examine this patient's breasts?",
     a:"Hand hygiene, introduce yourself and check the name and date of birth, explain what you are going to do and why, obtain verbal consent, and make her comfortable. The examination is intimate, so offer a chaperone, which B&L says should be especially for intimate examinations and part of a local guideline or policy; say you have offered and that you would record it. Expose what you need and cover the rest, and if consent is refused, explain again, offer a chaperone, document the refusal and do not proceed.", ref:"B&L 21 p.285 · B&L 35 p.472"},
    {id:"brl13", lv:1, type:"History", q:"What does the colour of a nipple discharge suggest?",
     a:"S Das maps colour to cause. Fresh or altered blood: duct papilloma or carcinoma. Pus: mammary abscess. Milk: lactation, a galactocele, or a mammary fistula from a chronic subareolar abscess. Serous or greenish: fibroadenosis or mammary duct ectasia. Nipple discharge is one of the three presentations that triggers full triple assessment.", ref:"Das 30 p.411 · B&L 58 p.915"},

    {id:"brl20", lv:2, type:"History", q:"The nipple is retracted. What do you ask?",
     a:"When it changed, not whether it is retracted. S Das: retraction for a long time or since puberty may be developmental, while recent retraction is of importance and is usually due to underlying carcinoma. The mechanism is extension of growth along the lactiferous ducts with subsequent fibrosis, or in B&L's terms shortening of Cooper's ligaments. And S Das's caveat: any tumour lying immediately deep to the nipple will fix the nipple, benign or malignant, because the main mammary ducts may travel through the growth, so a fixed nipple is not by itself malignant. And if the nipple is eroded rather than pulled in, think Paget's disease, a unique type of ductal carcinoma in situ arising in the nipple: if a nipple lesion fails to heal, exclude it by taking a wedge biopsy of the lesion.", ref:"Das 30 p.411, p.418, p.430 · B&L 58 p.932, p.924"},
    {id:"brl21", lv:2, type:"Examination", q:"What is peau d'orange, and does it mean the skin is invaded?",
     a:"It does not, and that is the point worth marks. B&L: peau d'orange is a sign of locally advanced disease due to obstruction of cutaneous lymphatic drainage by infiltration of either subdermal lymphatics or axillary lymph nodes by tumour cells, so the sign tells you the disease is locally advanced without telling you where the block is. The pitting is from fixation of the openings of the skin appendages, the hair follicles and the glands that open with them; if pressed for a gland say sebaceous, where SRB and the later S Das passage agree, though S Das names sweat glands elsewhere. And B&L's addition for an Indian bedside: in people with darker skins the accompanying erythema takes on a brownish hue rather than red.", ref:"B&L 58 p.932 · SRB 8 p.527 · Das 30 p.413, p.430"},
    {id:"brl22", lv:2, type:"Diagnosis", q:"A hot red tender breast in a woman who is not lactating.",
     a:"A cancer until proved otherwise. S Das warns that the picture of acute mastitis may be seen, very rarely, in acute mastitis carcinomatosa, the acute lactational carcinoma. SRB describes inflammatory carcinoma as diffuse, painful, warm, often involving the whole breast with peau d'orange and often extending to the chest wall, with more than a third of the skin involved, and B&L gives the same threshold: diffuse erythema and skin oedema involving more than one-third of the breast. A hot red breast that does not settle on antibiotics needs triple assessment, not a second course.", ref:"Das 30 p.412, p.416 · SRB 8 p.525 · B&L 58 p.932"},
    {id:"brl23", lv:2, type:"Examination", q:"How do you test for fluctuation in a breast lump, and what does a negative test mean?",
     a:"Stand behind the seated patient with both hands over her shoulders, hold the cyst with one hand and tap its centre gently with the index finger of the other. It is positive also in a chronic abscess, which may not be tender, and in a lipoma, and a very tense cyst may not fluctuate at all. So a negative test does not exclude a cyst, and a tense cyst can feel hard enough to be mistaken for a carcinoma: let the ultrasound, not your finger, decide whether a lump is cystic.", ref:"Das 30 p.418 · B&L 58 p.915"},
    {id:"brl24", lv:2, type:"Examination", q:"Why is a fibroadenoma called a breast mouse?",
     a:"Because it is not fixed to the breast tissue and moves easily within the breast substance. Hold the breast tissue with one hand and gently move the tumour with the other: a carcinoma is fixed to the breast substance and cannot be moved within it, and fibrous strands can be felt radiating from the mass into the breast substance.", ref:"Das 30 p.418"},
    {id:"brl25", lv:2, type:"History", q:"What symptoms of metastasis do you ask about?",
     a:"B&L's list: bony pain, cough, breathlessness, haemoptysis, headache, visual disturbance, neurological deficit, epileptic fits, abdominal distension, jaundice, anorexia, weakness, weight loss and hypercalcaemia, plus any swelling in the neck or armpit. And S Das's warning about why you must ask directly: in a long-standing carcinoma patients ignore back, hip or shoulder pain, considering it rheumatism and unrelated to the lump, when it is bony metastasis.", ref:"B&L 58 p.933 · Das 30 p.411"},
    {id:"brl26", lv:2, type:"Pathology", q:"Where do bone secondaries go, and why there?",
     a:"In order: lumbar vertebrae, neck of femur, thoracic vertebrae, rib, skull, generally osteolytic though osteosclerotic and mixed types occur. In the limbs the deposits occur above the elbow and above the knee, and the reason is the mark: haematopoietic vascular marrow is confined to the axial skeleton and to the limbs above those joints. One named consequence: extensive marrow replacement releases immature blast cells into the blood, giving a leukoerythroblastic anaemia.", ref:"B&L 58 p.932"},
    {id:"brl27", lv:2, type:"Pathology", q:"Give the risk factors for breast cancer.",
     a:"Modifiable: obesity with a BMI over 30, relative risk 1.29 in postmenopausal women; nulliparity or first pregnancy after 35; breastfeeding as protective, over 12 months more so than less; HRT over 10 years, RR 1.2; smoking 25 or more a day, RR 1.14; and alcohol, RR 1.05 light to 1.46 heavy. Non-modifiable: increasing age; female sex, with only 0.5 to 1% of breast cancers in males; ethnicity, where B&L lists American white, African American under 45, Ashkenazi Jewish and Parsi in India; family history, RR 2 with one first-degree relative and 3 with two; genetic predisposition, with 5 to 10% of all breast cancers hereditary and BRCA1 and BRCA2 accounting for up to 70% of those; and menarche and menopause, risk rising about 5% for each year earlier menarche and 3% for each year later menopause. High-risk histology: proliferative without atypia RR 1.8 to 2, complex fibroadenoma 3, papillomatosis 3, atypical ductal or lobular hyperplasia 4 to 5, lobular carcinoma in situ 8 to 10.", ref:"B&L 58 p.931"},
    {id:"brl28", lv:2, type:"Investigation", q:"Which imaging, in whom?",
     a:"Ultrasound as the primary modality in young women with dense breast tissue, mammography as the first investigation in older women, and in practice both in a woman over 40. MRI as an adjunct for its high sensitivity, with five uses: dense breasts or discordant or equivocal mammogram and ultrasound; distinguishing scar from recurrence after breast conservation; assessing multifocality and multicentricity, and in lobular cancer and high-grade DCIS; in BRCA or other genetic mutation or a strong family history; and in women with implants. The limit to state: mammographic and ultrasonographic features are not diagnostic of cancer, and biopsy is required for definitive diagnosis in lesions with a BI-RADS score of 4 or 5.", ref:"B&L 58 p.915, p.916, p.917"},
    {id:"brl29", lv:2, type:"Investigation", q:"What is BI-RADS, and what follows from each score?",
     a:"The American College of Radiology scale. 0, assessment incomplete, needing additional imaging or prior mammograms. 1, negative, and 2, benign, both essentially 0% risk, routine annual screening over 40. 3, probably benign, over 0% but 2% or less, short-term follow-up usually at 6 months. 4, suspicious, subdivided 4a over 2 to 10%, 4b over 10 to 50%, 4c over 50 to under 95%, where biopsy should be considered. 5, highly suggestive of malignancy, 95% or more, requiring biopsy or surgical treatment. 6, known biopsy-proven malignancy.", ref:"B&L 58 p.917 · SRB 8 p.507"},
    {id:"brl30", lv:2, type:"Investigation", q:"FNAC or core biopsy?",
     a:"Core biopsy, which is the third limb of triple assessment in B&L's figure, while SRB allows FNAC or core biopsy. Prefer core because it gives architecture, so it separates in situ from invasive disease and provides tissue for receptors; SRB says it plainly of FNAC in DCIS, that FNAC confirms the disease but will not differentiate DCIS from invasive carcinoma. SRB's handling detail is worth adding: the specimen goes in formalin for histology and margins, but in saline at low temperature for receptor study.", ref:"B&L 58 p.915 · SRB 8 p.525, p.538, p.539"},
    {id:"brl31", lv:2, type:"Investigation", q:"What must the pathologist report?",
     a:"Grade by the modified Bloom-Richardson system, scoring three variables from 1 to 3 each, the percentage of tumour cells with tubule formation, nuclear pleomorphism, and the size and number of mitoses per high-power field, with a total of 3 to 5 grade I, 6 or 7 grade II, and 8 or 9 grade III. Plus ER, PR, HER2/neu and the Ki-67 mitotic index, which give the molecular subtype: luminal A, luminal B, basal or triple negative, HER2/neu enriched, and normal-like. Where gene array such as PAM-50 is unavailable, immunohistochemical receptor staining serves as a surrogate marker, which is the clause to remember in a resource-limited setting.", ref:"B&L 58 p.931"},
    {id:"brl32", lv:2, type:"Investigation", q:"Who needs a metastatic work-up?",
     a:"Knowing who does not is as examinable as knowing who does. B&L: locally advanced disease, T3, T4, N2 or N3, gets contrast-enhanced CT of chest, abdomen and pelvis and an isotope bone scan; early disease, T1, T2, N0 or N1, gets metastatic evaluation only if there are symptoms suggesting metastasis or a raised serum alkaline phosphatase. SRB's practical equivalents for a hospital without PET: an isotope bone scan is a must in locally advanced disease or T3, a chest radiograph for pleural effusion, cannonball secondaries, mediastinal nodes and rib deposits, ultrasound of the abdomen for liver secondaries, ascites and a Krukenberg tumour, and a radiograph of the spine for osteolytic secondaries.", ref:"B&L 58 p.933 · SRB 8 p.538"},
    {id:"brl33", lv:2, type:"Diagnosis", q:"Give the differential diagnosis of a breast lump.",
     a:"Fibroadenoma, usually under 35, most often in the upper outer quadrant, firm or globular and not fixed to breast tissue, which on ultrasound is a well-circumscribed mobile solid mass in a young woman with an extremely low likelihood of malignancy, managed by reassurance and imaging follow-up. Phyllodes tumour, S Das's cystosarcoma phyllodes, where a large soft one shows engorged veins. ANDI, breast pain and nodularity, often bilateral and most conspicuous in the upper outer quadrant and sometimes cyclical, appearing one to two weeks before menstruation and regressing after. A cyst. An abscess, with the tuberculous and retromammary options in India. Fat necrosis and a haematoma after trauma. And carcinoma.", ref:"B&L 58 p.915, p.919, p.922, p.923 · Das 30 p.410, p.411, p.418"},

    {id:"brl40", lv:3, type:"Pathology", q:"Is breast cancer a Western disease?",
     a:"Answer it as a correction. The classical teaching, which is S Das's, is that carcinoma of the breast is commoner in the western world, rare in Japan, and less common in the under-developed world where women give birth to multiple children, with parity, breastfeeding and a diet rich in saturated fatty acids as the mechanism. The risk factors are real and B&L lists them too. What has dated is the conclusion: B&L treats breast cancer as a global disease with a different presentation, with the median age at presentation around 60 in the West but around 48 in low- and middle-income nations, Parsis in India among the higher-risk ethnic groups, and, most important, few breast cancers in high-income countries presenting with locally advanced or metastatic disease while the incidence is much greater in resource-poor countries, where up to 60% of women still present late. The practical consequence is the mark: never let age or geography reassure you.", ref:"Das 30 p.410 · B&L 58 p.931, p.932, p.933"},
    {id:"brl41", lv:3, type:"Pathology", q:"What is ANDI, and why does the vocabulary matter?",
     a:"Aberrations of Normal Development and Involution, the concept developed by the Cardiff Breast Clinic, which exists because the older names, fibroadenosis, fibrocystic disease and mammary dysplasia, caused confusion by treating normal variation as disease. S Das uses the older vocabulary throughout. Use ANDI as the framework and the old names as synonyms, and you sound current without abandoning the book your examiner read. B&L's tool for grading the nodularity is the Cardiff-Lucknow nodularity scale, a five-point ordinal scale, and treatment after normal imaging is reassurance, or an antioestrogen if needed: tamoxifen 10 mg daily or ormeloxifene, Centchroman, 30 mg for three to six months, or danazol 50 to 300 mg daily.", ref:"B&L 58 p.918, p.919, p.921 · Das 30 p.410"},
    {id:"brl42", lv:3, type:"Treatment", q:"Mastectomy or breast conservation?",
     a:"B&L's indications for mastectomy: large tumours in relation to breast size; multicentric disease; diffuse microcalcification on mammography indicating DCIS; BRCA-positive cancers; local recurrence after breast conservation; or the patient's preference. Breast conserving surgery removes the tumour with a 1 cm margin and all patients receive radiotherapy, so BCS plus RT equals BCT. The better question is when conservation is best avoided: a multicentric tumour, diffuse microcalcification, a large tumour-to-breast ratio, twice positive margins after re-excision, previous breast or chest wall radiation, systemic lupus or other collagen vascular disease because of a high risk of radiation reaction, ankylosing spondylitis, and severe orthopnoea, because the patient cannot lie on the radiation table. SRB adds earlier breast irradiation, a tumour beneath the nipple, and extensive intraductal carcinoma.", ref:"B&L 58 p.935 · SRB 8 p.548"},
    {id:"brl43", lv:3, type:"Procedure", q:"Does a modified radical mastectomy clear level III?",
     a:"Name the operation rather than the category, because modified radical mastectomy is the ambiguous term and that ambiguity is the disagreement. B&L defines MRM as mastectomy along with removal of the level I, II and III axillary nodes, and then two pages later says level I and II nodes are routinely removed while level III dissection is reserved for patients who have enlarged level I and II nodes. SRB resolves it by naming the operations: Patey's operation is total mastectomy with clearance of all levels, pectoralis minor detached from the coracoid or removed and the interpectoral nodes cleared with it; Auchincloss leaves pectoralis minor intact and does not remove level III, clearing Rotter's nodes by sweeping a finger under pectoralis major, and SRB says it is commonly done now. The modern rule both books agree on in practice: levels I and II routinely, level III when I and II are grossly involved. And the one that is history: the Halsted radical mastectomy removed the breast, all the axillary nodes and both pectoralis major and minor, and is rarely indicated because of excessive morbidity, limited shoulder movement, extensive upper limb lymphoedema, pain and chest wall deformity, with no survival benefit compared with less radical surgery.", ref:"B&L 58 p.935, p.937 · SRB 8 p.538, p.539"},
    {id:"brl44", lv:3, type:"Procedure", q:"What are the two jobs of axillary surgery, and how is the sentinel node found?",
     a:"B&L: axillary surgery exists to stage the patient, by sentinel lymph node biopsy, and to treat disease, by axillary lymph node dissection in node-positive patients; say which job you are doing. Sentinel means a guard, and the first echelon of axillary nodes sits at the gateway of the axilla and reports on the status of the rest; anatomically these are usually the anterior or pectoral group. The methods: blue dye, patent blue or methylene blue, and technetium-99m-labelled albumin, sulphur colloid or antimony, with fluorescein or indocyanine green where radioisotope is unavailable, fluorescein with methylene blue identifying sentinel nodes in over 90% and indocyanine green in 95 to 100%. Inject peritumoral, periareolar, subareolar or intradermal, and detect a blue node, a hot node on a handheld gamma probe, or a fluorescent node under blue light at 480 nm or infrared at 780 nm.", ref:"B&L 58 p.936 · SRB 8 p.536"},
    {id:"brl45", lv:3, type:"Procedure", q:"How far does the breast actually extend at mastectomy?",
     a:"To where the anterior premammary fascia fuses with the posterior pectoral fascia, which is the point to remove to: second rib above, inframammary crease below, parasternal edge medially, anterior border of latissimus dorsi laterally. B&L 28e flags that explicitly as different from the traditional view of raising flaps up to the inferior border of the clavicle and 2 to 3 cm below the inframammary crease, so if you describe the old flap limits, know that you are describing the old ones.", ref:"B&L 58 p.935"},
    {id:"brl46", lv:3, type:"Treatment", q:"What is oncoplasty, and what is the 20% rule?",
     a:"Wide local excision of up to 20% of breast volume can be closed by approximating breast tissue; volume loss greater than 20%, or an unfavourable breast-to-tumour ratio, requires an oncoplastic procedure, with level 1 being volume displacement and level 2 volume replacement with a local or distant flap. Skin- and nipple-sparing mastectomy is an option in DCIS and early cancer where mastectomy is indicated and the tumour is more than 1 cm from the skin and more than 2 cm from the nipple, with reconstruction by autologous tissue, fat or a silicone implant.", ref:"B&L 58 p.935"},
    {id:"brl48", lv:3, type:"Treatment", q:"Tamoxifen or an aromatase inhibitor, and for how long?",
     a:"Premenopausal patients get tamoxifen only, for 5 years in low-risk disease and 10 years where relapse risk is high, meaning node positive, tumour over 5 cm, or lymphovascular invasion. Postmenopausal women get an aromatase inhibitor, anastrozole, letrozole or exemestane, which outperform tamoxifen for relapse-free and overall survival, but are more expensive and cause bone density loss and fracture risk, so get a bone density scan before starting and add bisphosphonates with vitamin D and calcium, which may themselves reduce recurrence. The targeted agents are trastuzumab against the HER2/neu receptor, with pertuzumab and chemotherapy, and T-DM1, which conjugates emtansine to trastuzumab to deliver chemotherapy to HER2-positive cells selectively.", ref:"B&L 58 p.941"},
    {id:"brl49", lv:3, type:"Investigation", q:"Give the Nottingham Prognostic Index.",
     a:"The formula first, because both books agree on it: NPI equals 0.2 times the tumour size in centimetres, plus the lymph node stage, plus the tumour grade. SRB gives three bands with survival: under 3.4 good, 80% at 15 years; 3.4 to 5.4 moderate, 40%; over 5.4 poor, 15%. B&L gives four, subdividing the good group at 2.4: I excellent at 2.4 or less, II good over 2.4 up to 3.4, III moderate over 3.4 up to 5.4, IV poor over 5.4, with no survival figures. So give the formula, say three groups classically and four in current B&L, and quote SRB's survival figures, since figures are what make the index mean anything; the cut-offs 3.4 and 5.4 are common to both.", ref:"SRB 8 p.525 · B&L 58 p.942"},
    {id:"brl50", lv:3, type:"Management", q:"At what age does breast screening start in India, and with what test?",
     a:"These are three different countries' programmes and the examiner wants the Indian one. B&L: in low- and middle-income countries population-based mammographic screening is not available, and in India national screening involves multidisease screening for cancer of the mouth, breast and cervix for all women aged 30 to 65, with clinical breast examination by a trained healthcare professional and breast health awareness through self-examination being encouraged. In the UK all women aged 50 to 70 are invited for mammographic screening every three years, and population-based mammographic screening achieves 90 to 95% long-term survival in screen-detected tumours. SRB's opportunistic screening mammography is after 40, earlier with a family history or high-risk histology. Then the distinction that earns the mark: clinical breast examination is a screening test, self-examination is a health-awareness measure, and they are not interchangeable.", ref:"B&L 58 p.943 · SRB 8 p.507, p.531"},
    {id:"brl52", lv:3, type:"Investigation", q:"When would you use PET, and what is the Indian caveat?",
     a:"B&L: PET is used for staging in T3, T4, N2 and N3 disease, and in T1, T2, N0 and N1 disease only in the presence of symptoms or signs suggesting metastasis. The caveat is the sentence worth quoting: inflammatory lesions, namely mediastinal lymphadenopathy and pleuropulmonary lesions due to pulmonary tuberculosis, may give false-positive results, especially in Asian patients, and PET is very expensive with insurance policies that may not cover its cost.", ref:"B&L 58 p.917"},
    {id:"brl53", lv:3, type:"Pathology", q:"Which staging system, and what has changed in it?",
     a:"The eighth edition of the UICC-AJCC TNM system, which beyond anatomy incorporates histological grade, ER, PR, HER2/neu and Ki-67, multigene testing with Oncotype DX, and the response to neoadjuvant chemotherapy, to refine the prognosis. Four points from the eighth edition: lobular carcinoma in situ is now classed as a high-risk benign lesion and not a cancer; multiple synchronous tumours carry the (m) modifier; (y) prefixes post-neoadjuvant status; and satellite skin nodules must be separate from the primary for T4b to apply.", ref:"B&L 58 p.933"},
    {id:"brl54", lv:3, type:"Examination", q:"Sitting or lying: how do you examine the breast?",
     a:"S Das resolves it himself, so quote his resolution and do it in three stages, saying why as you go. Sitting first, for inspection, because that is where nipple level, dimpling and asymmetry show, and for palpating the axilla with the arm supported; he says examination is performed mainly in the sitting posture, which gives more information regarding the level of the nipples, a lump and palpation of the axillary nodes. Semi-recumbent at 45 degrees for palpating the breast itself, which he calls a good compromise between lying flat, which makes the breasts flatten out and fall sideways, and sitting upright, which makes them pendulous and bulky. And supine, which is the position B&L illustrates, to press a lump against the chest wall and test fixity to pectoralis major.", ref:"Das 30 p.411 · B&L 58 p.916"},
  ],

  "thyroid-swelling": [
    {id:"thy01", lv:1, type:"Examination", q:"What must you settle in any thyroid case?",
     a:"SRB's seven: the functional status, hyperthyroid, euthyroid or hypothyroid; compression on the trachea or recurrent laryngeal nerve; the neck lymph nodal status; tracheal deviation; carotid infiltration; retrosternal extension; and systemic features of toxicity or of malignant spread to bone, liver or lungs. Every question and every manoeuvre in the case exists to answer one of those seven.", ref:"SRB 6 p.451"},
    {id:"thy02", lv:1, type:"Pathology", q:"Define goitre, and the words for a single swelling.",
     a:"The normal thyroid is impalpable. Goitre, from the Latin guttur, the throat, means generalised enlargement. A discrete swelling in one lobe with no palpable abnormality elsewhere is isolated or solitary; a discrete swelling with abnormality elsewhere in the gland is dominant. Using the word dominant correctly is worth marks. Discrete thyroid swellings are palpable in 3 to 4% of the adult population and are three to four times more frequent in women, with about 70% clinically isolated and 30% dominant, though clinical classification is subjective and overestimates how many are truly isolated.", ref:"B&L 55 p.855, p.857"},
    {id:"thy03", lv:1, type:"Anatomy", q:"Why does a goitre move on swallowing?",
     a:"A ligament for the attachment and a muscle for the movement. The gland is bound to the larynx by Berry's ligament, a condensation of pretracheal fascia running to the cricoid cartilage. SRB completes it: the thyropharyngeus and cricopharyngeus parts of the inferior constrictor are attached to the thyroid and cricoid cartilages, so on swallowing they contract and carry the cartilages, and with them the gland, upwards.", ref:"B&L 55 p.852 · SRB 6 p.452"},
    {id:"thy04", lv:1, type:"Physiology", q:"Give the four steps of thyroid hormone synthesis.",
     a:"Trapping of inorganic iodide from the blood; oxidation of iodide to iodine; binding of iodine with tyrosine to form iodotyrosine; and coupling of monoiodotyrosines and di-iodotyrosines to form T3 and T4. Only the small free fraction is biologically active, 0.3% of T3 and 0.03% of T4; T3 is the more important physiological hormone, is also made peripherally from T4, and acts within a few hours where T4 takes 4 to 14 days. SRB's values for the free fractions: free T3 3 to 9 nmol/L, free T4 8 to 26 nmol/L.", ref:"B&L 55 p.852 · SRB 6 p.449"},
    {id:"thy05", lv:1, type:"Pathology", q:"How does a diffuse goitre become a nodular one?",
     a:"As a chain, which is how it is asked. One, diffuse hyperplasia: persistent growth stimulation, all lobules composed of active follicles, uniform iodine uptake, and this stage is reversible if stimulation ceases, which is why L-thyroxine is beneficial here. Two, mixed pattern: fluctuating stimulation produces areas of active and inactive lobules. Three, haemorrhage and necrosis: active lobules become more vascular and hyperplastic until haemorrhage occurs, causing central necrosis and leaving a surrounding rind of active follicles. Four, nodule formation: necrotic lobules coalesce into nodules filled with iodine-free colloid or inactive follicles. Five, multinodular goitre: repetition produces a gland in which most nodules are inactive and the active follicles are in the internodular tissue, which explains both why a toxic nodular goitre is toxic from its internodular tissue and why its isotope scan looks patchy.", ref:"B&L 55 p.856 · SRB 6 p.451"},
    {id:"thy06", lv:1, type:"Pathology", q:"How much iodine is needed, and where are the goitre belts?",
     a:"0.1 to 0.15 mg a day, and in nearly every district where simple goitre is endemic the iodide content of water and food is very low. S Das gives the Indian belts to name: the Himalayas, the Vindyas and the Satpuda. B&L names the Rockies, Alps, Andes and Himalayas, plus lowland areas where the soil lacks iodide, such as the Great Lakes, Lombardy, the Struma Valley, the Nile Valley and the Congo. Ask where the patient grew up, not only where he lives now. Two extras: calcium is goitrogenic too, which is why chalk and limestone areas appear on the list, and iodides in large quantities are themselves goitrogenic, inhibiting the organic binding of iodine.", ref:"B&L 55 p.855, p.856 · Das 27 p.374"},
    {id:"thy07", lv:1, type:"Examination", q:"How do you palpate the thyroid?",
     a:"From behind, with the neck slightly flexed, to assess the whole gland and count the nodules. Lahey's method for a lobe you cannot otherwise reach: push the gland from one side so the opposite lobe rotates forwards, where it can be felt. Crile's method: palpation with the thumb while the patient swallows. And get below the gland: if you cannot feel the lower border, even on swallowing, suspect retrosternal extension.", ref:"Das 27 p.378, p.379 · SRB 6 p.451"},
    {id:"thy08", lv:1, type:"Examination", q:"What does the consistency tell you, and what is actually reliable?",
     a:"Not much on its own. B&L's warning: nodules are smooth, usually firm and not hard, but hardness and irregularity due to calcification may simulate carcinoma, and conversely hard texture alone is not reliable because tense cystic swellings may be suspiciously hard; SRB completes the pair, a calcified nodule becomes harder and necrosis softens it. What is reliable is B&L's sentence: a hard, irregular swelling with any apparent fixity, which is unusual, is highly suspicious. It is fixity, not hardness, that carries the weight.", ref:"B&L 55 p.857, p.859 · SRB 6 p.452 · Das 27 p.379"},
    {id:"thy09", lv:1, type:"Examination", q:"Distinguish lid retraction, lid lag and exophthalmos.",
     a:"Candidates lose marks here more often than anywhere else. Lid retraction is when the upper lid is higher than normal while the lower lid is in its normal position, from overactivity of the smooth muscle part of levator palpebrae superioris. Lid lag is a different thing: the upper lid cannot keep pace with the eyeball as the patient follows your finger downwards. Exophthalmos is neither: it is the eyeball pushed forwards by increased fat, oedema or cellular infiltration in the retro-orbital space, so that sclera becomes visible below the lower edge of the iris first and then above the upper edge.", ref:"Das 27 p.383"},
    {id:"thy10", lv:1, type:"Examination", q:"Describe Kocher's test.",
     a:"Compress the lateral lobes gently and listen. If stridor appears the test is positive, meaning the trachea is already compressed or softened; SRB attributes a positive test to compression over the trachea, that is tracheomalacia or scabbard trachea, in a long-standing multinodular goitre. It changes management because a softened trachea may collapse after the gland that was splinting it is removed, so the anaesthetist must know before induction. And do it gently: it is a test that can precipitate the obstruction it is looking for.", ref:"Das 27 p.380, p.381 · SRB 6 p.452"},
    {id:"thy11", lv:1, type:"Examination", q:"Describe Pemberton's sign.",
     a:"Ask the patient to raise both arms until they touch the sides of the head, and hold. After some seconds the face becomes suffused and cyanosed, with distress and dyspnoea, because the raised arms draw the thoracic inlet upwards onto the goitre and obstruct the great veins. It answers the retrosternal question without imaging; then confirm it, since B&L says retrosternal extension can often be predicted on a plain chest radiograph but requires CT to determine the extent adequately before planning management.", ref:"Das 27 p.381 · B&L 55 p.853"},
    {id:"thy12", lv:1, type:"Investigation", q:"Which thyroid function test do you ask for first?",
     a:"TSH, with free T4 and free T3 only if it is abnormal, which is B&L's summary box. The reason is the pituitary-thyroid axis: TSH is suppressed in hyperthyroidism and stimulated in hypothyroidism, so it is the most sensitive single indicator, and it can be measured accurately down to very low concentrations with an immunochemiluminometric assay. Add SRB's exception, which shows you understand the rule: in suspected T3 toxicosis, where T3 alone is raised with a normal T4 and suppressed TSH, free T3 estimation is what makes the diagnosis. Do not offer protein-bound iodine or the T3 resin uptake, which S Das still teaches; they are historical.", ref:"B&L 55 p.852, p.853 · SRB 6 p.449, p.459 · Das 27 p.386"},
    {id:"thy13", lv:1, type:"Examination", q:"What do you do before you examine this patient's neck?",
     a:"Hand hygiene, introduce yourself and check the name and date of birth, explain what you are going to do, obtain verbal consent, and make the patient comfortable, sitting on a stool with the neck exposed to the level of the clavicles and good light. And look before you touch: a scar means previous thyroid surgery and therefore a recurrent goitre, and dilated veins over the upper chest suggest retrosternal extension with obstruction of the great veins.", ref:"B&L 35 p.472 · B&L 21 p.285 · SRB 6 p.452 · Das 27 p.377"},

    {id:"thy20", lv:2, type:"Pathology", q:"What is the risk that a discrete thyroid swelling is malignant?",
     a:"B&L: 15% of isolated swellings prove to be malignant and a further 30 to 40% are follicular adenomas, the remainder being non-neoplastic colloid degeneration, thyroiditis or cysts; the risk in a clinically dominant swelling is about half that of a truly isolated one, which is still substantial. And B&L 28e expresses the risk as a factor of 12 rising with three things: isolated rather than dominant, solid rather than cystic, and male rather than female. You do not need the grid, you need the three axes, because they are what the examiner will vary.", ref:"B&L 55 p.858"},
    {id:"thy21", lv:2, type:"History", q:"Which four structures can a goitre press on, and what does each give?",
     a:"The trachea: difficulty breathing, worse lying flat, and stridor, from gross lateral displacement or compression in a lateral or anteroposterior plane by retrosternal extension. The oesophagus: dysphagia, which is uncommon, and S Das gives the reason, that the oesophagus is a muscular tube that yields to pressure, so it suffers mainly in the thoracic inlet where there is no room to yield. The recurrent laryngeal nerve: hoarseness and a non-occlusive cough. And the cervical sympathetic chain: Horner's syndrome, which means infiltration and nothing else. The emergency to volunteer: acute respiratory obstruction may follow haemorrhage into a nodule impacted in the thoracic inlet.", ref:"B&L 55 p.857, p.860 · Das 27 p.375, p.381"},
    {id:"thy22", lv:2, type:"Examination", q:"The voice is hoarse. What does that mean?",
     a:"B&L's phrase is the one to use: recurrent laryngeal nerve paralysis, suggested by hoarseness and a non-occlusive cough and confirmed by laryngoscopy, is almost pathognomonic of malignancy in a thyroid swelling. So this single free question can convert a reassuring nodule into a cancer, and it should be asked early. Then confirm it: flexible laryngoscopy has rendered indirect laryngoscopy obsolete and is used preoperatively to determine cord mobility, and doing it before surgery is the only way to know afterwards whether you caused a palsy.", ref:"B&L 55 p.859"},
    {id:"thy23", lv:2, type:"Examination", q:"What does the carotid pulse tell you?",
     a:"S Das's sign, which answers the carotid infiltration question with one finger: a benign swelling pushes the carotid backwards, so the pulse is still felt behind it, while a malignant swelling engulfs the artery and the pulse is lost.", ref:"Das 27 p.381 · SRB 6 p.451"},
    {id:"thy24", lv:2, type:"Examination", q:"There are nodes along the internal jugular vein. What does that mean?",
     a:"B&L: cervical lymphadenopathy along the internal jugular vein in association with a clinically suspicious swelling is almost diagnostic of papillary thyroid carcinoma. Know the levels, because B&L describes the drainage in them: level VI central compartment, including the Delphian and paratracheal nodes, then levels II to V deep cervical, then level VII mediastinal.", ref:"B&L 55 p.859, p.850"},
    {id:"thy25", lv:2, type:"Diagnosis", q:"What is a lateral aberrant thyroid?",
     a:"A misnomer, and never a diagnosis to offer. SRB is explicit: a mass of tissue with the structure of thyroid lying lateral in the neck is a metastatic lymph node from an occult papillary carcinoma, and S Das teaches the same conclusion. Call it a secondary and go looking for the primary.", ref:"SRB 6 p.448 · Das 27 p.382"},
    {id:"thy26", lv:2, type:"Examination", q:"Name the eye signs of thyrotoxicosis.",
     a:"von Graefe's sign, the upper eyelid lagging behind the eyeball as the patient looks downwards. Joffroy's sign, absence of wrinkling of the forehead when the patient looks upwards with the face inclined downwards. Stellwag's sign, a staring look with infrequent blinking and widening of the palpebral fissure, from toxic contraction of the striated fibres of levator palpebrae superioris. Moebius' sign, failure of convergence of the eyeballs. Dalrymple's sign, upper sclera visible from retraction of the upper lid. Kocher's sign, which is SRB's: the clinician lifts the patient's eyes higher and the upper lid springs up faster than the eyebrow. Plus ophthalmoplegia, most often of the superior and lateral rectus and the inferior oblique so the patient cannot look upwards and outwards, and chemosis, oedema of the conjunctiva from obstruction of venous and lymphatic drainage by raised retro-orbital pressure.", ref:"Das 27 p.383, p.384 · SRB 6 p.462"},
    {id:"thy27", lv:2, type:"History", q:"What goitrogens would you ask about, and which step does each block?",
     a:"Vegetables of the brassica family, cabbage, kale and rape, which contain thiocyanate; the drugs para-aminosalicylic acid and the antithyroid drugs themselves, with S Das adding the sulphonylureas. And naming the step is the difference between a pass and a good pass: thiocyanates and perchlorates interfere with iodide trapping, while carbimazole and the thiouracils interfere with the oxidation of iodide and the binding of iodine to tyrosine, which are two different steps of the four.", ref:"B&L 55 p.856 · Das 27 p.376"},
    {id:"thy28", lv:2, type:"Investigation", q:"What is the limitation of FNAC in the thyroid?",
     a:"Say it before you are asked, because it is the single most important thing about the test: FNAC is reliable for papillary carcinoma but cannot distinguish a benign follicular adenoma from a follicular carcinoma, because that distinction depends not on cytology but on the histological criteria of capsular and vascular invasion. Otherwise it is the investigation of choice in discrete thyroid swellings, with excellent compliance, simple, quick in the outpatient department and readily repeated, and it should be used on all nodules that do not fulfil a fully benign U2 classification on ultrasound. Report it in the Thy system: Thy1 non-diagnostic, Thy1c non-diagnostic cystic, Thy2 non-neoplastic, Thy3 follicular, Thy4 suspicious of malignancy, Thy5 malignant.", ref:"B&L 55 p.855, p.858"},
    {id:"thy29", lv:2, type:"Investigation", q:"What does the ultrasound add, and what are its limits?",
     a:"B&L calls ultrasonography the workhorse investigation in thyroid disease for the surgeon, and it should be the primary investigation of any thyroid nodule, because a reassuring appearance removes the need for cytology. It reports the number, size, shape, margins and vascularity of nodules and specific features such as microcalcification, which together predict the risk of malignancy, and it assesses the regional lymphatics, particularly in the lateral neck; it uses no ionising radiation, is non-invasive, cheap and dynamic, and it lets FNA be done more accurately than free-hand. The limits: visualisation of the central neck nodes, particularly those behind the sternum, is limited, and only macroscopic capsular breach and nodal involvement are diagnostic of malignancy, while microcalcification and vascularity merely raise suspicion.", ref:"B&L 55 p.853, p.858"},
    {id:"thy30", lv:2, type:"Investigation", q:"When would you order an isotope scan?",
     a:"In one situation only. B&L: routine isotope scanning is unnecessary and inappropriate for distinguishing benign from malignant, because 80% of cold swellings are benign and 5% of functioning or warm swellings will be malignant, and it has been abandoned except when toxicity is associated with nodularity. The one indication is the toxic patient with a nodule or nodularity, where localising the overactivity distinguishes a toxic nodule with suppression of the rest of the gland from a toxic multinodular goitre with several areas of increased uptake, with important implications for therapy. Use low-dose iodine-123 or the cheaper technetium-99m, and remember hot nodules are very rarely malignant.", ref:"B&L 55 p.854, p.858, p.868"},
    {id:"thy31", lv:2, type:"Management", q:"The swelling is a cyst. What then?",
     a:"B&L: over 30% of clinically isolated swellings contain fluid, and tense cysts may be hard and mimic carcinoma. About 55% are colloid degeneration or of uncertain aetiology, most of the rest are involution in follicular adenomas, and 10 to 15% of cystic follicular swellings are histologically malignant, 30% in men and 10% in women; papillary carcinoma is often associated with cyst formation. Ultrasound is the most useful tool: no discernible solid element means the cyst is almost certainly benign and needs no further investigation, while a solid element should be targeted with guided FNAC. Simple aspiration has a high rate of reaccumulation, but ablation with ethanol or a thermal probe achieves resolution in up to 90% and should be considered for a recurrent symptomatic cyst.", ref:"B&L 55 p.859"},
    {id:"thy32", lv:2, type:"Management", q:"When would you operate on a nodular goitre?",
     a:"B&L's indications: features of underlying malignancy; pressure symptoms once other causes are excluded; cosmesis if the patient finds the goitre unsightly; and tracheal compression. With the counterweight: many such patients are found incidentally, asymptomatic and often very elderly, these goitres often grow very slowly, and the risks and benefits should be considered carefully, particularly if a sternal split may be required. More than half of benign nodules regress in size over 10 years, and most patients with multinodular goitre are asymptomatic and do not require operation. For a discrete swelling the main indication is the risk of neoplasia, and B&L's printed list is Thy3 to Thy5 cytology, age, male sex, hard texture, fixity, recurrent laryngeal nerve palsy, lymphadenopathy, recurrent cyst, pressure symptoms, cosmesis and the patient's wishes.", ref:"B&L 55 p.857, p.859, p.860"},

    {id:"thy40", lv:3, type:"Examination", q:"Kocher's test or Kocher's sign?",
     a:"Disambiguate before you answer, which takes four seconds and demonstrates exactly the reading the question is testing. Kocher's test is S Das's tracheal test: compress the lateral lobes, and stridor means the trachea is compressed or softened, and SRB uses the term in that sense in its multinodular goitre chapter. Kocher's sign is SRB's eye sign: the clinician places his hands on the patient's eyes and lifts them higher, and the upper lid springs up faster than the eyebrow. Both are real and both belong to Theodor Kocher, the name does not appear in B&L's thyroid chapter at all, and SRB itself uses test in one chapter and sign in another, so a candidate quoting SRB without a page can be made to look wrong either way. The same hazard applies to Crile: Crile's method is S Das's palpation technique, feeling the gland with the thumb while the patient swallows, while Crile's grading is SRB's severity grading of thyrotoxicosis by the sleeping pulse rate. Ask which the examiner means.", ref:"Das 27 p.380, p.381, p.379 · SRB 6 p.452, p.462"},
    {id:"thy42", lv:3, type:"Examination", q:"How many cardinal signs of primary toxic goitre?",
     a:"S Das says five in the text and four in its own figure on the facing page, so you cannot be caught out by choosing correctly, only by not knowing. The text's five: eye signs, tachycardia, fine tremor, warm moist skin, and the thyroid bruit. The figure's four: exophthalmos, thyroid swelling with or without thrill, tachycardia, tremor, which drops the moist skin and adds the swelling itself. B&L has no such list and does not describe any eye sign; what it gives is the discriminator to close on, that Graves' disease is frequently associated with eye signs while toxic nodular goitre very infrequently is.", ref:"Das 27 p.383, p.384, p.385 · B&L 55 p.861"},
    {id:"thy43", lv:3, type:"Classification", q:"Give the types of thyrotoxicosis and what distinguishes them.",
     a:"Diffuse toxic goitre, Graves' disease, which is primary thyrotoxicosis: younger women, frequently associated with eye signs, and 55% have a family history of autoimmune endocrine disease. Toxic nodular goitre, which is secondary thyrotoxicosis: a simple nodular goitre present for a long time first, usually with the internodular tissue overactive and the nodules inactive, in middle-aged or elderly patients, very infrequently with eye signs, often large and uncomfortable. And the toxic nodule: a solitary overactive autonomous nodule, not due to TSH receptor antibodies, where TSH is suppressed by the high circulating hormones so the surrounding normal thyroid is itself suppressed, which is why the isotope scan shows a hot nodule in a cold gland. S Das's framing adds where the brunt falls: on the nervous system in primary and the cardiovascular system in secondary thyrotoxicosis.", ref:"B&L 55 p.861 · Das 27 p.375, p.385"},
    {id:"thy44", lv:3, type:"Treatment", q:"Why will antithyroid drugs not cure a toxic nodule?",
     a:"Because the overactive tissue is autonomous, so recurrence of the hyperthyroidism is certain when the drug is discontinued. That is a complete, mechanism-based answer to why not just give drugs. Antithyroid drugs, carbimazole and propylthiouracil, are used to restore the patient to euthyroid and hold them there in the hope of a permanent remission, that is that TSH receptor antibody production diminishes or ceases, which can only happen in Graves' disease.", ref:"B&L 55 p.862"},
    {id:"thy45", lv:3, type:"Treatment", q:"Subtotal or total thyroidectomy for Graves' disease?",
     a:"Total, and the principle is the thing to quote: thyroid failure should not be regarded as a failure of treatment, but recurrent toxicity is, so in Graves' disease it is better to err on the side of removing too much thyroid tissue rather than too little. B&L's figures: after subtotal thyroidectomy thyroid failure is about 20 to 45%, recurrent thyrotoxicosis at least 5%, permanent hypoparathyroidism 5%, with minimal follow-up; after total, thyroid failure is 100% so lifelong thyroxine is needed, permanent hypoparathyroidism 1%, with lifelong follow-up. The footnote that matters: the risks of recurrence and late failure are a function of the size of the remnant as a proportion of total gland weight, so a large remnant in a small gland recurs and a small remnant in a large gland fails, which B&L says is difficult to judge, and that is why the practice of subtotal thyroidectomy has been largely abandoned.", ref:"B&L 55 p.860, p.862"},
    {id:"thy46", lv:3, type:"Complications", q:"A patient is in distress a few hours after a thyroidectomy. What is happening and what do you do?",
     a:"Haemorrhage, which is the most frequent life-threatening complication: around 1 in 50 patients develop a haematoma, in almost all cases within the first 24 hours. The mechanism is not what students expect and is the mark: if an arterial bleed occurs, pressure in the central compartment can rise until it exceeds venous pressure, so venous oedema of the larynx develops, and that causes the airway obstruction and death. It is not the haematoma pressing on the trachea, it is the larynx swelling because its venous drainage has stopped. So remove the skin sutures at once to release the pressure, and seek senior help; despite better understanding and better haemostatic technology this complication has not been eliminated.", ref:"B&L 55 p.865"},
    {id:"thy47", lv:3, type:"Complications", q:"What about the parathyroids and the calcium?",
     a:"The incidence of permanent hypoparathyroidism should be less than 1%. Most cases present dramatically 2 to 5 days after the operation; very rarely the onset is delayed 2 to 3 weeks, and a patient with marked hypocalcaemia may be asymptomatic. The complication is limited to total thyroidectomy, because after a lobectomy the contralateral parathyroid glands are sufficient to maintain calcium. The high-risk operation is total thyroidectomy with central neck dissection, which places the parathyroid glands and their vascular supply at great risk and should only be performed where there is evidence of metastatic disease or a high risk of occult nodal disease. Afterwards, check the calcium, educate the patient about paraesthesia of the fingers and toes or around the mouth because not all develop immediate hypocalcaemia, and monitor serially in those at highest risk. Thyroxine replacement after total thyroidectomy starts on day 1.", ref:"B&L 55 p.866"},
    {id:"thy48", lv:3, type:"Management", q:"Would you do a lobectomy, and what must you warn the patient?",
     a:"B&L's fact makes lobectomy attractive: in two-thirds of patients with negative antithyroid antibodies one thyroid lobe will maintain normal function. Said the other way round, around one in three patients who has a lobectomy will require supplementation, and rates are higher with positive antibodies, which is why the presence of circulating antibodies increases the risk of thyroid failure after lobectomy and is therefore a test that changes the consent conversation. In an asymmetrical multinodular goitre, total lobectomy on the more affected side is appropriate management. And for any thyroid operation in a teacher, singer or lawyer, warn that the voice changes even without nerve trauma.", ref:"B&L 55 p.860, p.865, p.858"},
    {id:"thy49", lv:3, type:"Pathology", q:"Give the types of thyroid cancer with their incidence and the one thing to know about each.",
     a:"Papillary 80%: spreads to lymph nodes, distant metastases uncommon, nodes in the young predict recurrence but not death, and FNAC is reliable for it. Follicular 10%: blood-borne spread, mortality twice that of papillary, and it cannot be distinguished from adenoma on cytology, only on histology. Poorly differentiated or anaplastic 5%: hard, irregular, infiltrating, rapidly fatal and generally palliative, and it must be separated from lymphoma and thyroiditis, which do respond. Medullary 2.5%: from the parafollicular C cells, with calcitonin as the marker and genetic screening of relatives in familial cases. Lymphoma and others 2.5%: diagnosis by biopsy, and with tracheal compression isthmusectomy is the most appropriate form of biopsy. Overall, mortality rates remain static at over 80% five-year survival for all groups.", ref:"B&L 55 p.866, p.867, p.868, p.871"},
    {id:"thy50", lv:3, type:"Treatment", q:"Total thyroidectomy or lobectomy for a low-risk papillary carcinoma?",
     a:"Lead with SRB, then the modern qualification. SRB: if FNAC shows papillary carcinoma, total or near-total thyroidectomy is done, with radioactive iodine if the tumour is over 2 cm or there is extracapsular spread, and total thyroidectomy is also indicated for a follicular lesion of undetermined significance because the risk of malignancy there is 10%. B&L 28e splits the decision by risk: in high-risk patients with nodal or distant metastases, total thyroidectomy, to eradicate thyroid disease and prepare for radioactive iodine, but for low-risk patients with a single focus of disease limited to the thyroid a thyroid lobectomy can be offered, which has the significant advantage of protecting the contralateral recurrent laryngeal nerve and parathyroid glands, and this approach is now considered appropriate unless there are high-risk features.", ref:"SRB 6 p.456 · B&L 55 p.869"},
    {id:"thy51", lv:3, type:"Investigation", q:"Why must the thyroid be ablated before a whole-body iodine scan?",
     a:"Because metastatic thyroid cancer cannot compete with normal thyroid in taking up iodine, so all normally functioning thyroid tissue must first be removed by surgery or ablated by radioiodine. That sentence is the reason total thyroidectomy precedes radioiodine, and it is worth having verbatim. PET has limited application here: consider it in recurrent thyroid cancer that does not concentrate iodine, where FDG uptake rises and lesions become positive.", ref:"B&L 55 p.854"},
    {id:"thy52", lv:3, type:"Investigation", q:"Which imaging for a retrosternal goitre, and is contrast a problem?",
     a:"CT is the modality of choice for retrosternal extent, for tracheal or oesophageal deviation or compression where there are swallowing or breathing symptoms, and for surgical planning when ultrasound has found nodal disease, because it also assesses the superior mediastinum and lungs; rapid acquisition minimises breathing artefact. Contrast-enhanced CT is useful for the extent of airway invasion, and B&L explicitly puts down the myth: concerns over the impact of iodine-containing contrast on delays to radioactive iodine therapy have been overplayed, and it is more important that the surgeon knows the true extent of disease before operating. MRI is superior to CT at determining prevertebral fascia invasion. A chest radiograph and thoracic inlet view are for tracheal deviation or a retrosternal goitre, not a routine film in every goitre.", ref:"B&L 55 p.853, p.854, p.857, p.868"},
    {id:"thy53", lv:3, type:"Pathology", q:"What is a papillary microcarcinoma, and what is done about it?",
     a:"A papillary carcinoma under 10 mm. It is common, detected in about 10% of benign thyroid resections, and not associated with adverse outcomes, and the management is controversial: in Korea national screening has caused a surge in cases, in Japan groups observe without surgery and have shown at least two-thirds never progress, in the USA some attempt ablation with ethanol or radiofrequency, and most of the world tries to avoid diagnosing them by limiting biopsy to lesions over 10 mm. The related oddity: up to 30% of patients who die of non-thyroid disease have deposits of papillary carcinoma at autopsy. And occult micrometastases are present in as high as 40% of clinically N0 patients in the central neck, yet few progress to clinically meaningful disease, which is why the role of elective nodal surgery is in question.", ref:"B&L 55 p.868"},
    {id:"thy54", lv:3, type:"History", q:"A euthyroid patient with a multinodular goitre says she had a spell of palpitations and weight loss years ago.",
     a:"That is the natural history of the disease in front of you, not a diagnostic puzzle. B&L: transient episodes of mild hyperthyroidism are common, occurring in up to 30% of patients with simple nodular goitre, and SRB's figure for secondary thyrotoxicosis complicating a multinodular goitre is the same 30%. SRB's other complications of multinodular goitre are follicular carcinoma in 10%, haemorrhage into a nodule, tracheal obstruction and calcification, and the cosmetic problem; B&L supports the cancer point from endemic areas, where an increased incidence of cancer, usually follicular, has been reported, and says dominant or rapidly growing nodules in longstanding goitres should always be subjected to aspiration cytology.", ref:"B&L 55 p.857 · SRB 6 p.452"},
  ],

};
</script>
<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------ config
  // Shaped so other subjects and cases drop in without touching the storage
  // layer: everything written is tagged with subject and case.

  var SUBJECT = "General Surgery";
  // Every guide in reference/ is built into dist/ as a standalone page, a body fragment and a
  // PDF, and publish_site.py discovers all three from dist/ rather than naming them, so adding a
  // case here needs nothing else. Two naming rules, both set by publish_site.py: the body
  // fragment keeps its number prefix, the PDF loses it.
  //   id   must equal the guide's data-doc attribute, because the reader stores a student's
  //        highlights and notes against it.
  // The guides all carry their own viva as tap-to-reveal questions; the scored drill is
  // separate, and a case has one wherever app/viva-banks.js holds a bank under its id.
  var CASES = [
    {num:"01", id:"inguinal-hernia", name:"Inguinal Hernia", kind:"long"},
    {num:"02", id:"thyroid-swelling", name:"Thyroid Swelling", kind:"long"},
    {num:"03", id:"breast-lump", name:"Breast Lump", kind:"long"},
    {num:"04", id:"gastric-outlet-obstruction", name:"Gastric Outlet Obstruction", kind:"long"},
    {num:"05", id:"obstructive-jaundice", name:"Obstructive Jaundice", kind:"long"},
    {num:"06", id:"right-iliac-fossa-mass", name:"Right Iliac Fossa Mass", kind:"long"},
    {num:"07", id:"liver-secondaries", name:"Liver Secondaries", kind:"long"},
    {num:"08", id:"varicose-veins", name:"Varicose Veins", kind:"long"},
    {num:"09", id:"peripheral-vascular-disease", name:"Peripheral Vascular Disease", kind:"long"},
    {num:"10", id:"ulcer", name:"Ulcer", kind:"short"},
    {num:"11", id:"sinus-and-fistula", name:"Sinus and Fistula", kind:"short"},
    {num:"12", id:"lipoma-and-sebaceous-cyst", name:"Lipoma and Sebaceous Cyst", kind:"short"},
    {num:"13", id:"cervical-lymphadenopathy", name:"Cervical Lymphadenopathy", kind:"short"},
    {num:"14", id:"neck-swellings", name:"Neck Swellings", kind:"short"},
    {num:"15", id:"salivary-swelling", name:"Salivary Swelling", kind:"short"},
    {num:"16", id:"oral-cavity-lesions", name:"Oral Cavity Lesions", kind:"short"},
    {num:"17", id:"hydrocele", name:"Hydrocele", kind:"short"},
    {num:"18", id:"varicocele", name:"Varicocele", kind:"short"},
    {num:"19", id:"undescended-testis", name:"Undescended Testis", kind:"short"},
    {num:"20", id:"dysphagia", name:"Dysphagia", kind:"short"},
    {num:"21", id:"testicular-tumour", name:"Testicular Tumour", kind:"short"},
    {num:"22", id:"lymphoedema", name:"Lymphoedema", kind:"short"},
    {num:"23", id:"carcinoma-penis", name:"Carcinoma of the Penis", kind:"short"},
    {num:"24", id:"benign-prostatic-hyperplasia", name:"Benign Prostatic Hyperplasia", kind:"short"},
    {num:"25", id:"anorectal-conditions", name:"Haemorrhoids, Fissure and Fistula-in-Ano", kind:"short"}
  ];

  // One line each, shown on the case page. Where a case has none, the generic line is used.
  var BLURB = {
    "inguinal-hernia":
      "The most commonly allotted surgical long case, and the one where the examiner is least " +
      "interested in your diagnosis. He can see the lump. What he wants is the reasoning behind " +
      "each question you asked and each test you performed.",
    "peripheral-vascular-disease":
      "Two pains to separate, claudication from rest pain, and then one decision: is this limb " +
      "threatened? The staging systems your examiner asks for are not the ones the current " +
      "edition uses, and section 1 sets out how to answer both."
  };

  var CASE = CASES[0];

  function caseById(id) {
    for (var i = 0; i < CASES.length; i++) if (CASES[i].id === id) return CASES[i];
    return null;
  }

  // claude.ai refuses to serve a published sibling file as a top-level document
  // (ERR_BLOCKED_BY_RESPONSE), so the guide is fetched and rendered inside this page
  // and the PDF is handed over through the downloads capability.
  function guideBodyFile(c) { return c.num + "-" + c.id + ".body.html"; }
  function pdfFile(c)       { return c.id + ".pdf"; }

  // The scored banks are inlined here from app/viva-banks.js by build.py. A case has a drill
  // only where it has a bank, so nothing has to be flagged by hand in CASES.
  var BANKS = (typeof VIVA_BANKS === "object" && VIVA_BANKS) ? VIVA_BANKS : {};

  function bankFor(c) { return (c && BANKS[c.id]) || []; }

  var LEVELS = [
    {n:1, name:"Foundation", desc:"Definitions, anatomy and the signs you must never fumble."},
    {n:2, name:"Clinical",  desc:"History technique, the special tests, and telling complications apart."},
    {n:3, name:"Examiner's edge", desc:"Where the three books disagree, named varieties, and the evidence."}
  ];

  // ------------------------------------------------------------------ storage
  // One record per student, keyed case-insensitively. The typed spelling is kept for display.

  var LS = "surgery-case-files-v2";

  // Storage used to fail in silence. A quota error, private browsing, or blocked site data
  // made save() a no-op, and because pushAnswers reads the batch back out of storage, nothing
  // was stored and nothing was sent either: a finished drill simply evaporated and the
  // progress page said "nothing drilled yet". A parse error was worse, because store()
  // returned {} and the next write replaced every student on the device.
  var storeBroken = false;

  function store() {
    var raw = null;
    try { raw = localStorage.getItem(LS); } catch (e) { storeBroken = true; return {}; }
    if (!raw) return {};
    try { return JSON.parse(raw); } catch (e) {
      // keep the damaged blob rather than overwriting it; it may be recoverable by hand
      try { localStorage.setItem(LS + ":corrupt:" + Date.now(), raw); } catch (e2) {}
      storeBroken = true;
      return {};
    }
  }

  function save(o) {
    try {
      localStorage.setItem(LS, JSON.stringify(o));
      storeBroken = false;
      return true;
    } catch (e) {
      storeBroken = true;
      warnStorage();
      return false;
    }
  }

  // Said once, plainly, and only when it is true. This is the opposite of the "saved on this
  // device" footers: it is worth interrupting someone for, because their work is not being kept.
  function warnStorage() {
    if (document.getElementById("storagewarn")) return;
    var el = document.createElement("div");
    el.id = "storagewarn";
    el.className = "storagewarn";
    el.textContent = "This browser is not letting the page save anything, so your answers and "
                   + "notes will be lost when you leave. Private browsing or full storage is "
                   + "the usual cause.";
    document.body.appendChild(el);
  }
  function keyOf(name) { return String(name).trim().toLowerCase().replace(/\s+/g, " "); }

  // --------------------------------------------- per-question history
  //
  // A session is only written when a whole level is finished, which meant answering three
  // questions and walking away left no trace at all: the answers sat in an in-memory array
  // that went out of scope, so the progress page and the database were both empty and
  // neither was wrong. Nothing about it looked broken, which is why it survived.
  //
  // These records are written the instant a question is marked, so partial work survives
  // leaving, navigating back, closing the tab or switching person. They are also the thing
  // that makes a question answerable across sessions: how many times this person has met it,
  // how often they got it, and whether they had it last time.

  function qKey(caseId, qid) { return caseId + "::" + qid; }

  function recordAnswer(q, ok) {
    if (!student.key) return;
    var s = store();
    s.students = s.students || {};
    var r = s.students[student.key] || { name: student.name, sessions: [] };
    r.name = student.name;
    r.questions = r.questions || {};

    var k = qKey(CASE.id, q.id);
    var rec = r.questions[k] || { t: q.type, n: 0, ok: 0, last: 0, at: null };
    rec.t = q.type;                      // kept current, in case a question is recategorised
    rec.n += 1;
    if (ok) rec.ok += 1;
    rec.last = ok ? 1 : 0;
    rec.at = new Date().toISOString();
    rec.synced = false;

    r.questions[k] = rec;
    s.students[student.key] = r;
    s.lastStudent = student.key;
    save(s);
    pushAnswersLater();
  }

  // Everything this person has ever answered for the case on screen.
  function answersForCase(key) {
    var r = (store().students || {})[key];
    var out = {};
    if (!r || !r.questions) return out;
    var prefix = CASE.id + "::";
    Object.keys(r.questions).forEach(function (k) {
      if (k.indexOf(prefix) === 0) out[k.slice(prefix.length)] = r.questions[k];
    });
    return out;
  }

  // Reading the history back, which never happened before.
  //
  // Answers only ever went up. A second device, or the same device after iOS evicted its
  // storage, showed an empty progress page even though the rows were sitting in the database,
  // and worse, its first answer posted attempts:1 over the server's attempts:12 and destroyed
  // the history, because the worker compares timestamps and that write was genuinely newer.
  //
  // Pulling on sign-in fixes both: the device starts from what the server holds, so there is
  // nothing to overwrite. Merging is per question and takes whichever side was written last.
  // answersPulled holds the student whose answers the server has actually answered for.
  // Until it matches, nothing may be pushed: a push before the first successful pull is
  // what posted attempts:1 over the server's attempts:12 in the first place.
  var answersPulled = "";
  var answerPullTimer = null;
  var answerPullMs = 1000;

  function answersReady() { return !SYNC || (!!student.key && answersPulled === student.key); }

  function pullAnswersLater(ms) {
    if (!SYNC || !student.key) return;
    clearTimeout(answerPullTimer);
    answerPullTimer = setTimeout(function () { pullAnswers(); }, ms || answerPullMs);
  }

  function pullAnswers(done) {
    if (!SYNC || !student.key) { if (done) done(); return; }
    // the name this request is for. Reading student.key again when the response lands is
    // how one student's history was merged into the next student's record.
    var mine = student.key;
    fetch(SYNC + "/api/answers?student=" + encodeURIComponent(mine))
      .then(function (r) {
        // a 503 is not an empty history, and must not be mistaken for one
        if (!r.ok) throw new Error("answers pull " + r.status);
        return r.json();
      })
      .then(function (j) {
        if (mine !== student.key) return;        // the reader switched name; not ours to apply
        answersPulled = mine;
        answerPullMs = 1000;
        if (!j || !j.answers) return;
        var s = store();
        s.students = s.students || {};
        var rec = s.students[student.key] || { name: student.name, sessions: [] };
        rec.questions = rec.questions || {};
        var merged = 0;
        j.answers.forEach(function (a) {
          var k = qKey(a.caseId, a.questionId);
          var mine = rec.questions[k];
          if (!mine || !mine.at || (a.at && a.at > mine.at)) {
            rec.questions[k] = { t: a.type, n: a.attempts, ok: a.correct,
                                 last: a.lastOk ? 1 : 0, at: a.at, synced: true };
            merged++;
          }
        });
        if (merged) {
          s.students[mine] = rec;
          save(s);
        }
      })
      .catch(function () {
        // we still do not know what the server holds, so leave answersPulled alone and
        // try again; nothing is pushed in the meantime
        if (mine === student.key) {
          pullAnswersLater(answerPullMs);
          answerPullMs = Math.min(answerPullMs * 2, 60000);
        }
      })
      .then(function () { if (done) done(); });
  }

  var answerTimer = null;

  function pushAnswersLater() {
    if (!SYNC) return;
    clearTimeout(answerTimer);
    answerTimer = setTimeout(pushAnswers, 1500);   // let a burst of marking settle
  }

  // Sent as a batch of whole counters rather than individual events, so a repeat delivery is
  // harmless: the worker stores the counters it is given and the newest write wins.
  function pushAnswers() {
    if (!SYNC || !student.key) return;
    var mine = student.key;
    if (!answersReady()) {       // we do not yet know what the server holds for this name
      pullAnswersLater(200);
      pushAnswersLater();
      return;
    }
    var s = store();
    var r = (s.students || {})[student.key];
    if (!r || !r.questions) return;

    var batch = [];
    Object.keys(r.questions).forEach(function (k) {
      var rec = r.questions[k];
      if (rec.synced) return;
      var cut = k.indexOf("::");
      batch.push({
        caseId: k.slice(0, cut), questionId: k.slice(cut + 2), type: rec.t,
        attempts: rec.n, correct: rec.ok, lastOk: rec.last, at: rec.at
      });
    });
    if (!batch.length) return;

    fetch(SYNC + "/api/answers?student=" + encodeURIComponent(student.key), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ answers: batch })
    }).then(function (res) {
      if (!res.ok) return;
      return res.json().then(function (j) {
        if (mine !== student.key) return;
        // Mark synced only what the worker says it stored. It discards a row whose stamp
        // is older than the one it holds, and a bare ok used to be read as success, so
        // an attempt from a device with a slow clock was dropped and never retried.
        // The deployed worker may predate the stored list. Without this, every row would
        // look rejected, nothing would ever be marked synced, and the client would pull in
        // a loop against a server that is working perfectly well.
        var reports = !!(j && j.stored);
        var applied = {};
        ((j && j.stored) || []).forEach(function (st) {
          applied[qKey(st.caseId, st.questionId) + "::" + st.at] = true;
        });
        // re-read rather than reuse the snapshot: marking may have continued while in flight
        var s2 = store();
        var r2 = (s2.students || {})[mine];
        if (!r2 || !r2.questions) return;
        var rejected = 0;
        batch.forEach(function (b) {
          var k = qKey(b.caseId, b.questionId);
          var rec = r2.questions[k];
          if (!rec || rec.at !== b.at) return;
          if (!reports || applied[k + "::" + b.at]) rec.synced = true;
          else rejected++;
        });
        save(s2);
        // the server holds something newer for those questions, so re-read rather than
        // pushing the same losing write again
        if (rejected) { answersPulled = ""; pullAnswersLater(600); }
      });
    }).catch(function () {
      // offline is normal; the next mark or the next open sends it
    });
  }

  // ------------------------------------------------- sync, for the viva results
  //
  // The same bargain as the reader: this browser holds the real copy and the worker is a
  // mirror, so every failure here is swallowed and the viva carries on regardless. Someone
  // halfway through revising should never see a network error about a score.
  //
  // Each session carries an id generated here, and the worker inserts-or-ignores on it, so a
  // session that goes up twice, from a retry or from a second device, is still one row.

  var SYNC = "https://rx-sync.harnar.workers.dev";

  function newId() {
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }

  function markSynced(id) {
    var s = store(), changed = false;
    Object.keys(s.students || {}).forEach(function (k) {
      (s.students[k].sessions || []).forEach(function (r) {
        if (r.id === id && !r.synced) { r.synced = true; changed = true; }
      });
    });
    if (changed) save(s);
  }

  function postSession(rec) {
    if (!SYNC || !rec || !rec.id) return;
    fetch(SYNC + "/api/sessions", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(rec)
    }).then(function (r) {
      if (r.ok) markSynced(rec.id);
    }).catch(function () {
      // offline is normal and not worth reporting; flushSessions picks it up next time
    });
  }

  // Sessions finished while offline never reached the worker, so they are retried whenever
  // the page is opened. Without this, a session done on a train would be lost to the
  // database for good, even though the browser still has it.
  function flushSessions() {
    if (!SYNC) return;
    var s = store(), pending = [];
    Object.keys(s.students || {}).forEach(function (k) {
      (s.students[k].sessions || []).forEach(function (r) {
        if (r && r.id && !r.synced) pending.push(r);
      });
    });
    pending.slice(-50).forEach(postSession);
  }

  function studentRec(k) {
    var s = store();
    return (s.students && s.students[k]) || null;
  }
  function allStudents() {
    var s = store(), out = [];
    Object.keys(s.students || {}).forEach(function (k) {
      out.push({ key: k, name: s.students[k].name, sessions: s.students[k].sessions || [] });
    });
    return out.sort(function (a, b) { return b.sessions.length - a.sessions.length; });
  }

  function recordSession(rec) {
    var s = store();
    s.students = s.students || {};
    rec.id = rec.id || newId();
    rec.synced = false;                  // postSession flips this once the worker has it
    var r = s.students[rec.studentKey] || { name: rec.studentName, sessions: [] };
    r.name = rec.studentName;            // keep the latest spelling they typed
    r.sessions = (r.sessions || []).concat([rec]).slice(-200);
    s.students[rec.studentKey] = r;
    s.lastStudent = rec.studentKey;
    save(s);
    postSession(rec);                    // saved locally first, so a failure here costs nothing
  }

  // ------------------------------------------------------------------ theme

  var THEMES = ["system", "light", "dark"];
  function currentTheme() { return store().theme || "system"; }
  function applyTheme(t) {
    var el = document.documentElement;
    if (t === "system") el.removeAttribute("data-theme");
    else el.setAttribute("data-theme", t);
  }
  function setTheme(t) {
    var s = store(); s.theme = t; save(s);
    applyTheme(t);
    renderTopbar();
  }
  applyTheme(currentTheme());

  var ICONS = {
    system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>'
  };
  var THEME_LABEL = { system: "Auto", light: "Light", dark: "Dark" };

  // ------------------------------------------------------------------ nav

  var app = document.getElementById("app");
  var topbar = document.getElementById("topbar");
  var backTo = null;          // function, or null at the root

  var inGuide = false;

  function renderTopbar() {
    var t = currentTheme();
    topbar.innerHTML =
      (backTo
        ? '<button class="ghost" id="navBack">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
