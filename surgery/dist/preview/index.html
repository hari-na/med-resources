     a:"Answer the pattern, which no book disputes, and quote a number only if asked. The pattern: AFP is never raised in a pure seminoma, so a raised AFP means the tumour is not a pure seminoma however it looks down the microscope; beta-HCG can be raised in either, more often and more markedly in non-seminomatous tumours, and in a minority of seminomas because of syncytiotrophoblastic elements, which SRB says occur in 15% of classic seminomas; LDH is not tissue-specific and reflects burden and recurrence. The figures: B&L gives a rise in AFP in around 50 to 70% of NSGCTs, HCG in 40 to 60% of NSGCTs and around 30% of seminomas, while SRB gives 65% for AFP and beta-HCG in teratomas, beta-HCG in 10% of advanced seminomas, and LDH in 80% of advanced seminomas and 60% of NSGCT. The consequence is in both books: a seminoma with high markers is treated as a non-seminomatous tumour.", ref:"B&L 86 p.1571 · SRB 26 p.1073, p.1070"},
    {id:"tst42", lv:3, type:"Procedure", q:"Is frozen section with the Chevassu manoeuvre part of the operation?",
     a:"An option rather than a requirement. SRB builds the operation around it, and lists it under investigations, which tells you how it is conceived: through an inguinal approach the cord and testis are exposed, a soft clamp is applied to the cord at or above the level of the deep ring to prevent dissemination through blood, a frozen section biopsy is taken from the suspected area, and if tumour is positive a high orchidectomy is done, the Chevassu manoeuvre. Neither the eponym nor the step appears in B&L, where the diagnosis is made beforehand by a mandatory ultrasound and the operation is then committed; the soft clamp is identical, and what has gone is the intraoperative histology. Where frozen section survives is testis-sparing surgery for a small lesion where a benign diagnosis is genuinely possible, and B&L notes that a normal AFP in children suggests a strong likelihood of a benign tumour, for which testis-sparing surgery can be considered. Learn the eponym, because an Indian examiner asks for it by name.", ref:"SRB 26 p.1073 · B&L 86 p.1571, p.1572"},
    {id:"tst43", lv:3, type:"Anatomy", q:"Which nodes are the primary landing zone, and does the side matter?",
     a:"It does, and SRB is the only one of the three books that gives it. A right testicular tumour goes first to the interaortocaval nodes immediately below the renal vessels, at L2, then to para-aortic, paracaval, preaortic and common iliac nodes. A left testicular tumour goes first to the true para-aortic nodes just below the renal vessels, then preaortic and common iliac. And one more route that explains iliac nodes in a testicular tumour: lymphatics along the medial side of the testis may run with the artery of the vas, draining into the common iliac nodes at the bifurcation.", ref:"SRB 26 p.1071"},
    {id:"tst44", lv:3, type:"Diagnosis", q:"A young man with sudden severe scrotal pain and a high-riding testis. What do you do?",
     a:"Explore, now. SRB names the sign: Deming's sign, the affected testis positioned high because of twisting of the cord and spasm of the cremaster. B&L: Doppler is not routinely recommended, and if there is any doubt as to the diagnosis then urgent scrotal exploration is indicated, with salvage nearly 100% within 6 hours against 20% at 24 hours. At exploration the testis is untwisted and viability checked; B&L's method is to wrap a doubtful testis in a warm swab and observe over a few minutes, and if a small incision in the tunica albuginea demonstrates bright red arterial bleeding the testis may survive, while an infarcted testis should be removed, with the patient counselled later about a prosthesis. SRB's rule is that when in doubt the testis is retained and orchidectomy postponed. And the consent point from B&L's summary box: the patient should be counselled and consented for orchidectomy before exploration.", ref:"SRB 26 p.1069, p.1068 · B&L 86 p.1561, p.1562"},
    {id:"tst45", lv:3, type:"Management", q:"How long have you got in testicular torsion? The books differ.",
     a:"Quote six hours. B&L works to 6 hours, with salvage nearly 100% within that window against 20% at 24 hours, and notes that 720 degrees of twist causes ischaemia faster than 360. SRB says that if not intervened and rectified within 12 to 24 hours testicular gangrene may occur, and that viability is expected if surgery is done within 12 to 24 hours. Six hours is the tighter figure, it is what B&L's salvage numbers are built on, and no examiner will fault urgency; SRB's longer window is a reason to explore a late presentation, never a reason to wait.", ref:"B&L 86 p.1561 · SRB 26 p.1068, p.1069"},
    {id:"tst46", lv:3, type:"Examination", q:"Which way does a torsed testis twist?",
     a:"Give SRB's text: the right testis rotates clockwise and the left anticlockwise. Then the caveat, if pressed: SRB does not state the viewpoint, and a rotation has no direction until you say where you are standing, since medial rotation of the right testis is anticlockwise seen from above and clockwise seen from below. A one-line epigram at the foot of another SRB page says the testis always twists away from the midline, which does not agree with SRB's own text, and B&L gives no direction at all, being concerned instead with the extent and duration of the twist. Treat it as an examination fact and not an instruction: none of the three books teaches manual detorsion, the treatment in all of them is urgent exploration with untwisting, viability check and fixation, and the direction is never the point being tested; the six-hour window is.", ref:"SRB 26 p.1068, p.1073 · B&L 86 p.1561"},
    {id:"tst47", lv:3, type:"Pathology", q:"Name the non-seminomatous germ cell tumours and what each produces.",
     a:"B&L's four, which may coexist within a single tumour. Embryonal carcinoma: highly malignant tumours that occasionally invade cord structures. Yolk sac tumour: produces AFP, appearing as a single tumour type in children and as part of a mixed tumour in adults, and SRB adds that the endodermal sinus tumour contains Schiller-Duval bodies. Teratoma: consists of different tissues derived from ectoderm, endoderm and mesoderm, arising from totipotent cells, with solid and cystic spaces, areas of haemorrhage, gelatinous fluid and cartilaginous nodules on the cut surface. Choriocarcinoma: produces beta-HCG, is part of a testicular germ cell tumour in 25% of adult tumours, very seldom appears as the single component, and is highly malignant, metastasising early by both lymphatics and bloodstream.", ref:"B&L 86 p.1569, p.1570 · SRB 26 p.1070"},
    {id:"tst49", lv:3, type:"Pathology", q:"Give the sex cord-stromal tumours with their figures.",
     a:"Leydig cell tumour, the commonest: 1 to 3% of adult testicular tumours and 3% in infants and children, occurring in about 8% of patients with Klinefelter's syndrome; most are benign, with malignant transformation in 10%, related to size over 5 cm, cellular atypia, increased proliferation, necrosis, vessel invasion and DNA aneuploidy. SRB adds that it is radioresistant and chemoresistant, so surgery is the only treatment. Sertoli cell tumour: less than 1% of testicular tumours, mean age around 45, rarely in androgen insensitivity syndrome and Peutz-Jeghers syndrome, with malignancy in 10 to 22%. Granulosa cell tumour: extremely rare in adult men, but a juvenile type accounts for 6% of testis tumours in childhood. B&L's management point: most of these tumours are benign, around 80%, so conservative treatment of small lesions with organ-sparing surgery is feasible if the diagnosis is considered.", ref:"B&L 86 p.1570, p.1571, p.1572 · SRB 26 p.1071"},
    {id:"tst50", lv:3, type:"Investigation", q:"How are these patients grouped for risk?",
     a:"SRB expects it by name: based on AFP, beta-HCG, LDH and the presence of non-pulmonary visceral secondaries in bone, liver or brain, there are good-risk and intermediate-risk categories for seminomatous germ cell tumours, and good, intermediate and poor risk for non-seminomatous. The detail worth remembering is that there is no poor-risk category for seminoma.", ref:"SRB 26 p.1073"},
    {id:"tst53", lv:3, type:"Treatment", q:"Stage I seminoma: is radiotherapy the treatment of choice?",
     a:"Give the three options and the reason the ranking changed. About 15% of patients with clinical stage I seminoma have subclinical metastatic disease, usually retroperitoneal, and will relapse after orchidectomy alone. Surveillance: in low-risk disease, under 4 cm with no stromal rete testis invasion, recurrence is about 6% with cancer-specific survival over 95%, the limitation being intensive follow-up. One course of adjuvant carboplatin: no significant difference from radiotherapy in recurrence rate, time to recurrence or survival at a median of four years. Adjuvant radiotherapy to a para-aortic field, or para-aortic and ipsilateral iliac nodes, reduces relapse to 1 to 3% with severe toxicity under 2%, but the main concern is the long-term risk of secondary malignancies. SRB calls radiotherapy the treatment of choice in stage I seminoma, with the opposite testis shielded, which is the Indian written answer; B&L ranks none first, and for stage II says explicitly that cardiovascular and second malignancy risks have led to chemotherapy being the preferred alternative. The logic to state is equal cure, less late harm, in a man in his thirties who will live fifty more years. Never omit the shielding.", ref:"SRB 26 p.1073 · B&L 86 p.1572"},
    {id:"tst54", lv:3, type:"Procedure", q:"What does a retroperitoneal lymph node dissection involve, and what does it cost?",
     a:"SRB's field: removal of the precaval, retrocaval, paracaval, interaortocaval, retroaortic, para-aortic and common iliac nodes along with the gonadal vein and adjacent fibrofatty tissue, from the level of the internal ring to its insertion into the renal vein on the left and the inferior vena cava on the right. Mortality 1%. Complications: haemorrhage, injury to major vessels, ureter or bowel, chylous ascites, lymphocele, and retrograde ejaculation. The modification exists only to save ejaculation: a modified RPLND dissects the same side both above and below the inferior mesenteric artery while the opposite side is dissected only above the artery, so the opposite sympathetic chain is preserved; nerve-sparing RPLND is ideal where technically possible, and laparoscopic RPLND is also advocated safely. The anatomical point to say is that ejaculation depends on the sympathetic chain and the hypogastric plexus, which lie in the field of dissection.", ref:"SRB 26 p.1073, p.1074"},
    {id:"tst33", lv:2, type:"Classification", q:"Stage this tumour.",
     a:"SRB's clinical four-stage system is the one to write in an Indian paper: stage I confined to the testis, II nodes involved below the diaphragm, III nodes involved above the diaphragm, IV distant blood-borne spread. Then show you know the current one: TNM 8 has three stages, with distant metastasis as stage III and no stage IV, and B&L's prognostic groups are non-metastatic stage I, lymph node metastasis stage II, and distant metastasis or nodal metastasis with elevated tumour markers stage III. So a bare stage III describes a different patient in each book. The strongest thing to add is that testis is one of the few cancers where serum markers are part of the stage, as the S category: S0 normal, S1 LDH under 1.5 times normal with HCG under 5000 and AFP under 1000, S2 LDH 1.5 to 10 times normal or HCG 5000 to 50 000 or AFP 1000 to 10 000.", ref:"SRB 26 p.1072, p.1073 · B&L 86 p.1572"},
    {id:"tst34", lv:2, type:"Treatment", q:"After the orchidectomy, what decides the treatment?",
     a:"The histology and the stage. B&L: the treatment of germ cell tumours of the testis is usually successful even in advanced cases, largely reflecting the excellent response of these tumours to chemotherapy and, for seminomatous tumours, to radiotherapy; its summary box says testicular tumours are extremely sensitive to platinum-based chemotherapy and that prognosis is excellent when the patient is treated with combination chemotherapy in a cancer centre. Most present early, which is why the cure rates are what they are: between 75 and 80% of patients with seminoma and about 55 to 64% with NSGCT have stage I disease at diagnosis. Follow-up is SRB's: tumour markers at regular intervals for 5 years and yearly after that, with CT of abdomen and chest once a year, and its five-year survival figures are 90% for stage II and 70% for stage III.", ref:"B&L 86 p.1572 · SRB 26 p.1074"},
    {id:"tst52", lv:3, type:"Examination", q:"Why do a rectal examination in a testicular swelling?",
     a:"Because a normal finding is positive evidence against genitourinary tuberculosis. S Das: rectal examination will reveal no abnormality of the prostate and seminal vesicles in a tumour. SRB: the vas, prostate and seminal vesicles are normal. In tuberculous epididymitis the prostate and seminal vesicles may be indurated and the vas beaded, so the examination separates the two diagnoses that matter most here.", ref:"Das 40 p.630 · SRB 26 p.1071, p.1059"},
  ],

  "benign-prostatic-hyperplasia": [
    {id:"bph01", lv:1, type:"Pathology", q:"What determines the clinical importance of an enlarged prostate?",
     a:"S Das: the clinical importance of prostatic hyperplasia is measured by the severity of symptoms and the amount of residual urine, and not by the size of the gland. B&L says the same in modern language, that the relationship between anatomical prostatic enlargement, lower urinary tract symptoms and urodynamic evidence of bladder outflow obstruction is complex, and then lists the combinations: no symptoms and no obstruction; no symptoms but urodynamic obstruction; symptoms without obstruction; and symptoms with obstruction, plus the complications. Four things can be present or absent independently: a big prostate, symptoms, obstruction, and complications.", ref:"Das 37 p.564 · B&L 84 p.1522"},
    {id:"bph02", lv:1, type:"Anatomy", q:"Which lobe does what?",
     a:"SRB: five lobes, anterior, posterior, two lateral and one middle or median. The median lobe produces an elevation in the lower trigone, the uvula vesicae, and adenoma is commoner there because of the greater amount of glandular tissue; B&L says a middle lobe projects up into the bladder within the internal sphincter. The lateral lobes narrow the urethra and cause obstruction. Primary carcinoma is said to begin in the posterior lobe. So the one-line distinction: benign hyperplasia starts centrally and medially, carcinoma posteriorly and peripherally, which is why a cancer is felt first on rectal examination and a median lobe may not be felt at all.", ref:"SRB 26 p.1032, p.1033 · B&L 84 p.1522"},
    {id:"bph03", lv:1, type:"Anatomy", q:"Give McNeal's zones and what arises in each.",
     a:"SRB: the peripheral zone, prone to carcinoma; the periurethral transition zone, where BPH arises; and the central zone. SRB's note is the crux: prostate carcinoma develops in the prostatic gland proper and BPH in the submucosal glands. B&L agrees: BPH typically affects the submucous group of glands in the transitional zone, forming a nodular enlargement, and eventually this overgrowth compresses the peripheral zone glands into a false capsule, causing the appearance of the typical lateral lobes.", ref:"SRB 26 p.1032 · B&L 84 p.1522"},
    {id:"bph04", lv:1, type:"History", q:"Give the lower urinary tract symptoms, divided properly.",
     a:"SRB's table. Voiding symptoms: hesitancy; poor flow not improving by straining; dribbling even after micturition; an intermittent stream that stops and starts; poor bladder emptying; episodes of near retention. Storage symptoms: frequency; nocturia; urgency; urge incontinence; nocturnal incontinence. The older term SRB still uses is prostatism, a combination of frequency by day and night, poor stream, delay in starting and difficulty in micturition; recognise it, then use LUTS.", ref:"SRB 26 p.1034"},
    {id:"bph05", lv:1, type:"Examination", q:"What do you feel on rectal examination in benign enlargement?",
     a:"S Das's six points: the size, with the warning that importance is measured by symptoms and residual urine and not by size; the consistency, normally like rubber, mushy when congested, indurated in chronic infection with or without calculi, and stony hard in carcinoma; the surface, smooth or irregular; the median groove and lateral sulci, and whether preserved; the mobility of the rectal mucosa over the prostate, which he calls an important point differentiating benign from malignant; and prostatic massage. B&L: in benign enlargement the posterior surface is smooth, convex and typically elastic, though the fibrous element may make it firm, and the rectal mucosa can be made to move over the prostate.", ref:"Das 37 p.564 · B&L 84 p.1526"},
    {id:"bph06", lv:1, type:"Examination", q:"What would make you say this prostate is malignant?",
     a:"Five paired findings. Benign: smooth, convex, elastic, median groove preserved, rectal mucosa mobile. Malignant, in S Das's words: stony hard, nodular and irregular, with the median sulcus obliterated, which he calls a very important sign, and the rectal mucosa tethered to the gland.", ref:"Das 37 p.589, p.564 · B&L 84 p.1526"},
    {id:"bph07", lv:1, type:"Examination", q:"What must you do before the rectal examination, and why?",
     a:"Palpate and percuss the abdomen, particularly the suprapubic region, to know whether the bladder is empty. S Das is explicit that if the bladder is not empty even after micturition, the rectal examination will not be very reliable in providing the necessary information about the prostate, and B&L gives the mechanism: if there is a considerable amount of residual urine it pushes the prostate downwards, making it appear larger than it is. SRB agrees that the rectal examination should be done when the bladder is empty. So: watch him void, palpate and percuss suprapubically, then examine the rectum.", ref:"Das 37 p.563 · B&L 84 p.1526 · SRB 26 p.1034"},
    {id:"bph08", lv:1, type:"Examination", q:"How much urine must be in the bladder before you can feel it?",
     a:"S Das: at least 150 ml must be collected in the bladder to make it palpable above the symphysis pubis; the swelling is elastic in feel and dull on percussion, and pressure induces a desire to micturate. B&L adds the inspection sign in chronic retention: a distended bladder is found on palpation, on percussion and sometimes on inspection, with loss of the transverse suprapubic skin crease.", ref:"Das 37 p.563 · B&L 84 p.1525"},
    {id:"bph09", lv:1, type:"Investigation", q:"What are the essential investigations?",
     a:"B&L's list: urine analysis by dipstick for blood, leukocyte esterase, glucose and protein; urine culture for infection; serum creatinine; and urinary flow rate with residual volume measurement. Additional investigations are PSA if indicated and pressure-flow studies. Note why glucose is on the dipstick: diabetes causes both polyuria and a neuropathic bladder, so two of the four dipstick items are there to find a mimic rather than to confirm BPH.", ref:"B&L 84 p.1525"},
    {id:"bph10", lv:1, type:"Investigation", q:"Give the flow rate figures.",
     a:"SRB: a urine flow rate over 15 ml per second is normal, 10 to 15 is equivocal, under 10 is low, with a normal peak flow of 20 ml per second and under 10 in obstruction. B&L: a typical history and a flow rate under 10 ml per second for a voided volume of over 200 ml will be sufficient for most urologists to recommend treatment. The conditions on the measurement are where the marks are: two or three voids should be recorded, the voided volume should exceed 150 to 200 ml, and the machine must be accurately calibrated.", ref:"SRB 26 p.1034 · B&L 84 p.1526"},
    {id:"bph11", lv:1, type:"Pathology", q:"What is the hormonal basis of BPH?",
     a:"B&L: serum testosterone levels slowly but significantly decrease with advancing age, while levels of oestrogenic steroids are not decreased equally, so the prostate enlarges because of increased oestrogenic effects, and it is likely that the secretion of intermediate peptide growth factors plays a part. SRB's axis is the one to recite because it explains the drugs: pulsatile LHRH from the hypothalamus, luteinising hormone from the anterior pituitary, stimulation of the Leydig cells, testosterone to the prostate, and 5-alpha reductase type II converting testosterone to dihydrotestosterone, which is five times more potent; 90% of testosterone comes from the testes and the remaining 10% from the adrenal cortex.", ref:"B&L 84 p.1522 · SRB 26 p.1033"},
    {id:"bph12", lv:1, type:"Examination", q:"What do you do before you examine this patient?",
     a:"Hand hygiene, introduce yourself and check the name and date of birth, explain what you are going to do, obtain verbal consent, and offer a chaperone, which B&L says should be especially for intimate examinations and part of a local guideline or policy. For the rectal examination B&L names four things needed before the finger goes anywhere: a relaxed patient who is informed of what the examination will entail, a private environment, a chaperone for the security of both parties, and good light. Say all four aloud.", ref:"B&L 80 p.1419 · B&L 21 p.285 · B&L 35 p.472"},

    {id:"bph20", lv:2, type:"History", q:"Why does the division into voiding and storage symptoms matter?",
     a:"Because it predicts the result of surgery. B&L: men who are unobstructed and have detrusor instability do not respond well to TURP, and in fact their storage symptoms could accentuate postoperatively. So voiding symptoms with a low flow rate get better after TURP, while pure storage symptoms may get worse. That one sentence is the most useful thing in the case.", ref:"B&L 84 p.1528"},
    {id:"bph21", lv:2, type:"History", q:"Does straining help the stream or hinder it?",
     a:"S Das's discriminator, which almost nobody asks: straining improves the stream in a urethral stricture and retards it in an enlarged prostate, where the median lobe presses on the internal urethral meatus like a ball valve. He adds a second postural question: with a bladder diverticulum, micturition may be started again by changing posture.", ref:"Das 37 p.558"},
    {id:"bph22", lv:2, type:"Diagnosis", q:"An elderly man is wetting the bed. Why is that urgent?",
     a:"Because it is overflow incontinence from high-pressure chronic retention, and it may be the only symptom of impending renal failure. Chronic retention is painless: S Das says the patient experiences little or no suprapubic discomfort even though the bladder is grossly distended, and B&L says such men may present with overflow incontinence, enuresis and renal insufficiency, and that these symptoms should alert the doctor to the condition. The consequence is back pressure on the upper tract with bilateral hydronephrosis, and then upper tract infection and renal impairment.", ref:"Das 37 p.557 · B&L 84 p.1525"},
    {id:"bph23", lv:2, type:"Investigation", q:"How do you quantify the symptoms, and what else do you ask the patient to bring?",
     a:"The International Prostate Symptom Score, which B&L says gives information on the severity of symptoms at the outset and changes over time and after intervention, and which should include an assessment of quality of life, a reflection of the degree of bother caused by the symptoms. And then the thing that is not the score: a frequency-volume diary completed before attending the clinic, which B&L calls invaluable in revealing fluid intake habits, diurnal variation in outputs and low-volume frequent voiding. A man drinking four litres of tea does not have an obstructed prostate, and the diary is what tells you that.", ref:"B&L 84 p.1525 · SRB 26 p.1034"},
    {id:"bph24", lv:2, type:"Diagnosis", q:"He has haematuria. Can you blame the prostate?",
     a:"Not until you have excluded everything else. B&L: haematuria may be a complication of BPH, but other causes must be excluded by urine culture, cytology, CT urography and cystoscopy. SRB has a name for the error: incrimination of BPH as the source of haematuria before excluding other causes is termed a decoy prostate. SRB does explain how BPH bleeds: the enlarged prostate compresses the prostatic venous plexus causing congestion, called vesical piles.", ref:"B&L 84 p.1525 · SRB 26 p.1033"},
    {id:"bph25", lv:2, type:"Examination", q:"Why examine the nervous system, and which two tests take thirty seconds?",
     a:"Because a neurological bladder mimics prostatic obstruction exactly, and operating on it makes the patient worse. B&L: the nervous system is examined to eliminate a neurological lesion, since diabetes mellitus, tabes dorsalis, disseminated sclerosis, cervical spondylosis, Parkinson's disease and other neurological states may mimic prostatic obstruction, and if these are suspected a pressure-flow urodynamic study should be carried out. The two tests are perianal sensation and anal tone, useful in detecting an S2 to S4 cauda equina lesion, and S Das makes the same point from the other end, that the rectal examination should start by noting the tone of the external sphincter, since laxity suggests the same change in the urinary sphincter.", ref:"B&L 84 p.1526 · Das 37 p.563"},
    {id:"bph26", lv:2, type:"Diagnosis", q:"Give the differential diagnosis of these symptoms.",
     a:"SRB's list: stricture urethra; bladder tumour; carcinoma of the prostate; the neurological causes of retention, diabetes, tabes, disseminated sclerosis and Parkinson's disease; idiopathic detrusor activity; and bladder neck stenosis or hypertrophy. B&L adds the one found by looking: the external urinary meatus should be examined to exclude stenosis, and the epididymides palpated for signs of inflammation.", ref:"SRB 26 p.1034 · B&L 84 p.1525"},
    {id:"bph27", lv:2, type:"Investigation", q:"What are the three causes of a low flow rate?",
     a:"B&L: bladder outflow obstruction; low voided volumes, characteristically in men with detrusor instability; and weak bladder contractions, that is low pressure-flow voiding, also known as an underactive detrusor. So a low flow rate is not the same as obstruction, and an underactive detrusor gives the same number but gets worse after TURP. Combine it with SRB's pressure figures to define obstruction: voiding pressure under 60 cm of water is normal, 60 to 80 equivocal, over 80 high, so obstruction is high pressure with low flow and an underactive detrusor is low pressure with low flow.", ref:"B&L 84 p.1526 · SRB 26 p.1034"},
    {id:"bph28", lv:2, type:"Investigation", q:"Would you do urodynamics on everyone?",
     a:"No. B&L's list is for the patients in whom you are not sure there is obstruction: men with suspected neuropathy, that is Parkinson's disease, dementia, longstanding diabetes, previous strokes or multiple sclerosis; men with a dominant history of irritative symptoms and men with lifelong urgency and frequency; men with a doubtful history and those with flow rates in the near normal range, around or over 15 ml per second; men with invalid flow rate measurements because of low voided volumes; high residual or chronic retention; men with recurrence of LUTS after previous BPH surgery; and young men under 50 and older men over 80. If the history is typical and the flow is under 10, you do not need them.", ref:"B&L 84 p.1526"},
    {id:"bph29", lv:2, type:"Investigation", q:"Would you image the upper tract, and would you cystoscope him?",
     a:"Not routinely. B&L: most urologists no longer carry out imaging of the upper tract in men with straightforward symptoms, but obviously if infection or haematuria is present the upper tract should be imaged by intravenous urogram, CT urography or ultrasound; SRB still lists IVU to see kidney function. A safe answer covers both: not routinely in a man with straightforward symptoms and normal renal function, but yes if there is haematuria, infection, a raised creatinine or a large residual volume. On cystoscopy B&L is precise: inspection of the urethra, prostate and bladder urothelium should be done immediately prior to prostatectomy to exclude a urethral stricture, a bladder carcinoma and the occasional non-opaque vesical calculus, but direct inspection of the prostate is not used as an indicator to establish bladder outflow obstruction and the need for surgery.", ref:"B&L 84 p.1526 · SRB 26 p.1034"},
    {id:"bph30", lv:2, type:"Treatment", q:"Who is treated conservatively, and what do you tell them?",
     a:"B&L: it is in men with relatively mild symptoms, reasonable flow rates over 10 to 15 ml per second and good bladder emptying with residual urine under 100 ml that careful discussion over the merits and side effects of operative treatment is warranted, with a wait of six months and then repeat assessment of symptoms, flow rates and an ultrasound, after which many men with stable symptoms will elect to leave matters be. Plus the fluid advice from its summary box: watchful waiting with fluid manipulation, avoiding fluid binges and late-night intake, and reducing caffeinated and alcoholic drinks. Say the fluid advice, because it treats the nocturia the man actually minds.", ref:"B&L 84 p.1528, p.1527"},
    {id:"bph31", lv:2, type:"Treatment", q:"Which drugs, and how do the two classes differ?",
     a:"Alpha-blockers inhibit the contraction of smooth muscle in the prostate, reducing bladder neck resistance; SRB's agents are prazosin and indoramin as short acting, terazosin and doxazosin as long acting, and tamsulosin 0.2 to 0.4 mg once daily as the selective alpha-1A. 5-alpha reductase inhibitors inhibit the conversion of testosterone to dihydrotestosterone and, taken for a year, give a 25% reduction in the size of the gland; SRB's agent is finasteride 5 mg daily for 6 to 8 months. B&L's comparison: both are effective, but alpha-blockers work more quickly, and although the 5-alpha reductase inhibitors have fewer side effects they need at least six months and their effect is greatest in glands over 40 g. A third class, the phosphodiesterase 5 inhibitors, improves symptom scores but not maximum flow rate and is particularly useful with concomitant erectile dysfunction.", ref:"B&L 84 p.1528 · SRB 26 p.1036"},
    {id:"bph32", lv:2, type:"Treatment", q:"How do you manage acute retention?",
     a:"Catheterise first: SRB says a patient with acute retention requires urethral catheterisation, and if that fails, suprapubic cystostomy. B&L: once the bladder has been drained the patient's fitness for treatment is determined, and if retention was not caused by drugs or constipation then prostatectomy would usually be the correct management, while unfit men or those with dementia may be treated with an indwelling urethral or suprapubic catheter. A trial without catheter after alpha-blockade has been found successful in certain groups with a short history and a low residual volume, but the recurrence rate becomes cumulatively high.", ref:"SRB 26 p.1034 · B&L 84 p.1527"},

    {id:"bph40", lv:3, type:"Management", q:"What are the indications for prostatectomy, and how often is each the reason?",
     a:"B&L's list with its proportions. Acute retention in fit men with no other cause such as drugs, constipation or a recent operation: 25% of prostatectomies. Chronic retention with renal impairment, that is a residual urine of 200 ml or more, hydroureter or hydronephrosis on ultrasound, uraemic manifestations and abnormal renal function: 15%. Complications of obstruction, stone, infection and diverticulum formation. Haemorrhage, with recurrent haematuria, no obvious cause and a very vascular prostate at cystoscopy. And elective prostatectomy for severe symptoms: about 60%. B&L's three qualifications on the elective indication: frequency alone is not a strong indication; the natural progression of outflow obstruction is variable and rarely gets worse after 10 years, which is the justification for watchful waiting; and severe symptoms not responding to drugs, a maximum flow under 10 ml per second and a residual of 100 to 250 ml are relatively strong indications.", ref:"B&L 84 p.1526, p.1527 · SRB 26 p.1034"},
    {id:"bph41", lv:3, type:"Management", q:"Why not simply resect everyone with symptoms?",
     a:"Because the result depends on having proved the obstruction. B&L: 90% of men undergoing elective operation for severe symptoms and urodynamically proven bladder outflow obstruction do well in terms of symptoms and flow rates, but only about 65% of those with mild symptoms, or with weak bladder contraction as the cause, do well. Ninety per cent against 65% purely on selection is the argument for urodynamics in the doubtful case. And for the man with coexisting detrusor overactivity, patients with both obstruction and secondary detrusor overactivity may need an anticholinergic for a few months if irritative symptoms persist.", ref:"B&L 84 p.1528"},
    {id:"bph42", lv:3, type:"Complications", q:"What do you tell the patient before a prostatectomy?",
     a:"The numbers, and both books agree almost exactly. Retrograde ejaculation or anejaculation: B&L 65 to 85%, SRB 65%. Erectile dysfunction: B&L 5 to 10%, usually in those whose potency is waning, SRB 5%. Incontinence: about 1%, higher in older patients and those with a very large prostate. Reoperation: about 15% after 8 to 10 years. Mortality: under 0.5%. Severe sepsis: about 6%. Haematuria needing more than two units: about 3%. Late urinary infection requiring antibiotics after discharge: 15 to 20%.", ref:"B&L 84 p.1528 · SRB 26 p.1035"},
    {id:"bph43", lv:3, type:"Procedure", q:"Where does the resection stop, and why?",
     a:"At the verumontanum. B&L: strips of tissue are cut from the bladder neck down to the level of the verumontanum, and damage to the external sphincter is avoided provided the verumontanum is used as a guide to the most distal point of the resection, vaporisation or enucleation. SRB says the same, that resection is done above the level of the verumontanum. Say the landmark and the reason together: resect from the bladder neck to the verumontanum and no further, because the external sphincter lies distal to it. That is the answer to how you avoid incontinence.", ref:"B&L 84 p.1529 · SRB 26 p.1034"},
    {id:"bph44", lv:3, type:"Complications", q:"What is TURP syndrome, and what would you do about it?",
     a:"Water intoxication with dilutional hyponatraemia from absorption of irrigant through open prostatic veins, presenting with confusion, congestive cardiac failure and hyponatraemia; B&L limits monopolar resection to one hour because of the risk of resorption if 1% glycine is used as an irrigant, and credits the fall in incidence to isotonic glycine. In common use the irrigant is 1.5% glycine, non-conducting and hypo-osmolar relative to plasma, which is why absorbing it dilutes the sodium. B&L's treatment sentence is that the treatment consists of fluid restriction, which is the answer to what the book says. Then, flagged as outside the three books: stop the resection and the irrigation, tell the anaesthetist, give oxygen, send an urgent sodium and a blood gas, and treat the overload; severe symptomatic hyponatraemia with seizures or a depressed conscious level is treated promptly with hypertonic saline under senior supervision, with a ceiling on the 24-hour rise. Do not say correct it slowly: that is the rule for chronic hyponatraemia.", ref:"B&L 84 p.1529, p.1530 · SRB 26 p.1034"},
    {id:"bph45", lv:3, type:"Treatment", q:"What do you irrigate the bladder with after a TURP?",
     a:"Isotonic saline. B&L: following TURP, careful haemostasis is performed and a three-way self-retaining catheter irrigated with isotonic saline is introduced into the bladder to prevent further bleeding from forming blood clots, irrigation is continued until the outflow is pale pink, and the catheter is usually removed on the second or third postoperative day. Glycine appears in B&L only as the intra-operative irrigant for monopolar resection, because monopolar diathermy cannot work in a conducting fluid. SRB contradicts itself, saying continuous bladder irrigation with normal saline through a three-way Foley on one page and continuous postoperative irrigation using glycine for 72 hours on the next. Saline is right, and SRB's own first page agrees.", ref:"B&L 84 p.1529 · SRB 26 p.1034, p.1035"},
    {id:"bph46", lv:3, type:"Complications", q:"The patient is bleeding after the resection. What do you do?",
     a:"B&L: haemorrhage is a major risk following prostatectomy whatever the surgical approach; arterial points are diathermied, and some of the venous bleeding from deep resection can only be stopped by gentle traction via a Foley catheter balloon inflated to 30 to 40 ml and kept in the bladder, with sustained traction applied by taping the catheter to the anterior abdominal wall or thigh for 12 to 24 hours, which compresses the prostatic tissue and veins. The balloon pulled onto the prostatic cavity tamponades the venous plexus in the false capsule: it is pressure, not cautery. If the catheter stops draining, a clot may be blocking its eye and the bladder should be promptly washed out using strict aseptic technique. And warn about secondary haemorrhage, which tends to occur several days after discharge, advising rest and a high fluid intake.", ref:"B&L 84 p.1529"},
    {id:"bph47", lv:3, type:"Complications", q:"What is post-obstructive diuresis, and how do you manage it?",
     a:"B&L: uraemic patients with chronic retention are often dehydrated at admission, and owing to chronic back pressure on the distal tubules there is loss of the ability to reabsorb salts and water, so after release of the pressure there may be an enormous outflow of salts and water. It is for this reason that a careful fluid chart, daily weights and serial estimations of creatinine and electrolytes are essential, with intravenous fluid if the patient cannot keep up. The related decision: men with chronic retention who have relatively low residual volumes, no symptoms of infection and good renal function do not necessarily require catheterisation before proceeding to prostatectomy on the next available list, while for those who are uraemic urgent catheterisation is mandatory to allow renal function to recover and stabilise.", ref:"B&L 84 p.1527"},
    {id:"bph48", lv:3, type:"Investigation", q:"How would you use PSA in this patient?",
     a:"B&L: after suitable counselling, measurement of serum PSA may be helpful, and men in whom a diagnosis of early prostate cancer might influence treatment, such as those under 70 or with a positive family history who might be offered radical treatment, should be offered it; if the PSA is 4 to 10 ng/mL, a free-to-total ratio of less than 15% should be suspicious of malignancy, and then multiparametric MRI with TRUS-guided or transperineal biopsy of a suspicious index lesion. SRB's figures for an Indian paper: normal 4 ng/mL, over 10 significant and suggestive of carcinoma, over 35 almost diagnostic of advanced carcinoma, 25% of men with a PSA of 4 to 10 have carcinoma and 20% with a normal PSA of 1 to 4 also have it; its refinements are PSA density over 0.5, velocity over 2 ng/mL/year, doubling time under 12 months and free PSA under 25%. And SRB's explanatory sentence: PSA rises in hyperplasia and prostatitis as well as carcinoma, but much more in carcinoma, with the bound form increased in carcinoma and the free form in benign conditions, which is why a low free fraction is the worrying one.", ref:"B&L 84 p.1526 · SRB 26 p.1032, p.1033"},
    {id:"bph49", lv:3, type:"Investigation", q:"Is serum acid phosphatase still a test?",
     a:"It is in SRB and absent from B&L 28e's prostate chapter. SRB: the enzyme that splits organic phosphates, more concentrated in the prostate, active at pH 5, estimated on an empty stomach because heavy meals alter the level, normal 0 to 5 King-Armstrong units per 100 ml; it is raised significantly in carcinoma of the prostate with metastases, does not increase in BPH, and rises slightly in acute prostatitis, Paget's disease of bone and hepatic cirrhosis. It has been superseded by PSA because it rises only once the cancer has metastasised, which SRB itself says, and because it is not prostate-specific. Answer it fully if asked directly, but lead with PSA.", ref:"SRB 26 p.1032, p.1034 · B&L 84 p.1526"},
    {id:"bph50", lv:3, type:"Examination", q:"What can the rectal examination not tell you?",
     a:"Two things. The median lobe: S Das says enlargement of the median lobe may not be detected by rectal examination, though it can be palpated per rectum with the introduction of a urethral bougie, because the lobe grows upwards into the bladder away from your finger, which is why a man can be in retention with a prostate that feels normal. And the top of a very large gland: B&L says it is not always possible to examine the cranial extreme of a very large prostate per rectum, and an inability to reach the prostate base implies a volume of at least 50 ml, which is a usable rule. What you can feel that students miss, in S Das's words, is residual urine in the post-prostatic pouch as a soft swelling above the prostate, the intravesical lobe on bimanual examination, and the seminal vesicles.", ref:"Das 37 p.564, p.563 · B&L 84 p.1526"},
    {id:"bph51", lv:3, type:"Anatomy", q:"Why can a man still get prostate cancer after a prostatectomy?",
     a:"Because the operation removes the adenoma from the transition zone and not the peripheral zone, which is where carcinoma arises. B&L describes the plane: the enucleation cuts all the attachments of the adenoma to the false capsule in the relatively avascular plane between the peripheral and transitional zones. The false capsule is not a true capsule but peripheral-zone gland flattened by the growing adenoma, and it is left behind.", ref:"B&L 84 p.1529, p.1522 · SRB 26 p.1032"},
    {id:"bph52", lv:3, type:"Treatment", q:"How honest are the figures for drugs against TURP?",
     a:"B&L is blunt: drug therapy results in improvements in maximum flow rates of about 2 ml per second more than placebo and a mild, 20%, improvement in symptom scores, while TURP results in improvements in maximum flow rate from 9 to 18 ml per second and a 75% improvement in symptom scores; the drugs are expensive in comparison with their effectiveness, and a significant proportion of men who try them will subsequently undergo surgery. So drugs are for the man who wants to avoid the side effects of surgery, chiefly retrograde ejaculation, which is how B&L introduces them: in men who are very concerned about the development of sexual dysfunction after TURP, the use of drugs may be helpful.", ref:"B&L 84 p.1528"},
  ],

  "anorectal-conditions": [
    {id:"ano01", lv:1, type:"History", q:"One question separates the three. What is it?",
     a:"Is the bleeding painless or agonising, and is there a discharge? Painless bright red bleeding separate from the motion is piles; pain like passing glass on defaecation is a fissure; intermittent purulent discharge with a history of an abscess is a fistula. S Das: uncomplicated piles are absolutely painless but hurt when complicated by secondary infection; in a fistula-in-ano pain is intermittent, appearing when the fistula closes and relieved when the pus discharges. B&L's words for the fissure are passing glass or a knife cutting, usually resolving only to recur at the next evacuation.", ref:"Das 36 p.539 · B&L 80 p.1428, p.1436"},
    {id:"ano02", lv:1, type:"Pathology", q:"What are haemorrhoids?",
     a:"Not varicose veins. B&L: haemorrhoids are symptomatic enlargements of the internal haemorrhoidal venous plexus, which constitutes the submucosal component of the anal cushions that are important in sealing the anal canal. SRB puts the modern concept first: downward sliding of the anal cushions, abnormally, due to straining or other causes, the cushions being aggregations of arterioles, venules, smooth muscle and elastic connective tissue in the submucosa, described by Thomson in 1975, normally residing in the left lateral, right posterolateral and right anterolateral anal canal. They are normal structures that have slid down, which is why you do not excise all of them.", ref:"B&L 80 p.1430 · SRB 25 p.961"},
    {id:"ano03", lv:1, type:"Anatomy", q:"Where do internal haemorrhoids lie, and why there?",
     a:"At 3, 7 and 11 o'clock with the patient in the lithotomy position, with secondary haemorrhoids between the primary positions. SRB gives the vascular reason: the positions relate to the branches of the superior haemorrhoidal vessel, which divides into two on the right and continues as one on the left, so right anterior at 11, right posterior at 7 and left lateral at 3. Always state the position of the patient, because the clock numbers are meaningless without it.", ref:"B&L 80 p.1430 · SRB 25 p.961"},
    {id:"ano04", lv:1, type:"Classification", q:"Give the degrees of haemorrhoids.",
     a:"First degree: bleed only, no prolapse. Second: prolapse but reduce spontaneously. Third: prolapse and have to be manually reduced. Fourth: permanently prolapsed. Both books agree, and the degree is the whole answer on treatment, because first and second map to injection or banding and third and fourth to operation.", ref:"B&L 80 p.1430 · SRB 25 p.961"},
    {id:"ano05", lv:1, type:"Pathology", q:"Why is the blood bright red?",
     a:"Because it is arterialised. B&L: there are direct arteriovenous communications with the submucosal venous dilatations, shown both histologically and radiologically, and the oxygen tension of the blood within the venous dilatations is more arterial than venous, which explains the bright red colour. SRB's term for the same structure is the anal corpus cavernosum of Stelzner, and it adds the extreme case, an arterial pile, a haemangiomatous condition of the superior rectal artery entering the pedicle, which bleeds profusely.", ref:"B&L 80 p.1419 · SRB 25 p.962"},
    {id:"ano06", lv:1, type:"Examination", q:"In what order do you examine the anal region?",
     a:"S Das puts it in italics: it cannot be emphasised too strongly that the anal region must be inspected firstly, palpated secondly and digital examination lastly. The order matters because a digital examination in an acute fissure is intolerable and doing it first ends the examination: SRB says per rectal examination and proctoscopy are not possible in acute fissure-in-ano and general anaesthesia is required, and B&L says the inability to conduct an adequate examination in the clinic should prompt early examination under anaesthesia.", ref:"Das 36 p.541 · SRB 25 p.968 · B&L 80 p.1428"},
    {id:"ano07", lv:1, type:"Examination", q:"What does inspection show?",
     a:"S Das: this part of the examination should never be omitted. Look for anal tags, that is external piles, a sentinel pile which is a feature of chronic fissure, a fistula-in-ano, a pilonidal sinus, condylomata and a carcinoma. B&L adds the manoeuvre for a fissure: if the buttocks are gently parted, an anal fissure can usually be detected as an ulcer of variable depth with the skin tag and an anal papilla. And to show prolapsing piles, third-degree internal haemorrhoids become visible when the patient strains, which can be reproduced by withdrawal of a small swab inserted into the anal canal.", ref:"Das 36 p.541 · B&L 80 p.1427, p.1430"},
    {id:"ano08", lv:1, type:"Examination", q:"Can you feel internal piles?",
     a:"No. S Das: uncomplicated internal piles cannot be felt with the finger and are diagnosed by proctoscope; only chronically inflamed and thrombosed piles can be felt by digital examination. SRB says the same. Piles are soft compressible vascular cushions and a finger occludes them, so if you can feel them they are thrombosed or they are not piles. In a chronic fissure, by contrast, SRB says the ulcer is felt with a button-like depression, induration and often a sentinel pile.", ref:"Das 36 p.544 · SRB 25 p.962, p.968"},
    {id:"ano09", lv:1, type:"Pathology", q:"Define an anal fissure.",
     a:"B&L: a longitudinal ulcer in the anoderm of the distal anal canal, which extends from the anal verge proximally towards, but not beyond, the dentate line. Every word earns its place: longitudinal, in the anoderm, distal, and stopping at the dentate line.", ref:"B&L 80 p.1427"},
    {id:"ano10", lv:1, type:"Pathology", q:"Define a fistula-in-ano, and what causes most of them?",
     a:"B&L: a chronic abnormal communication extending from the anorectal lumen, the internal opening, to an external opening on the skin of the perineum or buttock, or rarely in women to the vagina; the majority are idiopathic or cryptoglandular and are lined by granulation tissue. SRB's figure: 95% of anorectal abscesses are due to infection of the anal glands in relation to the crypts, that is cryptoglandular disease, the glands being the cryptoglands of Morgagni. An anal gland in the intersphincteric space becomes infected through its crypt at the dentate line, the abscess tracks out to the skin, and the resulting track is the fistula, which is why the internal opening is at the dentate line.", ref:"B&L 80 p.1436 · SRB 25 p.969, p.972"},
    {id:"ano11", lv:1, type:"Examination", q:"What do you need before a rectal examination?",
     a:"B&L names four things before the finger goes anywhere: a relaxed patient who is informed of what the examination will entail, a private environment, a chaperone for the security of both parties, and good light. Say all four aloud, because I would do a PR without them is where candidates lose this station. Add hand hygiene, introduction, checking the name and date of birth, verbal consent, and examining the tender part last.", ref:"B&L 80 p.1419 · B&L 35 p.472 · B&L 21 p.285"},
    {id:"ano12", lv:1, type:"Investigation", q:"What must you exclude before treating any of these?",
     a:"A colorectal cancer. B&L, on haemorrhoids: exclusion of other causes of rectal bleeding, especially colorectal malignancy, is the first priority. SRB's causes of bleeding per anum are the list to recite: piles, fissure-in-ano, fistula-in-ano, polyps, ulcerative colitis, amoebic colitis, carcinoma of the rectum, carcinoma of the colon, diverticulitis, intussusception and a vascular anomaly of the colorectum. So say it before you say anything about treatment: haemorrhoids in a patient over forty, or with any change in bowel habit or anaemia, require colonoscopy.", ref:"B&L 80 p.1431 · SRB 25 p.963"},
    {id:"ano13", lv:1, type:"Treatment", q:"How do you treat an anorectal abscess?",
     a:"Drainage of pus and appropriate systemic antibiotics, which is B&L's own summary box, and never drainage alone. Management of acute anorectal sepsis is primarily surgical, including careful examination under anaesthesia, sigmoidoscopy and proctoscopy, and adequate drainage of the pus; SRB adds sitz baths, antibiotics and analgesics alongside drainage under general anaesthesia. For perianal and ischiorectal sepsis, which B&L puts at 60% and 30% of cases, drainage is through the perineal skin, traditionally through a cruciate incision over the most fluctuant point with excision of the skin edges to deroof the abscess, though B&L adds that skin preservation is important and wide excision of otherwise healthy tissue should be avoided.", ref:"B&L 80 p.1436 · SRB 25 p.970"},

    {id:"ano20", lv:2, type:"History", q:"Where is the blood, and what does that tell you?",
     a:"S Das: blood on the toilet paper is only seen in minor bleeding from the anal skin, either from a fissure-in-ano or external haemorrhoids. Blood separate from the motion, on the paper or as a splash in the pan, is piles; blood mixed with the stool is not anal and sends you looking higher. And in a child with bleeding per anum, S Das says a diagnosis of rectal polyp should be considered.", ref:"Das 36 p.539 · B&L 80 p.1430 · SRB 25 p.962"},
    {id:"ano21", lv:2, type:"History", q:"How do you ask about the prolapse properly?",
     a:"S Das's two questions: whether the prolapse that comes out with defaecation reduces automatically after the act or has to be replaced by pushing it in, and the length of the protruded mass, since a slight protrusion is a partial prolapse while more than two inches is a complete prolapse or procidentia, that is prolapse of all coats of the rectum. The same two questions give you the degree of the piles and distinguish piles from a rectal prolapse.", ref:"Das 36 p.540"},
    {id:"ano22", lv:2, type:"Examination", q:"In which position do you examine, and why that one?",
     a:"Left lateral, Sims', which S Das calls the most popular position for anorectal examination, with the buttocks projecting over the edge of the table and hips and knees well flexed, suitable for inspection of the perianal region and proctoscopy. His others: dorsal, when the patient is too ill to be turned and for bimanual examination, but not suitable for inspection around the anus; knee-elbow, particularly suitable for palpating the prostate and seminal vesicles; right lateral, for a carcinoma at the pelvirectal junction, which then falls towards the finger; and lithotomy, for bimanual examination and a high rectal lesion, which SRB says is the position for all perineal surgery.", ref:"Das 36 p.540, p.541 · SRB 25 p.969"},
    {id:"ano23", lv:2, type:"Examination", q:"Describe the digital rectal examination and how you would report it.",
     a:"Position, look, strain, then the finger. B&L: visual examination of the anus precedes rectal examination to exclude anal disease, and evidence of rectal prolapse or abnormal pelvic floor descent can be elicited by asking the patient to strain; the index finger used with gentleness and precision remains a valuable test, the anal sphincters are assessed for anatomical integrity, resting tone and squeeze, tumours in the lower and middle thirds can usually be felt, and on removal the finger should be examined for mucus, pus or blood, noting the normal as well as the abnormal, such as the prostate. Report it in B&L's vocabulary: intraluminal, for blood or pus; intramural, for tumours, granular areas or strictures; or extramural, for an enlarged prostate or uterine fibroids, with intramural lesions described as fixed, tethered or mobile. And give the clock position with the position you examined in.", ref:"B&L 79 p.1395"},
    {id:"ano24", lv:2, type:"Examination", q:"What do you record at proctoscopy?",
     a:"SRB's checklist: the numbers, degrees and size; the surface and appearance of the piles; the features and chronicity of the prolapse; other rectal lesions such as external tags, anal papillae, a fissure or proctitis; and the presence of other discharge, blood, pus or mucus.", ref:"SRB 25 p.962, p.963"},
    {id:"ano25", lv:2, type:"Treatment", q:"How do you treat first- and second-degree piles?",
     a:"Conservatively first: improve bowel and defaecatory habits, stool softeners and bulking agents, and a defaecatory position that minimises straining. SRB specifies fibre 35 g a day, plenty of water, ispaghula husk, sterculia or methylcellulose, lactulose, and sitz baths, sitting in warm water with the anal region submerged for 20 minutes two to three times a day. B&L adds suppositories of phlebotonics, plant-based flavonoid extracts, and synthetic compounds such as calcium dobesilate, which may reduce capillary permeability and increase lymphatic drainage. Then injection sclerotherapy or rubber band ligation.", ref:"B&L 80 p.1431 · SRB 25 p.963"},
    {id:"ano26", lv:2, type:"Procedure", q:"Describe injection sclerotherapy and its three errors.",
     a:"Five per cent phenol in arachis or almond oil, 3 to 5 ml injected into the apex of the pedicle and not into the haemorrhoid itself, with SRB naming the Gabriel syringe and explaining that the oil acts as a vehicle holding the phenol for a long period of action. The aim is to cause fibrosis that obliterates the vascular channels and a scar that supports the prolapsing anorectal mucosa. The three errors: too painful means too low, and pain on injection means the needle is in the wrong place and should be withdrawn; too superficial is heralded by rapid bulging of the mucosa, which turns white, leading to superficial ulceration but rarely serious sepsis; and too deep is the dangerous one, with serious consequences including prostatitis and pelvic sepsis, and SRB adds pelvic abscess, impotence, rectovaginal fistula and hypochondriac pain from entry of the drug into the portal system. Review at eight weeks, or SRB's six, and repeat if necessary.", ref:"B&L 80 p.1431 · SRB 25 p.964"},
    {id:"ano27", lv:2, type:"Procedure", q:"Describe rubber band ligation, and what is the rule?",
     a:"Barron's bander is used to slip tight elastic bands onto the base of the pedicle of each haemorrhoid. The rule is the thing being examined: the band must be applied above the dentate line, about 2 cm above it in SRB's wording, because below it the band sits on somatically innervated skin and causes intense pain. The bands cause ischaemic necrosis and the piles slough off within 10 days, or one to two weeks in SRB, which may be associated with bleeding, about which the patient must be warned, and the resulting fibrosis supports the remaining anal cushions. Two bands per pedicle are often used in case one breaks. B&L bands all three primary haemorrhoids at one session and repeats after several weeks; SRB bands only two at a time and repeats after three weeks. SRB's contraindications: fissure, fistula or proctitis.", ref:"B&L 80 p.1431 · SRB 25 p.964"},
    {id:"ano28", lv:2, type:"Complications", q:"What are the complications of haemorrhoids, and how do you manage a thrombosed pile?",
     a:"B&L's four: strangulation and thrombosis, ulceration, gangrene and portal pyaemia. For a strangulated thrombosed pile, B&L gives both options and favours the conservative one: urgent haemorrhoidectomy may expedite symptom resolution but great care is needed to avoid later anal stenosis, and many surgeons adopt a conservative approach with adequate pain relief, bed rest, cold saline compresses and laxatives, with resolution usually in three to four days; systemic antibiotics are usually given to reduce the risk of portal pyaemia. Say the reason for the antibiotics: the superior rectal veins drain to the portal system.", ref:"B&L 80 p.1430 · SRB 25 p.962"},
    {id:"ano29", lv:2, type:"Pathology", q:"Why is a fissure posterior, and what does an anterior one mean?",
     a:"B&L is honest that it is not fully settled: the location in the posterior midline may relate to the shearing forces acting at that site at defaecation, combined with a less elastic anoderm endowed with an increased density of longitudinal muscle extensions in that region. SRB's mechanical version: because of the curvature of the sacrum and rectum, hard faecal matter passing down tears the anal valve. An anterior fissure is more common in women and may arise following vaginal delivery, which SRB attributes to lack of support to the pelvic floor.", ref:"B&L 80 p.1427 · SRB 25 p.968"},
    {id:"ano30", lv:2, type:"Pathology", q:"Recite the vicious cycle of a fissure.",
     a:"B&L: affected patients frequently present with internal anal sphincter hypertonia, which enhances the traumatic effect of the hard stool and perpetuates relative tissue ischaemia with decreased blood supply to the anal mucosa; after the initial tear a vicious cycle of non-healing and repeated trauma leads to chronic deep fissures, and local pain increases sphincter hypertonia, which worsens hard stool and local tissue ischaemia. Four links: hard stool, tear, pain, sphincter spasm, ischaemia, non-healing. Every treatment attacks one of them, so say the cycle first and the treatments explain themselves.", ref:"B&L 80 p.1428"},
    {id:"ano31", lv:2, type:"Examination", q:"What makes a fissure chronic?",
     a:"Three things to name. B&L: chronic fissures are characterised by a hypertrophied anal papilla internally and a sentinel tag externally, both consequent on repeated healing and breakdown, between which lies an indurated anal ulcer that exposes fibres of the internal sphincter. SRB's version adds inflamed indurated margins with scar tissue and a sentinel pile below which acts like a guard. Seeing the white fibres of the internal sphincter in the floor is what makes it chronic. And the paradox worth stating, which SRB says twice: pain is severe in the acute type and less severe in the chronic.", ref:"B&L 80 p.1428 · SRB 25 p.968"},
    {id:"ano32", lv:2, type:"Treatment", q:"How do you treat a fissure, and which drug would you choose?",
     a:"Conservative treatment first, which B&L says should heal almost all acute and the majority of chronic fissures: normalisation of bowel habit, added fibre to bulk the stool, stool softeners, adequate water, warm baths and topical local anaesthetic. Then chemical sphincterotomy: glyceryl trinitrate 0.2% two or three times daily, a nitric oxide donor; diltiazem 2% twice daily, a calcium channel antagonist; or botulinum toxin, 10 to 100 units in B&L and 25 units in SRB, injected into the internal sphincter, blocking acetylcholine release, with temporary incontinence in up to 10% and a cure rate of approximately 50%. Prefer diltiazem, and say why: the same efficacy with fewer side effects, because GTN causes headaches which limit its acceptability and are the reason patients stop using it.", ref:"B&L 80 p.1428 · SRB 25 p.968, p.969"},

    {id:"ano40", lv:3, type:"Treatment", q:"Is anal dilatation a useful manoeuvre?",
     a:"B&L says it is rarely indicated, and that is the answer. Its one sentence is a verdict: anal sphincter dilatation has been used to reduce sphincter tone, however this potentially disrupts the anal sphincters at multiple sites with an associated risk of incontinence such that it is rarely indicated; it does not appear among B&L's treatments for haemorrhoids at all, and B&L lists dilatation among the causes of faecal incontinence. SRB still teaches it with finger counts: Lord's dilatation, manual dilatation under general anaesthesia using four fingers of each hand, eight fingers, to break the circular constricting band, used for inflamed permanently prolapsed oedematous piles before a formal procedure, and Recamier's stretching with two fingers of each hand for an acute fissure, which SRB says is better than Lord's because complications are fewer; its own stated complications are incontinence, usually temporary, and infection. The continence risk is why it has been abandoned.", ref:"B&L 80 p.1428, p.1433, p.1424 · SRB 25 p.963, p.968"},
    {id:"ano41", lv:3, type:"Procedure", q:"Describe a haemorrhoidectomy, and name the one step that prevents a stenosis.",
     a:"Open, Milligan-Morgan, most commonly used in the UK, with ligation and excision and the anal mucosa and skin left open to heal by secondary intention; or closed, Ferguson, the popular technique in the USA, with the wound sutured. The step that matters is leaving mucocutaneous bridges between the excised piles, which B&L says twice, because excising all the way round gives an anal stenosis: the operation removes three pedicles, not a ring of anal canal. Technique: dilute adrenaline 1:300 000 into the anoderm, artery forceps on the skin-covered external component with traction to reveal the internal component, a V-shaped cut through the skin, dissection up the canal with the internal sphincter visible and separate from the dissected pile, a transfixion ligature on the pedicle, the pile excised well distal to the ligature and the ligature cut long. Afterwards: two warm baths a day, a bulk laxative twice daily, analgesia, a 5-day course of oral metronidazole which may reduce pain, and review at three to four weeks with a rectal examination to look for stenosis.", ref:"B&L 80 p.1432, p.1433"},
    {id:"ano42", lv:3, type:"Treatment", q:"What is stapled haemorrhoidopexy, and what is the trade-off?",
     a:"Longo's operation: a circular stapler excises a cylinder of mucosa and submucosa above the dentate line, with the vessels within it, stapling the ends together, so it lifts the prolapsing cushions back rather than excising them, which is why it is used for prolapsing piles. The trade-off is the answer: it is less painful than conventional haemorrhoidectomy with quicker recovery, but recurrence rates are higher, any external component persists, and it carries specific risks, staple line dehiscence, infection, rectovaginal fistula if the posterior vaginal wall is caught in the purse string, and distressing tenesmus from mucosal stimulation by the staples which may require reoperation and staple removal. Two technical imperatives: the staple line must be above the dentate line, and the posterior vaginal wall must not be included. Do not say equally efficacious without the recurrence qualification. The other sphincter-sparing alternative is transanal haemorrhoidal ligation, Doppler-guided ligation of the feeding vessels with or without suture mucopexy, which SRB calls Doppler-guided haemorrhoidal artery ligation: B&L cites the HubBLe trial, in which recurrence after HAL was significantly lower than after rubber band ligation though HAL was less cost-effective, with better complication rates and pain scores than conventional surgery.", ref:"B&L 80 p.1433 · SRB 25 p.963"},
    {id:"ano44", lv:3, type:"Treatment", q:"The fissure has not healed on drugs. What operation, and why not in the midline?",
     a:"A lateral internal sphincterotomy, dividing the lower third of the internal sphincter in the right or left lateral position, away from the fissure; the fissure itself needs no treatment, though a sentinel tag or hypertrophied papilla can be excised and should go for histology. The reason it is lateral rather than in the floor of the fissure, which is how it was originally done, is that a posterior midline division heals as a keyhole deformity, a gutter through which mucus and liquid stool leak. Where sphincterotomy is contraindicated, in a postpartum woman or a patient with a normal or low resting anal pressure, do a fissurectomy with an advancement flap instead. For an Indian paper list SRB's two operations, dorsal fissurectomy with sphincterotomy and lateral anal sphincterotomy, and say the lateral one is preferred, with the keyhole reason.", ref:"B&L 80 p.1428 · SRB 25 p.968, p.969"},
    {id:"ano45", lv:3, type:"Diagnosis", q:"The fissure is lateral. What does that mean?",
     a:"That it is not a simple fissure until proved otherwise. B&L: a fissure that is not midline, or one with atypical features, should raise the suspicion of a specific aetiology, which means Crohn's disease, tuberculosis, a sexually transmitted or HIV-related ulcer, and B&L names syphilis, Chlamydia, chancroid, lymphogranuloma venereum, herpes simplex, cytomegalovirus, Kaposi's sarcoma and B-cell lymphoma, or a squamous carcinoma; it needs examination under anaesthesia with biopsy and culture. SRB adds that multiple fissures are seen in inflammatory bowel disease, in homosexuals and in venereal disease.", ref:"B&L 80 p.1428 · SRB 25 p.968"},
    {id:"ano46", lv:3, type:"Classification", q:"Classify fistula-in-ano by Parks' classification.",
     a:"B&L: the most widely used classification is based on anal gland sepsis in the intersphincteric space, with the internal opening at the dentate line, resulting in a primary track whose relation to the external sphincter defines the type and influences management. Intersphincteric: does not cross the external sphincter, most commonly running directly from internal to external opening across the distal internal sphincter. Trans-sphincteric: crosses both sphincters, the external at a variable level, then passes through the ischiorectal fossa to the skin of the buttock, with possible circumferential horseshoe spread. Suprasphincteric: runs up above the puborectalis then curls down through the levators and ischioanal fossa, and is often caused by excessive probing of an abscess cavity or fistula tract. Extrasphincteric: runs without specific relation to the sphincters and usually results from pelvic disease or trauma. SRB's older systems are the standard Milligan-Morgan and Goligher types, subcutaneous, low anal, submucous, high anal and pelvirectal, and the practical high-and-low division by whether the internal opening is below or at or above the internal ring.", ref:"B&L 80 p.1436, p.1437 · SRB 25 p.972"},
    {id:"ano47", lv:3, type:"Classification", q:"What makes a fistula complex, and why does it matter?",
     a:"Because it decides whether you operate, investigate further or refer. B&L uses the American Gastroenterology Association classification, which condenses Parks' into simple and complex. Simple: low, that is superficial or low inter- or low trans-sphincteric, with a single external opening. Complex: high inter- or trans-sphincteric; extra- or suprasphincteric; the presence of an abscess or collection; an ano-vaginal fistula; or an anal stricture. SRB's definition adds the patient factors: the track crosses over 50% of the external sphincter, anterior in a female, multiple tracks, recurrent, or the patient has pre-existing incontinence, local irradiation or Crohn's disease.", ref:"B&L 80 p.1436 · SRB 25 p.972"},
    {id:"ano48", lv:3, type:"Examination", q:"State Goodsall's rule, and how much weight do you put on it?",
     a:"An external opening in the anterior half of the anus usually connects by a straight radial track to an internal opening at the nearest point of the dentate line, while a posterior one curves to the posterior midline; SRB adds that posterior openings may be of horseshoe type with multiple external openings all connected to a single internal opening. B&L gives it and qualifies it in the same breath: Goodsall's rule is helpful, however the majority of internal openings are midline in both the anterior and posterior planes. That is not a rejection: the posterior half of the rule holds, while an anterior external opening often also leads to a midline internal opening rather than a radially adjacent one. The practical consequence is that you confirm the internal opening rather than predicting it, with hydrogen peroxide or methylene blue through the external opening, gentle probing under anaesthesia, and MRI where there is doubt.", ref:"SRB 25 p.973 · B&L 80 p.1437"},
    {id:"ano49", lv:3, type:"Investigation", q:"How would you image a fistula, and why not a fistulogram?",
     a:"MRI is the gold standard for fistula imaging, and B&L calls short tau inversion recovery sequencing, a fat-suppression technique highlighting pus and granulation tissue without contrast, revolutionary; its great advantage is the ability to demonstrate secondary extensions, which may be missed at surgery and cause persistence. That is the reason: what makes a fistula recur is a secondary extension you did not find, and a fistulogram shows the track you already know about. Endoanal ultrasound, especially with hydrogen peroxide instilled through the external opening, is more accurate than clinical examination, useful to determine whether a fistula is simple or complex, and assesses sphincter integrity. SRB agrees that MRI or an MRI fistulogram is ideal, and names MRI as the investigation of choice for an anorectal abscess too.", ref:"B&L 80 p.1438 · SRB 25 p.974, p.970"},
    {id:"ano50", lv:3, type:"Treatment", q:"What are the aims of fistula surgery, and what is the number?",
     a:"Continence first, cure second. B&L's point is that what matters in fistulotomy is the amount of muscle left behind rather than that divided, and that in the presence of a normal bowel habit continence is usually maintained as long as a minimum length of external sphincter is retained, 2 cm as a rule but less in some cases. So the order of the aims is continent, comfortable, then eradication of the fistula, and 2 cm of external sphincter is the number.", ref:"B&L 80 p.1439"},
    {id:"ano51", lv:3, type:"Procedure", q:"Fistulotomy or fistulectomy, and what else can be done?",
     a:"Lay open rather than excise where you can: fistulotomy removes less tissue, heals faster and risks less sphincter, while fistulectomy gives a specimen for histology, which matters where tuberculosis, Crohn's or malignancy is possible. SRB: fistulotomy is done in a low anal fistula, passing a probe through the whole track and incising over it, then allowing it to granulate. The alternatives, all of which try to close the track without dividing muscle along its whole length: a loose draining seton, tied without tension and with no intent to cut; a cutting seton, tied securely to create ischaemic necrosis, dividing the muscle slowly without letting it spring apart and so avoiding a gutter deformity, kept up to three months and replaced by a rail-road technique, that is staged fistulotomy; an advancement flap; fibrin glue, with a success rate SRB gives as 70%; LIFT, ligation of the intersphincteric fistula track, reaching the intersphincteric space through a transverse incision and ligating the track on either side; and VAAFT with the nitinol clip. And proper curetting of the infected anal gland area is essential.", ref:"B&L 80 p.1438, p.1439 · SRB 25 p.975"},
    {id:"ano52", lv:3, type:"Treatment", q:"What must you not do when draining an anorectal abscess?",
     a:"Two prohibitions, both B&L's. Injudicious probing in the acute stage is potentially dangerous and may lead to a much more difficult situation, which is how a suprasphincteric fistula is created. And unless by highly experienced hands, immediate fistulotomy should not be performed. What you may do instead: a gentle search for an underlying fistula if the surgeon is experienced, and if obvious, a loose draining seton may be passed, noting loose and draining. Also note the exception in the classification: a supralevator abscess is not simply drained through the perineum, because that takes the track across the whole sphincter complex and creates an extrasphincteric fistula; treatment depends on the underlying cause and intrarectal drainage may be appropriate.", ref:"B&L 80 p.1436"},
    {id:"ano53", lv:3, type:"Diagnosis", q:"An ischiorectal abscess that does not fluctuate, and the patient is diabetic.",
     a:"Take him to theatre. SRB's warning prevents the missed diagnosis: an ischiorectal abscess presents with a tender, indurated, brawny swelling over the ischiorectal fossa with high fever, the swelling is not well localised, and fluctuation is absent, so waiting for fluctuation is the error. B&L adds why the diabetic matters: immunosuppressed patients or those with diabetes or AIDS may present with perianal or pelvirectal sepsis that may run an aggressive course. And a recurrent or atypical abscess is a reason to look for what B&L lists underneath: fistula-in-ano, Crohn's disease, diabetes, immunosuppression.", ref:"SRB 25 p.970 · B&L 80 p.1435, p.1436"},
    {id:"ano54", lv:3, type:"Diagnosis", q:"Multiple external openings with watery discharge and no induration.",
     a:"Not a simple cryptoglandular fistula. SRB: tuberculous fistulas do not have induration, have pale granulation tissue with watery discharge, and are most often multiple; its list for multiple openings is tuberculosis, Crohn's disease, ulcerative colitis, lymphogranuloma venereum, hidradenitis suppurativa and actinomycosis. B&L's list of non-cryptoglandular causes is the same with rectal duplication, foreign body and malignancy, which may very rarely arise within a longstanding fistula, and SRB explains the Crohn's link anatomically: plenty of lymphoid aggregates surround the anal glands. One question localises the internal opening without any instrument: B&L says the passage of flatus or faeces through the external opening is suggestive of a rectal rather than an anal internal opening.", ref:"SRB 25 p.974, p.972 · B&L 80 p.1436"},
  ],

  "breast-lump": [
    {id:"brl01", lv:1, type:"Investigation", q:"What is triple assessment?",
     a:"One thing, not three. Every patient presenting with a breast lump, nipple discharge or other breast symptom is assessed by clinical examination, radiological imaging and tissue sampling for cytology or histology, and that combination is triple assessment. B&L says the positive predictive value and diagnostic accuracy of the combination approach 100%, and its figure claims a confident diagnosis in 99.9% of cases. SRB's three limbs are the same: clinical assessment including age, radiological imaging with mammography after 40, and cytological or histological analysis by FNAC or core biopsy. Say the phrase early and structure the whole answer around it.", ref:"B&L 58 p.915 · SRB 8 p.538"},
    {id:"brl02", lv:1, type:"Examination", q:"Distinguish tethering from fixity.",
     a:"The commonest place to lose marks in the case. Tethered means the disease has spread to the fine fibrous septa running from the glandular tissue to the skin, Astley Cooper's ligaments: infiltration makes them shorter and inelastic, pulling the skin inwards and puckering it, and the lump can still be moved independently of the skin for some distance, after which the skin dimples. So you test for tethering by moving the lump side to side and watching for a dimple at the extremes of movement. Fixity means direct and continuous infiltration of the skin by the tumour: the lump cannot be moved independently of the skin at all, and the overlying skin cannot be pinched up.", ref:"Das 30 p.418"},
    {id:"brl03", lv:1, type:"Anatomy", q:"Where does the breast lie, and which parts must you not miss?",
     a:"From the second rib above to the sixth rib or the inframammary crease below, the lateral border of the sternum medially to the anterior or mid-axillary line laterally. The three areas that must not be skipped are the upper outer quadrant, the retroareolar region and the nipple-areola complex, because about 50% of the ductolobular tissue lies in the upper outer quadrant and about 20% centrally. Plus the axillary tail, which S Das insists you feel and in which carcinoma can arise, and which B&L warns is sometimes mistaken for a mass of enlarged nodes, a breast mass or a lipoma.", ref:"B&L 58 p.914, p.916 · Das 30 p.416"},
    {id:"brl04", lv:1, type:"Anatomy", q:"Which structure produces the skin signs of breast cancer?",
     a:"The ligaments of Cooper, fibrous suspensory ligaments attached to the undersurface of the dermis superficially and to the pectoral fascia deeply. B&L's mechanism: tumour growth factors drive a desmoplastic reaction, and contraction of the new collagen shortens Cooper's ligaments, giving dimpling from a single shortened ligament, puckering or tethering from many, or nipple retraction. Everything from dimpling to nipple retraction is these ligaments being shortened.", ref:"B&L 58 p.914, p.915, p.932"},
    {id:"brl05", lv:1, type:"Anatomy", q:"Give the levels of the axillary nodes.",
     a:"By their relation to pectoralis minor, which is the only way not to muddle them. Level I: below and lateral to the lateral border of pectoralis minor, the majority. Level II: in front of and behind pectoralis minor, including the interpectoral or Rotter's nodes. Level III: above and medial to the medial border of pectoralis minor. The axillary nodes receive approximately 85% of the lymph from the breast, and the internal mammary nodes drain the medial half.", ref:"B&L 58 p.915"},
    {id:"brl06", lv:1, type:"Examination", q:"In which positions do you inspect the breast, and what is each for?",
