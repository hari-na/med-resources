    {id:"lvs30", lv:2, type:"Investigation", q:"Would you biopsy the liver lesion?",
     a:"Not one I intend to resect. B&L, where resection is being considered, is explicit that biopsy should be avoided, and that in borderline cases diagnostic laparoscopy and intraoperative ultrasonography will exclude additional hepatic or peritoneal disease. Biopsy is for patients you are not going to operate on: SRB does a liver biopsy only if the primary is not identified by any of the other methods, and that is also the setting where the histology will direct chemotherapy. Before any liver biopsy, exclude hydatid disease.", ref:"B&L 69 p.1216 · SRB 11 p.605, p.586"},
    {id:"lvs31", lv:2, type:"Procedure", q:"If you do biopsy the liver, how, and what can go wrong?",
     a:"SRB: a Vim-Silverman needle or, better, a Menghini needle, usually through the right mid-axillary line. Complications: haemorrhage, infection, bile leak and biliary peritonitis. Contraindications: hydatid disease, because it precipitates anaphylaxis, haemangioma, bleeding disorders and ascites.", ref:"SRB 11 p.586"},
    {id:"lvs32", lv:2, type:"Management", q:"The primary is an obstructing colonic cancer and there are liver deposits. What do you do about the colon?",
     a:"Deal with it: SRB's position is that if the primary is in the colon a palliative hemicolectomy is done, and if a solitary liver secondary is present it can be resected along with it. An obstructing or bleeding primary needs treating whatever the state of the liver disease, and the decision on the liver belongs to a hepatobiliary multidisciplinary team.", ref:"SRB 11 p.605 · B&L 69 p.1217"},

    {id:"lvs40", lv:3, type:"Management", q:"Is this patient curable?",
     a:"Possibly, and that is the point of the case. B&L: despite recent advances in chemotherapeutic agents, resection remains the only potentially curative option, but only 20% of patients will be candidates at presentation and a further 20 to 30% become operable following chemotherapy. Thirty years ago metastatic colorectal cancer carried a five-year survival of less than 3%; liver resection in selected patients with liver-only metastatic disease has demonstrated five-year survival of 50%. SRB's position, that chemotherapy is the treatment of choice with surgery having a definitive role for a colonic or renal primary, is right for unresectable disease and wrong as a general rule. So the first question is not which chemotherapy but whether this patient can be made resectable, and liver-only metastatic colorectal cancer belongs in a hepatobiliary unit rather than in palliation.", ref:"B&L 69 p.1216, p.1210 · SRB 11 p.605"},
    {id:"lvs41", lv:3, type:"Management", q:"What makes liver metastases unresectable?",
     a:"Not the number and not the size. B&L: resection with curative intent is defined as the ability to successfully remove all residual disease from the liver with clear surgical margins, leaving adequate disease-free viable liver, and the technical contraindications are anatomical, principally involvement of major vascular or biliary structures. Previously, synchronous metastases, a rectal primary, multiple diffuse metastases, metastases larger than 5 cm, a disease-free interval of less than a year, or a high serum CEA were considered irresectable and suitable only for palliation; modern surgical techniques and chemotherapy mean they are not. SRB's criteria, the stage of the primary, the number of secondaries, the segments involved, the size of the largest lesion and associated liver disease, still predict prognosis; they no longer decide operability.", ref:"B&L 69 p.1216 · SRB 11 p.605"},
    {id:"lvs42", lv:3, type:"Management", q:"How much liver must you leave behind?",
     a:"B&L: there is no clear consensus about the volume required for adequate post-resection liver function, but a future liver remnant to total estimated liver volume ratio of at least 25% is recommended with a normal liver and 40% in the presence of cirrhosis; in the colorectal metastasis section, an FLR of 25% of preoperative volume is considered sufficient to prevent postoperative hepatic failure.", ref:"B&L 69 p.1212, p.1217"},
    {id:"lvs43", lv:3, type:"Treatment", q:"The future liver remnant would be too small. What can you do?",
     a:"Grow it, or change the operation. Preoperative portal vein embolisation induces hypertrophy of one side of the liver before a planned resection of the other, increasing the future liver remnant; B&L notes it was first described by Makuuchi in 1984 before an extended hepatectomy for bile duct carcinoma, and the materials are polyvinyl alcohol particles, coils, gelatin sponge, n-butyl cyanoacrylate with lipiodol, or fibrin glue. The other three tools B&L names for converting an inoperable liver are staged procedures, ablation, and local or multiple segmental resections, alongside downstaging chemotherapy.", ref:"B&L 69 p.1211, p.1212, p.1210"},
    {id:"lvs44", lv:3, type:"Treatment", q:"What margin do you aim for, and what if you cannot get it?",
     a:"An R0 resection with a negative surgical margin of 1 cm is considered the gold standard. But with effective modern chemotherapy, patients with an R1 resection, meaning a margin of at least 1 mm microscopically negative, which occurs in 10 to 30% of patients, have similar survival to those with R0 resections. So a close margin is not a reason to abandon an otherwise feasible resection, which is the same shift as everywhere else in this chapter, from anatomical rules to functional ones.", ref:"B&L 69 p.1216, p.1217"},
    {id:"lvs45", lv:3, type:"Treatment", q:"What is the standard operation for colorectal liver metastases?",
     a:"Multiple segmentectomies and/or metastectomies, which B&L calls the standard of care, rather than a hemihepatectomy by default. It is possible because each segment has its own arterial, portal and biliary supply and its own hepatic vein tributary, which is what makes anatomical segmental resection feasible, and it is the point of departure from SRB's rule that if the secondaries are in a single lobe a hemihepatectomy is done.", ref:"B&L 69 p.1211, p.1193 · SRB 11 p.605"},
    {id:"lvs46", lv:3, type:"Anatomy", q:"Divide the liver surgically.",
     a:"At Cantlie's line. Segments V to VIII, to its right, are supplied by the right hepatic artery and right portal vein and drain by the right hepatic duct; segments I to IV, to its left, by the left hepatic artery and left portal vein, draining by the left hepatic duct. Each segment is drained by a hepatic vein tributary, and B&L's own comment is that this concept facilitates anatomical liver resection, so resections of individual segments, of a whole hemiliver, or combinations are all possible.", ref:"B&L 69 p.1193"},
    {id:"lvs47", lv:3, type:"Treatment", q:"Why does blocking the hepatic artery work?",
     a:"SRB's sentence, worth quoting as written: hepatic artery ligation is one of the surgical palliations for advanced hepatocellular carcinoma and secondaries in the liver, as tumour tissue is supplied exclusively by the hepatic artery but normal tissue is also supplied by the portal vein. That is the rationale for every transarterial therapy in the liver: you can starve the tumour because the liver has a second blood supply and the tumour does not. SRB elsewhere writes that hepatic artery ligation or embolisation is tried, and lists chemoembolisation among the palliative options.", ref:"SRB 11 p.584, p.604 · SRB 21 p.869"},
    {id:"lvs48", lv:3, type:"Management", q:"There are lung metastases as well. Does that rule out liver resection?",
     a:"Not automatically. B&L: historically extrahepatic metastatic disease was considered a contraindication to liver surgery, but long-term survival is now possible in selected patients, and survival after lung resection for colorectal metastases is similar to that after liver resection, 40 to 50%, with low morbidity and mortality. It is a decision for a multidisciplinary team rather than a rule.", ref:"B&L 69 p.1217"},
    {id:"lvs49", lv:3, type:"Management", q:"What happens after resection?",
     a:"Five-year overall survival is about 50%, but tumour recurs in 65% of patients, and in 40% of those the recurrence is limited to the liver. That last figure is the one that matters: because most recurrences are again confined to the liver, re-resection or ablation is often possible, which is why these patients need structured follow-up in a specialist unit.", ref:"B&L 69 p.1216"},
    {id:"lvs50", lv:3, type:"Treatment", q:"What are the Milan criteria?",
     a:"The criteria for liver transplantation in hepatocellular carcinoma, first described by Mazzaferro in 1996: tumours of 5 cm or less, or up to three nodules each of 3 cm or less, with angioinvasion and extrahepatic involvement as exclusions. They achieved four-year overall survival of 75% and recurrence-free survival of 83% and are now universally accepted, and ablation can downstage a tumour into the criteria.", ref:"B&L 69 p.1216"},
    {id:"lvs51", lv:3, type:"Procedure", q:"What has made liver resection safe enough to offer?",
     a:"B&L names three things since the first formal resection in 1952: cross-sectional imaging, liver transection technology, and low central venous pressure anaesthesia, which is the one candidates forget and the one that controls bleeding from the hepatic veins. The parenchyma is divided by CUSA, harmonic scalpel or radiofrequency, and B&L is candid that the choice is a matter of personal preference with no evidence that any method is superior; the hepatic veins and the Glissonian sheath are now routinely stapled with an endoscopic vascular stapler.", ref:"B&L 69 p.1191, p.1211"},
    {id:"lvs52", lv:3, type:"Pathology", q:"What are the primary liver tumours in the differential, and how do they behave?",
     a:"Hepatocellular carcinoma, managed by resection, ablation or transplantation by the Milan criteria. Intrahepatic cholangiocarcinoma, which is 20% of cholangiocarcinomas and 5 to 30% of primary liver tumours, second only to HCC: rare in the West at 0.5 to 2 per 100 000 but 60 per 100 000 in Thailand where Clonorchis sinensis is endemic, with only 30% suitable for resection at presentation even when confined to the liver, and a five-year survival of 3% that remains unchanged. S Das's reminder still holds: primary carcinoma of the liver is rare and may be a hepatoma or a cholangioma, while secondary carcinoma is much commoner.", ref:"B&L 69 p.1216 · Das 35 p.524"},
  ],

  "varicose-veins": [
    {id:"vvn01", lv:1, type:"Pathology", q:"Define varicose veins, and the smaller veins, by calibre.",
     a:"SRB's thresholds: dermal flares are thread veins under 1 mm in diameter, seen in 30% of superficial vein incompetence; reticular veins are 1 to 3 mm, lying just deep to the skin, also in 30%; varicose veins are usually over 3 mm. Incidence of varicose veins is about 5% of the adult population.", ref:"SRB 1 p.222"},
    {id:"vvn02", lv:1, type:"Pathology", q:"Why are varicosities commoner in the lower limb?",
     a:"SRB: because of the erect posture, and because a long column of blood has to be supported, which leads to weakness and incompetency of the valves.", ref:"SRB 1 p.222"},
    {id:"vvn03", lv:1, type:"Anatomy", q:"Compare the superficial and deep venous systems.",
     a:"The superficial veins carry 10% of the venous system, lie in condensed superficial fascia between skin and deep fascia, and have thick muscular walls, low pressure and plenty of valves. The long saphenous vein is the longest vein in the body and has 10 to 20 valves.", ref:"SRB 1 p.222"},
    {id:"vvn04", lv:1, type:"Anatomy", q:"Name the sites of superficial-to-deep communication.",
     a:"SRB's four: the saphenofemoral junction, mid-thigh perforators, the short saphenopopliteal junction, and calf perforators. S Das's order of importance for the long saphenous system: the saphenofemoral junction, which is the most important, the mid-thigh perforator, the lower-thigh perforator, and the lower leg perforators on the medial side.", ref:"SRB 1 p.222 · Das 7 p.103"},
    {id:"vvn05", lv:1, type:"Anatomy", q:"Which system is involved, and how do you tell by looking?",
     a:"Long saphenous: medial side of the leg and thigh, passing anterior to the medial malleolus. Short saphenous: posterior calf, arising from the lateral side of the dorsal venous arch and passing posterior to the lateral malleolus with the sural nerve. The nerve matters because it is the one injured in short saphenous surgery.", ref:"B&L 62 p.1026"},
    {id:"vvn06", lv:1, type:"Examination", q:"Give the skin changes of chronic venous disease, in the order they develop.",
     a:"Pigmentation, that is haemosiderosis, then eczema, then lipodermatosclerosis of the calf skin, then ulceration. SRB adds atrophie blanche, white patches in the skin from severe varicose veins, and thickening of the tibia from periostitis in long-standing disease. S Das's instruction is to look for pitting oedema or thickening, redness or tenderness at the lower part of the leg, which follow chronic venous hypertension after deep vein thrombosis.", ref:"B&L 62 p.1029 · SRB 1 p.222, p.223 · Das 7 p.104"},
    {id:"vvn07", lv:1, type:"Examination", q:"How do you begin the examination?",
     a:"Expose both legs fully and examine the patient standing, because varices only fill against gravity. Mark the varicosities: SRB illustrates marking the veins with marking ink just before surgery. Then look at the distribution to decide which system, and at the skin for the changes of venous hypertension.", ref:"SRB 1 p.228 · Das 7 p.102"},
    {id:"vvn08", lv:1, type:"Classification", q:"Group the symptoms of varicose veins.",
     a:"SRB's three groups. Group I, asymptomatic: venous telangiectasia, thread, reticular or varicose veins. Group II, symptomatic: cramps, heaviness, tenderness, itching, swelling. Group III, complicated: haemorrhage, superficial thrombophlebitis, eczema, lipodermatosclerosis and venous ulcers. The classical symptom is a dragging pain with postural discomfort.", ref:"SRB 1 p.222"},
    {id:"vvn09", lv:1, type:"History", q:"Is the aching worse in the morning or the evening, and why does the answer matter?",
     a:"Worse in the evening: SRB says symptoms are less severe in the morning than in the evening, because they come from ambulatory venous hypertension, which accumulates through a day of standing and is relieved by a night of elevation. The contrast with arterial disease is the separator: claudication comes on walking a predictable distance and is relieved by standing still, while venous aching comes on standing still and is relieved by walking and elevation. If walking helps, think venous.", ref:"SRB 1 p.222 · B&L 62 p.1027"},
    {id:"vvn10", lv:1, type:"Classification", q:"Distinguish primary from secondary varicose veins.",
     a:"Primary: often familial, cause unknown, a weak valve or weak wall, younger patient, the main saphenous veins affected with the deep veins usually patent, only Trendelenburg test I positive, complications fewer and later. Secondary: acquired, adult or elderly, saphenous veins, perforators and often the deep veins involved, both Trendelenburg tests I and II often positive, complications common and quick to develop.", ref:"SRB 1 p.222"},
    {id:"vvn11", lv:1, type:"Diagnosis", q:"A soft swelling in the groin with a cough impulse in a patient with varicose veins.",
     a:"A saphena varix: a large varicosity in the groin which becomes visible on standing, with a positive cough impulse at the saphenofemoral junction. B&L's warning is that it may elicit an impulse and be mistaken for a groin hernia, which is the same trap seen from the other side in the hernia case.", ref:"SRB 1 p.223 · B&L 62 p.1031"},
    {id:"vvn12", lv:1, type:"Physiology", q:"What drives venous return from the leg?",
     a:"B&L: venous pressure in the leg is increased by compression by the surrounding muscles, the calf muscle pump, and to a lesser extent by the tone of the venous wall. The deep calf veins are capacious and joined by blind-ending sacks, the soleal sinusoids, which force blood into the popliteal and crural veins when the calf pump contracts, for instance while walking. That is why exercise relieves venous symptoms, standing worsens them, and compression works.", ref:"B&L 62 p.1027"},
    {id:"vvn13", lv:1, type:"Examination", q:"What do you do before you examine this patient's legs?",
     a:"Hand hygiene, introduce yourself and check the name and date of birth, explain what you are going to do, obtain verbal consent, and make the patient comfortable. Expose both legs fully and keep the patient covered otherwise, and examine standing.", ref:"B&L 35 p.472 · B&L 21 p.285"},

    {id:"vvn20", lv:2, type:"Examination", q:"Describe the Brodie-Trendelenburg test, both parts.",
     a:"With the patient recumbent, raise the leg to empty the veins, milking them proximally. Compress the saphenofemoral junction with the thumb, or apply a tourniquet just below it, and stand the patient up quickly. Part one: release the pressure, and if the varices fill very quickly by a column of blood from above, the saphenofemoral valve is incompetent. Part two: maintain the pressure for about a minute, and gradual filling of the veins while the junction stays occluded means incompetent communicating veins, mostly on the medial side of the lower half of the leg, allowing flow from deep to superficial. Part one tests the junction, part two the perforators, and for the short saphenous system press the saphenopopliteal junction instead.", ref:"Das 7 p.102 · SRB 1 p.223"},
    {id:"vvn21", lv:2, type:"Examination", q:"How does the tourniquet test localise a perforator?",
     a:"It is a variant of the Trendelenburg test. Empty the veins by elevation, tie the tourniquet at a chosen level, and stand the patient up. If the veins above the tourniquet fill while those below stay collapsed, the incompetent perforator is above the tourniquet; if those below fill rapidly while those above stay empty, it is below. Move the tourniquet down in steps and you localise it.", ref:"Das 7 p.102, p.103"},
    {id:"vvn22", lv:2, type:"Examination", q:"What is Perthes' test for?",
     a:"Deep venous patency. Occlude the superficial system, either with an elastic bandage or a thigh tourniquet, and exercise the patient. If the deep veins are patent the varices shrink and the patient is comfortable; if they are obstructed the varices become more distended and the patient develops severe crampy pain, because you have occluded the limb's only drainage. S Das gives two versions on the same page, the original judged by pain and the modified one by the size of the varices, and instructs that arterial occlusive disease be excluded first. The point that survives the method: if the deep veins are obstructed, the superficial veins are the limb's collateral drainage and must not be stripped or ablated.", ref:"Das 7 p.103 · B&L 62 p.1031"},
    {id:"vvn23", lv:2, type:"Examination", q:"What is the Schwartz test?",
     a:"In a long-standing case, a tap on the long saphenous varicosity in the lower leg transmits an impulse that is felt at the saphenous opening with the other hand, and the percussion wave can also be transmitted from above downwards. It demonstrates a continuous column of blood in an incompetent vein.", ref:"Das 7 p.103, p.104"},
    {id:"vvn24", lv:2, type:"Examination", q:"What is Pratt's test?",
     a:"A test for the sites of leg perforators. Apply an Esmarch elastic bandage from toes to groin and tie a tourniquet at the groin, which empties the varices. Keeping the tourniquet on, remove the bandage and then reapply it from the groin downwards: at the site of each perforator a blow-out or visible varix appears, and these are marked with a skin pencil.", ref:"Das 7 p.103, p.104"},
    {id:"vvn25", lv:2, type:"Examination", q:"How do you find the perforators by palpation alone?",
     a:"Mark the sites of excessive bulges while the patient stands. Then lie him down, elevate the limb to empty the veins, and palpate along the marked line for gaps or pits in the deep fascia, which transmit the incompetent perforators. It is the one test that is pure palpation and often the most convincing at the bedside.", ref:"Das 7 p.104"},
    {id:"vvn26", lv:2, type:"Examination", q:"How do you demonstrate saphenofemoral incompetence by cough?",
     a:"Elevate the limb to empty the veins, lay the patient down and ask for a forcible cough. An expansile impulse is felt in the long saphenous vein, particularly at the saphenous opening, if the saphenofemoral valve is incompetent, and a bruit may be heard on auscultation.", ref:"Das 7 p.104"},
    {id:"vvn27", lv:2, type:"History", q:"What is the single most important question in the history?",
     a:"Whether the patient has ever had a swollen painful leg, a clot, a long illness in bed or a fracture, because a post-thrombotic limb changes the treatment completely: the superficial veins may be the limb's collateral drainage and must not be stripped or ablated. SRB's figures make the point: 50% of venous ulcers are due to varicose veins and 50% to deep venous disease, and 50% of venous ulcers occur as a result of recanalisation of a deep vein thrombosis, the leg then being called a postphlebitic limb.", ref:"SRB 1 p.27, p.234"},
    {id:"vvn28", lv:2, type:"Examination", q:"Where should a venous ulcer be, and what if it is elsewhere?",
     a:"Around the ankle, in the gaiter's zone, from ambulatory chronic venous hypertension; SRB adds that it is vertically oval, commonly medial, occasionally lateral, sometimes both, but never above the middle third of the leg. An ulcer elsewhere on the leg is probably not venous. In the post-thrombotic limb the mechanism is deep vein thrombosis causing increased venous pressure around the ankle, transmitted through the perforators.", ref:"SRB 1 p.27"},
    {id:"vvn29", lv:2, type:"Treatment", q:"What does compression do, and what is the hazard?",
     a:"Graduated compression hosiery is the conservative mainstay, working with the calf pump against ambulatory venous hypertension. B&L is blunt about the hazard: misapplication of compression hosiery can have serious consequences, pressure necrosis and tourniquet effects, so assessment, prescription and application should be done properly. Exclude arterial disease before compressing a leg. SRB's options for the ulcer are a Charing Cross elastic multilayered compression bandage once a week, low compression bandaging, graduated elastic compression stockings over a leak-proof absorbent dressing, Unna boots, or crepe bandage and stockings.", ref:"B&L 62 p.1033 · SRB 1 p.234"},
    {id:"vvn30", lv:2, type:"Investigation", q:"What must the duplex scan tell you?",
     a:"B&L's four stated aims: the presence of reflux in the deep and superficial venous systems; the exact distribution and extent of reflux in the superficial system, including which junctions and perforators are affected; the presence of obstruction in the deep venous system; and the suitability of the vein for the planned intervention. Those four map exactly onto what the clinical tests were trying to establish, which is why duplex replaced them.", ref:"B&L 62 p.1031"},
    {id:"vvn31", lv:2, type:"Complications", q:"How do you elicit the signs of a deep vein thrombosis?",
     a:"Two ways of eliciting calf tenderness, one indirect and one direct. Homan's sign: passive forceful dorsiflexion of the foot with the knee extended stretches the calf muscles and produces pain. Moses' sign: calf tenderness elicited directly, by squeezing the calf muscles from side to side. S Das adds the extreme form: with venous obstruction the limb swells and becomes oedematous, and when it becomes congested and blue that is phlegmasia cerulea dolens.", ref:"Das 7 p.106"},
    {id:"vvn32", lv:2, type:"Pathology", q:"What are the secondary causes of varicose veins?",
     a:"SRB's list: recurrent thrombophlebitis; occupational prolonged standing, naming traffic police, guards and sportsmen; obstruction to venous return from an abdominal tumour, retroperitoneal fibrosis, lymphadenopathy or ascites; pregnancy, due to progesterone, with obesity and chronic constipation; arteriovenous malformations; iliac vein thrombosis; and tricuspid incompetence, which is the one nobody expects and is worth naming.", ref:"SRB 1 p.222"},

    {id:"vvn40", lv:3, type:"Investigation", q:"Are the tourniquet tests still worth doing?",
     a:"In the clinical examination yes, and you should perform them, because the examiner is marking from S Das and SRB and doing them competently shows you understand superficial-to-deep reflux. Then locate them: B&L 28e states that tourniquet tests and the use of hand-held Doppler have now been abandoned, and that there is good evidence to support the policy of duplex ultrasound scanning for all patients with varicose veins prior to any intervention. Its reason is the one to quote: the best clinical results come from clinicians who are personally very skilled in the use of duplex and use it to design a bespoke treatment for each individual patient based on their unique anatomy. The tests give a crude yes or no, duplex gives a map, and catheter-directed treatment needs a map. Perthes, Schwartz, Pratt, Fegan and Morrissey do not appear in B&L's venous chapter at all.", ref:"B&L 62 p.1031 · Das 7 p.102 · SRB 1 p.222"},
    {id:"vvn41", lv:3, type:"Treatment", q:"What is the gold standard treatment?",
     a:"B&L: endothermal ablation technologies replaced surgical ligation and stripping as the gold standard once randomised trials showed they were marginally safer, with extremely high technical efficacy, superior quality of life after the procedure with rapid recovery, and equivalent longer-term improvement, and that they are cost-effective because they can be done as an outpatient under local anaesthetic. Open surgery is framed as the traditional alternative, used unless by patient choice. SRB teaches the open operation as the treatment, which is what is done in most Indian hospitals, so give the endovenous gold standard first and the open operation as the alternative, noting that the principle is identical in both: abolish the point of junctional incompetence and deal with the refluxing axial vein. And duplex first, whichever you do.", ref:"B&L 62 p.1033, p.1037, p.1031 · SRB 1 p.228"},
    {id:"vvn42", lv:3, type:"Procedure", q:"Describe the Trendelenburg operation.",
     a:"Juxtafemoral flush ligation of the long saphenous vein, flush with the femoral vein, after ligating the named tributaries: superficial circumflex iliac, superficial external pudendal and superficial epigastric, plus the deep external pudendal and the unnamed tributaries. SRB's warning is the examinable part: all tributaries should be ligated, otherwise recurrence will occur. For a venous ulcer SRB's operation is Trendelenburg's operation, stripping of the veins and perforator ligation.", ref:"SRB 1 p.228, p.234"},
    {id:"vvn43", lv:3, type:"Procedure", q:"How does endovenous laser ablation work?",
     a:"A small flexible glass fibre is inserted into the vein, and laser energy, typically at 1470 nm, travels down the fibre and is absorbed at its tip, generating vigorous thermal energy. Varicosities are marked beforehand if concomitant phlebectomy or foam sclerotherapy is planned; the patient is positioned in the reverse Trendelenburg position, and for the great saphenous vein supine with the hip of the treated leg externally rotated. The vein is surrounded by tumescent local anaesthetic solution, which compresses the vein onto the treatment device and protects the surrounding tissue. The irony worth noticing: the one surviving use of Trendelenburg's name in B&L's venous chapter is the position on the table for the procedure that replaced his operation.", ref:"B&L 62 p.1033"},
    {id:"vvn44", lv:3, type:"Treatment", q:"What are the non-thermal, non-tumescent techniques, and their trade-off?",
     a:"B&L notes that the mechanical devices can make the procedure uncomfortable, and that the device can snag on the vein, tearing it or rarely stripping it altogether. Comparative studies suggest similar early efficacy but increased medium- and long-term recanalisation rates, and although the axial ablation is less painful, that advantage is lost when it is combined with phlebectomy.", ref:"B&L 62 p.1036"},
    {id:"vvn45", lv:3, type:"Treatment", q:"Where does foam sclerotherapy fit?",
     a:"Alongside ablation, for residual varicosities, and B&L names a specific advantage: it allows direct and targeted delivery of adjuvant foam, for example to ablate areas of neovascularisation.", ref:"B&L 62 p.1035"},
    {id:"vvn46", lv:3, type:"Diagnosis", q:"A woman has unilateral left leg swelling with varicose veins. What one diagnosis must you consider?",
     a:"May-Thurner syndrome: compression of the left common iliac vein by the right common iliac artery, clearly described by May and Thurner in 1957. It is why a unilateral left-sided presentation with swelling deserves imaging of the pelvic and iliac veins rather than straight treatment of the superficial veins.", ref:"B&L 62 p.1027"},
    {id:"vvn47", lv:3, type:"Management", q:"Which patients with varicose veins should almost always be treated conservatively?",
     a:"Those with Klippel-Trenaunay syndrome. B&L: virtually all such patients should be treated conservatively with compression hosiery, though some benefit from laser ablation of the naevus, stapling of the bones to avoid leg length discrepancy, and occasional removal of large superficial varicose veins. The reason is the same as in the post-thrombotic limb: the superficial veins may be the limb's main drainage. Think of it in a young patient with unilateral atypical varices and a difference in limb length or girth.", ref:"B&L 62 p.1047 · SRB 1 p.222"},
    {id:"vvn48", lv:3, type:"Anatomy", q:"Which anatomical variation causes recurrence after an otherwise correct operation?",
     a:"Treating the wrong vein. B&L: the anterior accessory great saphenous vein is commonly mistaken for the great saphenous vein itself, and a true duplex great saphenous vein is rare. SRB's surgical equivalent is that a double saphenous vein is the commonest anomaly near the saphenovenous junction. It is one of the reasons for duplex mapping before any intervention.", ref:"B&L 62 p.1026 · SRB 1 p.228"},
    {id:"vvn49", lv:3, type:"Classification", q:"What is CEAP?",
     a:"Clinical, aEtiology, Anatomy, Pathophysiology: the descriptive classification for chronic venous disorders, widely utilised and updated in 2020. SRB gives its own group I to III symptom classification and then adds that the CEAP classification is also important, so both books want it. Give it by name and expand the acronym, which most candidates cannot.", ref:"B&L 62 p.1029, p.1050 · SRB 1 p.222"},
    {id:"vvn50", lv:3, type:"Pathology", q:"What causes primary varicose veins?",
     a:"Be candid first: B&L says the majority of patients with venous disease have a problem primarily with the vein wall structure, in most confined to the superficial veins, and that little is known about the mechanism of initiation. SRB's list is congenital incompetence or absence of valves; weakness or wasting of muscles with defective connective tissue and smooth muscle in the venous wall; stretching of the deep fascia; inheritance, with the FOXC2 gene; and the syndromes with varices of atypical distribution, Klippel-Trenaunay, avalvulia and Parkes-Weber.", ref:"B&L 62 p.1027 · SRB 1 p.222"},
    {id:"vvn51", lv:3, type:"Examination", q:"A thigh tourniquet makes the reflux worse rather than better. What does that mean?",
     a:"Short saphenous incompetence. S Das flags the paradox: in short saphenous varices a tourniquet on the upper thigh increases the strength of the reflux with faster filling, because it blocks the long saphenous route that was carrying most of the superficial return and throws the saphenopopliteal leak into prominence, and he calls this pathognomonic. The definitive test is to mark the saphenopopliteal junction standing, empty the vein by elevation, apply firm thumb pressure to the ink mark, stand the patient and release: immediate filling confirms saphenopopliteal incompetence.", ref:"Das 7 p.103"},
    {id:"vvn52", lv:3, type:"Complications", q:"What must you warn about when a patient with deep venous disease is exercised with a tourniquet on?",
     a:"Pulmonary embolism. SRB describes the manoeuvre and the danger together: after applying a tourniquet at the saphenofemoral junction the patient is made to walk and, without removing the tourniquet, the limb is examined, with the warning of chest pain, breathlessness and haemoptysis. Any discussion of deep venous disease should end with embolism.", ref:"SRB 1 p.217"},
  ],

  "right-iliac-fossa-mass": [
    {id:"rif01", lv:1, type:"Diagnosis", q:"Give the differential diagnosis of a right iliac fossa mass.",
     a:"SRB's five common ones first: appendicular mass, carcinoma caecum, ileocaecal tuberculosis, lymph node mass and amoeboma, with appendicular abscess alongside the first. Then Crohn's disease, actinomycosis, psoas abscess, bony swellings of the ilium, iliac artery aneurysm, an ectopic or unascended kidney, an abdominal undescended testis, and the gynaecological masses, ovarian cyst, tubo-ovarian mass and pedunculated fibroid. And the parietal ones, which candidates forget: lipoma, desmoid tumour, fatty hernia of the linea alba and a parietal wall abscess. B&L's own list is appendix mass, lymphoma, carcinoma of the caecum, Crohn's disease, tuberculosis and actinomycosis.", ref:"SRB 16 p.723 · Das 35 p.533 · B&L 74 p.1308"},
    {id:"rif02", lv:1, type:"Diagnosis", q:"Which is the commonest cause?",
     a:"S Das: the appendicular lump is the commonest swelling in the right iliac region. In India the first three of SRB's five, appendicular mass, carcinoma caecum and ileocaecal tuberculosis, carry almost all the cases.", ref:"Das 35 p.533 · SRB 16 p.723"},
    {id:"rif03", lv:1, type:"Examination", q:"How do you tell a parietal from an intra-abdominal mass?",
     a:"The leg-lifting test, which S Das calls Carnett's manoeuvre: ask the supine patient to lift both legs off the bed with the knees extended, or to raise the head and shoulders with the arms folded across the chest, which makes the abdominal muscles taut. An intra-abdominal mass becomes less prominent; a parietal mass persists the same but becomes less mobile. Also, pitting of the skin on pressure suggests a parietal abscess, though a faecally loaded colon can also pit. Do this before anything else, because if the mass is parietal the whole intra-abdominal differential is irrelevant.", ref:"Das 35 p.520, p.519 · SRB 16 p.723"},
    {id:"rif04", lv:1, type:"Examination", q:"Separate an appendicular mass from an appendicular abscess.",
     a:"The mass contains no pus; the abscess does, and S Das is categorical about it. The mass is firm, with distinct borders, and resonant on percussion because it contains bowel; the abscess is soft, with indistinct borders, and dull because it contains fluid. The abscess has variable pyrexia and a rising leucocyte count with polymorphonuclear leucocytosis, and it tends to approach the surface, so redness and oedema of the abdominal wall appear. The distinction matters because the abscess needs drainage, preferably radiological, and the mass does not.", ref:"Das 35 p.533 · SRB 16 p.723 · B&L 76 p.1343"},
    {id:"rif05", lv:1, type:"Pathology", q:"What is an appendicular mass made of, and why does it form?",
     a:"Inflamed appendix, greater omentum, oedematous caecal wall and coils of small intestine matted together with lymph; SRB's figure names dilated ileum, greater omentum, inflamed appendix and caecum. It forms because, in S Das's words, it is an attempt by nature to make a protective wall around the inflamed appendix to prevent general peritonitis even if the appendix perforates. It appears gradually on the third day or earlier after the onset of acute appendicitis, and it invariably coincides with the position of the appendix.", ref:"Das 35 p.533 · SRB 24 p.937"},
    {id:"rif06", lv:1, type:"Examination", q:"Does a right iliac fossa mass move with respiration?",
     a:"None of the five common ones does. So if the mass does move with respiration you are feeling liver, gallbladder or kidney, and the differential you are working through is the wrong one.", ref:"SRB 16 p.723"},
    {id:"rif07", lv:1, type:"Examination", q:"Which of these masses is mobile?",
     a:"Carcinoma of the caecum, because the caecum is on a mesentery, though mobility becomes restricted once it is adherent to psoas. Ileocaecal tuberculosis has restricted mobility. The appendicular mass, the appendicular abscess and an amoeboma are not mobile. So paradoxically the cancer is the mobile mass, which is the opposite of what students expect.", ref:"SRB 16 p.723"},
    {id:"rif08", lv:1, type:"Examination", q:"What does a hard mass in the abdomen mean?",
     a:"SRB's one-line rule: a hard mass in the abdomen is commonly malignant. So the consistency is the first thing you report, because it decides how urgently everything else happens. Hard also fits ileocaecal tuberculosis and an amoeboma, which is why the other signs are needed.", ref:"SRB 16 p.724, p.723"},
    {id:"rif09", lv:1, type:"History", q:"What is the first question you ask, and why?",
     a:"How long the lump has been there: days, weeks or months. It splits the differential in two. Days, after an attack of abdominal pain, means an appendicular mass or abscess, since the mass develops on the third day or earlier. Weeks to months with ill health means tuberculosis, carcinoma, Crohn's disease or lymphoma. Ask it first and say out loud which half of the list you are in.", ref:"Das 35 p.533"},
    {id:"rif10", lv:1, type:"History", q:"What does the pattern of fever tell you?",
     a:"An evening rise of temperature with a right iliac fossa lump and ill health should arouse the suspicion of hyperplastic ileocaecal tuberculosis. Continuous fever with rigors and a tender dull mass suggests an abscess. No fever, with a hard nodular mass in an elderly patient, suggests carcinoma.", ref:"Das 35 p.533 · SRB 16 p.723"},
    {id:"rif11", lv:1, type:"Examination", q:"Which examination is not optional in a lower abdominal mass?",
     a:"SRB: in all lower abdominal masses a per rectal and/or per vaginal examination is a must. It finds a pelvic abscess, a pelvic appendix, an ovarian mass and a rectovesical deposit, none of which can be felt from above.", ref:"SRB 16 p.723"},
    {id:"rif12", lv:1, type:"Examination", q:"What do you do before you examine this patient's abdomen?",
     a:"Hand hygiene, introduce yourself and check the name and date of birth, explain what you are going to do, obtain verbal consent, and make the patient comfortable in ensured privacy. B&L gives the clinical reason it matters here: a tense patient without a relaxed abdominal wall will substantively affect the accuracy of the examination, and where the patient is uncomfortable or reticent the presence of a close family member as a chaperone can help. Examine the tender part last.", ref:"B&L 63 p.1051 · B&L 35 p.472"},
    {id:"rif13", lv:1, type:"Examination", q:"Describe this mass to me.",
     a:"Describe the thing rather than reaching for an adjective: a firm, tender mass in the right iliac fossa, this size, with a fairly well-defined margin but an uneven surface, not moving with respiration, not mobile, resonant where it can be percussed. Note that the books disagree about the surface, SRB calling an appendicular mass smooth with distinct borders and S Das calling it irregular, so report what you actually feel. S Das's caveat is worth saying too: the mass is so tender, and the overlying muscle so rigid, that it may not be easy to feel or to percuss properly at all.", ref:"SRB 16 p.723 · SRB 24 p.937 · Das 35 p.533"},

    {id:"rif20", lv:2, type:"History", q:"The patient has recurrent abdominal pain, diarrhoea, anaemia, weight loss and fatty stools. What is the lesion, and what is the chain?",
     a:"Hyperplastic ileocaecal tuberculosis. B&L gives the mechanism: incomplete ileal obstruction leads to stasis and bacterial overgrowth, which in turn causes steatorrhoea, anaemia and loss of weight. S Das calls the same picture the features of blind loop syndrome. Learn the chain, because it explains three symptoms from one lesion.", ref:"B&L 74 p.1308 · Das 35 p.533"},
    {id:"rif21", lv:2, type:"History", q:"There is occult blood in the stool, anaemia and rapid weight loss in an elderly patient.",
     a:"Carcinoma of the caecum. A right-sided colonic cancer bleeds occultly and presents with anaemia rather than obstruction, because the caecum is capacious and the stool there is liquid, though SRB notes that features of intestinal obstruction may still be present.", ref:"Das 35 p.533 · SRB 16 p.723"},
    {id:"rif22", lv:2, type:"Examination", q:"The patient has a fissure and multiple fistulae around the anus. What does that tell you?",
     a:"Crohn's disease. S Das's discriminator: anal complications such as fissure and multiple fistulae are mainly seen in Crohn's disease, and fistulae may even be seen in the right iliac fossa. B&L's contrast for tuberculosis is that, unlike in Crohn's disease, abscess and fistula formation are uncommon. So a fistula points towards Crohn's and away from tuberculosis, a distinction that is otherwise hard to make, since the two look alike radiologically and histologically.", ref:"Das 35 p.533 · B&L 74 p.1308"},
    {id:"rif23", lv:2, type:"Examination", q:"The caecum is not in the right iliac fossa. What does that mean?",
     a:"Ileocaecal tuberculosis. SRB: the caecum may be pulled up to the lumbar region due to fibrosis. S Das uses it as his key differential from Crohn's: in Crohn's disease the caecum remains in its position and is not elevated as in tuberculosis. The chain to say: tuberculosis fibroses and shortens, which pulls the caecum up; Crohn's inflames and thickens, which leaves it where it is.", ref:"SRB 16 p.723 · Das 35 p.533, p.534"},
    {id:"rif24", lv:2, type:"Diagnosis", q:"A right iliac fossa mass, a flexed hip and a tender spine.",
     a:"A psoas abscess from spinal tuberculosis, tracking down the psoas sheath, and it needs no laparotomy at all. SRB: the abscess is localised, smooth, soft and non-mobile, with psoas spasm, that is flexion of the hip joint, typical. So examine the spine for a gibbus, tenderness, paraspinal spasm and restricted movements.", ref:"SRB 16 p.723"},
    {id:"rif25", lv:2, type:"Pathology", q:"Which patients perforate and wall off badly?",
     a:"B&L: extremes of age, immunosuppression, diabetes mellitus, faecolith obstruction of the lumen, a free-lying pelvic appendix, and previous abdominal surgery, which limits the greater omentum's ability to wall off the spread. SRB's list is almost identical: children, old age, faecolith, laxative abuse, diabetes, immunosuppression and a pelvic appendix. The omental point is the one candidates never give, and it is why previous surgery is a risk factor.", ref:"B&L 76 p.1338 · SRB 24 p.936"},
    {id:"rif26", lv:2, type:"Investigation", q:"What do the blood tests add?",
     a:"Leucocytosis with a polymorphonuclear predominance supports an abscess, and in an appendicular mass the total count is increased. A microcytic anaemia with a hard mass in an older patient points to carcinoma of the caecum, which bleeds occultly. B&L's routine preoperative tests in suspected appendicitis are a full blood count and urinalysis, with pregnancy test, urea and electrolytes and C-reactive protein as selective.", ref:"Das 35 p.533 · SRB 24 p.937 · B&L 76 p.1342"},
    {id:"rif27", lv:2, type:"Investigation", q:"How would you image this mass?",
     a:"Ultrasound first, which confirms the mass and, more usefully, distinguishes a solid mass from a collection, so it decides whether something needs draining. Then contrast-enhanced CT, which B&L makes part of the conservative regime itself and which answers three questions at once: is there a collection to drain, is there a tumour, and are there nodes. In tuberculosis CT also demonstrates the narrowed segment with proximal distension and the associated lymphadenopathy.", ref:"SRB 24 p.937 · B&L 76 p.1343, p.1342 · B&L 74 p.1308"},
    {id:"rif28", lv:2, type:"Investigation", q:"What do the barium findings show in the three chronic causes?",
     a:"S Das's three-way discrimination. Hyperplastic ileocaecal tuberculosis: a long narrow constricted terminal ileum and ascending colon, with the caecum high up, and B&L agrees that a barium follow-through or small bowel enema shows a long narrow filling defect in the terminal ileum, adding candidly that this may result in a differential diagnosis of Crohn's disease. Crohn's disease: a narrow and smooth terminal ileum, the string sign of Kantor, that segment devoid of peristaltic waves, with a normal caecum in the majority. Carcinoma of the caecum: an irregular filling defect in the caecum with a soft tissue shadow showing the extent of the tumour, but an absolutely normal terminal ileum. So tuberculosis and Crohn's both narrow the ileum and the caecum tells them apart, while the cancer spares the ileum entirely.", ref:"Das 35 p.534 · B&L 74 p.1308"},
    {id:"rif29", lv:2, type:"Investigation", q:"What else would you do once the acute episode settles?",
     a:"Colonoscopy, to exclude carcinoma and to biopsy a tuberculous or Crohn's lesion, which SRB lists among the investigations for an abdominal mass; in amoebic typhlitis S Das says the sigmoidoscope is of great help. Image-guided biopsy, ultrasound- or CT-guided, is how a lymphoma or a tuberculous node is diagnosed without a laparotomy. And where everything else fails, diagnostic laparoscopy and then exploratory laparotomy, which S Das still calls the last court of appeal.", ref:"SRB 16 p.723 · Das 35 p.534 · Das 34 p.507"},
    {id:"rif30", lv:2, type:"Treatment", q:"Describe the Ochsner-Sherren regime.",
     a:"Conservative treatment of an appendicular mass, with observation as the active part. SRB: charting of temperature, blood pressure and pulse; marking the mass to identify progression or regression; antibiotics, ampicillin, metronidazole and gentamicin by severity; intravenous fluids; analgesics; and initial nasogastric aspiration. B&L's specifics: mark the limits of the mass on the abdominal wall with a skin pencil, record temperature and pulse four-hourly, keep a fluid balance record, perform a contrast-enhanced CT, start antibiotics, often metronidazole and a third-generation cephalosporin, and drain an abscess radiologically if one is present. All three books name the skin pencil.", ref:"SRB 24 p.937 · B&L 76 p.1343 · Das 35 p.533"},
    {id:"rif31", lv:2, type:"Treatment", q:"Why is an appendicular mass treated conservatively, and how often does it work?",
     a:"B&L: the strategy is based on the premise that the inflammatory process is already localised and that inadvertent surgery is difficult and may be dangerous; it may be impossible to find the appendix and occasionally a faecal fistula may form. SRB puts it as nature having already localised the infection, which if now disturbed will cause a faecal fistula. It works: approximately 90% of cases resolve without incident, with clinical improvement usually evident within 24 to 48 hours, and SRB's figure is a response by 48 to 72 hours with the mass reducing and the temperature and pulse settling.", ref:"B&L 76 p.1343 · SRB 24 p.937"},
    {id:"rif32", lv:2, type:"Treatment", q:"When do you abandon conservative treatment?",
     a:"Give SRB's five, grouped as reasoning: the patient becomes more toxic with tachycardia and high fever; persistent vomiting; increase or spread of the abdominal pain, meaning diffuse peritonitis; the mass enlarges; or it suppurates into an abscess. B&L's summary box prints three of those, a rising pulse rate, increasing or spreading abdominal pain, and increasing size of the mass, and a rising pulse is the single most important early sign in all accounts, so name it first. The two extra items change what you do: suppuration means drainage, preferably radiological, rather than straight to laparotomy, and persistent vomiting flags developing obstruction.", ref:"SRB 24 p.937 · B&L 76 p.1343"},

    {id:"rif40", lv:3, type:"Management", q:"Failure of the mass to resolve. Operate, or think again?",
     a:"Think again. B&L separates two different failures with two different meanings: clinical deterioration or evidence of peritonitis is an indication for early laparotomy, while failure of the mass to resolve should raise suspicion of a carcinoma or Crohn's disease. And it adds the link that makes this urgent in an older patient: obstruction of the appendiceal orifice by tumour, particularly carcinoma of the caecum, is an occasional cause of acute appendicitis in middle-aged and elderly patients, so the appendicitis may be the presenting symptom of the cancer.", ref:"B&L 76 p.1343, p.1337"},
    {id:"rif41", lv:3, type:"Management", q:"Is interval appendicectomy mandatory?",
     a:"The classical teaching is yes: SRB treats the mass with the Ochsner-Sherren regime and does an interval appendicectomy after six weeks, and three months after a drained abscess. B&L has turned the indication upside down. On recurrence it says the need for interval appendicectomy is much debated and that the majority of patients will not develop recurrent appendicitis. On malignancy it says recently published studies have found higher than expected rates of underlying appendiceal neoplasm in those who do go on to interval appendicectomy, particularly over the age of 40, and that a randomised trial was terminated early owing to the unexpected finding of appendiceal tumour during follow-up in 29%, 12 of 41, of patients over 40 who presented with a periappendicular abscess; its general rule is that patients over 40 should be followed up to ensure there is no underlying malignancy. So interval appendicectomy is now justified less to prevent recurrence and more to exclude a tumour: resect or investigate over 40, and discuss rather than mandate it in the young.", ref:"SRB 24 p.936, p.938 · B&L 76 p.1343"},
    {id:"rif42", lv:3, type:"Management", q:"What are the contraindications to conservative treatment, and is it unsafe in children?",
     a:"SRB's four contraindications: when the diagnosis is in doubt; in acute appendicitis in children and the elderly; in burst or gangrenous appendicitis; and when diffuse peritonitis has set in. B&L reports the opposite about children, but it is answering a different question: in children, conservative antibiotic treatment of uncomplicated appendicitis appears safe in the short term with resolution in approximately 90%, re-presentation with complicated appendicitis appears very rare, but recurrent symptoms requiring surgery have been reported in up to 46%, and histological appendicitis is present in only one-fifth of those needing interval surgery. So for an established mass the Ochsner-Sherren regime is standard at any age with the usual stopping criteria, while for acute appendicitis in a child the operation is the answer. SRB's other three contraindications are uncontested, and doubt about the diagnosis is the most important: you cannot watch a mass you have not diagnosed.", ref:"SRB 24 p.937, p.936 · B&L 76 p.1343"},
    {id:"rif43", lv:3, type:"Management", q:"Can acute appendicitis ever be treated without an operation?",
     a:"B&L gives the evidence, and neither Indian text teaches it as an option, so do not lead with it. In uncomplicated appendicitis, meaning no appendicolith, no perforation and no abscess, bowel rest and intravenous antibiotics, often metronidazole and a third-generation cephalosporin, succeed initially in approximately 85%, but between a quarter and a third of patients require surgery within one year for recurrent symptoms. Reassuringly, subsequent surgery tends to be uncomplicated, with a similar overall complication rate and similar length of stay. B&L's verdict is that it appears safe and allows many patients to avoid invasive treatment, but must be balanced against the high treatment failure rate, and should be considered in the well patient with limited signs or the patient at high operative risk, who must be aware of the failure rate.", ref:"B&L 76 p.1342, p.1343"},
    {id:"rif44", lv:3, type:"Treatment", q:"How do you treat an appendicular abscess?",
     a:"Drain it, and preferably radiologically, which is B&L's first choice and avoids a laparotomy in an inflamed field. If it is drained surgically, SRB places a drain through a separate incision, continues antibiotics, and does an interval appendicectomy after three months. SRB's sites for these abscesses are retrocaecal, appendicular, pelvic, subphrenic, lumbar and preileal, with portal pyaemia as well, and the commonest is retrocaecal. A pelvic abscess is drained per rectum, or through posterior colpotomy in a woman, which is one more reason the rectal examination is not optional.", ref:"B&L 76 p.1343 · SRB 24 p.937, p.938"},
    {id:"rif45", lv:3, type:"Treatment", q:"How do you treat ileocaecal tuberculosis?",
     a:"B&L: when the diagnosis is clear and the patient has not yet developed obstructive symptoms, treatment with antituberculous medication is advised and may be curative; for the ulcerative form a course of chemotherapy usually leads to cure provided the pulmonary tuberculosis is adequately treated. Surgery has two indications: where obstruction is present, or where the possibility of Crohn's disease or lymphoma requires clarification, ileocaecal resection is often required. For the ulcerative form, surgery is usually undertaken only in the rare event of perforation or complete intestinal obstruction. So you operate either because the bowel is blocked or because you do not know what the lesion is.", ref:"B&L 74 p.1308"},
    {id:"rif46", lv:3, type:"Pathology", q:"Distinguish the ulcerative from the hyperplastic form of intestinal tuberculosis.",
     a:"B&L: the ulcerative form develops secondary to pulmonary tuberculosis and arises from swallowing tubercle bacilli, presenting with diarrhoea and weight loss, sometimes subacute obstruction, local perforation or fistula. The hyperplastic form is caused by ingestion of Mycobacterium tuberculosis by patients with a high resistance to the organism, and presents with attacks of abdominal pain and intermittent diarrhoea, and patients may present with a mass in the right iliac fossa and vague ill health. The consequence worth saying: the patient with a mass is usually the hyperplastic type and by definition relatively resistant, so the chest may be clear, and a normal chest radiograph does not exclude abdominal tuberculosis.", ref:"B&L 74 p.1308"},
    {id:"rif47", lv:3, type:"Pathology", q:"Why is a tuberculous mass fixed, and how can you sample it?",
     a:"Because it is as much nodal as intestinal: B&L notes early involvement of the regional lymph nodes, which may caseate, and S Das says the nodes become matted along with the involved terminal ileum and caecum to produce the lump. That is why it is fixed, and why an ultrasound- or CT-guided biopsy of the mass or node can give the diagnosis without a laparotomy.", ref:"B&L 74 p.1308 · Das 35 p.533 · SRB 16 p.723"},
    {id:"rif48", lv:3, type:"Treatment", q:"How is carcinoma of the caecum treated, and what must you protect?",
     a:"Right hemicolectomy. B&L on a right-sided lesion presenting acutely: it is usually possible to perform a right hemicolectomy and anastomosis in the usual manner, though if there has been perforation with substantial contamination, or the patient is unstable, it may be advisable to bring out an ileocolostomy rather than anastomose, which is the difference from the left colon. The structures to protect are the important posterior relations of the caecum and ascending colon: the right ureter, the right gonadal vessels and the duodenum. For context, the caecum is about 12% of large bowel cancers and the ascending colon 5%, against rectum 38% and sigmoid 21%.", ref:"B&L 77 p.1363, p.1354, p.1359"},
    {id:"rif49", lv:3, type:"Diagnosis", q:"A patient with dysentery, pain over both the caecum and the sigmoid, and diarrhoea.",
     a:"Amoebic colitis rather than a mass: S Das's amoebic typhlitis, which he says hardly produces a lump, so pain in two places argues against a single localised mass. His warning is the Indian caution the British text does not make: one must be very careful to exclude this condition before doing an appendicectomy. Where there is a mass and a history of dysentery, the diagnosis is an amoeboma, which is hard, well-defined and non-mobile.", ref:"Das 35 p.534 · SRB 16 p.723"},
    {id:"rif50", lv:3, type:"Examination", q:"There is free fluid as well. How do you demonstrate it and what does it mean?",
     a:"Peritoneal tuberculosis and peritoneal carcinomatosis both cause ascites. SRB describes the puddle sign in the knee-elbow position for minimal ascites, and the Blaxland ruler test for separating an ovarian cyst from ascites: a flat ruler pressed firmly backwards on the lower abdomen just above the anterosuperior iliac spines transmits aortic pulsation to the fingers in an ovarian cyst but not in ascites.", ref:"SRB 16 p.723"},
    {id:"rif51", lv:3, type:"Examination", q:"What would you examine outside the abdomen, and why?",
     a:"The lymph nodes and the liver, for lymphoma and for secondaries from a caecal carcinoma: a hard nodular liver with a right iliac fossa mass settles both the diagnosis and the prognosis in one examination. The chest, for pulmonary tuberculosis, remembering that a clear chest does not exclude the hyperplastic abdominal form. The spine and hip, for a psoas abscess. The perineum, for the fistulae of Crohn's disease. And in a woman the menstrual and obstetric history with a pregnancy test, since a third of SRB's differential is gynaecological.", ref:"SRB 16 p.723 · B&L 74 p.1308 · B&L 76 p.1342 · Das 35 p.533"},
  ],

  "obstructive-jaundice": [
    {id:"obj01", lv:1, type:"Pathology", q:"Define obstructive jaundice, and give the bilirubin figures.",
     a:"Jaundice developing due to biliary obstruction, partial, complete or intermittent, causing a conjugated hyperbilirubinaemia; also called surgical jaundice, and it may be intrahepatic or extrahepatic, leading to cholestasis, which means impaired bile flow and impaired bile formation. Normal serum bilirubin is 0.2 to 0.8 mg%, and scleral icterus becomes visible above 2.5 mg%.", ref:"SRB 12 p.646, p.647"},
    {id:"obj02", lv:1, type:"Classification", q:"Classify the causes of obstructive jaundice.",
     a:"SRB's anatomical version is the one to use: extrahepatic obstruction is luminal, that is stones and infestations, ascariasis, Clonorchis sinensis, schistosomiasis; mural, that is a growth, a stricture from inflammation, surgery or radiotherapy, and primary sclerosing cholangitis; or external compression, from pancreatitis, a pancreatic tumour or a nodal mass. Intrahepatic cholestasis occurs at the hepatocyte or the biliary canalicular membrane: viral hepatitis, drug-induced cholestasis such as thiazides and chlorpromazine, and biliary cirrhosis. Say luminal, mural, extrinsic for any obstruction anywhere and you will not leave a cause out.", ref:"SRB 12 p.647"},
    {id:"obj03", lv:1, type:"Pathology", q:"Why does this patient bleed?",
     a:"Because bile acid secretion into the gut is impaired, so fat and the fat-soluble vitamins are not absorbed, so synthesis of the vitamin K-dependent clotting factors, II, VII, IX and X, falls and the prothrombin time and INR rise; PT measures the extrinsic pathway and partial thromboplastin time the intrinsic. Check the prothrombin time and correct it with vitamin K or fresh-frozen plasma, and do that before ERCP as well as before surgery.", ref:"SRB 12 p.647 · B&L 72 p.1283"},
    {id:"obj04", lv:1, type:"Pathology", q:"Why are the stools pale and the urine dark?",
     a:"SRB: the lack of bilirubin in the intestinal tract is responsible for the pale stools in biliary obstruction, and conjugated bilirubin is water soluble, so it spills into the urine instead. Add steatorrhoea, bulky fatty stools, because the absence of bile impairs fat absorption.", ref:"SRB 12 p.647, p.648"},
    {id:"obj05", lv:1, type:"Examination", q:"State Courvoisier's law.",
     a:"In a jaundiced patient a palpably distended gallbladder is unlikely to be due to a stone, because a stone-bearing gallbladder is chronically inflamed, thickened, fibrotic, contracted and cannot distend. The obstruction is therefore usually below the cystic duct in a previously normal gallbladder, most often a periampullary or pancreatic head carcinoma. That version is true to the 1890 observation, gives the mechanism, and reaches the useful conclusion without over-claiming.", ref:"SRB 12 p.646 · Das 34 p.492 · B&L 71 p.1244"},
    {id:"obj06", lv:1, type:"Examination", q:"Describe the gallbladder you can feel in a malignant obstruction.",
     a:"SRB's description: palpable to the right of the rectus in the right hypochondrium, non-tender, globular, smooth, soft, dull on percussion, moving with respiration, and with horizontal mobility. The horizontal mobility and the movement with respiration are what separate it from a renal or a hepatic mass.", ref:"SRB 12 p.646"},
    {id:"obj07", lv:1, type:"History", q:"What is the most discriminating question in the history?",
     a:"Has the jaundice ever got better on its own, or has it only deepened? S Das: painful, intermittent jaundice is very much characteristic of a stone in the common bile duct, whereas painless and progressively deepening jaundice is a feature of carcinoma of the head of the pancreas. SRB gives the mechanism for the intermittency: the stone moves proximally and floats, the obstruction is relieved and the symptoms subside. Benjamin's classification turns the same distinction into types, intermittent obstruction for a stone or a periampullary tumour against complete obstruction for a pancreatic tumour.", ref:"Das 34 p.484 · SRB 12 p.643, p.648"},
    {id:"obj08", lv:1, type:"History", q:"What does pain add?",
     a:"Painless progressive jaundice is the classical presentation of carcinoma of the head of the pancreas: B&L says jaundice draws attention to ampullary and pancreatic head tumours, characteristically painless but sometimes with nausea and epigastric discomfort, with pruritus and dark urine. Colicky right hypochondrial pain with jaundice points to a stone, and SRB's rule is that recurrence of biliary colic after cholecystectomy should make you think of choledocholithiasis. Back pain is the worrying symptom, raising the possibility of retroperitoneal infiltration.", ref:"B&L 72 p.1282, p.1283 · SRB 12 p.647"},
    {id:"obj09", lv:1, type:"Diagnosis", q:"Fever with chills and rigors in a jaundiced patient. What is it?",
     a:"Cholangitis, and it converts the case into an emergency. B&L: symptomatic patients with cholangitis have bouts of pain, jaundice and fever, Charcot's triad. SRB's chain: bile flow stasis, then colonisation and multiplication of organisms, then increased intraductal pressure, then reflux of biliary contents, then bacteraemia, septicaemia and septic shock. Bile is normally sterile, and in symptomatic gallstone disease the commonest organisms are E. coli and Klebsiella.", ref:"B&L 71 p.1253 · SRB 12 p.647, p.625"},
    {id:"obj10", lv:1, type:"Examination", q:"What do you look for on general examination?",
     a:"The depth and character of the jaundice in daylight, a deep greenish-yellow tinge suggesting long-standing obstruction. Scratch marks over the back and forearms, where SRB says the pruritus is worst. Bruising, petechiae and bleeding gums, the clinical face of a prolonged prothrombin time. Xanthomas, cutaneous cholesterol deposits in persistent cholestasis. Nutrition and hydration, since dehydration is common in obstructive jaundice. And the signs of chronic liver disease, spider naevi, palmar erythema, gynaecomastia, testicular atrophy, caput medusae, splenomegaly and asterixis, whose presence shifts you towards hepatocellular disease, which is not a surgical jaundice.", ref:"SRB 12 p.646, p.647, p.648 · SRB 14 p.698"},
    {id:"obj11", lv:1, type:"Investigation", q:"What is the first line of investigation?",
     a:"B&L's sequence, in three sentences: in a jaundiced patient the usual blood tests and an ultrasound scan should be performed; ultrasonography will determine if the bile duct is dilated; if it is, and there is genuine suspicion of a tumour in the head of the pancreas, the preferred test is a contrast-enhanced CT scan, which in the majority of instances should establish whether there is a pancreatic tumour and whether it is resectable. Bloods, then ultrasound, then cross-sectional imaging. The ultrasound itself identifies intra- and extrahepatic biliary dilatation, the level of the obstruction, and stones within the extrahepatic biliary tree: it answers the first question, is this obstruction, and begins to answer the second, where.", ref:"B&L 72 p.1283 · B&L 71 p.1235"},
    {id:"obj13", lv:1, type:"Examination", q:"What do you do before you examine this patient's abdomen?",
     a:"Hand hygiene, introduce yourself and check the name and date of birth, explain what you are going to do, obtain verbal consent, and ensure privacy. B&L's reason it matters: a tense patient without a relaxed abdominal wall will substantively affect the accuracy of the clinical examination, and where a patient is uncomfortable or reticent the presence of a close family member as a chaperone can help.", ref:"B&L 63 p.1051 · B&L 35 p.472"},

    {id:"obj20", lv:2, type:"Examination", q:"Give the exceptions to Courvoisier's law.",
     a:"The one both Indian books agree on first: double impaction, a stone in the cystic duct and another in the common bile duct, producing a mucocele with jaundice. SRB also lists a large stone in Hartmann's pouch, and empyema of the gallbladder with a CBD stone. S Das also lists Oriental cholangiohepatitis, and a pancreatic calculus obstructing the ampulla of Vater, plus mucocele from a cystic duct stone. B&L gives no exceptions at all, so attribute the lists to the book you are quoting.", ref:"SRB 12 p.646 · Das 34 p.491"},
    {id:"obj21", lv:2, type:"Examination", q:"What do you feel for in the abdomen, and in what order?",
     a:"The gallbladder first, below the right costal margin lateral to the rectus edge. Then the liver, which is enlarged and smooth in obstruction from bile stasis, and hard and nodular when there are secondaries. Then a mass, with S Das's caveat attached: in carcinoma of the head of the pancreas the tumour is seldom palpable, so the absence of a mass tells you nothing. Then ascites, which in carcinoma of the head of the pancreas is present only in late cases. Then the signs of incurability, which B&L says to seek with care: a palpable mass, ascites, supraclavicular nodes and tumour deposits in the pelvis, which when present indicate a grim prognosis.", ref:"SRB 12 p.646, p.647 · Das 34 p.511 · B&L 72 p.1283"},
    {id:"obj22", lv:2, type:"Examination", q:"The patient sits up all night with his arms folded. What does that tell you?",
     a:"It is the posture of pancreatic pain. S Das describes the pain of carcinoma of the body and tail passing through to the back, aggravated on lying down and relieved on sitting up, so the patient spends the night sitting with his arms folded across his chest. B&L's equivalent warning is that back pain raises the possibility of retroperitoneal infiltration. It is a sign you can see from the door.", ref:"Das 34 p.511 · B&L 72 p.1283"},
    {id:"obj23", lv:2, type:"Investigation", q:"Which blood tests, and what is the cholestatic pattern?",
     a:"A conjugated hyperbilirubinaemia with a disproportionately raised alkaline phosphatase and gamma-GT; B&L lists exactly elevated bilirubin, ALP and GGT as the biochemical findings in cholangiocarcinoma. Then the prothrombin time and INR, which must not wait. Renal function, because hepatorenal syndrome and renal failure are listed consequences and because dehydration is common. And CA19-9, which B&L says is not highly specific or sensitive, but a baseline level should be established, because if it is initially raised it can be useful later in identifying recurrence: a follow-up marker, not a diagnostic test.", ref:"B&L 71 p.1256 · B&L 72 p.1283 · SRB 12 p.646, p.647"},
    {id:"obj24", lv:2, type:"Investigation", q:"There is no urobilinogen in the urine. What does that mean?",
     a:"SRB: bilirubin secreted in bile is converted by gut bacteria to urobilinogen, most of which is reabsorbed and recirculated with a fraction excreted in urine, so absence of urobilinogen in the urine signifies obstructive jaundice. Neither B&L's biliary chapter nor S Das mentions urobilinogen, so attribute it to SRB, and remember that in a partial or intermittent obstruction urobilinogen will still be present.", ref:"SRB 12 p.624, p.625"},
    {id:"obj25", lv:2, type:"Investigation", q:"What does MRCP add, and what does CT add?",
     a:"B&L's own summary of what each modality contributes: ultrasound for stones and biliary dilatation; MRCP for anatomy and stones; CT for anatomy and for liver, biliary and pancreatic cancer. MRCP is a non-invasive modality that provides excellent images of the gallbladder and ducts, with results comparable to ERCP or percutaneous transhepatic cholangiography. Contrast-enhanced CT is the preferred test once ultrasound shows a dilated duct and a pancreatic head tumour is suspected, and SRB's equivalent is that spiral or three-dimensional CT is ideal, to detect operability, portal vein invasion, size and extent.", ref:"B&L 71 p.1236, p.1238 · B&L 72 p.1283 · SRB 14 p.699"},
    {id:"obj26", lv:2, type:"Investigation", q:"Is ERCP an investigation?",
     a:"Not any more, in B&L's account: this technique is now used only as a therapeutic modality in patients with obstructive jaundice, and ultrasound and MRCP have taken over the diagnostic aspect. Its indications in a jaundiced patient are therapeutic or problem-solving: cholangitis, diagnostic doubt after non-invasive imaging, or a likely delay between diagnosis and surgery in a deeply jaundiced patient with distressing pruritus. SRB still describes it within the investigative armoury, together with its interventional uses, sphincterotomy, stone extraction with a Dormia basket, stenting and stricture dilatation. The resolution is about sequence: diagnose with ultrasound, MRCP and CT, and use ERCP when you intend to do something at the same sitting. Correct the prothrombin time before ERCP, not just before the operation, and give antibiotic cover, because ERCP carries the risks of pancreatitis, bleeding, perforation and cholangitis.", ref:"B&L 71 p.1237 · B&L 72 p.1283 · SRB 12 p.623 · SRB 14 p.690"},
    {id:"obj27", lv:2, type:"Investigation", q:"When is endoscopic ultrasound better?",
     a:"B&L's four situations: when CT fails to demonstrate a tumour; when a tissue diagnosis is needed before surgery, for instance to distinguish inflammation from neoplasia in a mass arising on chronic pancreatitis; when vascular invasion must be confirmed; and to separate cystic tumours from pseudocysts. And the reason to prefer its biopsy route: transduodenal or transgastric fine-needle or Trucut biopsy under endoscopic ultrasound guidance avoids spillage of tumour cells into the peritoneal cavity.", ref:"B&L 72 p.1283"},
    {id:"obj28", lv:2, type:"Investigation", q:"What is the double duct sign?",
     a:"Concurrent narrowing of both the bile duct and the main pancreatic duct, which is the cholangiographic signature of a tumour at the head of the pancreas.", ref:"B&L 72 p.1265"},
    {id:"obj29", lv:2, type:"Treatment", q:"What do you do before any intervention in a jaundiced patient?",
     a:"Correct the coagulopathy with vitamin K or fresh-frozen plasma, guided by the prothrombin time, before any intervention including ERCP. Rehydrate, because SRB says dehydration is common in obstructive jaundice and the inadequate hepatic glycogen reserve should be replenished with preoperative glucose, orally or intravenously. Antibiotics from the day before surgery, cephalosporins or aminoglycosides. Total parenteral nutrition, often needed preoperatively and continued afterwards, with pulmonary function assessment and respiratory physiotherapy. And SRB's specific negative: preoperative albumin therapy is usually not done.", ref:"B&L 72 p.1283 · SRB 14 p.698, p.699"},
    {id:"obj30", lv:2, type:"Treatment", q:"The cause is a stone in the common bile duct. What do you do?",
     a:"Endoscopic clearance then cholecystectomy: ERCP with sphincterotomy and stone extraction using a Dormia basket, with stenting if there is a stricture. In gallstone pancreatitis SRB favours early endoscopic intervention within 48 hours and then laparoscopic cholecystectomy within two weeks of the acute attack, during the same admission.", ref:"SRB 14 p.690, p.681"},
    {id:"obj31", lv:2, type:"History", q:"What in the past history would make you doubt a surgical jaundice?",
     a:"A blood transfusion, injections, alcohol or hepatotoxic drugs, or a family history of liver disease, because intrahepatic cholestasis from viral hepatitis or from drugs such as thiazides and chlorpromazine produces the same conjugated picture and must not be operated on. Conversely, previous biliary or gastric surgery makes an iatrogenic stricture or a retained stone the diagnosis until proved otherwise, and B&L lists a biliary-enteric anastomosis among the risk factors for cholangiocarcinoma.", ref:"SRB 12 p.647, p.648 · B&L 71 p.1256"},
    {id:"obj32", lv:2, type:"History", q:"Which causes would you ask about that a British textbook barely covers?",
     a:"The parasitic ones. SRB's luminal causes include ascariasis, Clonorchis sinensis and schistosomiasis, and its figure of the causes of obstructive jaundice shows a roundworm in the common bile duct. They matter twice over, because B&L's risk factors for cholangiocarcinoma include Opisthorchis viverrini and C. sinensis, and Oriental cholangiohepatitis among the chronic inflammatory conditions, while S Das lists Oriental cholangiohepatitis as an exception to Courvoisier's law.", ref:"SRB 12 p.647 · B&L 71 p.1256 · Das 34 p.491"},

    {id:"obj40", lv:3, type:"Examination", q:"Did Courvoisier mention cancer?",
     a:"B&L answers this twice and differently. Chapter 71's eponym footnote says he made his observation in 1890 and that no mention was made of either gallbladder tenderness or malignancy. Chapter 72 says he first drew attention to the association of an enlarged gallbladder and a pancreatic tumour in 1890, and quotes him using the word neoplasm. SRB prints his original words, which contrast obstruction by a stone with obstruction from other causes and do not name cancer. The safe answer: his observation contrasted stone with non-stone obstruction, and the association with malignancy is the inference the profession drew from it.", ref:"B&L 71 p.1244 · B&L 72 p.1283 · SRB 12 p.631"},
    {id:"obj41", lv:3, type:"Diagnosis", q:"Your patient has a hilar cholangiocarcinoma. Will Courvoisier's sign be positive?",
     a:"No. B&L: in cholangiocarcinoma the gallbladder is palpable if the obstruction is in the distal common bile duct. A hilar, Klatskin, tumour obstructs above the cystic duct, so the gallbladder is collapsed and the sign is negative. It is the one situation in which a negative Courvoisier actively localises the lesion for you.", ref:"B&L 71 p.1256"},
    {id:"obj42", lv:3, type:"Classification", q:"Classify biliary obstruction by Benjamin's classification.",
     a:"SRB's version of Benjamin's 1983 classification. Type 1, complete obstruction: pancreatic tumours, cholangiocarcinoma, iatrogenic CBD ligation, primary or secondary liver tumours. Type 2, intermittent obstruction: choledocholithiasis, periampullary tumour, choledochal cyst, bile duct papilloma, haemobilia, duodenal diverticula. Type 3, chronic incomplete obstruction: bile duct stricture, congenital, traumatic or post-radiotherapy, chronic pancreatitis, cystic fibrosis. Type 4, segmental obstruction: traumatic, sclerosing cholangitis, cholangiocarcinoma, intrahepatic biliary stones. B&L carries no equivalent classification, so do not attribute it to it. Its real value is clinical: it separates intermittent obstruction, where a stone or a periampullary tumour lets bile through between episodes, from the complete obstruction of pancreatic cancer.", ref:"SRB 12 p.648 · B&L 71 p.1235"},
    {id:"obj43", lv:3, type:"Diagnosis", q:"Your patient with cholangitis is now hypotensive and confused. What does that mean, and what do you do?",
     a:"Charcot's triad with hypotension and altered mental state added, and it belongs to acute obstructive, that is suppurative, cholangitis, which SRB puts at 5%. The clinical content is the escalation: the triad is a diagnosis, the pentad is an indication for urgent decompression rather than for more imaging. B&L carries Charcot's triad but Reynolds' pentad does not appear in its biliary chapter; where it uses a formal severity framework it is the Tokyo Consensus Guidelines, which it prints as the diagnostic criteria for acute cholecystitis. So attribute the pentad to SRB.", ref:"SRB 12 p.643, p.648 · B&L 71 p.1253, p.1244"},
    {id:"obj44", lv:3, type:"Pathology", q:"How urgently must the obstruction be relieved, and what happens if it is not?",
     a:"SRB: severe biliary obstruction causes cell damage usually within one month and, if unrelieved, may lead to secondary biliary cirrhosis. The liver becomes enlarged, green and bile-stained, which SRB calls hydrohepatosis, with dilated intrahepatic biliary radicles, and once intraductal pressure rises bile secretion falls and white bile forms in the common duct. The systemic consequences to name are an altered coagulation profile, hepatorenal syndrome and renal failure, and sepsis.", ref:"SRB 12 p.647"},
    {id:"obj45", lv:3, type:"Treatment", q:"Should you stent a resectable tumour before operating?",
     a:"Not routinely, and the two pieces of advice in B&L apply to different operations. For pancreatic head cancer: preoperative ERCP and biliary stenting is not routine in patients with resectable disease, as it is associated with a higher incidence of infective complications after surgery; the exceptions are cholangitis, diagnostic doubt, or a delay before surgery in a deeply jaundiced patient with distressing pruritus, and if a stent is placed in a patient who may undergo resection, use a plastic stent or a covered metal stent because these can easily be removed during surgery. For a hilar tumour needing anticipated major liver resection, preoperative biliary drainage is needed, because hyperbilirubinaemia with a bilirubin above 6 mg/dL may impair hepatic regeneration. The principle: drain beforehand when the liver has something difficult to do afterwards, such as regenerate, or when the patient cannot safely wait.", ref:"B&L 72 p.1283 · B&L 71 p.1256"},
    {id:"obj46", lv:3, type:"Management", q:"How many pancreatic head cancers can be resected?",
