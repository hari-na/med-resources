     a:"Give the mechanism, not a slogan. SRB: reperfusion injury occurs after re-establishment of arterial flow to an ischaemic tissue bed and leads to further tissue death with peripheral muscle infarction, due to sudden release of oxygen free radicals which block the microcirculation, with release of high levels of potassium and myoglobin, so the patient becomes haemodynamically unstable with lactic acidosis, interstitial oedema and cardiac dysfunction, and it is often life-threatening. The eponym is Haimovici's triad of revascularisation injury, 1960: muscle infarction, myoglobinuria and acute renal failure. SRB also names the no-reflow phenomenon, poor peripheral tissue perfusion from severe capillary oedema despite major vessel revascularisation. That is why a class III limb is an amputation rather than a revascularisation.", ref:"SRB 1 p.186"},
    {id:"pvd49", lv:3, type:"Examination", q:"Which two bedside findings tell you the limb is already dead?",
     a:"Fixed mottling and a stiff muscle, and both are findings of your thumb. B&L gives the skin sequence: the skin is initially cold and pale, but as time progresses it slowly becomes mottled, first non-fixed, blanching to pressure, and then fixed, non-blanching, indicating skin death. SRB gives the muscle sign: muscle which is normally soft on palpation will feel doughy initially but later becomes stiff, and once stiffness of muscle is found the benefit of embolectomy is bleak. B&L adds that manual compression of affected muscle groups may cause pain owing to ischaemia-induced injury, that is rhabdomyolysis.", ref:"B&L 61 p.1011 · SRB 1 p.184"},
    {id:"pvd50", lv:3, type:"Investigation", q:"What investigations does acute limb ischaemia need besides imaging the artery?",
     a:"Three of the four are blood tests. B&L: ECG to assess for myocardial infarction and atrial fibrillation; creatine kinase to assess for rhabdomyolysis; renal function, as rhabdomyolysis may lead to myoglobinuria and acute kidney injury; and imaging of the limb's arterial tree, duplex or CT angiography, if readily available and not likely to unnecessarily delay emergency treatment when indicated, for example in a Rutherford class IIb limb. SRB adds emergency Doppler, angiogram, which it calls the gold standard in all acute limb ischaemia because it differentiates embolism from thrombosis, echocardiography and clotting studies.", ref:"B&L 61 p.1012 · SRB 1 p.185"},
    {id:"pvd51", lv:3, type:"Investigation", q:"The ABPI is 1.6. What does that mean?",
     a:"That it is artificially high and cannot be used. Values above 1.4 are caused by media sclerosis and calcification of the arterial wall making the vessel incompressible, which is the pattern seen in diabetes and renal failure. In that situation rely on the waveform, the toe pressure, where an absolute hallux pressure under 50 mmHg indicates severe ischaemia, and imaging.", ref:"B&L 61 p.1001"},
    {id:"pvd52", lv:3, type:"Pathology", q:"Why does sensation go before movement in acute ischaemia?",
     a:"SRB gives the order of tissue death: distal ischaemia begins immediately after acute obstruction, the most sensitive peripheral nerves are involved first, and then muscles, subcutaneous tissue and skin are affected in order. That is exactly how Rutherford's classes are built: sensory loss confined to the toes is IIa, sensory loss beyond the toes with a motor deficit is IIb, and a paralysed insensate limb is III.", ref:"SRB 1 p.183 · B&L 61 p.1012"},
    {id:"pvd53", lv:3, type:"Examination", q:"The case is an upper limb one. Which test do you add?",
     a:"Adson's test, the scalene manoeuvre, for thoracic outlet obstruction: with the patient sitting, feel the radial pulse and ask the patient to take a deep breath and turn the head, which tightens the scalenes adequately so the pulse disappears, unmasking the arterial obstruction.", ref:"SRB 1 p.166"},
  ],

  "gastric-outlet-obstruction": [
    {id:"goo01", lv:1, type:"Diagnosis", q:"Give the causes of gastric outlet obstruction.",
     a:"B&L: the two common causes are gastric cancer and pyloric stenosis secondary to peptic ulceration. SRB's fuller list: congenital; chronic duodenal ulcer, fibrosed or cicatrised; carcinoma of the pylorus; adult pyloric stenosis, which is treated by pyloroplasty and not by pyloromyotomy; and a pyloric mucosal diaphragm, which must be excised surgically or endoscopically.", ref:"B&L 67 p.1168 · SRB 20 p.819"},
    {id:"goo02", lv:1, type:"Examination", q:"Give the triad that makes the diagnosis at the bedside.",
     a:"SRB: visible gastric peristalsis positive, auscultopercussion test positive, succussion splash positive, with the mnemonic stomach we see, stomach we feel, stomach we hear. B&L's entire physical examination of the condition is one sentence: the distended stomach may be visible and a succussion splash may be audible.", ref:"SRB 20 p.818, p.840 · B&L 67 p.1168"},
    {id:"goo03", lv:1, type:"Pathology", q:"Describe the vomiting.",
     a:"Three features to name: large volume, no bile, and old food. B&L: the vomitus is characteristically of undigested food and totally lacking in bile. SRB: large quantity, foul smelling and frothy, containing food consumed on the previous day, partially digested or undigested. S Das: large in amount, characteristically in the evening, often foul and frothy, containing undigested food eaten even two or three days earlier. The absence of bile localises the obstruction at or proximal to the pylorus, which is the whole point of asking.", ref:"B&L 67 p.1168 · SRB 20 p.818 · Das 34 p.508"},
    {id:"goo04", lv:1, type:"Pathology", q:"What is the metabolic abnormality, and in what order does it develop?",
     a:"Vomiting hydrochloric acid produces a hypochloraemic alkalosis. Initially sodium and potassium may be relatively normal, and at this stage the urine has a low chloride and high bicarbonate content, reflecting the primary abnormality. As dehydration progresses, more profound abnormalities appear, partly from renal dysfunction, and the patient becomes progressively hyponatraemic. Because of the dehydration, sodium is retained and potassium and hydrogen ions are excreted in its place, so the urine becomes paradoxically acidic and hypokalaemia ensues. The alkalosis lowers the circulating ionised calcium, and tetany can occur.", ref:"B&L 67 p.1169"},
    {id:"goo05", lv:1, type:"Pathology", q:"Why does the urine turn acid while the blood is alkaline?",
     a:"SRB's sentence is the cleanest explanation in the three books: in alkalosis without hyponatraemia the kidney excretes bicarbonate along with sodium, but here, because the body must conserve sodium, bicarbonate is excreted with hydrogen ion instead, so the urine turns acid. SRB calls the resulting tetany gastric tetany.", ref:"SRB 20 p.820"},
    {id:"goo06", lv:1, type:"Examination", q:"How do you look for visible gastric peristalsis?",
     a:"Look across the epigastrium in tangential light, and wait, because peristalsis comes in waves. SRB: it may be elicited by asking the patient to drink a cup of water. S Das is explicit about its value and its direction: visible peristalsis passing from left to right is pathognomonic, and if there is any history suggesting pyloric stenosis one should look for visible peristalsis. The word peristalsis does not appear in B&L's chapter at all, so this sign lives in the Indian texts.", ref:"Das 34 p.508, p.489 · SRB 20 p.818 · B&L 67 p.1168"},
    {id:"goo07", lv:1, type:"Examination", q:"How do you test for a succussion splash?",
     a:"Place the stethoscope over the epigastrium and shake the patient adequately by the shoulders or hips, listening for a splash of fluid in a stomach that should be empty. The precondition is the whole test: SRB says four hours of empty stomach in its pyloric stenosis section and four to six hours in its gastric cancer section, so say at least four hours and preferably six, because the longer the fast the more specific the sign. Note that it is not specific to obstruction: SRB lists a positive succussion splash in acute gastric dilatation too.", ref:"SRB 20 p.818, p.840, p.833 · Das 34 p.508 · B&L 67 p.1168"},
    {id:"goo08", lv:1, type:"Examination", q:"Describe the auscultopercussion test.",
     a:"Place a stethoscope over the epigastrium, scratch the skin with a finger from the left side downwards at several points away from the epigastrium, and join the points at which the sound changes. Normally the greater curvature lies above the level of the umbilicus, midway between umbilicus and epigastrium; in gastric outlet obstruction it lies below the umbilicus. SRB's barium equivalent is more extreme: the greater curvature below the level of the iliac crest.", ref:"SRB 20 p.818, p.819"},
    {id:"goo09", lv:1, type:"Examination", q:"What single palpable finding changes your diagnosis?",
     a:"A mass. SRB: in pyloric stenosis due to chronic duodenal ulcer a mass is never palpable, while in carcinoma of the pylorus a mass may be palpable. It is the most useful discriminating sign at the bedside, which is why you palpate carefully with the stomach emptied.", ref:"SRB 20 p.819"},
    {id:"goo10", lv:1, type:"Management", q:"What is the order of treatment?",
     a:"B&L states it in one sentence: treating the patient involves correcting the metabolic abnormalities and dealing with the mechanical obstruction, in that order. Nobody with a hypochloraemic alkalosis and a potassium of 2.5 should be anaesthetised, and saying so unprompted is worth more than any operative detail in this case.", ref:"B&L 67 p.1169"},
    {id:"goo11", lv:1, type:"Treatment", q:"Which fluid would you resuscitate with, and why that one?",
     a:"Isotonic saline with potassium supplementation, and B&L gives the reason, which is the examinable part: replacing the sodium chloride and water allows the kidney to correct the acid-base abnormality. So you do not give bicarbonate and you do not give acid; you give the kidney back the chloride and the volume it needs to excrete bicarbonate itself.", ref:"B&L 67 p.1169"},
    {id:"goo12", lv:1, type:"Investigation", q:"What is the decisive investigation?",
     a:"Upper gastrointestinal endoscopy with biopsy. B&L uses the word essential twice: endoscopic biopsy is essential to exclude malignancy, and biopsy of the area around the pylorus is essential. SRB's version is gastroscopy to rule out carcinoma of the stomach and to visualise the stenosed area.", ref:"B&L 67 p.1169 · SRB 20 p.819"},
    {id:"goo13", lv:1, type:"Examination", q:"What do you do before you examine this patient's abdomen?",
     a:"Hand hygiene, introduce yourself and check the name and date of birth, explain what you are going to do, obtain verbal consent, and ensure privacy, because B&L notes that a tense patient without a relaxed abdominal wall will substantively affect the accuracy of the clinical examination.", ref:"B&L 63 p.1051 · B&L 35 p.472"},

    {id:"goo20", lv:2, type:"Diagnosis", q:"Is this benign or malignant until proved otherwise?",
     a:"B&L reverses the classical presumption: with the decreasing incidence of peptic ulceration, gastric outlet obstruction should be considered malignant until proven otherwise, and endoscopic biopsy is essential. Both positions are right about different populations, since B&L's premise is a falling ulcer incidence in high-income countries while peptic ulcer disease remains common in India, which is why SRB gives benign pyloric stenosis its own chapter. So give the classical cause and then take B&L's position on management: manage every gastric outlet obstruction as malignant until biopsy of the pyloric region proves otherwise, because a missed cancer costs the patient far more than an unnecessary biopsy.", ref:"B&L 67 p.1168, p.1169 · SRB 20 p.818 · Das 34 p.508"},
    {id:"goo21", lv:2, type:"Pathology", q:"Why is the alkalosis less marked when the cause is cancer?",
     a:"Because the stomach is not making as much acid to lose. B&L: in cancer the metabolic consequences may be somewhat different from those of benign pyloric stenosis because of the relative hypochlorhydria found in patients with gastric cancer, and the alkalosis is usually less pronounced than when duodenal ulceration leads to obstruction; its summary box goes further, that the hypochloraemic alkalosis is usually only seen with peptic ulcer disease. SRB agrees that metabolic changes are not severe in carcinoma of the pylorus because there is often hypochlorhydria or achlorhydria. So a florid hypochloraemic alkalosis points to a benign cause, and its absence does not reassure you: it points towards cancer.", ref:"B&L 67 p.1168, p.1169, p.1170 · SRB 20 p.820"},
    {id:"goo22", lv:2, type:"History", q:"What in the ulcer history makes a benign cause plausible?",
     a:"Years of typical pain, because benign gastric outlet obstruction requires a long history of peptic ulcer disease. S Das localises both ulcers: duodenal, on the transpyloric plane about an inch and a half to the right of the midline, the duodenal point, about a hand's breadth below the xiphisternal joint; gastric, deep tenderness in the mid-epigastric region, elicitable with remarkable constancy. And the food relation separates them: duodenal pain appears two and a half to four hours after a meal, when the stomach is empty, so it is hunger pain relieved by food, while gastric ulcer pain comes immediately after food with clock-like regularity and is relieved when the stomach empties, by alkali, or by vomiting which is often self-induced.", ref:"B&L 67 p.1168 · Das 34 p.483, p.507"},
    {id:"goo23", lv:2, type:"History", q:"The pain has lost its periodicity. What does that mean?",
     a:"Three possibilities, and name all three. S Das's warning about gastric ulcer: if the patient loses the periodicity of pain one may suspect superimposition of carcinoma, or penetration into the pancreas, or pyloric obstruction. Normally peptic ulcer has a definite periodicity lasting several weeks followed by an interval of freedom, with attacks in spring and autumn, and SRB lists loss of periodicity as a clinical feature of pyloric stenosis. In appendicular dyspepsia and gallbladder disease that definite periodicity is not found; instead a mild pain continues through the quiet periods.", ref:"Das 34 p.483, p.482, p.508 · SRB 20 p.818"},
    {id:"goo24", lv:2, type:"History", q:"Does the vomiting relieve the pain?",
     a:"It should. S Das: vomiting always relieves the pain of peptic ulcer. In carcinoma of the stomach the late symptom is vomiting which gives no relief to the pain, with constant epigastric pain neither caused by nor relieved by food. So does it help is a one-question screen for malignancy, and almost nobody asks it.", ref:"Das 34 p.483, p.508"},
    {id:"goo25", lv:2, type:"History", q:"He has lost weight. Does that mean cancer?",
     a:"No. Weight loss is a feature of benign gastric outlet obstruction too, and the patient appears unwell and dehydrated. What discriminates is the sequence: in benign disease, years of typical ulcer pain, then obstruction, then weight loss; in cancer, early satiety, bloating, distension and vomiting on a short history with profound weight loss, and S Das notes of the insidious type that the history is usually short. His caution about age: carcinoma of the stomach is a disease of the elderly, but if suspected in the young it should not be turned down on the point of age only.", ref:"B&L 67 p.1168, p.1170 · SRB 20 p.818 · Das 34 p.508"},
    {id:"goo26", lv:2, type:"Examination", q:"What do you look for on general examination?",
     a:"Dehydration, because the fluid deficit is what you treat first. Confusion, irritability and even convulsions, which SRB attributes to the alkalosis and electrolyte changes, with features of alkalosis such as rapid Cheyne-Stokes breathing and tetany; a confused vomiting patient is not septic until proved otherwise, so check the calcium and the gases. Signs of tetany, actively sought, because alkalosis lowers ionised calcium. And anaemia and cachexia, which SRB lists among the features of gastric cancer and which follow a tumour that bleeds.", ref:"B&L 67 p.1168, p.1169, p.1170 · SRB 20 p.818, p.820, p.841"},
    {id:"goo27", lv:2, type:"Examination", q:"What would you look for outside the stomach if you suspected cancer?",
     a:"SRB's list for advanced gastric cancer: a liver with secondaries, hard and nodular in 50% with umbilication; ascites; Troisier's sign, that is Virchow's node in the left supraclavicular fossa; rectovesical secondaries, the Blumer shelf, on rectal examination; and Trousseau's sign, migrating thrombophlebitis. B&L adds the two named transcoelomic deposits: the ovaries as the sole site of spread, Krukenberg's tumours, and spread to the umbilicus, Sister Joseph's nodule. Do the rectal examination, because the shelf is free information and candidates skip it.", ref:"SRB 20 p.841 · B&L 67 p.1174, p.1171"},
    {id:"goo28", lv:2, type:"Investigation", q:"What do you do before you investigate anything?",
     a:"Empty the stomach properly. B&L: a large nasogastric tube may not be sufficiently large to deal with the contents of the stomach, and it may be necessary to pass an orogastric tube and lavage the stomach until it is completely emptied, which allows investigation with endoscopy and contrast radiology. SRB names a tube for it, Ewald's, and gives the second benefit: a stomach wash with normal saline also reduces the oedema of the stomach wall and improves gastric emptying. You cannot scope a stomach full of three-day-old food.", ref:"B&L 67 p.1169 · SRB 20 p.819"},
    {id:"goo29", lv:2, type:"Investigation", q:"Which investigations come before the endoscopy?",
     a:"The ones that tell you what is going to kill him. SRB's list: serum electrolytes, arterial blood gas analysis and serum calcium estimation, with magnesium alongside. And an ECG, which SRB asks for to check for hypokalaemia and which is needed again during potassium replacement.", ref:"SRB 20 p.819, p.820"},
    {id:"goo30", lv:2, type:"Investigation", q:"What does the barium meal show?",
     a:"SRB's four findings: absence of the duodenal cap; a dilated stomach with the greater curvature below the level of the iliac crest; a mottled stomach, from retained food; and barium that will not pass into the duodenum. The cap is absent because with deformity of the first part of the duodenum barium will not stay, so the cap is not formed. S Das says a barium meal will clinch the diagnosis. SRB's warning: a barium meal may precipitate intestinal obstruction.", ref:"SRB 20 p.819, p.808 · Das 34 p.508"},
    {id:"goo31", lv:2, type:"Investigation", q:"What is Goldstein's saline load test?",
     a:"Instil 750 ml of saline into the stomach and aspirate half an hour later; more than 250 ml remaining suggests obstruction. A bedside test of gastric emptying worth naming even though endoscopy has superseded it.", ref:"SRB 20 p.819"},
    {id:"goo32", lv:2, type:"Treatment", q:"How much potassium, and how fast?",
     a:"SRB prints the ceiling: intravenous potassium chloride 40 mmol per litre given in 5% dextrose or normal saline slowly, often under ECG monitoring, with a total dose of 40 mmol at 0.2 mmol per kg per hour and a maximum of 20 mmol per hour, and it names this very patient, saying the hypokalaemic alkalosis of pyloric stenosis should be treated carefully with intravenous potassium. Say the ceiling out loud: a maximum of 20 mmol in an hour, at a concentration of 40 mmol per litre, with ECG monitoring. It is the number an examiner presses for after you say slowly.", ref:"SRB 1 p.89 · SRB 20 p.820"},

    {id:"goo40", lv:3, type:"Treatment", q:"Isotonic or double-strength saline?",
     a:"Isotonic, with potassium, which is B&L's instruction, and the reasoning supports it: you are giving the kidney back the chloride and the volume it needs to excrete bicarbonate itself. SRB's phrase is normal saline, often double strength normal saline, with slow correction important, plus intravenous potassium under ECG monitoring, magnesium and calcium, with blood transfusion if anaemic and parenteral nutrition support. Double-strength saline is 1.8%, which is hypertonic, and nothing in either book explains when one would use it here. Quote SRB's phrase if asked what SRB says, and give isotonic saline. Outside the books and flagged as such: hypertonic saline in a dehydrated hypochloraemic patient risks a sodium rise for no benefit.", ref:"B&L 67 p.1169 · SRB 20 p.819, p.820"},
    {id:"goo41", lv:3, type:"Treatment", q:"Is endoscopic balloon dilatation worth doing?",
     a:"In selected patients. B&L: endoscopic dilatation of the gastric outlet may be effective, and endoscopic treatment with balloon dilatation may be most useful in early cases and may have to be repeated several times. SRB: endoscopic balloon dilatation of the stenosed area benefits only temporarily with a high recurrence rate. They are not far apart, because B&L concedes the recurrence in the same sentence. Answer it as selection rather than principle: a role in early, benign, oedematous stenosis and in a patient too unfit for surgery, but not a definitive treatment for an established fibrotic stricture. Then the two places endoscopy genuinely wins: it is how you get the mandatory biopsy, and in unresectable malignancy B&L says a duodenal stent may be considered.", ref:"B&L 67 p.1169 · SRB 20 p.820"},
    {id:"goo42", lv:3, type:"Treatment", q:"Why a gastrojejunostomy rather than a pyloroplasty?",
     a:"B&L: traditionally, severe cases are treated surgically, usually with a gastroenterostomy rather than a pyloroplasty. SRB supplies the mechanism B&L leaves out, and it is the better answer: there is no role for pyloroplasty, or for highly selective vagotomy alone, in a scarred duodenum, as it can cause disruption and bile leak. You cannot safely cut and re-suture a thick fibrotic duodenum, so you bypass it, and SRB's operation of choice follows: gastrojejunostomy with vagotomy is commonly used in pyloric stenosis due to chronic duodenal ulcer.", ref:"B&L 67 p.1169 · SRB 20 p.820"},
    {id:"goo43", lv:3, type:"Treatment", q:"Why add a vagotomy to the gastrojejunostomy?",
     a:"Because a drainage procedure alone leaves the acid, and a gastrojejunostomy without vagotomy is the classical setting for a stomal ulcer. S Das gives the figures: the incidence of gastro-jejunal ulcer is very high when gastro-jejunostomy is not combined with vagotomy, with recurrence about 3% after Pólya gastrectomy and 5% after vagotomy and gastro-jejunostomy, usually within two years. SRB's phrase for the principle is no acid, no ulcer.", ref:"Das 34 p.508 · SRB 20 p.818, p.820"},
    {id:"goo44", lv:3, type:"Procedure", q:"Describe highly selective vagotomy, and say why it is not used here.",
     a:"Only the fibres supplying the parietal cells are divided; the nerve of Latarjet, supplying the antral pump, is retained, so no drainage procedure is required; the fibres in the last 6 cm of stomach proximal to the pylorus are preserved, the crow's foot, and 6 cm of distal oesophageal nerve clearance is essential. Described by Amdrup and Johnston in 1969, and also called parietal cell or superselective vagotomy. Its figures: operative mortality 0.2%, morbidity 0.5%, very low post-vagotomy diarrhoea and dumping, but lesser curve necrosis from ischaemia and recurrent ulcer in 10 to 15% at 10 years. SRB excludes it alone in a scarred duodenum for the same reason it excludes pyloroplasty.", ref:"SRB 20 p.818, p.820"},
    {id:"goo45", lv:3, type:"Complications", q:"The patient is still vomiting on the fifth postoperative day. Has the operation failed?",
     a:"Not necessarily. SRB: gastric emptying may be delayed for two to four weeks after surgery in pyloric stenosis, though it usually recovers in seven days. A stomach dilated for months does not regain tone overnight, so a patient still vomiting on day five does not automatically need re-operation.", ref:"SRB 20 p.820"},
    {id:"goo46", lv:3, type:"Treatment", q:"What would you do about Helicobacter pylori?",
     a:"Eradicate it. SRB: after recovery, eradication of H. pylori is routinely done even though infection may not be evident in many patients with outlet obstruction, and follow-up gastroscopy is a must to confirm the ulcer has healed. Its triple regime: a proton pump inhibitor with clarithromycin 500 mg twice daily and metronidazole 400 mg twice daily, or amoxycillin 500 to 750 mg twice daily with tinidazole 600 mg twice daily. Its practical warning: antacids and H2 blockers should not be used alongside a PPI, because they create an alkaline medium that reduces the PPI's action. And note B&L's limit on the epidemiology: the association with distal gastric cancer is real, but there is insufficient evidence to support eradication programmes in asymptomatic patients.", ref:"SRB 20 p.818, p.820 · B&L 67 p.1170"},
    {id:"goo47", lv:3, type:"Management", q:"This patient has not eaten properly for weeks. What must you watch for when you feed him?",
     a:"Refeeding syndrome. B&L: in a patient at risk, nutrition should be started at no more than 50% of the estimated target energy needs, and nutritional support should include supplementary thiamine, vitamin B, multivitamins and trace elements. So feed slowly, give thiamine before or with the first feed, and watch the potassium, phosphate and magnesium as you start.", ref:"B&L 25 p.334, p.340"},
    {id:"goo48", lv:3, type:"Pathology", q:"Give the risk factors for gastric cancer.",
     a:"Helicobacter pylori, principally in carcinoma of the body and distal stomach rather than the proximal stomach. Previous peptic ulcer surgery, particularly drainage procedures such as Billroth II or Pólya gastrectomy, gastroenterostomy or pyloroplasty, at approximately four times the average risk, thought to be from bile reflux and intestinal metaplasia, which is the one risk factor the surgeon creates. Pernicious anaemia, gastric atrophy and adenomatous polyps. Excessive salt intake, deficiency of antioxidants, exposure to N-nitroso compounds, cigarette smoking and dust ingestion in industrial processes, with the decline in gastric cancer among Japanese families living in the USA as the evidence that diet matters.", ref:"B&L 67 p.1170"},
    {id:"goo49", lv:3, type:"Pathology", q:"What is the Laurén classification?",
     a:"B&L calls it the most useful clinicopathological classification of gastric cancer. The intestinal type resembles a carcinoma elsewhere in the gut, forms polypoid tumours or ulcers, and probably arises in intestinal metaplasia. The diffuse type, often with signet ring cells, infiltrates deeply without forming an obvious mass but spreads widely in the gastric wall, and unsurprisingly has a much worse prognosis. SRB gives the intestinal type as 53% with a favourable prognosis, and notes that in the diffuse type linitis plastica is common, with decreased E-cadherin and p53 and p16 inactivation.", ref:"B&L 67 p.1170 · SRB 20 p.837"},
    {id:"goo50", lv:3, type:"Pathology", q:"Why are the results of gastric cancer surgery better in Japan?",
     a:"B&L: the prognosis tends to be poor, with cure rates little better than 5 to 10%, although better results are obtained in Japan where the disease is common, from a high population incidence, screening programmes and high-quality surgery. Its sentence worth quoting is that gastric cancer is actually an eminently curable disease whose poor outcome is owing to the advanced stage at presentation. For scale: incidence about 10 per 100 000 per year in the USA, about 40 in Eastern Europe and approximately 70 in Japan.", ref:"B&L 67 p.1169"},
    {id:"goo51", lv:3, type:"Investigation", q:"How is gastric cancer staged, and what does CT miss?",
     a:"Contrast CT, with the UICC TNM system. Two eighth-edition points: all gastric tumours whose epicentre is within 5 cm of the gastro-oesophageal junction and which extend into the oesophagus are staged by the oesophageal system, while those within 5 cm that do not extend into the oesophagus, and all other gastric cancers, are staged by the gastric system. And what CT misses: transperitoneal spread is detected most effectively by laparoscopy rather than by CT. Note also B&L's point about nodes: unlike malignancies such as breast cancer, nodal involvement does not carry the same implication, so nodal spread may be extensive and still resectable, which is why D2 lymphadenectomy exists.", ref:"B&L 67 p.1171, p.1174"},
    {id:"goo52", lv:3, type:"Complications", q:"A patient with a previous gastrojejunostomy now has diarrhoea and vomits faeculent material.",
     a:"A gastro-jejunocolic fistula. S Das: the anastomotic ulcer symptoms disappear and are replaced by severe diarrhoea, eructation of foul gas and vomiting of fragments of formed faeces, from fouling of the jejunum by colonic contents. And the examinable technical point: it is better diagnosed by a barium enema, since in more than half of patients the barium meal fails to reveal the fistula.", ref:"Das 34 p.508"},
  ],

  "dysphagia": [
    {id:"dys01", lv:1, type:"Pathology", q:"Define dysphagia and odynophagia.",
     a:"SRB: dysphagia is difficulty in swallowing, and painful swallowing is odynophagia. Odynophagia is a different pointer, suggesting mucosal inflammation or ulceration, so oesophagitis, candidal oesophagitis or a corrosive injury, rather than a simple obstructing mass; S Das makes the same point from the other direction about cancer, that pain is conspicuous by its absence. Then separate oropharyngeal from oesophageal by asking about coughing rather than about the site: SRB says dysphagia may be due to pathology in the voluntary or pharyngeal phase, where the patient also develops cough while swallowing, while a problem in the oesophageal involuntary phase is specified by food getting stuck, but the site of that feeling is not relevant.", ref:"SRB 19 p.778 · Das 31 p.440"},
    {id:"dys03", lv:1, type:"History", q:"Solids first or liquids first, and why does it matter?",
     a:"The single most discriminating question. S Das: difficulty first with solids and subsequently with liquids points to mechanical obstruction, mainly carcinoma of the oesophagus; difficulty first with liquids and subsequently with solids is typical of achalasia, where the weight of the solid helps in overcoming the spasm. The mechanism: a fixed narrowing lets fluid through and stops a bolus, while a sphincter that will not relax is overcome by weight and hydrostatic pressure. But do not reject achalasia if the patient reports both, because B&L records that achalasia typically presents with dysphagia to both solid and liquid.", ref:"Das 31 p.434 · B&L 66 p.1121"},
    {id:"dys04", lv:1, type:"History", q:"How does the age of the patient shift the differential?",
     a:"S Das: carcinoma of the oesophagus is a disease of old age, 50 to 70 years. In infancy, oesophageal atresia, dysphagia lusoria and congenital cardiospasm. In children, a foreign body, paralysis of the soft palate from diphtheria, and acute retropharyngeal abscess. In middle age, benign stricture, achalasia at 30 to 40 years, and Paterson-Kelly syndrome. Open with the age bracket and name your top two.", ref:"Das 31 p.434"},
    {id:"dys05", lv:1, type:"History", q:"What does the duration and the pattern tell you?",
     a:"S Das: a sudden onset suggests a foreign body or acute oesophagitis; a comparatively short history of a few months in the elderly suggests carcinoma; a slow onset with a long history is obtained in benign stricture, achalasia and pharyngeal pouch; progressively worsening dysphagia is typical of carcinoma and stricture; and in spastic lesions, Paterson-Kelly syndrome and Schatzki's rings, there may be periods of remission. SRB agrees that in carcinoma the dysphagia is of short duration and progressive. The trap: in cancer, sloughing of a portion of the growth may ease the dysphagia temporarily, so improvement in an elderly patient is not recovery.", ref:"Das 31 p.434, p.440 · SRB 19 p.778"},
    {id:"dys06", lv:1, type:"History", q:"What does regurgitation tell you, and what do you ask next?",
     a:"S Das: regurgitation is often seen in achalasia, may be seen in sliding hiatus hernia with stooping or straining, and a pharyngeal pouch may cause it, with a visible lump in the neck that can be emptied with pressure; in achalasia, regurgitation of food even several hours after a meal is the main complaint. Then ask what comes up: recognisable undigested food never reached the stomach, so the hold-up is in the oesophagus or the pouch, while sour or bitter material has been in the stomach and this is reflux. B&L adds that patients may report regurgitating food they ingested before, and that the retained food ferments, so there is halitosis.", ref:"Das 31 p.434, p.439 · B&L 66 p.1121"},
    {id:"dys07", lv:1, type:"History", q:"What does the vomitus tell you?",
     a:"S Das: note the amount, the reaction, since it is generally not acid in causes other than reflux oesophagitis, the odour, and the presence of blood, which occurs in carcinoma, in reflux, and very rarely in achalasia; when the oesophagus is dilated the patient may vomit foul-smelling stagnated intraoesophageal contents two to three days old. So not acid means it never reached the stomach, and foul and days old means stasis in a dilated oesophagus. In cancer the regurgitated material is usually alkaline, mixed with saliva and streaked with blood.", ref:"Das 31 p.434, p.441"},
    {id:"dys08", lv:1, type:"History", q:"The patient coughs. When, in relation to the meal?",
     a:"The interval localises it. S Das: coughing immediately after feeds indicates a tracheo-oesophageal fistula, while coughing some time after ingestion of meals may be regurgitation in cardiospasm or a pharyngeal pouch, and persistent coughing without that relationship suggests irritation by a mediastinal mass. In an older patient it is a red flag: B&L says choking and cough on drinking water are typical of fistulation, and associated haemoptysis is common, which means advanced and usually unresectable disease.", ref:"Das 31 p.434, p.435 · B&L 66 p.1136"},
    {id:"dys09", lv:1, type:"Examination", q:"What does the general examination give you?",
     a:"S Das's four findings: emaciation, usual in dysphagia but much more prominent in achalasia and malignant disease; anaemia, very evident in Paterson-Kelly syndrome, in carcinoma and in reflux oesophagitis; unequal radial pulses on the two sides in an aneurysm of the aorta, which is the one cause of dysphagia you diagnose at the wrist; and concave spoon-shaped nails with a smooth, pale tongue devoid of papillae in Paterson-Kelly syndrome.", ref:"Das 31 p.435"},
    {id:"dys10", lv:1, type:"Examination", q:"What is there to find in the neck?",
     a:"S Das: a soft swelling which appears during meals just above the left clavicle is the third stage of a pharyngeal pouch, and pressure over it causes regurgitation of food into the mouth; when the patient drinks, the pouch can be seen enlarging with a gurgling noise. B&L explains the side: most diverticula point towards the left, which is also why the operation is through a left cervical incision. And the one you must not omit: if no relevant sign is found in the neck, palpate the left supraclavicular fossa for enlarged nodes, which may be the only sign of carcinoma of the oesophagus.", ref:"Das 31 p.435, p.439 · B&L 66 p.1127"},
    {id:"dys11", lv:1, type:"Diagnosis", q:"Give the common causes of dysphagia.",
     a:"SRB's shortlist, which is better for a viva than the full table: gastro-oesophageal reflux disease, carcinoma of the oesophagus, foreign body, carcinoma of the pharynx or posterior third of the tongue, corrosive stricture, oesophageal candidiasis, and Plummer-Vinson syndrome. Everything else SRB files under rare.", ref:"SRB 19 p.778"},
    {id:"dys12", lv:1, type:"Investigation", q:"Where do you start investigating an adult with progressive dysphagia?",
     a:"Upper gastrointestinal endoscopy, because it visualises the mucosa and gives a biopsy at the same sitting, and carcinoma is the diagnosis you must exclude. B&L: endoscopy is an essential tool with both diagnostic and therapeutic roles, and a standard diagnostic upper endoscopy includes examination of the pharynx, hypopharynx, laryngeal inlet, oesophagus, stomach and part of the duodenum.", ref:"B&L 66 p.1108"},
    {id:"dys13", lv:1, type:"Examination", q:"What do you do before you examine this patient?",
     a:"Hand hygiene, introduce yourself and check the name and date of birth, explain what you are going to do, obtain verbal consent, and make the patient comfortable. Then say why you are examining at all: there is nothing to feel in the chest, so the examination is a search for the complication and the metastasis rather than for the lesion.", ref:"B&L 35 p.472 · B&L 21 p.285 · Das 31 p.435"},

    {id:"dys20", lv:2, type:"Diagnosis", q:"Classify the causes of dysphagia.",
     a:"By site, then within the oesophagus by lumen, wall and outside the wall. Mouth: tonsillitis, quinsy, stomatitis, carcinoma of the tongue, paralysis of the soft palate. Pharynx: an impacted foreign body in the lumen; acute pharyngitis, malignant growth, hysterical spasm and Paterson-Kelly syndrome in the wall; retropharyngeal abscess, an enlarged cervical node and a malignant thyroid outside it. Oesophagus: a foreign body in the lumen; in the wall, atresia, benign stricture from reflux, corrosive, tuberculosis, scleroderma or radiotherapy, spasm, diverticulum, neoplasm and nervous disorders; outside it, a retrosternal goitre, pharyngeal diverticulum, aortic aneurysm, mediastinal growth, dysphagia lusoria, perioesophagitis after vagotomy, a paraoesophageal hiatus hernia and too tight a hiatal repair. SRB adds a fourth column of neurological causes, bulbar palsy, infarction or hemiplegia and vertebrobasilar insufficiency, with oesophageal candidiasis, Boerhaave's syndrome, motor neuron disease, Parkinson's disease, drug-induced dysphagia and mediastinal fibrosis.", ref:"Das 31 p.437 · SRB 19 p.778, p.779"},
    {id:"dys21", lv:2, type:"History", q:"Which five things in the past history would you ask about?",
     a:"S Das: a history of radiation, instrumentation or swallowing of a corrosive such as concentrated acid or alkali, in simple stricture; past vagotomy, indicating perioesophagitis; previous hiatus hernia repair, indicating excessive tightness of the repair; diphtheria; and symptoms of other bowel disease, suggesting Crohn's disease of the oesophagus. Add two in current practice: drugs, since SRB lists potassium chloride, quinine and NSAIDs as causes of drug-induced dysphagia, and immunosuppression, since oesophageal candidiasis is becoming common with HIV infection, steroid therapy, cancer chemotherapy and the post-transplant period.", ref:"Das 31 p.435 · SRB 19 p.778, p.779"},
    {id:"dys22", lv:2, type:"History", q:"The patient swallowed a corrosive. Does it matter which one?",
     a:"Yes. SRB: it is usually an alkali stricture, because squamous mucosa is resistant to acid effect to a certain extent. So ask specifically whether the substance was an acid or an alkali. The history has a long tail as well, because B&L lists lye corrosive stricture among the aetiological factors for squamous cell cancer.", ref:"SRB 19 p.778 · B&L 66 p.1136"},
    {id:"dys23", lv:2, type:"Examination", q:"What do you examine besides the neck?",
     a:"The mouth and pharynx: tonsils and fauces for a lesion, the mobility of the soft palate for paralysis, and the posterior pharyngeal wall for a retropharyngeal abscess, which is three causes and three findings needing no instrument. The chest, where in the majority there will be hardly any abnormality, but look for pleural effusion in a late cancer and for aspiration pneumonitis in achalasia, which may cause lung abscess, bronchiectasis and haemoptysis, with SRB putting recurrent pneumonia in achalasia at 60%. The abdomen, for a mass from a cancer infiltrating the upper stomach and an enlarged liver from metastases. And the cervical spine, if a cold abscess of Pott's disease is pressing on the pharynx.", ref:"Das 31 p.435 · SRB 19 p.789"},
    {id:"dys24", lv:2, type:"Examination", q:"How do you demonstrate tracheal tugging, and what is it for?",
     a:"S Das's technique: the clinician stands behind the patient and holds the cricoid cartilage with a little upward traction, and the downward tug can be felt with each throb of the aorta. It is for an aneurysm of the aortic arch, which is also the cause that gives unequal radial pulses.", ref:"Das 31 p.435"},
    {id:"dys25", lv:2, type:"Investigation", q:"What are the two safety points when you endoscope a patient with dysphagia?",
     a:"B&L: extra care should be taken when performing endoscopy for patients with achalasia or obstruction, as the oesophagus can be fluid-filled and regurgitation may lead to aspiration. And where perforation is suspected or the procedure will be long, carbon dioxide should be used for insufflation, since it is absorbed more quickly than air.", ref:"B&L 66 p.1108, p.1109"},
    {id:"dys26", lv:2, type:"Investigation", q:"Describe the barium appearances in carcinoma, in benign stricture and in achalasia.",
     a:"Carcinoma: the dilatation above the tumour is less marked, the constricted part is extremely irregular, and shouldering may be seen at the proximal end of the filling defect, with a soft tissue shadow of the tumour. Benign stricture: a long tortuous stricture with some dilatation of the proximal oesophagus and no shouldering, so shouldering is the discriminator. Achalasia: the distal bird-beak taper of the oesophagogastric junction below a dilated oesophagus, with retained contents, absence of the fundic gas bubble, and in late disease massive dilatation with a sigmoid oesophagus. Diffuse oesophageal spasm: a corkscrew oesophagus. Careful with rat-tail, which S Das uses for the irregular narrowing of carcinoma and B&L as a synonym for the bird's beak of achalasia, so say bird's beak for achalasia and irregular filling defect with shouldering for cancer.", ref:"Das 31 p.436, p.439 · SRB 19 p.789 · B&L 66 p.1121, p.1122, p.1125"},
    {id:"dys27", lv:2, type:"Investigation", q:"When would you ask for a contrast swallow before the endoscopy?",
     a:"In three situations. A suspected pharyngeal pouch, where blind intubation risks perforating the pouch and where S Das insists on a thin emulsion, since a thick mixture refuses to be washed out of the pouch afterwards. A suspected high or tight stricture, to show the level and length before anything is passed. And a suspected motility disorder, where the contrast study shows the dynamics endoscopy cannot. B&L's own limit: a contrast swallow can demonstrate narrowing, anatomical distortion or abnormal motility, but it is inaccurate in the diagnosis of GORD and should not be used for that purpose.", ref:"B&L 66 p.1108 · Das 31 p.439"},
    {id:"dys28", lv:2, type:"Investigation", q:"What does manometry show, and what does pH study add?",
     a:"Manometry is for motility, not obstruction. In achalasia it shows failure of the lower oesophageal sphincter to relax reflexly with swallowing and lack of progressive peristalsis throughout the oesophagus; in diffuse oesophageal spasm, multiphasic, repetitive, high-amplitude contractions after swallowing. B&L calls high-resolution manometry the gold standard for diagnosing an oesophageal motility disorder. pH study is for reflux, where barium is unreliable: S Das records pH 5 cm above the distal high-pressure zone falling below 4 as clear evidence of reflux, and SRB calls 24-hour pH monitoring ideal and most accurate for GERD.", ref:"Das 31 p.437 · B&L 66 p.1122, p.1125 · SRB 19 p.779"},
    {id:"dys29", lv:2, type:"Pathology", q:"What is achalasia, and what is the mechanism?",
     a:"Failure of the lower oesophageal sphincter to relax with deglutition, the name coming from the Greek khalasis, failure to relax, with the number of ganglion cells in the myenteric plexus diminished. B&L's mechanism, worth learning whole: the mismatch in excitatory and inhibitory activity results in failure of lower oesophageal sphincter relaxation and absent peristalsis, and with time the oesophagus dilates and contractions disappear, so that it empties mainly by the hydrostatic pressure of its contents, which is nearly always incomplete, leaving residual food and fluid. That one sentence explains the regurgitation, the halitosis, the aspiration and the missing fundic gas bubble at once. The aetiology is postulated to be loss of inhibitory ganglion cells in Auerbach's plexus, possibly from a virus-induced autoimmune effect, and SRB adds reduced nitric oxide and VIP.", ref:"Das 31 p.439 · B&L 66 p.1121 · SRB 19 p.789"},
    {id:"dys30", lv:2, type:"Diagnosis", q:"What is pseudoachalasia, and how do you exclude it?",
     a:"SRB: features like achalasia with dysphagia and weight loss in an elderly patient, due to carcinoma; amyl nitrate inhalation causes sphincter relaxation in achalasia but not in pseudoachalasia. B&L makes endoscopy the test, as an important investigation to exclude pseudo-achalasia, often referring to cancer of the gastric cardia mimicking achalasia, and notes that a normal endoscopy does not exclude achalasia, since 30 to 40% of endoscopies are reported as normal before the final diagnosis is made.", ref:"SRB 19 p.791 · B&L 66 p.1122"},
    {id:"dys31", lv:2, type:"Diagnosis", q:"Give the triad of Plummer-Vinson syndrome and its other names.",
     a:"A cervical oesophageal web, iron deficiency anaemia and dysphagia; also called Paterson-Brown-Kelly syndrome in the UK, and sideropenic dysphagia. S Das's clinical picture: nearly always a middle-aged woman, with glossitis, anaemia and dysphagia as the triad, a tongue devoid of papillae, smooth and pale, cracked lips and angles of the mouth, hypochromic anaemia almost always present, and brittle spoon-shaped nails. It was first described by Paterson and Kelly in 1919 and more elaborately by Plummer and Vinson in 1921.", ref:"B&L 66 p.1146, p.1147 · Das 31 p.438 · SRB 19 p.791"},
    {id:"dys32", lv:2, type:"Management", q:"How is Plummer-Vinson syndrome treated, and why does it matter?",
     a:"B&L: iron therapy, diet modification and, if necessary, endoscopic dilatation of the cervical web. SRB gives the dose, ferrous sulphate 300 mg three times a day with vitamins, and insists on oesophagoscopy and biopsy to rule out malignancy. It matters because it is premalignant: S Das calls the lesion precancerous and B&L is more precise, that there is a predisposition to postcricoid, cervical oesophageal cancer.", ref:"B&L 66 p.1147 · SRB 19 p.791 · Das 31 p.438"},

    {id:"dys40", lv:3, type:"Investigation", q:"Barium swallow first or endoscopy first?",
     a:"Lead with endoscopy and give barium a named indication. S Das is unambiguous that radiography with barium meal is by far the most important investigation in dysphagia and that more or less all the conditions causing dysphagia will be diagnosed by it. B&L mentions barium swallow once in a 42-page chapter, gives contrast studies a single paragraph, and opens with endoscopy as an essential tool with both diagnostic and therapeutic roles; on S Das's rigid instrument it is categorical, that rigid oesophagoscopy is rarely used nowadays except for unusual circumstances such as retrieving large or sharp foreign objects. The divergence is not about what barium shows but that barium cannot biopsy, and cancer is the diagnosis you cannot afford to delay. So: endoscopy first in an adult with progressive dysphagia, and contrast first for a suspected pouch, a high or tight stricture, or a motility disorder.", ref:"Das 31 p.436 · B&L 66 p.1108, p.1109 · SRB 19 p.790"},
    {id:"dys41", lv:3, type:"Investigation", q:"Is the diagnostic standard a sphincter pressure over 35 mmHg, or the Chicago classification?",
     a:"Say the finding first, then the framework. Manometry shows failure of the lower oesophageal sphincter to relax on swallowing with absent peristalsis in the body, and SRB's conventional threshold is a resting sphincter pressure over 35 mmHg, which it calls the gold standard. B&L describes conventional water-perfused manometry as history: with the introduction of the colour contour plot by Ray Clouse in 1995 it is being replaced by high-resolution manometry with solid-state catheters, typically 36 circumferential sensors 1 cm apart, and the measurement that matters is now the integrated relaxation pressure, the relaxation pressure across the oesophagogastric junction in response to a swallow. An abnormal IRP puts the patient in disorders of oesophagogastric junction outflow, which contains the three types of achalasia and outflow obstruction; a normal one sends you to disorders of peristalsis. It is not cosmetic, because the types change management, and B&L adds that all motility disorders have to be associated with symptoms or other supporting tests to be clinically relevant.", ref:"SRB 19 p.790 · B&L 66 p.1110, p.1121 · Das 31 p.437"},
    {id:"dys42", lv:3, type:"Treatment", q:"What is the goal of treating achalasia, and what are the options?",
     a:"Say the goal first, because it reframes everything: the treatment goal is symptom palliation, since there is no therapy to reverse the neuronal degeneration, and therapies target the lower oesophageal sphincter, aiming to reduce its contractility pharmacologically or by destroying the muscle fibres endoscopically or surgically. Drugs, calcium channel blockers, nitrates and phosphodiesterase inhibitors, have limited efficacy and should be reserved for patients who are poor candidates for endoscopic or surgical treatment. Botulinum toxin relief falls from 70% at three months to around 40% at a year, repeated injection may cause scarring that makes later treatment harder, and B&L restricts it to elderly patients with comorbidities. Pneumatic dilatation with balloons of 30 to 40 mm graded up, where the responders are patients over 45, female, with an undilated oesophagus, who responded to the first dilatation, and with type II achalasia. Heller's myotomy. POEM. And oesophagectomy for end-stage disease.", ref:"B&L 66 p.1122, p.1123, p.1124"},
    {id:"dys43", lv:3, type:"Procedure", q:"Describe Heller's myotomy, and say why you add a partial and not a complete wrap.",
     a:"An anterior myotomy for at least 6 cm proximally on the oesophageal side and 2 to 3 cm distally into the gastric cardia, standardly by a laparoscopic approach; SRB's figures are 8 to 10 cm of circular muscle from 2 cm proximal to the thickened muscle to 1 cm distal to the oesophagogastric junction, with care not to open the mucosa, and it notes the original Heller's was both anterior and posterior while only anterior is done now. The major complication is reflux, in up to 40%, so a partial fundoplication, anterior Dor or posterior Toupet, is added, and a complete 360-degree Nissen is considered contraindicated because the increase in outflow resistance against an aperistaltic oesophageal body will probably result in postoperative dysphagia. That last clause is the whole answer: there is no peristalsis above to push against a full wrap.", ref:"B&L 66 p.1123, p.1124 · SRB 19 p.790"},
    {id:"dys44", lv:3, type:"Procedure", q:"What is POEM, and what is its cost?",
     a:"Per-oral endoscopic myotomy: a submucosal tunnel is created and the circular muscle divided from inside, the entry closed with endoclips. Randomised trials have demonstrated similar efficacy to pneumatic dilatation and Heller's myotomy in relieving dysphagia. Its cost is reflux: without an antireflux procedure the incidence of oesophagitis at three months after POEM can be as high as 57%, which may subject patients to lifelong acid suppression or a subsequent antireflux operation. It is preferred in type III achalasia, where there is a spastic component at the distal oesophagus that responds less well to pneumatic dilatation and Heller's myotomy, because POEM can extend the myotomy proximally.", ref:"B&L 66 p.1124, p.1125"},
    {id:"dys45", lv:3, type:"Diagnosis", q:"Name the two syndromes associated with achalasia, and what is vigorous achalasia?",
     a:"Chagas' disease, where chronic infection with Trypanosoma cruzi destroys the myenteric plexus in South America, and Allgrove syndrome, a rare genetic syndrome associated with familial adrenal insufficiency, alacrimia and achalasia. Vigorous achalasia is SRB's term, which B&L does not use: achalasia with diffuse oesophageal spasm, that is achalasia with high-amplitude contractions.", ref:"B&L 66 p.1121 · SRB 19 p.789"},
    {id:"dys46", lv:3, type:"Examination", q:"The patient has learned manoeuvres to get food down. What are they, and what do they tell you?",
     a:"SRB lists them: walking while eating, chin thrusting, neck and shoulder extension, and the Valsalva manoeuvre, all of which facilitate emptying of food from the oesophagus. All of them raise intraoesophageal hydrostatic pressure, which in achalasia is the only emptying mechanism left, so the manoeuvres themselves confirm the mechanism.", ref:"SRB 19 p.789 · B&L 66 p.1121"},
    {id:"dys47", lv:3, type:"Pathology", q:"Which cell type of oesophageal cancer, and where?",
     a:"B&L: squamous cell cancers tend to be found in the middle and upper part of the oesophagus, while adenocarcinoma predominantly affects the lower oesophagus and the oesophagogastric junction. The geography matters for an Indian answer: squamous cell cancer still predominates in the East while Barrett's adenocarcinoma is more common in the West, where among white populations in developed countries there has been an epidemiological shift since the 1990s such that the incidence of adenocarcinoma has surpassed that of squamous cell cancer. It most commonly presents in the sixth and seventh decades, and it is the eighth most common cancer worldwide and the sixth most common cause of cancer death.", ref:"B&L 66 p.1136, p.1146, p.1135"},
    {id:"dys48", lv:3, type:"Pathology", q:"Give the risk factors for oesophageal cancer by cell type.",
     a:"For squamous cell cancer: smoking, alcohol, hot beverages, N-nitroso-containing food such as pickled vegetables, chewing betel nut, yerba mate, dietary deficiency of fresh green vegetables, fruit and vitamins, low socioeconomic class, fungal toxin or virus, radiation to the mediastinum, lye corrosive stricture, previous upper aerodigestive malignancy, Plummer-Vinson syndrome and achalasia. For adenocarcinoma: Barrett's oesophagus, which is the strongest, gastro-oesophageal reflux, obesity, and smoking and alcohol to a lesser degree. The mechanism worth knowing is the ALDH2 story: alcohol is metabolised to acetaldehyde by alcohol dehydrogenase and the acetaldehyde in turn by ALDH2 to acetate, and individuals with variants of the ALDH2 gene may have a suboptimal level of the enzyme, leading to accumulation of the carcinogen acetaldehyde.", ref:"B&L 66 p.1136, p.1135"},
    {id:"dys49", lv:3, type:"Pathology", q:"Why does oesophageal cancer spread early, and what follows surgically?",
     a:"Because the oesophageal wall has a rich network of submucosal lymphatics, so longitudinal submucosal spread is common, and because the wall lacks a serosa, so there is no barrier to early local invasion. B&L draws the surgical conclusion that a longer resection margin reduces the chance of local recurrence, and notes that nodal spread can be unpredictable with skip lesions, which is the rationale for three-field lymphadenectomy. It also records that using oesophageal cancer as the index tumour, multiple primary cancers are found in about 10% of patients, of which 70% are in the aerodigestive tract.", ref:"B&L 66 p.1136, p.1108, p.1107"},
    {id:"dys50", lv:3, type:"Complications", q:"Name the late complications of oesophageal carcinoma.",
     a:"Hoarseness from recurrent laryngeal nerve involvement; broncho-oesophageal fistula, with choking and cough on drinking water and often haemoptysis; and erosion of the aorta, which S Das says is very rare but fatal and which B&L describes as usually presenting with a smaller sentinel bleed followed by massive bleeding that is invariably fatal. Aspiration gives pneumonitis, lung abscess and bronchiectasis.", ref:"Das 31 p.441 · B&L 66 p.1136"},
    {id:"dys51", lv:3, type:"Treatment", q:"How would you palliate an unresectable oesophageal carcinoma?",
     a:"B&L: placement of a self-expanding metallic stent is simple and effective and allows immediate relief of dysphagia, with the risks of stent migration, tumour ingrowth, airway compression, and tracheal erosion if placed in the mid- and upper oesophagus. It is what most patients in India will need, because of the stage at presentation.", ref:"B&L 66 p.1146"},
    {id:"dys52", lv:3, type:"Diagnosis", q:"Distinguish an oesophageal web from a Schatzki's ring.",
     a:"B&L's distinction is histological and is a favourite viva question: a web is distinguished from a Schatzki's ring in that both the proximal and distal surfaces of the web are lined by squamous mucosa, while in a Schatzki's ring the proximal side is lined with squamous mucosa and the distal side by columnar mucosa, coinciding with its location at the squamocolumnar junction. Both narrow the lumen; one sits at the top of the oesophagus and one at the bottom. The number to quote for the ring: radiological studies by Schatzki showed that in individuals with a ring size of less than 13 mm dysphagia may occur, a threshold S Das gives too; its aetiology is uncertain but believed related to reflux, hiatus hernia is more common, and treatment is endoscopic dilatation if symptomatic.", ref:"B&L 66 p.1147 · Das 31 p.440"},
    {id:"dys53", lv:3, type:"Pathology", q:"Where does a pharyngeal pouch arise, and why there?",
     a:"B&L: Zenker's diverticulum is a false pulsion diverticulum, as it protrudes posteriorly above the cricopharyngeal sphincter through the natural weak point, the dehiscence of Killian, between the oblique and horizontal fibres of the inferior pharyngeal constrictor, and the pathophysiology is believed to involve loss of coordination between pharyngeal contraction and opening of the upper sphincter. Most diverticula point towards the left, which is why the swelling appears above the left clavicle and the operation is through a left cervical incision.", ref:"B&L 66 p.1126, p.1127 · Das 31 p.435"},
    {id:"dys54", lv:3, type:"Investigation", q:"What do chromoendoscopy, CT and endoscopic ultrasound add?",
     a:"Chromoendoscopy is for early disease, on the principle that normal squamous mucosa takes up iodine while dysplastic and early cancerous mucosa does not: Lugol's iodine at 0.5 to 1% to look for suspicious unstained areas and the pink colour sign in squamous neoplasia, and acetic acid at 1 to 3% for loss of aceto-whitening in Barrett's mucosa. CT and endoscopic ultrasound are for staging rather than diagnosis: CT is important in staging a malignant neoplasm, delineating the anatomical relationship with other mediastinal structures, and endoscopic ultrasound gives highly detailed images of the layers of the oesophageal wall, so it is the test for T stage and for sampling adjacent nodes. S Das's blunt verdict on these for diagnosis still holds: their value is not much in finding out the cause of dysphagia.", ref:"B&L 66 p.1109, p.1136, p.1108, p.1110 · Das 31 p.437"},
  ],

  "testicular-tumour": [
    {id:"tst01", lv:1, type:"Pathology", q:"How common are testicular tumours, and how many are malignant?",
     a:"S Das: though these tumours constitute only 1% of all malignant tumours in man, they are one of the commonest forms of malignant tumour in the young, and almost all, 99%, are malignant. B&L: testicular cancer represents around 1 to 1.5% of male neoplasms, with 3 to 10 new cases per 100 000 males per year in western societies, and they are the commonest form of tumour in young men. The 99% figure is the one to say, because it is the justification for everything that follows: there is no safe period of observation and no place for a needle.", ref:"Das 40 p.630 · SRB 26 p.1070 · B&L 86 p.1569"},
    {id:"tst02", lv:1, type:"Examination", q:"Describe the swelling.",
     a:"S Das: the swelling is purely scrotal, the testis enlarged, firm, smooth and heavy, more so in seminoma though slight nodularity can be felt, while in teratoma the surface is irregular or nodular with varying consistency and soft bosses in between. The word to use is heavy: weight out of proportion to size is the oldest sign. B&L reduces the case to one line: a solid testicular lump that cannot be felt separately from the testis may be a malignant tumour. You can get above it, which separates it from an inguinoscrotal hernia, and it does not transilluminate, which separates it from a hydrocele unless there is a secondary one.", ref:"Das 40 p.630 · B&L 86 p.1571"},
    {id:"tst03", lv:1, type:"Examination", q:"What is testicular sensation, and what does its loss mean?",
     a:"Gentle pressure on a normal testis produces a characteristic sickening discomfort referred to the epigastrium. S Das: in gumma and malignant tumour of the testis the testicular sensation quickly dwindles away, more so in gumma, and in tumours it is always lost early, but one must be very gentle in finding out this sign. SRB lists loss of testicular sensation in the early stage only. Use it to support your diagnosis, never to abandon one, and note that the sign is absent from B&L altogether.", ref:"Das 40 p.622, p.630 · SRB 26 p.1071"},
    {id:"tst04", lv:1, type:"Examination", q:"What does the vas tell you?",
     a:"It is the single most useful discriminator against infection, and SRB names it the sign of the vas: in testicular tumours the vas is normal and the cord structures may become bulky because of cremasteric hypertrophy, whereas in infection the vas is thickened, beaded and tender. S Das says the same, that the spermatic cord remains normal for a long time but may eventually thicken from cremasteric hypertrophy and enlargement of the testicular vessels, while the vas is never thickened. The logic: a tumour is confined by the tunica and spreads along lymphatics, which do not thicken the vas, while tuberculous epididymitis spreads along the vas itself.", ref:"SRB 26 p.1072 · Das 40 p.630"},
    {id:"tst05", lv:1, type:"Anatomy", q:"Where do testicular tumours spread to, and where do they not?",
     a:"To the para-aortic nodes near the origin of the gonadal vessels, with the contralateral para-aortic nodes sometimes involved, and the inguinal nodes affected only if the scrotal skin is involved. The embryological reason is the one to give: the testis descends from the posterior abdominal wall and takes its lymphatic drainage with it, so the first-echelon nodes are para-aortic, not inguinal. Examining the groin and calling it staging is the classic error. SRB adds that previous scrotal or inguinal surgery can open the inguinal route.", ref:"B&L 86 p.1569 · SRB 26 p.1072"},
    {id:"tst06", lv:1, type:"Examination", q:"Where do you look for secondaries, and what do they feel like?",
     a:"S Das: lymphatic metastasis enlarges the pre- and para-aortic nodes, which lie just above the level of the umbilicus; palpate the liver; and examine the lungs with a chest radiograph to exclude blood-borne metastasis. SRB describes how the nodal mass feels: often in the epigastric region the para-aortic nodes may be palpable as a hard, nodular, non-tender, non-mobile, vertically placed, resonant mass that does not move with respiration. SRB adds spread from the retroperitoneal nodes to the left supraclavicular and posterior mediastinal nodes.", ref:"Das 40 p.630 · SRB 26 p.1072, p.1071"},
    {id:"tst07", lv:1, type:"History", q:"How does age split the two main tumours?",
     a:"S Das: teratoma occurs between 20 and 30 years, seminoma between 30 and 50. B&L: the peak incidence of seminomas is in the fourth decade, with the non-seminomatous germ cell tumours more common in the third. The rule that survives both: younger means teratoma or NSGCT, older means seminoma, with the crossover around 30. Lymphoma of the testis is the tumour of the man over 50, and spermatocytic seminoma is seen only in adult men usually over 50.", ref:"Das 40 p.630 · B&L 86 p.1569, p.1570"},
    {id:"tst08", lv:1, type:"History", q:"The patient blames a minor injury. What do you say?",
     a:"That the trauma did not cause the tumour; it made him examine himself. S Das: the commonest presentation is a painless swelling of the testis of a few months' duration, and trivial injury may draw the attention of the patient towards the swelling, so he often incriminates trauma as the cause. B&L says the same, that occasionally an episode of trauma calls attention to the swelling. Accepting the patient's attribution is how these diagnoses get delayed.", ref:"Das 40 p.630 · B&L 86 p.1571"},
    {id:"tst09", lv:1, type:"Investigation", q:"What investigation is mandatory, and in which testis?",
     a:"Ultrasound of the scrotum, in both. B&L: the diagnosis is confirmed by ultrasound scanning of the testis, which is also able to assess the contralateral testis, and it is a mandatory test in all suspected cases of testicular tumour; its summary box repeats that ultrasound is mandatory in all cases of suspected testicular tumour. The reason to scan both: the tumour is bilateral at diagnosis in 1 to 2% by B&L and 3% by SRB.", ref:"B&L 86 p.1571 · SRB 26 p.1072"},
    {id:"tst10", lv:1, type:"Investigation", q:"What must you not do to a solid testicular mass?",
     a:"SRB states the three prohibitions as a heading, and they are worth a mark each: no FNAC, no scrotal approach, no incision biopsy. A needle or an incision through the scrotal skin breaches the tunica and opens the inguinal and scrotal lymphatics, which are not the tumour's natural route, so it converts a disease staged and treated through the para-aortic nodes into one with unpredictable inguinal spread, and it changes the field for any later radiotherapy. B&L makes the same point from the anatomy: the inguinal nodes are involved only if the scrotal skin is involved.", ref:"SRB 26 p.1073 · B&L 86 p.1569"},
    {id:"tst11", lv:1, type:"Classification", q:"Classify testicular tumours.",
     a:"Germ cell, 90 to 95%, divided into seminomatous and non-seminomatous; and non-germ-cell, 5 to 10%, that is sex cord-stromal tumours, lymphoma and the rest. B&L's proportions: germ cell tumours 90 to 95%, sex cord-stromal 1 to 2%, lymphoma 3 to 7%, other 1 to 2%. SRB's incidence list, which Indian papers quote: seminoma 40%, teratoma 32%, seminoma with teratoma 14%, interstitial tumours 1.5%, lymphoma 7%. S Das: seminoma 40%, teratoma 35%, mixed 15%, lymphoma 6%, interstitial 2%, other 2%.", ref:"B&L 86 p.1569 · SRB 26 p.1070 · Das 40 p.630"},
    {id:"tst12", lv:1, type:"Examination", q:"What do you do before you examine this patient?",
     a:"Hand hygiene, introduce yourself and check the name and date of birth, explain what you are going to do and why, obtain verbal consent, and make the patient comfortable. The examination is intimate, so offer a chaperone, which B&L says should be especially for intimate examinations and part of a local guideline or policy, say you have offered and that you would record it. If consent is refused, explain again, offer a chaperone, document the refusal and do not proceed.", ref:"B&L 21 p.285 · B&L 35 p.472"},

    {id:"tst20", lv:2, type:"Diagnosis", q:"Separate a testicular tumour from acute epididymo-orchitis.",
     a:"Epididymo-orchitis is painful, tender and febrile, with a thickened tender vas, and it settles on antibiotics. The traps run both ways: B&L warns that some cases of tumour may simulate epididymo-orchitis and that rarely acute painful enlargement occurs because of haemorrhage into the tumour, which can mimic torsion, and S Das says acute pain and tenderness is a very rare form of presentation which is indistinguishable from acute epididymo-orchitis. So an epididymo-orchitis that does not settle on antibiotics must be imaged, not re-treated.", ref:"B&L 86 p.1571 · Das 40 p.630"},
    {id:"tst21", lv:2, type:"Diagnosis", q:"Give the differential diagnosis of a testicular swelling.",
     a:"Vaginal hydrocele, fluctuant and transilluminant, with the testis not felt separately because fluid surrounds it, remembering that a tumour can have a secondary hydrocele, which SRB calls common while B&L puts it no higher than may be present and calls testicular malignancy an uncommon cause of hydrocele. Acute epididymo-orchitis. Tuberculous epididymitis, beginning in the epididymis, especially the globus minor, with a beaded vas and a secondary hydrocele in about 30%. Haematocele, with a history of trauma or repeated aspiration. Gumma, painless and hard with sensation lost early and more completely, the testis later softening, almost always with a secondary hydrocele. Epididymal cyst, felt separately behind and above the testis, multilocular and brilliantly transilluminant, finely tessellated like a Chinese lantern. And torsion, which is an emergency rather than a differential to work through at leisure.", ref:"SRB 26 p.1071, p.1059 · B&L 86 p.1571 · Das 40 p.626, p.628, p.630"},
    {id:"tst22", lv:2, type:"Examination", q:"How do you transilluminate a scrotal swelling, and how is the test got wrong?",
     a:"In darkness, with a pencil torch placed laterally over the swollen scrotum and a rolled sheet of paper on the other side: a red glow throughout the scrotum means clear fluid. S Das names the error: putting the torch on the posterior aspect with the paper in front, because the testis then comes in the way of the light and the test reads falsely negative, so a genuine hydrocele looks solid.", ref:"Das 40 p.621"},
    {id:"tst23", lv:2, type:"History", q:"Why does this young man have swollen legs and back pain?",
     a:"Bulky para-aortic nodes compressing the inferior vena cava and iliac veins. B&L: rarely the predominant symptoms are those of metastatic disease, with intra-abdominal disease causing abdominal or lumbar pain, and the primary tumour may not have been noticed by the patient and may be detected only by ultrasound. S Das describes exactly that presentation, abdominal pain and swelling of the legs from secondaries in the pre- and para-aortic nodes. SRB's checklist adds haemoptysis, altered breath sounds and pleural effusion, bone pain and tenderness, nodular liver secondaries and central nervous system involvement, and notes that 10% present asymptomatically. So a young man with bilateral leg oedema and back pain needs his testes examined.", ref:"B&L 86 p.1571 · Das 40 p.630 · SRB 26 p.1072"},
    {id:"tst24", lv:2, type:"History", q:"The patient has gynaecomastia. What does it mean?",
     a:"A hormone-producing tumour. B&L: around 5% of cases have gynaecomastia, mainly non-seminomatous. SRB agrees and gives the mechanism, that it occurs in a few teratomas, 5%, and is due to raised beta-HCG. For the sex cord-stromal tumours the mnemonic that works is Leydig masculinises, Sertoli feminises: SRB's Leydig cell tumour is prepubertal with excessive output of androgens causing sexual precocity and extreme muscular development, often mimicking infant Hercules, while the Sertoli cell tumour is postpubertal and causes a feminising effect with gynaecomastia, loss of libido and aspermia.", ref:"B&L 86 p.1571 · SRB 26 p.1071, p.1072 · Das 40 p.630"},
    {id:"tst25", lv:2, type:"Examination", q:"The hemiscrotum is empty and smooth, and there is a groin mass.",
     a:"A tumour in an undescended testis. SRB gives the sign: a hemiscrotum with absence of rugae and a suspicious mass in the groin suggests undescended testis with testicular tumour, and it illustrates such a case removed through a suprainguinal approach. It also explains why the risk factor matters: undescended testis and testicular atrophy are SRB's predisposing factors, and B&L's are cryptorchidism, male factor infertility including Klinefelter syndrome, a family history in first-degree relatives, and a contralateral tumour or germ cell neoplasia in situ, which is the term that has replaced carcinoma in situ of the testis. B&L also names a genetic marker: an isochromosome of the short arm of chromosome 12, i12p, is pathognomonic of all types of adult germ cell tumour as well as of germ cell neoplasia in situ.", ref:"SRB 26 p.1072, p.1070 · B&L 86 p.1569"},
    {id:"tst26", lv:2, type:"Investigation", q:"When do you take the tumour markers, and why then?",
     a:"Before the orchidectomy. B&L is explicit: blood is taken prior to orchidectomy to measure the levels of tumour markers, which are raised in around 50% of cases. The reason is that the post-operative fall is the measurement that tells you whether all tumour has gone, and a fall cannot be interpreted without a baseline: the mean serum half-lives of AFP and HCG are 5 to 7 days and 2 to 3 days, and reassessment after orchidectomy can indicate whether all the tumour tissue has been removed. SRB's half-life for beta-HCG is 18 to 36 hours, which is the figure Indian papers expect.", ref:"B&L 86 p.1571 · SRB 26 p.1073"},
    {id:"tst27", lv:2, type:"Investigation", q:"What does each tumour marker mean?",
     a:"AFP comes from yolk sac elements, and SRB's sentence is the most examined thing about markers: a raised AFP always indicates a teratomatous tumour, and AFP is not raised in pure seminomas, so a raised AFP means it is not a pure seminoma whatever the histology says. Beta-HCG comes from syncytiotrophoblast, is never found in a normal individual, and is raised in choriocarcinoma 100%, embryonal carcinoma 65%, teratoma, and in recurrent or residual disease. LDH is a burden marker rather than a tissue marker: it is expressed on chromosome 12p, which is often amplified in testis cancer cells, is less specific than HCG or AFP, but elevated levels are associated with high tumour burden in seminoma and recurrence in NSGCT. PLAP, placental alkaline phosphatase, is SRB's seminoma marker and does not appear in B&L.", ref:"SRB 26 p.1073 · B&L 86 p.1571"},
    {id:"tst28", lv:2, type:"Investigation", q:"How is a testicular tumour staged?",
     a:"CT of the chest, abdomen and pelvis. B&L: while a chest radiograph can show the classical cannonball metastases, CT of the chest, abdomen and pelvis has taken over as the most useful means of detecting metastases and monitoring response to therapy, and its summary box calls CT central to the staging of testicular tumours. SRB agrees, calling CT better than ultrasound for the abdomen and HRCT ideal for the chest.", ref:"B&L 86 p.1571, p.1572 · SRB 26 p.1073"},
    {id:"tst29", lv:2, type:"Management", q:"What must you offer this young man before any treatment?",
     a:"Semen analysis and sperm banking. B&L puts it first under treatment: men should be offered semen analysis and sperm banking prior to interventions such as surgery and chemotherapy that may render them infertile. These are young men with a curable cancer, so fertility preservation before treatment is part of the correct answer and not an afterthought.", ref:"B&L 86 p.1572"},
    {id:"tst30", lv:2, type:"Procedure", q:"Describe the operation.",
     a:"A radical orchidectomy through an inguinal incision, never a scrotal one. B&L: the spermatic cord is displayed by dividing the external oblique aponeurosis and a soft clamp is placed across the cord to stop dissemination of malignant cells as the testis is mobilised into the wound; if there is a tumour the cord should be double transfixed and divided at the level of the internal inguinal ring and the testis removed. The non-negotiable parts are the inguinal incision, the soft clamp before mobilisation, and the cord divided at the internal ring.", ref:"B&L 86 p.1571, p.1572 · SRB 26 p.1073"},
    {id:"tst31", lv:2, type:"Pathology", q:"How do seminoma and teratoma differ in their spread, and why does it matter?",
     a:"B&L: seminomas metastasise mainly via the lymphatics and haematogenous spread is uncommon. S Das puts the contrast directly: seminomas first metastasise by lymphatic spread with blood-borne metastasis late, whereas in teratomas blood-borne metastasis is early. SRB says teratoma spreads mainly through blood and less commonly through lymphatics. That single contrast is why the two are staged and treated differently.", ref:"B&L 86 p.1569 · Das 40 p.630 · SRB 26 p.1070"},
    {id:"tst32", lv:2, type:"Pathology", q:"Describe a seminoma, gross and microscopic.",
     a:"B&L: the cut surface is homogeneous and pinkish cream, and it appears to compress neighbouring testicular tissue; microscopically it consists of oval cells with clear cytoplasm and large rounded nuclei with prominent acidophilic nucleoli, in sheets resembling spermatocytes separated by a fine fibrous stroma. SRB: lobulated, fleshy, homogeneous, creamy or pinkish, starting in the mediastinum of the testis and the lower pole. The prognostic detail to add: active lymphocytic infiltration of the tumour suggests a good host response and a better prognosis. Seminoma accounts for 50% of testicular germ cell tumours and seldom occurs in childhood or over 70. SRB's four types, which an Indian paper may ask for: typical or classic, with a syncytiotrophoblastic form in 15% producing high beta-HCG; spermatocytic, in older men, in which spread is very rare; anaplastic, with a high mitotic index and pleomorphism and a high potential to spread; and atypical.", ref:"B&L 86 p.1569 · SRB 26 p.1070 · B&L 86 p.1570"},

    {id:"tst40", lv:3, type:"Pathology", q:"How much does an undescended testis raise the risk of cancer?",
     a:"Give the direction and the condition, then a number. An undescended testis carries a substantially increased risk, and the commonest tumour in an untreated one is seminoma. S Das: undescended testis is about 50 times more vulnerable to malignant transformation, which is not reduced by late orchidopexy. B&L gives figures an order of magnitude lower, for testes that have been brought down: the risk is around two to three times the general population if orchidopexy is done before puberty and five to six times if after, and the risk does not seem different when orchidopexy is done early in infancy compared with later in childhood. They are not the same quantity: the old 30 to 50 fold figures come from series of untreated, often intra-abdominal testes, while B&L's are the residual risk after treatment. They also agree about late repair, since post-pubertal orchidopexy leaves a five- to six-fold risk against two to three.", ref:"Das 40 p.630 · B&L 86 p.1559"},
    {id:"tst41", lv:3, type:"Investigation", q:"The books give different marker percentages. What do you say?",
