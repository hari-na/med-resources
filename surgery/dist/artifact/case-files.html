    // citations: first tap fetches the excerpts, then opens the pane
    guide.addEventListener("click", function (ev) {
      var c = ev.target.closest("cite.src");
      if (!c || tool.kind === "pen" || tool.kind === "ink-hl" || tool.kind === "erase") return;
      ev.preventDefault();
      ev.stopPropagation();
      var k = citeKeyOf(c);
      if (!k) return;
      if (citesState === "ready") { openCite(k); return; }
      if (citesState === "failed") return;
      loadCites().then(function (j) { if (j) openCite(k); });
    });

    guide.addEventListener("keydown", function (ev) {
      if (ev.key !== "Enter" && ev.key !== " ") return;
      var c = ev.target.closest && ev.target.closest("cite.src[data-cite-key]");
      if (!c) return;
      ev.preventDefault();
      openCite(c.getAttribute("data-cite-key"));
    });

    // recall mode: tap a hidden answer to show it
    guide.addEventListener("click", function (ev) {
      if (state.recall !== "on") return;
      var t = ev.target.closest(".why, dl.findings dd, .viva .ans");
      if (t && guide.contains(t)) t.classList.toggle("revealed");
    });

    // tapping a highlight removes it; tapping a note opens it
    guide.addEventListener("click", function (ev) {
      var n = ev.target.closest(".rdr-note");
      if (n) { openNoteEditor(null, n.getAttribute("data-nid")); return; }
      var m = ev.target.closest(".rdr-mark");
      if (m && tool.kind !== "pen" && tool.kind !== "ink-hl" && tool.kind !== "erase") {
        removeMarkAt(m);
      }
    });
  }


  // ------------------------------------------------------------------ source pane
  // Tapping a citation shows what the book actually said, in a pane over the guide rather
  // than a new tab, so the reader keeps their place. The excerpts live in citations.json,
  // fetched once on the first tap; without it the chips stay inert rather than erroring.

  var CITES = null, citesState = "idle";   // idle | loading | ready | failed
  var citePane = null;

  // The book id is the class beside "src"; the rest of the key is every number in the chip,
  // in order. That covers the simple case, comma lists, page ranges, and the one chip that
  // carries two chapters, and it matches the rule the extractor used to name its entries.
  function citeKeyOf(el) {
    var book = null;
    for (var i = 0; i < el.classList.length; i++) {
      if (el.classList[i] !== "src") { book = el.classList[i]; break; }
    }
    if (!book) return null;
    var nums = (el.textContent || "").match(/[0-9]+/g);
    if (!nums || !nums.length) return null;
    return book + "-" + nums.join("-");
  }

  var citesPromise = null;

  function loadCites() {
    if (citesPromise) return citesPromise;
    citesState = "loading";
    citesPromise = fetch("citations.json")
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { CITES = j; citesState = "ready"; markCitesClickable(); return j; })
      .catch(function () { citesState = "failed"; return null; });
    return citesPromise;
  }

  function markCitesClickable() {
    if (!guide || !CITES) return;
    [].forEach.call(guide.querySelectorAll("cite.src"), function (c) {
      var k = citeKeyOf(c);
      if (k && CITES.citations && CITES.citations[k]) {
        c.setAttribute("data-cite-key", k);
        c.tabIndex = 0;
      }
    });
  }

  function openCite(key) {
    if (!CITES) return;
    var c = CITES.citations[key];
    if (!c) return;
    var book = (CITES.books || {})[c.book] || { title: c.book, edition: "" };

    var body = (c.pages || []).map(function (pid) {
      var pg = (CITES.pages || {})[pid];
      if (!pg) return "";
      return '<div class="rdr-src-page">' +
        '<div class="rdr-src-pno">page ' + pg.page + '</div>' +
        (pg.before ? '<p class="rdr-src-ctx">' + escHtml(pg.before) + '</p>' : "") +
        '<p class="rdr-src-main">' + escHtml(pg.text) + '</p>' +
        (pg.after ? '<p class="rdr-src-ctx">' + escHtml(pg.after) + '</p>' : "") +
        '</div>';
    }).join("");

    citePane.querySelector(".rdr-src-book").textContent = book.title;
    citePane.querySelector(".rdr-src-meta").textContent =
      [book.edition, "chapter " + c.chapter].filter(Boolean).join(" · ");
    citePane.querySelector(".rdr-src-body").innerHTML = body ||
      '<p class="rdr-src-ctx">That page was not extracted.</p>';
    citePane.hidden = false;
    citePane.querySelector(".rdr-src-close").focus();
  }

  function closeCite() { if (citePane) citePane.hidden = true; }

  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
    });
  }

  function buildCitePane() {
    citePane = el("aside", "rdr-srcpane");
    citePane.hidden = true;
    citePane.setAttribute("aria-label", "Source text");
    citePane.innerHTML =
      '<header class="rdr-src-head">' +
        '<div><div class="rdr-src-book"></div><div class="rdr-src-meta"></div></div>' +
        '<button class="rdr-src-close" aria-label="Close">&times;</button>' +
      '</header><div class="rdr-src-body"></div>' +
      '<footer class="rdr-src-foot">Quoted for study. The surrounding paragraphs are shown ' +
      'for context.</footer>';
    document.body.appendChild(citePane);
    citePane.querySelector(".rdr-src-close").addEventListener("click", closeCite);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeCite();
    });
  }


  // ------------------------------------------------------------------ backup
  // localStorage is the only copy of any of this, and Safari drops it for sites left
  // unvisited for a week. Export writes one file holding every person's settings,
  // highlights, notes, ink and viva results; restore puts them back.

  var BACKUP_FORMAT = "rx-backup";

  function backupKeys() {
    var out = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && (k.indexOf("reader:") === 0 || k.indexOf("surgery-case-files") === 0)) {
          out.push(k);
        }
      }
    } catch (e) {}
    return out;
  }

  function collectBackup() {
    var data = {};
    backupKeys().forEach(function (k) {
      try { data[k] = JSON.parse(localStorage.getItem(k)); }
      catch (e) { data[k] = localStorage.getItem(k); }
    });
    return {
      format: BACKUP_FORMAT,
      version: 1,
      exportedAt: new Date().toISOString(),
      keys: data
    };
  }

  // a plain-English summary, so a restore is not a leap of faith
  function describeBackup(b) {
    var people = {}, marks = 0, notes = 0, ink = 0, sessions = 0, docs = {};
    Object.keys(b.keys || {}).forEach(function (k) {
      var v = b.keys[k];
      if (k.indexOf("reader:") === 0) {
        var bits = k.split(":");
        if (bits[1] && bits[1] !== "_") people[bits[1]] = true;
        if (bits[2]) docs[bits[2]] = true;
        if (v && v.marks) marks += v.marks.length;
        if (v && v.notes) notes += v.notes.length;
        if (v && v.ink) ink += v.ink.length;
      } else if (v && v.students) {
        Object.keys(v.students).forEach(function (s) {
          people[s] = true;
          sessions += (v.students[s].sessions || []).length;
        });
      }
    });
    return {
      people: Object.keys(people),
      docs: Object.keys(docs).length,
      marks: marks, notes: notes, ink: ink, sessions: sessions
    };
  }

  function backupFilename() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return "rx-backup-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + ".json";
  }

  function exportBackup(say) {
    var json = JSON.stringify(collectBackup(), null, 1);
    var blob = new Blob([json], { type: "application/json" });
    var name = backupFilename();
    var size = Math.max(1, Math.round(json.length / 1024));

    // inside an artifact a download link does nothing, so ask the host to save it
    if (window.claude && window.claude.use) {
      window.claude.use("downloads").then(function (dl) {
        if (!dl) throw new Error("not granted");
        return dl.save({ filename: name, data: blob });
      }).then(function () {
        say("Saved " + name + ", " + size + " KB.");
      }).catch(function () {
        say("Could not save the file here. Open the guide on the website and export from there.");
      });
      return;
    }

    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    say("Saved " + name + ", " + size + " KB.");
  }

  var pendingRestore = null;

  function readBackupFile(file, say, onReady) {
    var fr = new FileReader();
    fr.onload = function () {
      var b;
      try { b = JSON.parse(fr.result); } catch (e) { b = null; }
      if (!b || b.format !== BACKUP_FORMAT || !b.keys) {
        say("That does not look like a backup from this site.");
        return;
      }
      pendingRestore = b;
      onReady(describeBackup(b), b);
    };
    fr.onerror = function () { say("Could not read that file."); };
    fr.readAsText(file);
  }

  function applyRestore(say) {
    if (!pendingRestore) return;
    var n = 0;
    Object.keys(pendingRestore.keys).forEach(function (k) {
      var v = pendingRestore.keys[k];
      try {
        localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v));
        n++;
      } catch (e) {}
    });
    pendingRestore = null;
    say("Restored " + n + " record" + (n === 1 ? "" : "s") + ". Reloading…");
    setTimeout(function () { location.reload(); }, 900);
  }

  // ------------------------------------------------------------------ interface

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function swatches(kind) {
    return PALETTE.map(function (p) {
      return '<button class="rdr-sw" data-colour="' + p.id + '" title="' + p.label + '" ' +
             'style="background:' + (kind === "ul" ? p.ul : p.hl) + '"></button>';
    }).join("");
  }

  function seg(name, opts, current) {
    return '<div class="rdr-seg" data-setting="' + name + '">' + opts.map(function (o) {
      return '<button data-v="' + o[0] + '"' + (current === o[0] ? ' class="on"' : '') +
             (o[2] ? ' data-locks-layout="1"' : '') + '>' + o[1] + '</button>';
    }).join("") + '</div>';
  }

        '<label>Text size</label>' +

  function attachCanvas() {
    if (!canvas) {
      canvas = el("canvas", "rdr-canvas");
      canvas.style.pointerEvents = "none";
      ctx = canvas.getContext("2d");

      // the stroke in progress lives on its own layer, above the committed one
      live = el("canvas", "rdr-canvas rdr-canvas-live");
      live.style.pointerEvents = "none";
      live.addEventListener("pointerdown", penDown);
      live.addEventListener("pointermove", penMove);
      live.addEventListener("pointerup", penUp);
      live.addEventListener("pointercancel", penUp);
      live.addEventListener("pointerleave", penUp);
      lctx = live.getContext("2d");
    }
    var host = guide.querySelector(".wrap") || guide;
    if (canvas.parentNode !== host.parentNode) {
      host.parentNode.insertBefore(canvas, host);
      host.parentNode.insertBefore(live, host);
    }
  }

  function wireUI(rail, studio) {
    document.getElementById("rdrStudio").addEventListener("click", function () {
      studio.hidden = !studio.hidden;
    });
    studio.querySelector(".rdr-close").addEventListener("click", function () { studio.hidden = true; });

    // settings segments
    studio.addEventListener("click", function (ev) {
      var b = ev.target.closest(".rdr-seg button");
      if (!b) return;
      var name = b.parentNode.getAttribute("data-setting");
      [].slice.call(b.parentNode.children).forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on");
      state[name] = b.getAttribute("data-v");
      save();
      applySettings();
    });

    function say(msg) {
      var el2 = document.getElementById("rdrSay");
      if (el2) el2.textContent = msg || "";
    }

    studio.querySelector(".rdr-export").addEventListener("click", function () {
      say("Preparing…");
      exportBackup(say);
    });

    var fileInput = studio.querySelector(".rdr-file");
    studio.querySelector(".rdr-import").addEventListener("click", function () {
      say("");
      fileInput.value = "";
      fileInput.click();
    });

    fileInput.addEventListener("change", function () {
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      readBackupFile(f, say, function (sum) {
        var box = document.getElementById("rdrRestore");
        var bits = [];
        if (sum.people.length) bits.push(sum.people.join(", "));
        if (sum.marks) bits.push(sum.marks + " highlight" + (sum.marks === 1 ? "" : "s"));
        if (sum.notes) bits.push(sum.notes + " note" + (sum.notes === 1 ? "" : "s"));
        if (sum.ink) bits.push(sum.ink + " ink stroke" + (sum.ink === 1 ? "" : "s"));
        if (sum.sessions) bits.push(sum.sessions + " viva session" + (sum.sessions === 1 ? "" : "s"));
        box.innerHTML =
          '<p>This file holds ' + escHtml(bits.join(", ") || "nothing recognisable") + '.</p>' +
          '<p class="rdr-warn">Restoring replaces what is in this browser now.</p>' +
          '<div class="rdr-backup">' +
            '<button class="rdr-cancel-restore">Cancel</button>' +
            '<button class="rdr-do-restore">Restore</button>' +
          '</div>';
        box.hidden = false;
        box.querySelector(".rdr-cancel-restore").addEventListener("click", function () {
          pendingRestore = null; box.hidden = true; say("");
        });
        box.querySelector(".rdr-do-restore").addEventListener("click", function () {
          box.hidden = true;
          applyRestore(say);
        });
      });
    });

    studio.addEventListener("click", function (ev) {
      var c = ev.target.closest(".rdr-clear");
      if (!c) return;
      var what = c.getAttribute("data-what");
      state[what] = [];
      if (what === "ink") { state.inkLayout = null; }
      save();
      if (what === "marks") renderMarks();
      if (what === "notes") renderNotes();
      if (what === "ink") redrawInk();
      updateLock();
    });

    // tools
    rail.addEventListener("click", function (ev) {
      var b = ev.target.closest(".rdr-tool");
      if (b) {
        var t = b.getAttribute("data-tool");
        tool.kind = (tool.kind === t) ? "hl" : t;
        [].slice.call(rail.querySelectorAll(".rdr-tool")).forEach(function (x) {
          x.classList.toggle("on", x.getAttribute("data-tool") === tool.kind);
        });
        var inkish = (tool.kind === "pen" || tool.kind === "ink-hl" || tool.kind === "erase");
        document.getElementById("rdrPal").innerHTML =
          swatches(tool.kind === "ul" || tool.kind === "pen" ? "ul" : "hl");
        document.getElementById("rdrPal").hidden = (tool.kind === "erase");
        document.getElementById("rdrEraseModes").hidden = (tool.kind !== "erase");
        markActiveSwatch();
        setPenMode(inkish);
        return;
      }
      var s = ev.target.closest(".rdr-sw");
      if (s) {
        tool.colour = s.getAttribute("data-colour");
        markActiveSwatch();
        return;
      }
      var m = ev.target.closest(".rdr-erase-modes button");
      if (m) {
        eraseMode = m.getAttribute("data-erase");
        [].slice.call(m.parentNode.children).forEach(function (x) {
          x.classList.toggle("on", x === m);
        });
      }
    });

    // selection bubble
    bubble.addEventListener("mousedown", function (e) { e.preventDefault(); });
    bubble.addEventListener("click", function (ev) {
      var b = ev.target.closest("button");
      if (!b) return;
      var act = b.getAttribute("data-act");
      if (act === "note") {
        var sel = window.getSelection();
        var block = blockOf(sel.anchorNode);
        hideBubble();
        if (block) openNoteEditor(block, "");
        return;
      }
      applyToSelection(act);
    });

    document.addEventListener("selectionchange", function () {
      if (tool.kind === "pen" || tool.kind === "ink-hl" || tool.kind === "erase") return;
      clearTimeout(wireUI._t);
      wireUI._t = setTimeout(onSelection, 120);
    });

    // note editor
    noteEditor.querySelector(".rdr-cancel").addEventListener("click", function () { noteEditor.hidden = true; });
    noteEditor.querySelector(".rdr-ok").addEventListener("click", function () {
      var text = noteEditor.querySelector("textarea").value.trim();
      var nid = noteEditor.dataset.nid;
      if (nid) {
        state.notes = state.notes.map(function (n) { return n.id === nid ? Object.assign({}, n, { text: text }) : n; })
                                 .filter(function (n) { return n.text; });
      } else if (text) {
        state.notes.push({
          id: "n" + Date.now() + Math.random().toString(36).slice(2, 5),
          b: +noteEditor.dataset.block, text: text, at: new Date().toISOString()
        });
      }
      save(); renderNotes();
      noteEditor.hidden = true;
    });
    noteEditor.querySelector(".rdr-del").addEventListener("click", function () {
      var nid = noteEditor.dataset.nid;
      state.notes = state.notes.filter(function (n) { return n.id !== nid; });
      save(); renderNotes();
      noteEditor.hidden = true;
    });

    window.addEventListener("resize", function () { clearTimeout(wireUI._r); wireUI._r = setTimeout(layoutInk, 150); });
    window.addEventListener("scroll", hideBubble, { passive: true });

    markActiveSwatch();
  }

  function markActiveSwatch() {
    [].slice.call(document.querySelectorAll(".rdr-sw")).forEach(function (s) {
      s.classList.toggle("on", s.getAttribute("data-colour") === tool.colour);
    });
  }

  // ------------------------------------------------------------------ print

  function openAllForPrint() {
    window.__rdrReopen = [];
    [].slice.call(document.querySelectorAll("details:not([open])")).forEach(function (d) {
      window.__rdrReopen.push(d); d.open = true;
    });
  }
  function restoreAfterPrint() {
    (window.__rdrReopen || []).forEach(function (d) { d.open = false; });
    window.__rdrReopen = [];
  }
  window.addEventListener("beforeprint", openAllForPrint);
  window.addEventListener("afterprint", restoreAfterPrint);

  // ------------------------------------------------------------------ boot

  function start() {
    if (!guide) return;
    bindGuide();
    indexBlocks();
    if (!document.querySelector(".rdr-rail")) buildUI();
    else attachCanvas();
    applySettings();
    renderMarks();
    renderNotes();
    markCitesClickable();
    setTimeout(layoutInk, 60);
    updateLock();
    syncPull();
    prefsPull();
  }

  function reloadState() {
    var s = load();
    Object.keys(DEFAULTS).forEach(function (k) {
      state[k] = (s[k] === undefined) ? DEFAULTS[k] : s[k];
    });
    applyPrefsTo(state);
    // strokes saved before the highlighter existed carry no kind, and the old pixel
    // eraser stored erase strokes that the vector model has no use for
    state.ink = (state.ink || []).filter(function (x) { return !x.erase; })
                                 .map(function (x) {
      if (!x.k) x.k = "pen";
      if (!x.id) x.id = "s" + Math.random().toString(36).slice(2, 8);
      return x;
    });
  }

  // The standalone document already holds the guide, so boot now. Inside the artifact the
  // guide is fetched and injected when the reader opens it, so wait to be called.
  if (guide) start();
  else window.ReaderBoot = function (opts) {
    opts = opts || {};
    guide = opts.guide || document.querySelector(".guide");
    if (!guide) return null;
    DOC = opts.doc || DOC;
    if (opts.syncRoot !== undefined) cfg.syncRoot = opts.syncRoot;
    if (opts.onTheme !== undefined) cfg.onTheme = opts.onTheme;
    if (opts.student !== undefined) student = (opts.student || "").trim().toLowerCase() || "_";
    reloadState();
    start();
    return window.Reader;
  };

  window.Reader = {
    setStudent: function (name) {
      student = (name || "").trim().toLowerCase() || "_";
      reloadState();
      if (!guide) return;          // nothing mounted yet; start() will apply it
      applySettings(); renderMarks(); renderNotes(); redrawInk(); updateLock();
      // A different student has a different record on the server, and this is the one
      // path into a mounted guide that did not go through start(), so without this the
      // new student read their local copy and never learned what the server held.
      syncPull();
      prefsPull();
    },
    remount: function (opts) {
      opts = opts || {};
      if (opts.guide) guide = opts.guide;
      if (opts.doc) DOC = opts.doc;
      if (opts.student !== undefined) student = (opts.student || "").trim().toLowerCase() || "_";
      reloadState();
      start();
    },
    state: function () { return state; }
  };
})();

<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------ config
  // Shaped so other subjects and cases drop in without touching the storage
  // layer: everything written is tagged with subject and case.

  var SUBJECT = "General Surgery";
  // Every guide in reference/ is built into dist/ as a standalone page, a body fragment and a
  // PDF, and publish_site.py discovers all three from dist/ rather than naming them, so adding a
  // case here needs nothing else. Two naming rules, both set by publish_site.py: the body
  // fragment keeps its number prefix, the PDF loses it.
  //   id   must equal the guide's data-doc attribute, because the reader stores a student's
  //        highlights and notes against it.
  //   bank is true only where this hub has a scored question bank for the case. The guides all
  //        carry their own viva as tap-to-reveal questions; the scored drill is separate.
  var CASES = [
    {num:"01", id:"inguinal-hernia", name:"Inguinal Hernia", kind:"long", bank:true},
    {num:"02", id:"thyroid-swelling", name:"Thyroid Swelling", kind:"long"},
    {num:"03", id:"breast-lump", name:"Breast Lump", kind:"long"},
    {num:"04", id:"gastric-outlet-obstruction", name:"Gastric Outlet Obstruction", kind:"long"},
    {num:"05", id:"obstructive-jaundice", name:"Obstructive Jaundice", kind:"long"},
    {num:"06", id:"right-iliac-fossa-mass", name:"Right Iliac Fossa Mass", kind:"long"},
    {num:"07", id:"liver-secondaries", name:"Liver Secondaries", kind:"long"},
    {num:"08", id:"varicose-veins", name:"Varicose Veins", kind:"long"},
    {num:"09", id:"peripheral-vascular-disease", name:"Peripheral Vascular Disease", kind:"long"},
    {num:"10", id:"ulcer", name:"Ulcer", kind:"short"},
    {num:"11", id:"sinus-and-fistula", name:"Sinus and Fistula", kind:"short"},
    {num:"12", id:"lipoma-and-sebaceous-cyst", name:"Lipoma and Sebaceous Cyst", kind:"short"},
    {num:"13", id:"cervical-lymphadenopathy", name:"Cervical Lymphadenopathy", kind:"short"},
    {num:"14", id:"neck-swellings", name:"Neck Swellings", kind:"short"},
    {num:"15", id:"salivary-swelling", name:"Salivary Swelling", kind:"short"},
    {num:"16", id:"oral-cavity-lesions", name:"Oral Cavity Lesions", kind:"short"},
    {num:"17", id:"hydrocele", name:"Hydrocele", kind:"short"},
    {num:"18", id:"varicocele", name:"Varicocele", kind:"short"},
    {num:"19", id:"undescended-testis", name:"Undescended Testis", kind:"short"},
    {num:"20", id:"dysphagia", name:"Dysphagia", kind:"short"},
    {num:"21", id:"testicular-tumour", name:"Testicular Tumour", kind:"short"},
    {num:"22", id:"lymphoedema", name:"Lymphoedema", kind:"short"},
    {num:"23", id:"carcinoma-penis", name:"Carcinoma of the Penis", kind:"short"},
    {num:"24", id:"benign-prostatic-hyperplasia", name:"Benign Prostatic Hyperplasia", kind:"short"},
    {num:"25", id:"anorectal-conditions", name:"Haemorrhoids, Fissure and Fistula-in-Ano", kind:"short"}
  ];

  // One line each, shown on the case page. Where a case has none, the generic line is used.
  var BLURB = {
    "inguinal-hernia":
      "The most commonly allotted surgical long case, and the one where the examiner is least " +
      "interested in your diagnosis. He can see the lump. What he wants is the reasoning behind " +
      "each question you asked and each test you performed.",
    "peripheral-vascular-disease":
      "Two pains to separate, claudication from rest pain, and then one decision: is this limb " +
      "threatened? The staging systems your examiner asks for are not the ones the current " +
      "edition uses, and section 1 sets out how to answer both."
  };

  var CASE = CASES[0];

  function caseById(id) {
    for (var i = 0; i < CASES.length; i++) if (CASES[i].id === id) return CASES[i];
    return null;
  }

  // claude.ai refuses to serve a published sibling file as a top-level document
  // (ERR_BLOCKED_BY_RESPONSE), so the guide is fetched and rendered inside this page
  // and the PDF is handed over through the downloads capability.
  function guideBodyFile(c) { return c.num + "-" + c.id + ".body.html"; }
  function pdfFile(c)       { return c.id + ".pdf"; }

  var BANK = [
    {id:"h01", lv:1, type:"Anatomy", q:"Define a hernia.",
     a:"S Das: the protrusion of the whole or a part of a viscus through the wall that contains it. Bailey & Love: the bulging of part of the contents of the abdominal cavity through a weakness in the abdominal wall.", ref:"Das 38 p.594 · B&L 64 p.1058"},
    {id:"h02", lv:1, type:"Anatomy", q:"Name the three parts of a hernia, and the four parts of its sac.",
     a:"Covering, sac and contents. The sac has a mouth, neck, body and fundus.", ref:"SRB 18 p.741"},
    {id:"h03", lv:1, type:"Anatomy", q:"By what route does an indirect inguinal hernia leave the abdomen?",
     a:"Through the deep inguinal ring, lateral to the inferior epigastric vessels, obliquely along the inguinal canal, emerging at the superficial ring. Lateral by origin, oblique by course.", ref:"Das 38 p.594 · B&L 64 p.1066"},
    {id:"h04", lv:1, type:"Anatomy", q:"Give the boundaries of Hesselbach's triangle.",
     a:"Lateral border of rectus abdominis medially, inferior epigastric vessels laterally, inguinal ligament below. B&L names the pubic bone and iliopubic tract as the lower border. The neck of a direct sac lies medial to the inferior epigastric vessels.", ref:"Das 38 p.603 · B&L 64 p.1066"},
    {id:"h05", lv:1, type:"Examination", q:"What are the two classical signs of an uncomplicated hernia, and the two caveats?",
     a:"Impulse on coughing and reducibility. Caveats: a swelling with a cough impulse is not necessarily a hernia, and a swelling with no cough impulse may still be one.", ref:"Das 38 p.598 · B&L 64 p.1061"},
    {id:"h06", lv:1, type:"Classification", q:"When is an inguinal hernia 'complete'?",
     a:"Only when the contents reach the bottom of the scrotum. Short of that, incomplete; still inside the superficial ring, a bubonocele.", ref:"Das 38 p.594, p.603"},
    {id:"h07", lv:1, type:"History", q:"Which inguinal hernia is typical of the young, and which of the old?",
     a:"Indirect in the young, and always the congenital type in neonates and young children. Direct mostly in older subjects, more common above 40.", ref:"Das 38 p.594, p.604 · B&L 64 p.1066"},
    {id:"h08", lv:1, type:"Classification", q:"Name the possible contents of a hernial sac.",
     a:"Omentum (omentocele/epiplocele), intestine (enterocele), bladder (cystocele), Meckel's diverticulum (Littre's), part of the bowel circumference (Richter's), appendix (Amyand's), ovary with fallopian tube, and fluid.", ref:"SRB 18 p.741–742"},
    {id:"h09", lv:1, type:"Examination", q:"Why must the patient be examined standing?",
     a:"A direct hernia disappears the moment he lies down. S Das examines standing first; B&L lies the patient down first to reduce and assess. Do both: standing to demonstrate, supine to assess the defect.", ref:"Das 38 p.596 · B&L 64 p.1061"},
    {id:"h10", lv:1, type:"Examination", q:"How far must you expose the patient?",
     a:"Both inguinal regions, from the umbilicus to mid-thigh. Inadequate exposure of this area is exactly why femoral hernias are missed.", ref:"Das 38 p.595 · B&L 64 p.1071"},
    {id:"h11", lv:1, type:"Classification", q:"Name the clinical types of hernia.",
     a:"Reducible, irreducible, obstructed, inflamed, strangulated, and SRB adds occult. B&L's complexity scale ends in infarcted.", ref:"Das 38 p.604–605 · SRB 18 p.742–743 · B&L 64 p.1060"},
    {id:"h12", lv:1, type:"Anatomy", q:"Where is the superficial inguinal ring, and what should it admit?",
     a:"A triangular opening in the external oblique aponeurosis, 1.25 cm above the pubic tubercle, bounded by a superomedial and an inferolateral crus. Normally it does not, or only just, admits the tip of the little finger.", ref:"SRB 18 p.743"},
    {id:"h13", lv:1, type:"Examination", q:"Where does an inguinal hernia lie relative to the pubic tubercle? And a femoral hernia?",
     a:"Inguinal: above the inguinal ligament and medial to the pubic tubercle. Femoral: below the ligament and lateral to the tubercle. Edition note, not a live disagreement: B&L 26e said 'above and lateral' for the inguinal hernia and 28e has deleted that sentence, so the books now agree. The only relation 28e prints is the femoral one, and it matches S Das.", ref:"Das 38 p.597 · B&L 64 p.1071"},
    {id:"h14", lv:1, type:"History", q:"What proportion of adult hernia repairs are inguinal?",
     a:"B&L 28e has dropped the 80% figure. What it says now is that inguinal hernia is the most common hernia in men and around 10 times more common in men than in women. More than 80% of inguinal hernias are indirect, and almost all hernias in children and women are indirect.", ref:"B&L 64 p.1065 · Das 38 p.603"},

    {id:"h20", lv:2, type:"History", q:"Describe the pain of an early hernia. What does it mean when it stops?",
     a:"Dragging and aching, worse as the day passes, often appearing before the lump. It ceases once the hernia is fully formed: so settling pain means the hernia has finished forming, not that he is improving. B&L: sharp intermittent pain suggests pinching; severe pain means high risk of strangulation.", ref:"Das 38 p.594 · B&L 64 p.1061"},
    {id:"h21", lv:2, type:"History", q:"Give the four set questions for any inguinoscrotal swelling.",
     a:"How did it start: on straining? Where did it first appear: groin descending, or below the crease ascending? What size when first seen, bottom of scrotum at once, or gradual? Does it disappear on lying down?", ref:"Das 38 p.594–595"},
    {id:"h22", lv:2, type:"History", q:"Is a hernia caused by heavy lifting?",
     a:"Classically yes. But B&L 28e begins from the premise that a normal abdominal wall has sufficient strength to resist high pressure, so the strain brings the hernia to the patient's attention rather than causing it. The evidence favours an inherited imbalance of collagen types, supported by the association with aortic aneurysm, by the difficulty of repair in Ehlers-Danlos syndrome, and by smoking raising risk through impaired collagen maturation. SRB agrees in its own words, 'metastatic emphysema of Read'. Edition note: the Olympic weightlifters line was 26e's way of making this argument and has been removed from 28e, so quote the mechanism, not the weightlifters.", ref:"B&L 64 p.1060 · SRB 18 p.741"},
    {id:"h23", lv:2, type:"Examination", q:"A hernia with no cough impulse. What does that mean?",
     a:"A complication, strangulated or incarcerated: or a neck blocked by adhesions. It is also typical of femoral hernia, where its absence leads to misdiagnosis as a lymph node. A saphena varix and a varicocele give false positives.", ref:"Das 38 p.597, p.599 · B&L 64 p.1061, p.1071"},
    {id:"h24", lv:2, type:"Examination", q:"Describe Zieman's technique and its precondition.",
     a:"Index on the deep ring (indirect), middle on the superficial ring (direct), ring finger on the saphenous opening 4 cm below and lateral to the pubic tubercle (femoral); the patient holds his nose and blows, or coughs. Only valid with no obvious swelling, or after complete reduction.", ref:"Das 38 p.599"},
    {id:"h25", lv:2, type:"Examination", q:"In the invagination test, what does the direction of the finger tell you?",
     a:"Directly backwards, direct. Upwards, backwards and outwards: indirect. Impulse on the pulp means direct; on the tip, oblique.", ref:"Das 38 p.600–601"},
    {id:"h26", lv:2, type:"Examination", q:"Explain the ring occlusion test and its logic.",
     a:"Standing, hernia reduced, thumb over the deep ring, cough. An indirect hernia comes through that ring so it is blocked; a direct one comes medial to it and bulges medial to your finger. B&L warns even experienced surgeons cannot distinguish the two with certainty.", ref:"Das 38 p.601 · B&L 64 p.1067"},
    {id:"h27", lv:2, type:"Examination", q:"Distinguish an enterocele from an omentocele at the bedside.",
     a:"Enterocele: elastic, resonant, reduces with a gurgle, first part difficult and last part easy, may show peristalsis. Omentocele: doughy and granular, dull, no gurgle, first part easy and last part resists.", ref:"Das 38 p.598, p.600 · SRB 18 p.742"},
    {id:"h28", lv:2, type:"Examination", q:"Why is rectal examination obligatory in a case of hernia?",
     a:"To exclude chronic constipation and an enlarged prostate, causes of straining that recur the hernia. And prostatic symptoms predict postoperative urinary retention.", ref:"Das 38 p.603 · B&L 64 p.1070"},
    {id:"h29", lv:2, type:"Complications", q:"Differentiate an irreducible from a strangulated hernia.",
     a:"Both are irreducible. The strangulated one is extremely tense and tender, may have red overlying skin, and has lost its cough impulse. All absent in pure irreducibility.", ref:"Das 38 p.604–605"},
    {id:"h30", lv:2, type:"Complications", q:"Define obstructed hernia, and say why the diagnosis is dangerous.",
     a:"Irreducibility plus intestinal obstruction with blood supply intact. It shares two of the three features of strangulation, so calling a strangulated hernia 'obstructed' wastes the time that would have saved the patient.", ref:"Das 38 p.604–605"},
    {id:"h31", lv:2, type:"Examination", q:"Why examine abdominal muscle tone, and how?",
     a:"To choose the operation, herniorrhaphy if tone is good, hernioplasty if poor. Observe in profile; the rising test, where weak obliques give Malgaigne's bulgings; and a finger in the superficial ring during a cough.", ref:"Das 38 p.602"},
    {id:"h32", lv:2, type:"History", q:"A hernia that enlarges before micturition and shrinks after. What is in it?",
     a:"Urinary bladder: a cystocele, only in a direct or sliding hernia. Pressing it provokes a desire to micturate. The medially placed bladder is pulled into a direct hernia.", ref:"Das 38 p.604 · B&L 64 p.1066"},
    {id:"h33", lv:2, type:"Management", q:"Which investigation establishes the diagnosis?",
     a:"None, it is clinical. Investigations are for fitness and cause. In doubt: ultrasound first, low cost but highly operator dependent; CT for complex or incisional hernia, and for planning abdominal wall reconstruction; MRI for sportsman's groin; laparoscopy for an occult contralateral hernia, though it will not show an intraparietal hernia. Plain x-ray is of little value. Herniography is SRB's answer, not B&L 28e's. And a negative scan does not exclude the hernia you felt, because groin hernias tend to reduce in a supine patient.", ref:"B&L 64 p.1061, p.1062"},
    {id:"h34", lv:2, type:"Management", q:"State the four principles of any hernia repair.",
     a:"Reduce the contents and remove non-viable tissue; excise and close the peritoneal sac, though small sacs may be reduced intact; close the defect if possible; reinforce with mesh, since closure alone has a high recurrence rate and mesh reduces but does not prevent recurrence. B&L 28e adds a fifth: excise redundant skin if necessary for cosmesis.", ref:"B&L 64 p.1062"},
    {id:"h35", lv:2, type:"History", q:"A right direct hernia in a man with a right iliac fossa scar. Connect them.",
     a:"Appendicectomy through a McBurney incision injured the ilioinguinal nerve, weakening the inguinal region and producing a right-sided direct hernia.", ref:"SRB 18 p.741 · Das 38 p.595"},

    {id:"h40", lv:3, type:"Anatomy", q:"Where exactly is the deep inguinal ring?",
     a:"S Das and SRB: 1.25 cm above the mid-inguinal point, midway between the ASIS and the symphysis pubis. B&L: midway between the ASIS and the pubic tubercle, the midpoint of the inguinal ligament: 2–3 cm above the femoral pulse. The mid-inguinal point overlies the femoral artery; the midpoint of the ligament overlies the deep ring.", ref:"Das 38 p.599 · SRB 18 p.743 · B&L 64 p.1065"},
    {id:"h41", lv:3, type:"Complications", q:"Which hernia strangulates most often?",
     a:"Two answers to two questions. The most common strangulated hernia is the indirect inguinal, because inguinal hernias are far more numerous. The highest rate of strangulation is in the femoral hernia. Fifty per cent of femoral hernias present as an emergency, against five per cent of inguinal.", ref:"SRB 18 p.743 · B&L 64 p.1070, p.1071"},
    {id:"h42", lv:3, type:"Complications", q:"Why can a small hernia be more dangerous than a large one?",
     a:"Risk depends on the neck, not the bulk. A small rigid-walled defect traps contents, acts as a constriction ring, impedes venous return and progresses to strangulation. A wide-necked direct hernia rarely strangulates.", ref:"B&L 64 p.1060, p.1062"},
    {id:"h43", lv:3, type:"Complications", q:"What is Garrey's stricture?",
     a:"An ischaemic narrowing of small bowel that has been reduced from an obstructed hernia, a stricture forming later at the site of the constriction ring.", ref:"SRB 18 p.742–743"},
    {id:"h44", lv:3, type:"Classification", q:"What is Amyand's hernia? And Littre's?",
     a:"Amyand's, the appendix in an inguinal hernial sac, often incarcerated. Littre's: a Meckel's diverticulum in the sac; Littre described it 81 years before Meckel was born.", ref:"SRB 18 p.742–743"},
    {id:"h45", lv:3, type:"Complications", q:"What is Richter's hernia, and why is it treacherous?",
     a:"Strangulation of only part of the circumference of the bowel, often complicating a femoral hernia. It mimics gastroenteritis: colic, bowels opening normally, sometimes diarrhoea, so operation is delayed. It may be impossible to detect clinically, yet the bowel can necrose and perforate.", ref:"Das 38 p.605–606 · B&L 64 p.1060"},
    {id:"h46", lv:3, type:"Classification", q:"Classify a hernia by the European Hernia Society system.",
     a:"Primary or recurrent (P/R); lateral, medial or femoral (L/M/F); defect size in finger breadths at 1.5 cm each. A primary indirect hernia with a 3 cm defect is PL2.", ref:"B&L 64 p.1067"},
    {id:"h47", lv:3, type:"Classification", q:"What is a sliding hernia, and what is the surgical danger?",
     a:"Extraperitoneal viscus, caecum on the right, sigmoid on the left, bladder either side, slides outside the sac and forms part of its wall. B&L: the sac forms secondarily, which distinguishes it from a classic indirect hernia; the large bowel wall may not be covered by peritoneum and can be damaged at operation.", ref:"Das 38 p.605 · B&L 64 p.1066"},
    {id:"h48", lv:3, type:"Management", q:"Choose the operation, and justify it.",
     a:"Herniotomy in a child: the wall is normal and in infants the rings are superimposed with no obliquity. Herniorrhaphy in a young adult with good tone. Hernioplasty with mesh where tone is poor, Malgaigne's bulgings are present, or the hernia is large or recurrent. Lichtenstein is commonest worldwide; laparoscopic TEP or TAPP for bilateral or recurrent hernia.", ref:"SRB 18 p.743 · Das 38 p.602 · B&L 64 p.1068-1069"},
    {id:"h49", lv:3, type:"Management", q:"Describe the Shouldice repair and how it differs from Bassini.",
     a:"Bassini sutures conjoint tendon to inguinal ligament from pubic tubercle to deep ring. Shouldice first incises the transversalis fascia from deep ring to pubic tubercle and closes it as a double-thick, two-layered posterior wall, double breasting: then the external oblique likewise. The only one of 150+ modifications with benefit; under 2% lifetime failure in expert hands, identical to Bassini in general hands.", ref:"B&L 64 p.1068"},
    {id:"h50", lv:3, type:"Management", q:"What size mesh, and what must it cover?",
     a:"Lichtenstein: 8 × 15 cm over the posterior wall, split around the cord at the deep ring. Laparoscopic: 10 × 15 cm crossing the midline into the retropubic space and 5 cm lateral to the deep ring, covering Hesselbach's triangle, the deep ring and the femoral canal together. At least 2 cm overlap, up to 5 cm.", ref:"B&L 64 p.1068, p.1069"},
    {id:"h51", lv:3, type:"Management", q:"Why are lightweight large-pore meshes preferred?",
     a:"Better integration, less contracture, less foreign body reaction, more flexibility and better comfort. Heavyweight mesh provokes a greater fibrous reaction, with collagen contraction and stiffening, impaired abdominal wall mobility, foreign body sensation and pain. Note the vocabulary: the mesh does not shrink, the fibrous tissue grown into it contracts, so 'mesh contracture' is the accurate term, and it can exceed 50% of area. Edition note: 28e has dropped the weight thresholds in g/m² and argues from pore size instead, favouring at least 1 mm in all directions.", ref:"B&L 64 p.1063, p.1064"},
    {id:"h52", lv:3, type:"Management", q:"Groin pain four months after a Lichtenstein repair. What is it?",
     a:"Chronic pain: defined as pain at three months, the commonest complication of open flat mesh repair, reported up to 20%. Most severe form is neuralgic, from injury to or irritation of the ilioinguinal, iliohypogastric or genital branch of the genitofemoral nerve, or from mesh shrinkage.", ref:"B&L 64 p.1069, p.1070"},
    {id:"h53", lv:3, type:"Management", q:"Laparoscopic or open, what does the evidence say?",
     a:"Laparoscopic repair gives less pain both immediately and up to five years later, faster return to full activity, and fewer wound complications: infection, bleeding and seroma. Particular benefit in bilateral hernias and in recurrence after open repair. Note what is not claimed: recurrence is no different between open and laparoscopic, nor between mesh types. The limit is a long learning curve. Robot assistance has shown little additional patient benefit so far and is hard to justify on cost for a simple repair. Edition note: 28e no longer cites the 'over 60 randomised trials' figure.", ref:"B&L 64 p.1069, p.1070"},
    {id:"h54", lv:3, type:"Management", q:"Would you repair the asymptomatic other side?",
     a:"Occult contralateral hernias are present in up to 20% of patients, so the other groin must always be examined, and a patient with a single hernia has a 50% lifetime risk of developing one on the other side. Some surgeons have suggested offering bilateral repair, especially if laparoscopic surgery is planned, but that is not widespread practice. Edition note: the lifetime risk was 33% in 26e and is 50% in 28e.", ref:"B&L 64 p.1061, p.1067"},
    {id:"h55", lv:3, type:"Examination", q:"List the differential diagnosis of a groin swelling.",
     a:"Integument: sebaceous cyst, lipoma, neurofibroma. Hernia: inguinal, femoral. Lymphatic: inguinal lymphadenopathy. Vascular: saphena varix, aneurysm. Inguinal canal: ectopic testis, lipoma or hydrocele of the cord, hydrocele of the canal of Nuck. Deep: psoas abscess. The common four are inguinal hernia, femoral hernia, inguinal lymphadenopathy and saphena varix.", ref:"SRB 18 p.741"},
    {id:"h56", lv:3, type:"Complications", q:"A patient has unexplained small bowel obstruction. What must you do?",
     a:"Examine the groins carefully for a femoral hernia. It is missed because the area is inadequately exposed, it may be only 1–2 cm, it loses its cough impulse early, and it is mistaken for a lymph node. CT in obstruction can identify one the clinician missed.", ref:"B&L 64 p.1071"},
    {id:"h57", lv:3, type:"Management", q:"Does every hernia need repair?",
     a:"No. Small hernias can be more dangerous than large, because risk follows the defect and not the lump. Femoral hernia should always be repaired. Recommend repair when complications are likely, for symptomatic or irreducible hernias, when reduction is getting harder or the hernia is enlarging, and in younger adults. Watchful waiting in an asymptomatic inguinal hernia in an elderly patient appears generally safe, with an annual crossover to surgery of around 10% as symptoms develop. Trusses are not recommended.", ref:"B&L 64 p.1062"}
  ];

  var LEVELS = [
    {n:1, name:"Foundation", desc:"Definitions, anatomy and the signs you must never fumble."},
    {n:2, name:"Clinical",  desc:"History technique, the special tests, and telling complications apart."},
    {n:3, name:"Examiner's edge", desc:"Where the three books disagree, named varieties, and the evidence."}
  ];

  // ------------------------------------------------------------------ storage
  // One record per student, keyed case-insensitively. The typed spelling is kept for display.

  var LS = "surgery-case-files-v2";

  // Storage used to fail in silence. A quota error, private browsing, or blocked site data
  // made save() a no-op, and because pushAnswers reads the batch back out of storage, nothing
  // was stored and nothing was sent either: a finished drill simply evaporated and the
  // progress page said "nothing drilled yet". A parse error was worse, because store()
  // returned {} and the next write replaced every student on the device.
  var storeBroken = false;

  function store() {
    var raw = null;
    try { raw = localStorage.getItem(LS); } catch (e) { storeBroken = true; return {}; }
    if (!raw) return {};
    try { return JSON.parse(raw); } catch (e) {
      // keep the damaged blob rather than overwriting it; it may be recoverable by hand
      try { localStorage.setItem(LS + ":corrupt:" + Date.now(), raw); } catch (e2) {}
      storeBroken = true;
      return {};
    }
  }

  function save(o) {
    try {
      localStorage.setItem(LS, JSON.stringify(o));
      storeBroken = false;
      return true;
    } catch (e) {
      storeBroken = true;
      warnStorage();
      return false;
    }
  }

  // Said once, plainly, and only when it is true. This is the opposite of the "saved on this
  // device" footers: it is worth interrupting someone for, because their work is not being kept.
  function warnStorage() {
    if (document.getElementById("storagewarn")) return;
    var el = document.createElement("div");
    el.id = "storagewarn";
    el.className = "storagewarn";
    el.textContent = "This browser is not letting the page save anything, so your answers and "
                   + "notes will be lost when you leave. Private browsing or full storage is "
                   + "the usual cause.";

  function keyOf(name) { return String(name).trim().toLowerCase().replace(/\s+/g, " "); }

  // --------------------------------------------- per-question history
  //
  // A session is only written when a whole level is finished, which meant answering three
  // questions and walking away left no trace at all: the answers sat in an in-memory array
  // that went out of scope, so the progress page and the database were both empty and
  // neither was wrong. Nothing about it looked broken, which is why it survived.
  //
  // These records are written the instant a question is marked, so partial work survives
  // leaving, navigating back, closing the tab or switching person. They are also the thing
  // that makes a question answerable across sessions: how many times this person has met it,
  // how often they got it, and whether they had it last time.

  function qKey(caseId, qid) { return caseId + "::" + qid; }

  function recordAnswer(q, ok) {
    if (!student.key) return;
    var s = store();
    s.students = s.students || {};
    var r = s.students[student.key] || { name: student.name, sessions: [] };
    r.name = student.name;
    r.questions = r.questions || {};

    var k = qKey(CASE.id, q.id);
    var rec = r.questions[k] || { t: q.type, n: 0, ok: 0, last: 0, at: null };
    rec.t = q.type;                      // kept current, in case a question is recategorised
    rec.n += 1;
    if (ok) rec.ok += 1;
    rec.last = ok ? 1 : 0;
    rec.at = new Date().toISOString();
    rec.synced = false;

    r.questions[k] = rec;
    s.students[student.key] = r;
    s.lastStudent = student.key;
    save(s);
    pushAnswersLater();
  }

  // Everything this person has ever answered for the case on screen.
  function answersForCase(key) {
    var r = (store().students || {})[key];
    var out = {};
    if (!r || !r.questions) return out;
    var prefix = CASE.id + "::";
    Object.keys(r.questions).forEach(function (k) {
      if (k.indexOf(prefix) === 0) out[k.slice(prefix.length)] = r.questions[k];
    });
    return out;
  }

  // Reading the history back, which never happened before.
  //
  // Answers only ever went up. A second device, or the same device after iOS evicted its
  // storage, showed an empty progress page even though the rows were sitting in the database,
  // and worse, its first answer posted attempts:1 over the server's attempts:12 and destroyed
  // the history, because the worker compares timestamps and that write was genuinely newer.
  //
  // Pulling on sign-in fixes both: the device starts from what the server holds, so there is
  // nothing to overwrite. Merging is per question and takes whichever side was written last.
  // answersPulled holds the student whose answers the server has actually answered for.
  // Until it matches, nothing may be pushed: a push before the first successful pull is
  // what posted attempts:1 over the server's attempts:12 in the first place.
  var answersPulled = "";
  var answerPullTimer = null;
  var answerPullMs = 1000;

  function answersReady() { return !SYNC || (!!student.key && answersPulled === student.key); }

  function pullAnswersLater(ms) {
    if (!SYNC || !student.key) return;
    clearTimeout(answerPullTimer);
    answerPullTimer = setTimeout(function () { pullAnswers(); }, ms || answerPullMs);
  }

  function pullAnswers(done) {
    if (!SYNC || !student.key) { if (done) done(); return; }
    // the name this request is for. Reading student.key again when the response lands is
    // how one student's history was merged into the next student's record.
    var mine = student.key;
    fetch(SYNC + "/api/answers?student=" + encodeURIComponent(mine))
      .then(function (r) {
        // a 503 is not an empty history, and must not be mistaken for one
        if (!r.ok) throw new Error("answers pull " + r.status);
        return r.json();
      })
      .then(function (j) {
        if (mine !== student.key) return;        // the reader switched name; not ours to apply
        answersPulled = mine;
        answerPullMs = 1000;
        if (!j || !j.answers) return;
        var s = store();
        s.students = s.students || {};
        var rec = s.students[student.key] || { name: student.name, sessions: [] };
        rec.questions = rec.questions || {};
        var merged = 0;
        j.answers.forEach(function (a) {
          var k = qKey(a.caseId, a.questionId);
          var mine = rec.questions[k];
          if (!mine || !mine.at || (a.at && a.at > mine.at)) {
            rec.questions[k] = { t: a.type, n: a.attempts, ok: a.correct,
                                 last: a.lastOk ? 1 : 0, at: a.at, synced: true };
            merged++;
          }
        });
        if (merged) {
          s.students[mine] = rec;
          save(s);
        }
      })
      .catch(function () {
        // we still do not know what the server holds, so leave answersPulled alone and
        // try again; nothing is pushed in the meantime
        if (mine === student.key) {
          pullAnswersLater(answerPullMs);
          answerPullMs = Math.min(answerPullMs * 2, 60000);
        }
      })
      .then(function () { if (done) done(); });
  }

  var answerTimer = null;

  function pushAnswersLater() {
    if (!SYNC) return;
    clearTimeout(answerTimer);
    answerTimer = setTimeout(pushAnswers, 1500);   // let a burst of marking settle
  }

  // Sent as a batch of whole counters rather than individual events, so a repeat delivery is
  // harmless: the worker stores the counters it is given and the newest write wins.
  function pushAnswers() {
    if (!SYNC || !student.key) return;
    var mine = student.key;
    if (!answersReady()) {       // we do not yet know what the server holds for this name
      pullAnswersLater(200);
      pushAnswersLater();
      return;
    }
    var s = store();
    var r = (s.students || {})[student.key];
    if (!r || !r.questions) return;

    var batch = [];
    Object.keys(r.questions).forEach(function (k) {
      var rec = r.questions[k];
      if (rec.synced) return;
      var cut = k.indexOf("::");
      batch.push({
        caseId: k.slice(0, cut), questionId: k.slice(cut + 2), type: rec.t,
        attempts: rec.n, correct: rec.ok, lastOk: rec.last, at: rec.at
      });
    });
    if (!batch.length) return;

    fetch(SYNC + "/api/answers?student=" + encodeURIComponent(student.key), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ answers: batch })
    }).then(function (res) {
      if (!res.ok) return;
      return res.json().then(function (j) {
        if (mine !== student.key) return;
        // Mark synced only what the worker says it stored. It discards a row whose stamp
        // is older than the one it holds, and a bare ok used to be read as success, so
        // an attempt from a device with a slow clock was dropped and never retried.
        // The deployed worker may predate the stored list. Without this, every row would
        // look rejected, nothing would ever be marked synced, and the client would pull in
        // a loop against a server that is working perfectly well.
        var reports = !!(j && j.stored);
        var applied = {};
        ((j && j.stored) || []).forEach(function (st) {
          applied[qKey(st.caseId, st.questionId) + "::" + st.at] = true;
        });
        // re-read rather than reuse the snapshot: marking may have continued while in flight
        var s2 = store();
        var r2 = (s2.students || {})[mine];
        if (!r2 || !r2.questions) return;
        var rejected = 0;
        batch.forEach(function (b) {
          var k = qKey(b.caseId, b.questionId);
          var rec = r2.questions[k];
          if (!rec || rec.at !== b.at) return;
          if (!reports || applied[k + "::" + b.at]) rec.synced = true;
          else rejected++;
        });
        save(s2);
        // the server holds something newer for those questions, so re-read rather than
        // pushing the same losing write again
        if (rejected) { answersPulled = ""; pullAnswersLater(600); }
      });
    }).catch(function () {
      // offline is normal; the next mark or the next open sends it
    });
  }

  // ------------------------------------------------- sync, for the viva results
  //
  // The same bargain as the reader: this browser holds the real copy and the worker is a
  // mirror, so every failure here is swallowed and the viva carries on regardless. Someone
  // halfway through revising should never see a network error about a score.
  //
  // Each session carries an id generated here, and the worker inserts-or-ignores on it, so a
  // session that goes up twice, from a retry or from a second device, is still one row.

  var SYNC = "https://rx-sync.harnar.workers.dev";

  function newId() {
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }

  function markSynced(id) {
    var s = store(), changed = false;
    Object.keys(s.students || {}).forEach(function (k) {
      (s.students[k].sessions || []).forEach(function (r) {
        if (r.id === id && !r.synced) { r.synced = true; changed = true; }
      });
    });
    if (changed) save(s);
  }

  function postSession(rec) {
    if (!SYNC || !rec || !rec.id) return;
    fetch(SYNC + "/api/sessions", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(rec)
    }).then(function (r) {
      if (r.ok) markSynced(rec.id);
    }).catch(function () {
      // offline is normal and not worth reporting; flushSessions picks it up next time
    });
  }

  // Sessions finished while offline never reached the worker, so they are retried whenever
  // the page is opened. Without this, a session done on a train would be lost to the
  // database for good, even though the browser still has it.
  function flushSessions() {
    if (!SYNC) return;
    var s = store(), pending = [];
    Object.keys(s.students || {}).forEach(function (k) {
      (s.students[k].sessions || []).forEach(function (r) {
        if (r && r.id && !r.synced) pending.push(r);
      });
    });
    pending.slice(-50).forEach(postSession);
  }

  function studentRec(k) {
    var s = store();
    return (s.students && s.students[k]) || null;
  }
  function allStudents() {
    var s = store(), out = [];
    Object.keys(s.students || {}).forEach(function (k) {
      out.push({ key: k, name: s.students[k].name, sessions: s.students[k].sessions || [] });
    });
    return out.sort(function (a, b) { return b.sessions.length - a.sessions.length; });
  }

  function recordSession(rec) {
    var s = store();
    s.students = s.students || {};
    rec.id = rec.id || newId();
    rec.synced = false;                  // postSession flips this once the worker has it
    var r = s.students[rec.studentKey] || { name: rec.studentName, sessions: [] };
    r.name = rec.studentName;            // keep the latest spelling they typed
    r.sessions = (r.sessions || []).concat([rec]).slice(-200);
    s.students[rec.studentKey] = r;
    s.lastStudent = rec.studentKey;
    save(s);
    postSession(rec);                    // saved locally first, so a failure here costs nothing
  }

  var stack = [];

  function esc(s) {

    app.innerHTML = head(q) +
      '<div class="answer"><span class="tag">Answer</span>' + esc(q.a) +
      '<span class="ref">' + esc(q.ref) + '</span></div>' +
      '<div class="grade">' +
      '<button class="btn missed" id="no">I missed this</button>' +
      '<button class="btn got" id="yes">I had it</button></div>';
    on("yes", "click", function () { mark(q, true); });
    on("no", "click", function () { mark(q, false); });
  }

  function mark(q, ok) {
    results.push({ id: q.id, type: q.type, correct: ok });
    recordAnswer(q, ok);     // durable, before anything can navigate away
    idx++;
    screenQuestion();
  }

  // ------------------------------------------------------------------ summary

  function screenSummary() {
    var total = results.length;
    var score = results.filter(function (r) { return r.correct; }).length;
    var pct = total ? Math.round(score / total * 100) : 0;

    var byType = {};
    results.forEach(function (r) {
      if (!byType[r.type]) byType[r.type] = { ok: 0, n: 0 };
      byType[r.type].n++;
      if (r.correct) byType[r.type].ok++;
    });
    var types = Object.keys(byType).sort(function (a, b) {
      return (byType[a].ok / byType[a].n) - (byType[b].ok / byType[b].n);
    });
    var weakest = types.filter(function (t) { return byType[t].ok / byType[t].n < 0.7; });

    var rec = {
      studentKey: student.key, studentName: student.name,
      subject: SUBJECT, caseId: CASE.id, caseName: CASE.name,
      level: level, levelName: LEVELS[level-1].name,
      score: score, total: total, pct: pct,
      byType: byType, weakest: weakest,
      missed: results.filter(function (r) { return !r.correct; }).map(function (r) { return r.id; }),
      seen: results.map(function (r) { return r.id; }),
      at: new Date().toISOString()
    };
    // screenSummary is a render function and Back re-runs it, so recording here without a
    // guard wrote the same session again on every return, inflating attempts and the
    // completed-levels list and posting a duplicate row each time.
    if (!results.recorded) {
      results.recorded = true;
      recordSession(rec);
    }

    var html =
      '<div class="who"><span>Session complete · <b>' + esc(student.name) + '</b></span></div>' +
      '<h2>' + esc(LEVELS[level-1].name) + '</h2>' +
      '<p class="score">' + pct + '%<small> &nbsp;' + score + ' of ' + total + '</small></p>' +
      '<div class="breakdown">';
    types.forEach(function (t) {
      var d = byType[t], p = Math.round(d.ok / d.n * 100);
      html += '<div class="brow"><span class="bname">' + esc(t) + '</span>' +
              '<span class="bval">' + d.ok + '/' + d.n + '</span>' +
              '<span class="btrack"><i style="width:' + p + '%;background:' +
              (p >= 70 ? "var(--good)" : "var(--miss)") + '"></i></span></div>';
    });
    html += '</div>';
    html += weakest.length
      ? '<div class="verdict weak"><b>Work on ' + esc(weakest.join(", ")) + '.</b> Go back to ' +
        'those sections of the study guide before the next session.</div>'
      : '<div class="verdict strong"><b>Solid across every category.</b> Move up a level, or come ' +
        'back in a few days to test retention rather than recall.</div>';
    html += '<div class="row"><button class="btn" id="retry">Retry this level</button>' +
            '<button class="btn" id="levels">Another level</button>' +
            '<button class="btn primary" id="prog">Your progress</button></div>';

    app.innerHTML = html;
    on("retry", "click", function () { level = level; startDrill(level, true); });
    on("levels", "click", function () { replace(screenLevels); });
    on("prog", "click", function () { go(screenProgress); });

    syncSession(rec);
  }

  // ------------------------------------------------------------------ progress

  function screenProgress() {
    // a pull may still be in flight from sign-in; repaint once it lands
    if (SYNC && student.key && screenProgress._pulled !== student.key && !answersReady()) {
      // keyed by student, and only counted as done once the pull has actually succeeded,
      // so a failed pull no longer leaves the page showing "nothing drilled yet" forever
      screenProgress._pulled = student.key;
      pullAnswers(function () {
        if (!answersReady()) screenProgress._pulled = "";
        if (stack[stack.length - 1] === screenProgress) paint();
      });
    }

    var rec = studentRec(student.key);
    var sessions = (rec ? rec.sessions : []).filter(function (s) { return s.caseId === CASE.id; });
    sessions = sessions.slice().sort(function (a, b) { return new Date(b.at) - new Date(a.at); });

    var html = '<div class="who"><span>Progress for <b>' + esc(student.name) + '</b> · ' +
               esc(CASE.name) + '</span></div><h2>Where you stand</h2>';

    // Everything below is built from the per-question history rather than from finished
    // sessions. A single answered question counts, which is the whole point: this page used
    // to say "nothing here" to someone who had just answered three.
    var qs = answersForCase(student.key);
    var qids = Object.keys(qs);

    if (!qids.length && !sessions.length) {
      html += '<div class="empty">Nothing drilled yet for this case. Answer a single question ' +
              'and it is kept, so this page fills in as you go, even if you stop part way.</div>' +
              '<div class="row"><button class="btn primary" id="start">Start a session</button>' +
              '<button class="btn" id="switch">Switch person</button></div>' + askHtml();
      app.innerHTML = html;
      on("start", "click", function () { go(screenLevels); });
      on("switch", "click", function () { reset(screenWelcome); });
      wireAsk();
      return;
    }

    var agg = {}, totalQ = 0, totalOk = 0, wrongNow = [];
    qids.forEach(function (id) {
      var r = qs[id], t = r.t || "Uncategorised";
      if (!agg[t]) agg[t] = { ok: 0, n: 0 };
      agg[t].ok += r.ok; agg[t].n += r.n;
      totalQ += r.n; totalOk += r.ok;
      if (!r.last) wrongNow.push(id);
    });

    var seenCount = qids.length;
    var coverage = BANK.length ? Math.round(seenCount / BANK.length * 100) : 0;
    var overall = totalQ ? Math.round(totalOk / totalQ * 100) : 0;
    var best = sessions.length
      ? Math.max.apply(null, sessions.map(function (s) { return s.pct; })) : null;

    html += '<div class="stats">' +
      '<div class="stat"><div class="sv">' + seenCount +
        '<span style="font-size:.6em;color:var(--ink-soft)">/' + BANK.length + '</span></div>' +
        '<div class="sl">questions met (' + coverage + '%)</div></div>' +
      '<div class="stat"><div class="sv">' + overall + '%</div>' +
        '<div class="sl">answered right, all attempts</div></div>' +
      '<div class="stat"><div class="sv">' + wrongNow.length + '</div>' +
        '<div class="sl">wrong last time</div></div>' +
      '<div class="stat"><div class="sv">' + (best === null ? '&mdash;' : best + '%') + '</div>' +
        '<div class="sl">' + (best === null ? 'no full level yet' : 'best full level') + '</div></div>' +
      '</div>';

    if (wrongNow.length) {
      var byTypeWrong = {};
      wrongNow.forEach(function (id) {
        var t = qs[id].t || "Uncategorised";
        byTypeWrong[t] = (byTypeWrong[t] || 0) + 1;
      });
      var parts = Object.keys(byTypeWrong).sort(function (a, b) {
        return byTypeWrong[b] - byTypeWrong[a];
      }).map(function (t) { return byTypeWrong[t] + " in " + t.toLowerCase(); });
      html += '<div class="verdict weak"><b>' + wrongNow.length + ' question' +
              (wrongNow.length === 1 ? '' : 's') + ' you got wrong the last time you met ' +
              (wrongNow.length === 1 ? 'it' : 'them') + ':</b> ' + esc(parts.join(", ")) +
              '. These are the ones worth going back to first.</div>';
    }

    if (seenCount >= BANK.length) {
      html += '<div class="verdict info"><b>You have been through every question in this case.</b> ' +
              'Repeating them now tests retention rather than recall, which is the more useful ' +
              'thing this close to an exam. If you want more, ask for the bank to be extended, ' +
              'your results are kept, so new questions slot in alongside these.</div>';
    }

    // cumulative accuracy by topic
    var types = Object.keys(agg).sort(function (a, b) {
      return (agg[a].ok / agg[a].n) - (agg[b].ok / agg[b].n);
    });
    html += '<h3>Accuracy by topic, every attempt</h3><div class="breakdown">';
    types.forEach(function (t) {
      var d = agg[t], p = Math.round(d.ok / d.n * 100);
      html += '<div class="brow"><span class="bname">' + esc(t) + '</span>' +
              '<span class="bval">' + d.ok + '/' + d.n + ' · ' + p + '%</span>' +
              '<span class="btrack"><i style="width:' + p + '%;background:' +
              (p >= 70 ? "var(--good)" : "var(--miss)") + '"></i></span></div>';
    });
    html += '</div>';

    var weak = types.filter(function (t) { return agg[t].ok / agg[t].n < 0.7; });
    if (weak.length) {
      html += '<div class="verdict weak"><b>Consistently weak: ' + esc(weak.join(", ")) + '.</b> ' +
              'These are the sections of the study guide to reread before the next session.</div>';
    }

    html += '<h3>Completed levels</h3><div class="hist">';
    if (!sessions.length) {
      html += '<div class="empty" style="margin:0">No level finished end to end yet. Your ' +
              'answers so far are all kept either way, this list is just the full runs.</div>';
    }
    sessions.forEach(function (s) {
      html += '<div class="hrow"><span class="hl">' + esc(s.levelName || ("Level " + s.level)) + '</span>' +
              '<span class="hd">' + esc(when(s.at)) + '</span>' +
              '<span class="hp ' + (s.pct >= 70 ? 'ok' : 'bad') + '">' + s.pct + '%</span></div>';
    });
    html += '</div>';

    html += '<div class="row" style="margin-top:1.4rem">' +
            '<button class="btn primary" id="again">Drill again</button>' +
            '<button class="btn" id="switch">Switch person</button></div>';

    html += askHtml();

    app.innerHTML = html;
    on("again", "click", function () { replace(screenLevels); });
    on("switch", "click", function () { reset(screenWelcome); });
    wireAsk();
  }

  // ------------------------------------------------- asking for better questions
  //
  // The viva bank was written without the people who use it, so nothing in the system knows
  // whether a level is pitched right, which case needs more questions, or which question is
  // wrong. This is the only channel that can say so. It is stored locally first and retried,
  // like everything else here, because a request typed on ward wifi should not evaporate.

  function askHtml() {
    return '<div class="ask"><h3>Ask for different questions</h3>' +
           '<textarea id="askbox" rows="3" placeholder="Harder anatomy. More on complications. ' +
           'This question is wrong."></textarea>' +
           '<div class="row end"><button class="btn" id="asksend">Send</button></div>' +
           '<p class="asknote" id="asknote"></p></div>';
  }

  function wireAsk() {
    var box = document.getElementById("askbox");
    var note = document.getElementById("asknote");
    if (!box) return;

    on("asksend", "click", function () {
      var text = box.value.trim();
      if (!text) { box.focus(); return; }

      var rec = {
        id: newId(), studentKey: student.key, subject: SUBJECT, caseId: CASE.id,
        body: text.slice(0, 4000), at: new Date().toISOString(), sent: false
      };
      var s = store();
      s.asks = (s.asks || []).concat([rec]).slice(-200);
      save(s);
      // save() swallows a storage failure, so check rather than assume: if the record did
      // not land, sendAsks has nothing to read and the message is gone.
      var kept = ((store().asks || []).filter(function (a) { return a.id === rec.id; })).length > 0;

      box.value = "";
      note.textContent = "Sending...";
      // Say it has been sent when it has been sent, not when the button was pressed. This
      // said "Noted, thank you" before the request left, and said it just the same when
      // storage had failed and nothing was ever sent at all.
      sendAsk(rec).then(function (ok) {
        if (ok) note.textContent = "Thank you. It goes into the next revision of this case.";
        else if (kept) note.textContent = "No connection just now. It is saved and will go when you are back online.";
        else { note.textContent = "That did not save. Please try again."; box.value = rec.body; }
      });
    });
  }

  // Takes the record itself rather than re-reading storage, so a message still goes out
  // when the browser refused to store it. Resolves true only when the worker accepted it.
  function sendAsk(a) {
    if (!SYNC || !a || !a.studentKey) return Promise.resolve(false);
    return fetch(SYNC + "/api/feedback?student=" + encodeURIComponent(a.studentKey), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ id: a.id, subject: a.subject, caseId: a.caseId,
                             body: a.body, at: a.at })
    }).then(function (r) {
      if (!r.ok) return false;
      var s2 = store();
      (s2.asks || []).forEach(function (x) { if (x.id === a.id) x.sent = true; });
      save(s2);
      return true;
    }).catch(function () { return false; });   // offline; it goes on the next open
  }

  function sendAsks() {
    if (!SYNC) return;
    var s = store();
    var pending = (s.asks || []).filter(function (a) { return a && !a.sent && a.studentKey; });
    pending.slice(-20).forEach(sendAsk);
  }

  // ------------------------------------------------------------------ sync

  // Saving is not something the reader needs told. It happens on every mark, it happens
  // again on leaving, and saying so in a footer only suggests it might not have.
  function syncSession(rec) {
    if (!dbReady || !db) return;        // the website path; recordSession has already stored it
    var id = rec.at.replace(/[^0-9]/g, "") + "-" + Math.random().toString(36).slice(2, 7);
    db.collection("sessions").doc(id).set(rec).catch(function () {});
  }

  // ------------------------------------------------------------------ study guide

  var guideCache = {};   // keyed by case id: the hub keeps every guide the student has opened

  function screenGuide() {
    app.innerHTML = '<div class="loading">Opening the study guide…</div>';

    function mount(html) {
      app.innerHTML = '<div class="readerwrap"><div class="guide" id="guideRoot">' + html + '</div></div>';
      var root = document.getElementById("guideRoot");
      var opts = { guide: root, doc: CASE.id, student: student.key || "_",
                   syncRoot: true, onTheme: function () { renderTopbar(); } };
      if (window.ReaderBoot) window.ReaderBoot(opts);
      else if (window.Reader && window.Reader.remount) window.Reader.remount(opts);
    }

    var id = CASE.id;
    if (guideCache[id]) { mount(guideCache[id]); return; }

    fetch(guideBodyFile(CASE))
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (txt) { guideCache[id] = txt; return txt; })
      // mount separately: chaining it meant any error it threw was reported as "the request
      // did not come back", which sent me hunting a network fault for a plain ReferenceError
      .then(function (txt) { mount(txt); })
      .catch(function (err) {
        if (window.console && console.error) console.error("guide failed to open:", err);
        app.innerHTML =
          '<h2>The study guide could not load</h2>' +
          '<p class="sub">It is published alongside this page but the request did not ' +
          'come back. Reloading usually fixes it. The PDF on the case page has the same ' +
          'content and does not depend on this.</p>' +
          '<div class="row"><button class="btn primary" id="retry">Try again</button></div>';
        on("retry", "click", function () { go(screenGuide); });
      });
  }

  // ------------------------------------------------------------------ pdf

  var IN_ARTIFACT = !!(window.claude && window.claude.use);

  function savePdf() {
    var d = document.getElementById("pdfDesc");
    function say(msg) { if (d) d.textContent = msg; }

    // On the web the sandbox restrictions do not apply, so just open it.
    var file = pdfFile(CASE);

    if (!IN_ARTIFACT) {
      window.open(file, "_blank", "noopener");
      return;
    }

    say("Fetching the PDF…");
    fetch(file)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
      .then(function (blob) {
        return window.claude.use("downloads").then(function (dl) {
          if (!dl) throw new Error("not granted");
          return dl.save({ filename: file, data: blob });
        });
      })
      .then(function () { say("Saved. The whole study guide laid out for paper."); })
      .catch(function () {
        say("Could not save it here, open the study guide above and print it instead, " +
            "which produces the same pages.");
      });
  }

  // ------------------------------------------------------------------ welcome

  function screenWelcome() {
    var others = allStudents();
    var last = store().lastStudent;
    var saved = (last && studentRec(last)) ? studentRec(last).name : "";

    var html =
      '<p class="eyebrow">' + esc(SUBJECT) + ' · MBBS final year</p>' +
      '<h1>Surgery Case Files</h1>' +
      '<label class="fld" for="nm">Your name</label>' +
      '<input type="text" id="nm" autocomplete="off" placeholder="Name" value="' + esc(saved) + '">';

    if (others.length) {
      html += '<div class="known">' + others.map(function (o) {
        return '<button data-k="' + esc(o.key) + '">' + esc(o.name) + '</button>';
      }).join("") + '</div>';
    }
    html += '<div class="row end" style="margin-top:1.3rem">' +
            '<button class="btn primary" id="go">Continue</button></div>';
    app.innerHTML = html;

    function enter(name) {
      var v = String(name).trim();
      if (!v) { document.getElementById("nm").focus(); return; }
      student = { key: keyOf(v), name: v };
      var st = store();
      st.students = st.students || {};
      if (st.students[student.key]) student.name = st.students[student.key].name;
      else st.students[student.key] = { name: student.name, sessions: [] };
      st.lastStudent = student.key;
      save(st);
      if (window.Reader && window.Reader.setStudent) window.Reader.setStudent(student.key);
      // take what the server already has before this device writes anything, so a fresh or
      // evicted browser cannot push its empty counters over a real history
      pullAnswers();
      sendAsks();
      reset(screenIndex);
    }
    on("go", "click", function () { enter(document.getElementById("nm").value); });
    document.getElementById("nm").addEventListener("keydown", function (e) {
      if (e.key === "Enter") enter(this.value);
    });
    [].forEach.call(app.querySelectorAll(".known button"), function (b) {
      b.addEventListener("click", function () {
        var r = studentRec(b.dataset.k);
        enter(r ? r.name : b.dataset.k);
      });
    });
    document.getElementById("nm").focus();
  }

  // ------------------------------------------------------------------ boot

  reset(screenWelcome);

  // Anything finished while offline goes up now. Deliberately after the first paint, so a
  // slow or failing network never delays the screen the reader is waiting for.
  setTimeout(flushSessions, 1200);
  setTimeout(pushAnswers, 1400);
  setTimeout(sendAsks, 1600);

  // A phone does not reliably fire unload, but it does fire this when the tab is hidden or
  // the app is backgrounded, which is how a session on a phone actually ends.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") { pushAnswers(); flushSessions(); sendAsks(); }
  });

  if (window.claude && window.claude.use) {
    window.claude.use("db").then(function (d) { db = d; dbReady = true; })
                           .catch(function () { db = null; dbReady = true; });
  } else { dbReady = true; }
})();
</script>
