<title>Surgery Case Files</title>
<style>
/* Layout: an index that opens into one case, and a case page offering four ways in,
   read it, drill it, see where you stand, or take it away. One column throughout,
   because it is used on a phone between postings as often as at a desk. */

:root {
  --bg:       #f4f1ec;
  --card:     #ffffff;
  --ink:      #1a1e21;
  --ink-soft: #5c646b;
  --rule:     #e0dad0;
  --accent:   #005f73;
  --accent-dim:#e0ecef;
  --good:     #2f6b45;
  --good-dim: #e2efe7;
  --miss:     #9a4228;
  --miss-dim: #f7e8e2;


  /* The reader's floating chrome, the rail, studio, note editor, bubble and source pane, is
     appended to document.body rather than inside .guide, so it cannot see the tokens the
     stylesheet defines on .guide. In the hub that left every panel painting var(--paper, #fff)
     white while its text used the dark --ink, measured at 1.24:1. These aliases give the
     chrome the same palette the hub is already using. */
  --paper:       var(--card);
  --accent-soft: var(--accent-dim);
  --flag:        #8a5a2b;
  --flag-soft:   #f6ece0;
  --cite:        var(--ink-soft);
  /* The note editor's Save button reads var(--on-accent). That token is defined on .guide,
     and the editor is appended to document.body, so it fell back to white on the pale
     accent the dark themes use: 2.02:1. */
  --on-accent:   #fff;
  --mark:        #fff3bf;
  --bl:          #5b4a8a;
  --srb:         #1f6b5c;

  --serif: "Spectral", Georgia, "Times New Roman", serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111416; --card: #1a1e21; --ink: #e9e7e2; --ink-soft: #a0a8ae;
    --rule: #2d3338; --accent: #6fc3d2; --accent-dim: #16292f;
    --good: #7fc79b; --good-dim: #16281d; --miss: #e09a7c; --miss-dim: #2a1b15;
    --flag: #d8a46a; --flag-soft: #2a1f14; --mark: #6b5b1f;
    --on-accent: #06191e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111416; --card: #1a1e21; --ink: #e9e7e2; --ink-soft: #a0a8ae;
  --rule: #2d3338; --accent: #6fc3d2; --accent-dim: #16292f;
  --good: #7fc79b; --good-dim: #16281d; --miss: #e09a7c; --miss-dim: #2a1b15;
  --flag: #d8a46a; --flag-soft: #2a1f14; --mark: #6b5b1f;
  --on-accent: #06191e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}

.shell {
  max-width: 40rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 1rem 4rem;
}

/* ---------- top bar: back on the left, theme on the right ---------- */

.topbar {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  min-height: 2.2rem;
  margin-bottom: 0.9rem;
}

.topbar .spacer { flex: 1; }

button.ghost {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--ink-soft);
  background: none;
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 0.3rem 0.55rem;
  cursor: pointer;
}
button.ghost:hover { color: var(--accent); border-color: var(--rule); }
button.ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.ghost svg { width: 15px; height: 15px; flex: none; }

.card {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 1.5rem;
}

h1 {
  font-family: var(--serif);
  font-size: 1.9rem; font-weight: 600; letter-spacing: -0.015em;
  margin: 0 0 0.4rem; text-wrap: balance;
}
h2 {
  font-family: var(--serif);
  font-size: 1.3rem; font-weight: 600; margin: 0 0 0.5rem; text-wrap: balance;
}
h3 {
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--accent);
  margin: 1.8rem 0 0.7rem;
}
.eyebrow {
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.13em;
  text-transform: uppercase; color: var(--accent); margin: 0 0 0.55rem;
}
.sub { color: var(--ink-soft); margin: 0 0 1.6rem; font-size: 0.95rem; }

/* ---------- entry tiles ---------- */

.tiles { display: grid; gap: 0.8rem; margin-top: 1.4rem; }

.tile {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 0.25rem 1rem;
  align-items: start;
  text-align: left;
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 9px;
  padding: 1.05rem 1.15rem;
  cursor: pointer;
  text-decoration: none;
  transition: border-color 0.12s, transform 0.12s;
}
.tile:hover { border-color: var(--accent); transform: translateY(-1px); }
.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tile .ico {
  grid-column: 1; grid-row: 1 / span 2;
  width: 34px; height: 34px; border-radius: 7px;
  background: var(--accent-dim); color: var(--accent);
  display: grid; place-items: center;
  font-size: 0.62rem; font-weight: 700; letter-spacing: 0.03em;
}
.tile .t-name { grid-column: 2; grid-row: 1; font-weight: 650; font-size: 1.02rem; }
.tile .t-desc { grid-column: 2; grid-row: 2; font-size: 0.85rem; color: var(--ink-soft); line-height: 1.45; }
.tile .t-go { grid-column: 3; grid-row: 1 / span 2; color: var(--ink-soft); font-size: 1.1rem; align-self: center; }
.tile:hover .t-go { color: var(--accent); }

.tile.muted { opacity: 0.5; cursor: default; }
.tile.muted:hover { border-color: var(--rule); transform: none; }

.meta-line {
  font-size: 0.78rem; color: var(--ink-soft);
  margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--rule);
}
.meta-line b { color: var(--ink); }

.srckey { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; font-size: 0.74rem; color: var(--ink-soft); margin-top: 0.8rem; }
.srckey span { display: inline-flex; align-items: center; gap: 0.35rem; }
.srckey i { width: 9px; height: 9px; border-radius: 2px; flex: none; }

/* ---------- buttons ---------- */

button.btn {
  font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px;
  border: 1px solid var(--rule); background: var(--card); color: var(--ink);
  padding: 0.6rem 1rem;
}
button.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] button.btn.primary { color: #06191e; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) button.btn.primary { color: #06191e; }
}
button.btn.primary:hover:not(:disabled) { opacity: 0.9; }

.row { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.row.end { justify-content: flex-end; }

input[type="text"] {
  width: 100%; font: inherit; font-size: 1rem; color: var(--ink);
  background: var(--bg); border: 1px solid var(--rule);
  border-radius: 6px; padding: 0.6rem 0.75rem;
}
input[type="text"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.fld {
  display: block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 0.4rem;
}
.hint { font-size: 0.8rem; color: var(--ink-soft); margin-top: 0.5rem; }

.known { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.8rem; }
.known button {
  font: inherit; font-size: 0.82rem; font-weight: 600;
  color: var(--accent); background: var(--accent-dim);
  border: 1px solid transparent; border-radius: 999px;
  padding: 0.25rem 0.7rem; cursor: pointer;
}
.known button:hover { border-color: var(--accent); }

/* ---------- viva ---------- */

.levels { display: grid; gap: 0.7rem; margin: 1.2rem 0 1.4rem; }
.level { text-align: left; display: grid; gap: 0.2rem; padding: 0.9rem 1rem; width: 100%;
         font: inherit; color: var(--ink); background: var(--card);
         border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; }
.level:hover { border-color: var(--accent); }
.level:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.level .lv-name { font-weight: 650; font-size: 1rem; }
.level .lv-desc { font-size: 0.85rem; color: var(--ink-soft); line-height: 1.45; }
.level .lv-meta { font-size: 0.75rem; color: var(--accent); font-weight: 600; }

.progress { display: flex; justify-content: space-between; align-items: baseline;
            font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em;
            text-transform: uppercase; color: var(--ink-soft); margin-bottom: 0.5rem; }
.bar { height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; margin-bottom: 1.4rem; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width 0.25s; }

.qtag { display: inline-block; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.09em;
        text-transform: uppercase; color: var(--accent); background: var(--accent-dim);
        border-radius: 3px; padding: 0.2rem 0.45rem; margin-bottom: 0.8rem; }

.question { font-family: var(--serif); font-size: 1.28rem; line-height: 1.4;
            font-weight: 600; margin: 0 0 1.3rem; text-wrap: balance; }

.answer { border-left: 3px solid var(--accent); background: var(--accent-dim);
          border-radius: 0 6px 6px 0; padding: 0.9rem 1rem; margin-bottom: 1.3rem; font-size: 0.95rem; }
.answer .tag { display: block; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em;
               text-transform: uppercase; color: var(--accent); margin-bottom: 0.35rem; }
.answer .ref { display: block; margin-top: 0.6rem; font-size: 0.72rem; color: var(--ink-soft); }

.grade { display: flex; gap: 0.6rem; }
.grade button { flex: 1; }
/* These were coloured on hover only, so on a phone the two buttons were byte-identical
   and the hover colour could stick to whichever was tapped last. Colour them always. */
.grade .got { border-color: var(--good); color: var(--good); background: var(--good-dim); }
.grade .missed { border-color: var(--miss); color: var(--miss); background: var(--miss-dim); }
.grade .got:hover { background: var(--good); color: var(--paper); }
.grade .missed:hover { background: var(--miss); color: var(--paper); }
@media (hover: none) {
  .grade .got:hover { background: var(--good-dim); color: var(--good); }
  .grade .missed:hover { background: var(--miss-dim); color: var(--miss); }
}

.score { font-family: var(--serif); font-size: 3rem; font-weight: 600; line-height: 1;
         margin: 0.4rem 0 0.2rem; font-variant-numeric: tabular-nums; }
.score small { font-size: 1.05rem; color: var(--ink-soft); font-weight: 400; }

.breakdown { margin: 1.4rem 0; display: grid; gap: 0.5rem; }
.brow { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem 0.8rem; align-items: center;
        padding-bottom: 0.5rem; border-bottom: 1px solid var(--rule); }
.brow .bname { font-size: 0.9rem; font-weight: 600; min-width: 0; }
.brow .bval { font-size: 0.82rem; font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
.brow .btrack { grid-column: 1 / -1; height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.brow .btrack > i { display: block; height: 100%; }

.verdict { padding: 0.9rem 1rem; border-radius: 6px; font-size: 0.92rem;
           margin: 1.2rem 0; border-left: 3px solid; }
.verdict.weak { background: var(--miss-dim); border-color: var(--miss); }
.verdict.strong { background: var(--good-dim); border-color: var(--good); }
.verdict.info { background: var(--accent-dim); border-color: var(--accent); }

.saved { font-size: 0.78rem; color: var(--ink-soft); margin-top: 1.1rem;
         padding-top: 0.9rem; border-top: 1px solid var(--rule); }

.ask { margin-top: 1.8rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); }
.ask h3 { margin: 0 0 0.6rem; font-size: 0.92rem; }
.ask textarea {
  width: 100%; box-sizing: border-box; resize: vertical; min-height: 4.2rem;
  font: inherit; font-size: 1rem;            /* 16px, so iOS does not zoom on focus */
  color: var(--ink); background: var(--card);
  border: 1px solid var(--rule); border-radius: 8px; padding: 0.7rem 0.8rem;
}
.ask textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ask .row { margin-top: 0.6rem; }
.asknote { font-size: 0.8rem; color: var(--ink-soft); margin: 0.6rem 0 0; min-height: 1.1em; }

.storagewarn {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
  background: var(--miss-dim); color: var(--ink);
  border-top: 2px solid var(--miss);
  padding: 0.8rem 1rem; font-size: 0.85rem; line-height: 1.45;
  padding-bottom: max(0.8rem, env(safe-area-inset-bottom, 0px));
}

.who { display: flex; justify-content: space-between; align-items: center; gap: 0.8rem;
       font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 1rem; }

/* ---------- progress view ---------- */

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: 0.8rem; margin: 1.2rem 0; }
.stat { border: 1px solid var(--rule); border-radius: 8px; padding: 0.8rem 0.9rem; }
.stat .sv { font-family: var(--serif); font-size: 1.6rem; font-weight: 600; line-height: 1.1;
            font-variant-numeric: tabular-nums; }
.stat .sl { font-size: 0.72rem; color: var(--ink-soft); margin-top: 0.15rem; line-height: 1.35; }

.hist { margin: 0.6rem 0 0; display: grid; gap: 0; }
.hrow { display: grid; grid-template-columns: 1fr auto auto; gap: 0.8rem; align-items: baseline;
        padding: 0.55rem 0; border-bottom: 1px solid var(--rule); font-size: 0.86rem; }
.hrow .hl { font-weight: 600; min-width: 0; }
.hrow .hd { color: var(--ink-soft); font-size: 0.78rem; white-space: nowrap; }
.hrow .hp { font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
.hrow .hp.ok { color: var(--good); }
.hrow .hp.bad { color: var(--miss); }

.empty { color: var(--ink-soft); font-size: 0.9rem; padding: 1.2rem 0; }

/* ---------- the study guide, rendered inside this page ---------- */

/* The guide carries its own measure, and the shell's 40rem was clamping it: Narrow fitted
   inside the shell and every wider setting came out identical, so the control looked
   broken. In the guide the shell follows whatever width the reader chose, a little wider
   than the guide's own measure so that the guide stays the binding constraint. */
body[data-screen="guide"] .shell { max-width: var(--guide-measure, 40rem); }
body[data-width="narrow"] { --guide-measure: 37rem; }
body[data-width="medium"] { --guide-measure: 45rem; }
body[data-width="wide"]   { --guide-measure: 57rem; }
body[data-width="full"]   { --guide-measure: none; }

.readerwrap { margin: 0 -1.5rem -1.5rem; }
.readerwrap .guide { border-radius: 0 0 10px 10px; }
.readerwrap .guide .wrap { padding-block: 1.5rem 3rem; }
/* The brownie debt. Sits out of the way, waits to be tapped, and turns into what it is
   actually about. */
.brownie {
  position: fixed;
  left: 50%;
  bottom: 1.1rem;
  transform: translate(-50%, 14px);
  z-index: 70;
  max-width: min(27rem, calc(100vw - 2rem));
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0.68rem 1rem;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--card);
  color: var(--ink);
  box-shadow: 0 6px 22px rgba(0, 0, 0, 0.14);
  font-family: var(--sans);
  font-size: 0.86rem;
  line-height: 1.35;
  text-align: center;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.28s ease, transform 0.28s ease;
}
.brownie.in { opacity: 1; transform: translate(-50%, 0); }
.brownie.paid {
  min-height: 0;
  padding: 0.5rem 0.9rem;
  border-color: transparent;
  background: none;
  box-shadow: none;
}
.brownie.gone { opacity: 0; transform: translate(-50%, -10px) scale(0.86); }
.brownie:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  .brownie, .brownie.gone { transition: opacity 0.2s ease; transform: translate(-50%, 0); }
}

.loading { color: var(--ink-soft); font-size: 0.9rem; padding: 2rem 0; text-align: center; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------ config
  // Shaped so other subjects and cases drop in without touching the storage
  // layer: everything written is tagged with subject and case.

  var SUBJECT = "General Surgery";
  // Every guide in reference/ is built into dist/ as a standalone page, a body fragment and a
  // PDF, and publish_site.py discovers all three from dist/ rather than naming them, so adding a
  // case here needs nothing else. Two naming rules, both set by publish_site.py: the body
  // fragment keeps its number prefix, the PDF loses it.
  //   id   must equal the guide's data-doc attribute, because the reader stores a student's
  //        highlights and notes against it.
  // The guides all carry their own viva as tap-to-reveal questions; the scored drill is
  // separate, and a case has one wherever app/viva-banks.js holds a bank under its id.
  var CASES = [
    {num:"01", id:"inguinal-hernia", name:"Inguinal Hernia", kind:"long"},
    {num:"02", id:"thyroid-swelling", name:"Thyroid Swelling", kind:"long"},
    {num:"03", id:"breast-lump", name:"Breast Lump", kind:"long"},
    {num:"04", id:"gastric-outlet-obstruction", name:"Gastric Outlet Obstruction", kind:"long"},
    {num:"05", id:"obstructive-jaundice", name:"Obstructive Jaundice", kind:"long"},
    {num:"06", id:"right-iliac-fossa-mass", name:"Right Iliac Fossa Mass", kind:"long"},
    {num:"07", id:"liver-secondaries", name:"Liver Secondaries", kind:"long"},
    {num:"08", id:"varicose-veins", name:"Varicose Veins", kind:"long"},
    {num:"09", id:"peripheral-vascular-disease", name:"Peripheral Vascular Disease", kind:"long"},
    {num:"10", id:"ulcer", name:"Ulcer", kind:"short"},
    {num:"11", id:"sinus-and-fistula", name:"Sinus and Fistula", kind:"short"},
    {num:"12", id:"lipoma-and-sebaceous-cyst", name:"Lipoma and Sebaceous Cyst", kind:"short"},
    {num:"13", id:"cervical-lymphadenopathy", name:"Cervical Lymphadenopathy", kind:"short"},
    {num:"14", id:"neck-swellings", name:"Neck Swellings", kind:"short"},
    {num:"15", id:"salivary-swelling", name:"Salivary Swelling", kind:"short"},
    {num:"16", id:"oral-cavity-lesions", name:"Oral Cavity Lesions", kind:"short"},
    {num:"17", id:"hydrocele", name:"Hydrocele", kind:"short"},
    {num:"18", id:"varicocele", name:"Varicocele", kind:"short"},
    {num:"19", id:"undescended-testis", name:"Undescended Testis", kind:"short"},
    {num:"20", id:"dysphagia", name:"Dysphagia", kind:"short"},
    {num:"21", id:"testicular-tumour", name:"Testicular Tumour", kind:"short"},
    {num:"22", id:"lymphoedema", name:"Lymphoedema", kind:"short"},
    {num:"23", id:"carcinoma-penis", name:"Carcinoma of the Penis", kind:"short"},
    {num:"24", id:"benign-prostatic-hyperplasia", name:"Benign Prostatic Hyperplasia", kind:"short"},
    {num:"25", id:"anorectal-conditions", name:"Haemorrhoids, Fissure and Fistula-in-Ano", kind:"short"}
  ];

  // One line each, shown on the case page. Where a case has none, the generic line is used.
  var BLURB = {
    "inguinal-hernia":
      "The most commonly allotted surgical long case, and the one where the examiner is least " +
      "interested in your diagnosis. He can see the lump. What he wants is the reasoning behind " +
      "each question you asked and each test you performed.",
    "peripheral-vascular-disease":
      "Two pains to separate, claudication from rest pain, and then one decision: is this limb " +
      "threatened? The staging systems your examiner asks for are not the ones the current " +
      "edition uses, and section 1 sets out how to answer both."
  };

  var CASE = CASES[0];

  function caseById(id) {
    for (var i = 0; i < CASES.length; i++) if (CASES[i].id === id) return CASES[i];
    return null;
  }

  // claude.ai refuses to serve a published sibling file as a top-level document
  // (ERR_BLOCKED_BY_RESPONSE), so the guide is fetched and rendered inside this page
  // and the PDF is handed over through the downloads capability.
  function guideBodyFile(c) { return c.num + "-" + c.id + ".body.html"; }
  function pdfFile(c)       { return c.id + ".pdf"; }

  // The scored banks are inlined here from app/viva-banks.js by build.py. A case has a drill
  // only where it has a bank, so nothing has to be flagged by hand in CASES.
  var BANKS = (typeof VIVA_BANKS === "object" && VIVA_BANKS) ? VIVA_BANKS : {};

  function bankFor(c) { return (c && BANKS[c.id]) || []; }

  var LEVELS = [
    {n:1, name:"Foundation", desc:"Definitions, anatomy and the signs you must never fumble."},
    {n:2, name:"Clinical",  desc:"History technique, the special tests, and telling complications apart."},
    {n:3, name:"Examiner's edge", desc:"Where the three books disagree, named varieties, and the evidence."}
  ];

  // ------------------------------------------------------------------ storage
  // One record per student, keyed case-insensitively. The typed spelling is kept for display.

  var LS = "surgery-case-files-v2";

  // Storage used to fail in silence. A quota error, private browsing, or blocked site data
  // made save() a no-op, and because pushAnswers reads the batch back out of storage, nothing
  // was stored and nothing was sent either: a finished drill simply evaporated and the
  // progress page said "nothing drilled yet". A parse error was worse, because store()
  // returned {} and the next write replaced every student on the device.
  var storeBroken = false;

  function store() {
    var raw = null;
    try { raw = localStorage.getItem(LS); } catch (e) { storeBroken = true; return {}; }
    if (!raw) return {};
    try { return JSON.parse(raw); } catch (e) {
      // keep the damaged blob rather than overwriting it; it may be recoverable by hand
      try { localStorage.setItem(LS + ":corrupt:" + Date.now(), raw); } catch (e2) {}
      storeBroken = true;
      return {};
    }
  }

  function save(o) {
    try {
      localStorage.setItem(LS, JSON.stringify(o));
      storeBroken = false;
      return true;
    } catch (e) {
      storeBroken = true;
      warnStorage();
      return false;
    }
  }

  // Said once, plainly, and only when it is true. This is the opposite of the "saved on this
  // device" footers: it is worth interrupting someone for, because their work is not being kept.
  function warnStorage() {
    if (document.getElementById("storagewarn")) return;
    var el = document.createElement("div");
    el.id = "storagewarn";
    el.className = "storagewarn";
    el.textContent = "This browser is not letting the page save anything, so your answers and "
                   + "notes will be lost when you leave. Private browsing or full storage is "
                   + "the usual cause.";
    document.body.appendChild(el);
  }
  function keyOf(name) { return String(name).trim().toLowerCase().replace(/\s+/g, " "); }

  // --------------------------------------------- per-question history
  //
  // A session is only written when a whole level is finished, which meant answering three
  // questions and walking away left no trace at all: the answers sat in an in-memory array
  // that went out of scope, so the progress page and the database were both empty and
  // neither was wrong. Nothing about it looked broken, which is why it survived.
  //
  // These records are written the instant a question is marked, so partial work survives
  // leaving, navigating back, closing the tab or switching person. They are also the thing
  // that makes a question answerable across sessions: how many times this person has met it,
  // how often they got it, and whether they had it last time.

  function qKey(caseId, qid) { return caseId + "::" + qid; }

  function recordAnswer(q, ok) {
    if (!student.key) return;
    var s = store();
    s.students = s.students || {};
    var r = s.students[student.key] || { name: student.name, sessions: [] };
    r.name = student.name;
    r.questions = r.questions || {};

    var k = qKey(CASE.id, q.id);
    var rec = r.questions[k] || { t: q.type, n: 0, ok: 0, last: 0, at: null };
    rec.t = q.type;                      // kept current, in case a question is recategorised
    rec.n += 1;
    if (ok) rec.ok += 1;
    rec.last = ok ? 1 : 0;
    rec.at = new Date().toISOString();
    rec.synced = false;

    r.questions[k] = rec;
    s.students[student.key] = r;
    s.lastStudent = student.key;
    save(s);
    pushAnswersLater();
  }

  // Everything this person has ever answered for the case on screen.
  function answersForCase(key) {
    var r = (store().students || {})[key];
    var out = {};
    if (!r || !r.questions) return out;
    var prefix = CASE.id + "::";
    Object.keys(r.questions).forEach(function (k) {
      if (k.indexOf(prefix) === 0) out[k.slice(prefix.length)] = r.questions[k];
    });
    return out;
  }

  // Reading the history back, which never happened before.
  //
  // Answers only ever went up. A second device, or the same device after iOS evicted its
  // storage, showed an empty progress page even though the rows were sitting in the database,
  // and worse, its first answer posted attempts:1 over the server's attempts:12 and destroyed
  // the history, because the worker compares timestamps and that write was genuinely newer.
  //
  // Pulling on sign-in fixes both: the device starts from what the server holds, so there is
  // nothing to overwrite. Merging is per question and takes whichever side was written last.
  // answersPulled holds the student whose answers the server has actually answered for.
  // Until it matches, nothing may be pushed: a push before the first successful pull is
  // what posted attempts:1 over the server's attempts:12 in the first place.
  var answersPulled = "";
  var answerPullTimer = null;
  var answerPullMs = 1000;

  function answersReady() { return !SYNC || (!!student.key && answersPulled === student.key); }

  function pullAnswersLater(ms) {
    if (!SYNC || !student.key) return;
    clearTimeout(answerPullTimer);
    answerPullTimer = setTimeout(function () { pullAnswers(); }, ms || answerPullMs);
  }

  function pullAnswers(done) {
    if (!SYNC || !student.key) { if (done) done(); return; }
    // the name this request is for. Reading student.key again when the response lands is
    // how one student's history was merged into the next student's record.
    var mine = student.key;
    fetch(SYNC + "/api/answers?student=" + encodeURIComponent(mine))
      .then(function (r) {
        // a 503 is not an empty history, and must not be mistaken for one
        if (!r.ok) throw new Error("answers pull " + r.status);
        return r.json();
      })
      .then(function (j) {
        if (mine !== student.key) return;        // the reader switched name; not ours to apply
        answersPulled = mine;
        answerPullMs = 1000;
        if (!j || !j.answers) return;
        var s = store();
        s.students = s.students || {};
        var rec = s.students[student.key] || { name: student.name, sessions: [] };
        rec.questions = rec.questions || {};
        var merged = 0;
        j.answers.forEach(function (a) {
          var k = qKey(a.caseId, a.questionId);
          var mine = rec.questions[k];
          if (!mine || !mine.at || (a.at && a.at > mine.at)) {
            rec.questions[k] = { t: a.type, n: a.attempts, ok: a.correct,
                                 last: a.lastOk ? 1 : 0, at: a.at, synced: true };
            merged++;
          }
        });
        if (merged) {
          s.students[mine] = rec;
          save(s);
        }
      })
      .catch(function () {
        // we still do not know what the server holds, so leave answersPulled alone and
        // try again; nothing is pushed in the meantime
        if (mine === student.key) {
          pullAnswersLater(answerPullMs);
          answerPullMs = Math.min(answerPullMs * 2, 60000);
        }
      })
      .then(function () { if (done) done(); });
  }

  var answerTimer = null;

  function pushAnswersLater() {
    if (!SYNC) return;
    clearTimeout(answerTimer);
    answerTimer = setTimeout(pushAnswers, 1500);   // let a burst of marking settle
  }

  // Sent as a batch of whole counters rather than individual events, so a repeat delivery is
  // harmless: the worker stores the counters it is given and the newest write wins.
  function pushAnswers() {
    if (!SYNC || !student.key) return;
    var mine = student.key;
    if (!answersReady()) {       // we do not yet know what the server holds for this name
      pullAnswersLater(200);
      pushAnswersLater();
      return;
    }
    var s = store();
    var r = (s.students || {})[student.key];
    if (!r || !r.questions) return;

    var batch = [];
    Object.keys(r.questions).forEach(function (k) {
      var rec = r.questions[k];
      if (rec.synced) return;
      var cut = k.indexOf("::");
      batch.push({
        caseId: k.slice(0, cut), questionId: k.slice(cut + 2), type: rec.t,
        attempts: rec.n, correct: rec.ok, lastOk: rec.last, at: rec.at
      });
    });
    if (!batch.length) return;

    fetch(SYNC + "/api/answers?student=" + encodeURIComponent(student.key), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ answers: batch })
    }).then(function (res) {
      if (!res.ok) return;
      return res.json().then(function (j) {
        if (mine !== student.key) return;
        // Mark synced only what the worker says it stored. It discards a row whose stamp
        // is older than the one it holds, and a bare ok used to be read as success, so
        // an attempt from a device with a slow clock was dropped and never retried.
        // The deployed worker may predate the stored list. Without this, every row would
        // look rejected, nothing would ever be marked synced, and the client would pull in
        // a loop against a server that is working perfectly well.
        var reports = !!(j && j.stored);
        var applied = {};
        ((j && j.stored) || []).forEach(function (st) {
          applied[qKey(st.caseId, st.questionId) + "::" + st.at] = true;
        });
        // re-read rather than reuse the snapshot: marking may have continued while in flight
        var s2 = store();
        var r2 = (s2.students || {})[mine];
        if (!r2 || !r2.questions) return;
        var rejected = 0;
        batch.forEach(function (b) {
          var k = qKey(b.caseId, b.questionId);
          var rec = r2.questions[k];
          if (!rec || rec.at !== b.at) return;
          if (!reports || applied[k + "::" + b.at]) rec.synced = true;
          else rejected++;
        });
        save(s2);
        // the server holds something newer for those questions, so re-read rather than
        // pushing the same losing write again
        if (rejected) { answersPulled = ""; pullAnswersLater(600); }
      });
    }).catch(function () {
      // offline is normal; the next mark or the next open sends it
    });
  }

  // ------------------------------------------------- sync, for the viva results
  //
  // The same bargain as the reader: this browser holds the real copy and the worker is a
  // mirror, so every failure here is swallowed and the viva carries on regardless. Someone
  // halfway through revising should never see a network error about a score.
  //
  // Each session carries an id generated here, and the worker inserts-or-ignores on it, so a
  // session that goes up twice, from a retry or from a second device, is still one row.

  var SYNC = "https://rx-sync.harnar.workers.dev";

  function newId() {
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }

  function markSynced(id) {
    var s = store(), changed = false;
    Object.keys(s.students || {}).forEach(function (k) {
      (s.students[k].sessions || []).forEach(function (r) {
        if (r.id === id && !r.synced) { r.synced = true; changed = true; }
      });
    });
    if (changed) save(s);
  }

  function postSession(rec) {
    if (!SYNC || !rec || !rec.id) return;
    fetch(SYNC + "/api/sessions", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(rec)
    }).then(function (r) {
      if (r.ok) markSynced(rec.id);
    }).catch(function () {
      // offline is normal and not worth reporting; flushSessions picks it up next time
    });
  }

  // Sessions finished while offline never reached the worker, so they are retried whenever
  // the page is opened. Without this, a session done on a train would be lost to the
  // database for good, even though the browser still has it.
  function flushSessions() {
    if (!SYNC) return;
    var s = store(), pending = [];
    Object.keys(s.students || {}).forEach(function (k) {
      (s.students[k].sessions || []).forEach(function (r) {
        if (r && r.id && !r.synced) pending.push(r);
      });
    });
    pending.slice(-50).forEach(postSession);
  }

  function studentRec(k) {
    var s = store();
    return (s.students && s.students[k]) || null;
  }
  function allStudents() {
    var s = store(), out = [];
    Object.keys(s.students || {}).forEach(function (k) {
      out.push({ key: k, name: s.students[k].name, sessions: s.students[k].sessions || [] });
    });
    return out.sort(function (a, b) { return b.sessions.length - a.sessions.length; });
  }

  function recordSession(rec) {
    var s = store();
    s.students = s.students || {};
    rec.id = rec.id || newId();
    rec.synced = false;                  // postSession flips this once the worker has it
    var r = s.students[rec.studentKey] || { name: rec.studentName, sessions: [] };
    r.name = rec.studentName;            // keep the latest spelling they typed
    r.sessions = (r.sessions || []).concat([rec]).slice(-200);
    s.students[rec.studentKey] = r;
    s.lastStudent = rec.studentKey;
    save(s);
    postSession(rec);                    // saved locally first, so a failure here costs nothing
  }

  // ------------------------------------------------------------------ theme

  var THEMES = ["system", "light", "dark"];
  function currentTheme() { return store().theme || "system"; }
  function applyTheme(t) {
    var el = document.documentElement;
    if (t === "system") el.removeAttribute("data-theme");
    else el.setAttribute("data-theme", t);
  }
  function setTheme(t) {
    var s = store(); s.theme = t; save(s);
    applyTheme(t);
    renderTopbar();
  }
  applyTheme(currentTheme());

  var ICONS = {
    system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>'
  };
  var THEME_LABEL = { system: "Auto", light: "Light", dark: "Dark" };

  // ------------------------------------------------------------------ nav

  var app = document.getElementById("app");
  var topbar = document.getElementById("topbar");
  var backTo = null;          // function, or null at the root

  var inGuide = false;

  function renderTopbar() {
    var t = currentTheme();
    topbar.innerHTML =
      (backTo
        ? '<button class="ghost" id="navBack">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
          'stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>' +
          'Back</button>'
        : '') +
      '<span class="spacer"></span>' +
      (inGuide ? '' : '<button class="ghost" id="themeBtn" title="Switch theme" ' +
      'aria-label="Theme: ' + THEME_LABEL[t] + '">' + ICONS[t] + THEME_LABEL[t] + '</button>');

    var b = document.getElementById("navBack");
    if (b) b.addEventListener("click", function () { if (backTo) backTo(); });
    var tb = document.getElementById("themeBtn");
    if (tb) tb.addEventListener("click", function () {
      setTheme(THEMES[(THEMES.indexOf(currentTheme()) + 1) % THEMES.length]);
    });
  }

  var stack = [];

  function paint() {
    var render = stack[stack.length - 1];
    var wasGuide = inGuide;
    inGuide = (render === screenGuide);
    // The reader's rail, studio, bubble, note editor and source pane are appended to
    // document.body, while this swaps #app.innerHTML. Leaving a guide therefore removed
    // the guide and left its chrome behind: the source pane covering the case list, the
    // tool rail pinned over the viva with the pen still armed, and twelve tool buttons in
    // the tab order of every screen.
    if (wasGuide && !inGuide && window.Reader && window.Reader.unmount) {
      window.Reader.unmount();
    }
    document.body.setAttribute("data-screen", inGuide ? "guide" : "app");
    backTo = stack.length > 1 ? back : null;
    renderTopbar();
    render();
    window.scrollTo(0, 0);
  }

  function go(render)      { stack.push(render); paint(); }
  function replace(render) { stack[stack.length - 1] = render; paint(); }
  function reset(render)   { stack = [render]; paint(); }
  function back()          { if (stack.length > 1) { stack.pop(); paint(); } }

  // ------------------------------------------------------------------ helpers

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function on(id, ev, fn) { var el = document.getElementById(id); if (el) el.addEventListener(ev, fn); }
  function when(iso) {
    var d = new Date(iso), now = new Date();
    var days = Math.floor((now - d) / 86400000);
    if (days === 0) return "today";
    if (days === 1) return "yesterday";
    if (days < 7) return days + " days ago";
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }

  // ------------------------------------------------------------------ state

  var student = { key: "", name: "" };
  var db = null, dbReady = false;
  var queue = [], idx = 0, results = [], level = 1;

  // ------------------------------------------------------------------ index

  function tilesFor(kind) {
    return CASES.filter(function (c) { return c.kind === kind; }).map(function (c) {
      return '<button class="tile" id="case-' + c.id + '">' +
             '<span class="ico">' + c.num + '</span>' +
             '<span class="t-name">' + esc(c.name) + '</span>' +
             '<span class="t-desc">' + (c.kind === "long" ? "Long case" : "Short case") +
             '. Study guide and printable PDF' + (bankFor(c).length ? ', plus the scored viva drill' : '') +
             '.</span><span class="t-go">&rarr;</span></button>';
    }).join("");
  }

  function screenIndex() {
    app.innerHTML =
      '<div class="who"><span>Signed in as <b>' + esc(student.name) + '</b></span>' +
      '<button class="btn" id="swapWho" style="padding:.25rem .6rem;font-size:.75rem">Switch</button></div>' +
      '<p class="eyebrow">' + esc(SUBJECT) + ' · MBBS final year</p>' +
      '<h1>Surgery Case Files</h1>' +
      '<p class="sub">History and examination with the reasoning attached to every step, ' +
      'management with the rationale for every decision, and a viva drill that tracks what you ' +
      'keep getting wrong. Built from S Das, Bailey &amp; Love and SRB.</p>' +
      '<div class="tiles">' + tilesFor("long") + '</div>' +
      '<h2 style="margin-top:1.6rem">Short cases</h2>' +
      '<div class="tiles">' + tilesFor("short") + '</div>' +
      '<div class="srckey">' +
        '<span><i style="background:#005f73"></i> S Das 13e: clinical method</span>' +
        '<span><i style="background:#5b4a8a"></i> Bailey &amp; Love 28e: mechanism and management</span>' +
        '<span><i style="background:#1f6b5c"></i> SRB 6e: exam framework</span>' +
      '</div>';
    CASES.forEach(function (c) {
      on("case-" + c.id, "click", function () { CASE = c; go(screenCase); });
    });
    on("swapWho", "click", function () { reset(screenWelcome); });
  }

  // ------------------------------------------------------------------ case hub

  function screenCase() {
    var studs = allStudents();
    var totalSessions = studs.reduce(function (n, s) { return n + s.sessions.length; }, 0);
    var line = totalSessions
      ? '<b>' + totalSessions + '</b> viva session' + (totalSessions === 1 ? '' : 's') +
        ' recorded on this device across <b>' + studs.length + '</b> ' +
        (studs.length === 1 ? 'person' : 'people') + '.'
      : 'Nothing drilled yet. The viva marks itself against your own honesty, so answer out loud first.';

    var blurb = BLURB[CASE.id] ||
      ("Full case with the reasoning attached to every history question, examination finding, " +
       "investigation and treatment decision, and the amber boxes wherever S Das, Bailey & Love " +
       "and SRB disagree.");

    app.innerHTML =
      '<p class="eyebrow">' + (CASE.kind === "long" ? "Long case " : "Short case ") + CASE.num +
      '</p>' +
      '<h1>' + esc(CASE.name) + '</h1>' +
      '<p class="sub">' + esc(blurb) + '</p>' +
      '<div class="tiles">' +
        '<button class="tile" id="goGuide">' +
          '<span class="ico">READ</span><span class="t-name">Study guide</span>' +
          '<span class="t-desc">Full case with rationale on every history question, examination ' +
          'finding, investigation and treatment decision. Set it up how you like to read, and ' +
          'highlight, annotate or write on it.</span>' +
          '<span class="t-go">&rarr;</span></button>' +
        (bankFor(CASE).length
          ? '<button class="tile" id="goViva">' +
            '<span class="ico">VIVA</span><span class="t-name">Viva drill</span>' +
            '<span class="t-desc">' + bankFor(CASE).length + ' questions across three levels. Tracks ' +
            'which kinds of question you miss and tells you what to revise.</span>' +
            '<span class="t-go">&rarr;</span></button>'
          : '<div class="tile muted">' +
            '<span class="ico">VIVA</span><span class="t-name">Viva drill</span>' +
            '<span class="t-desc">No scored drill for this case yet. The study guide ends with ' +
            'its own viva section: the questions are there with the answers hidden until you tap ' +
            'them, so answer out loud first.</span>' +
            '<span class="t-go">&middot;</span></div>') +
        '<button class="tile" id="goProgress">' +
          '<span class="ico">STATS</span><span class="t-name">Your progress</span>' +
          '<span class="t-desc">Everything drilled so far: coverage, accuracy by topic, and ' +
          'every past session.</span>' +
          '<span class="t-go">&rarr;</span></button>' +
        '<button class="tile" id="goPdf">' +
          '<span class="ico">PDF</span><span class="t-name">Printable PDF</span>' +
          '<span class="t-desc" id="pdfDesc">The whole study guide laid out for paper, with ' +
          'every answer opened.</span>' +
          '<span class="t-go">&darr;</span></button>' +
      '</div>' +
      '<p class="meta-line">' + line + '</p>';

    on("goGuide", "click", function () { go(screenGuide); });
    on("goPdf", "click", savePdf);
    if (bankFor(CASE).length) on("goViva", "click", function () { go(screenLevels); });
    on("goProgress", "click", function () { go(screenProgress); });
  }

  // ------------------------------------------------------------------ sign in


  // ------------------------------------------------------------------ levels

  function screenLevels() {
    // A case with no bank cannot be drilled. Without this, "Start a session" on such a case
    // ran another case's questions and filed them under this one's id.
    if (!bankFor(CASE).length) {
      app.innerHTML =
        '<div class="who"><span>' + esc(CASE.name) + '</span></div>' +
        '<h2>No scored drill yet</h2>' +
        '<p class="sub">This case has its study guide and its PDF. The scored viva, with ' +
        'levels and progress, has not been written for it yet.</p>' +
        '<div class="row"><button class="btn primary" id="read">Open the study guide</button>' +
        '<button class="btn" id="back2">Back</button></div>' + askHtml();
      on("read", "click", function () { replace(screenGuide); });
      on("back2", "click", function () { back(); });
      wireAsk();
      return;
    }
    var rec = studentRec(student.key);
    var hist = rec ? rec.sessions : [];
    var mine = hist.filter(function (s) { return s.caseId === CASE.id; });

    var html =
      '<div class="who"><span>Drilling as <b>' + esc(student.name) + '</b></span></div>' +
      '<h2>Choose your level</h2>' +
      '<p class="sub">Answer out loud, then mark yourself honestly, the summary is only useful ' +
      'if the marking is.</p><div class="levels">';

    LEVELS.forEach(function (L) {
      var n = bankFor(CASE).filter(function (q) { return q.lv === L.n; }).length;
      var past = mine.filter(function (s) { return s.level === L.n; });
      var meta = n + " questions";
      if (past.length) {
        meta += " · best " + Math.max.apply(null, past.map(function (s) { return s.pct; })) +
                "% · " + past.length + " attempt" + (past.length === 1 ? "" : "s");
      }
      html += '<button class="level" data-lv="' + L.n + '">' +
              '<span class="lv-name">' + esc(L.name) + '</span>' +
              '<span class="lv-desc">' + esc(L.desc) + '</span>' +
              '<span class="lv-meta">' + meta + '</span></button>';
    });
    html += '</div><div class="row"><button class="btn" id="seeProgress">Your progress</button>' +
            '<button class="btn" id="switch">Switch person</button></div>';

    app.innerHTML = html;
    [].forEach.call(app.querySelectorAll(".level"), function (b) {
      b.addEventListener("click", function () { startDrill(+b.dataset.lv); });
    });
    on("switch", "click", function () { reset(screenWelcome); });
    on("seeProgress", "click", function () { go(screenProgress); });
  }

  // ------------------------------------------------------------------ drill

  function startDrill(lv, inPlace) {
    level = lv;
    queue = shuffle(bankFor(CASE).filter(function (q) { return q.lv === lv; }).slice());
    idx = 0; results = []; results.recorded = false;
    // back from any question returns to the level list, not the previous question
    if (inPlace) replace(screenQuestion); else go(screenQuestion);
  }

  function head(q) {
    var pct = Math.round(idx / queue.length * 100);
    return '<div class="progress"><span>' + esc(LEVELS[level-1].name) + '</span>' +
           '<span>' + (idx + 1) + ' / ' + queue.length + '</span></div>' +
           '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
           '<span class="qtag">' + esc(q.type) + '</span>' +
           '<p class="question">' + esc(q.q) + '</p>';
  }

  function screenQuestion() {
    if (idx >= queue.length) { replace(screenSummary); return; }
    var q = queue[idx];
    app.innerHTML = head(q) +
      '<div class="row end"><button class="btn primary" id="reveal">Show the answer</button></div>';
    on("reveal", "click", function () { revealAnswer(q); });
  }

  function revealAnswer(q) {
    app.innerHTML = head(q) +
      '<div class="answer"><span class="tag">Answer</span>' + esc(q.a) +
      '<span class="ref">' + esc(q.ref) + '</span></div>' +
      '<div class="grade">' +
      '<button class="btn missed" id="no">I missed this</button>' +
      '<button class="btn got" id="yes">I had it</button></div>';
    on("yes", "click", function () { mark(q, true); });
    on("no", "click", function () { mark(q, false); });
  }

  function mark(q, ok) {
    results.push({ id: q.id, type: q.type, correct: ok });
    recordAnswer(q, ok);     // durable, before anything can navigate away
    idx++;
    screenQuestion();
  }

  // ------------------------------------------------------------------ summary

  function screenSummary() {
    var total = results.length;
    var score = results.filter(function (r) { return r.correct; }).length;
    var pct = total ? Math.round(score / total * 100) : 0;

    var byType = {};
    results.forEach(function (r) {
      if (!byType[r.type]) byType[r.type] = { ok: 0, n: 0 };
      byType[r.type].n++;
      if (r.correct) byType[r.type].ok++;
    });
    var types = Object.keys(byType).sort(function (a, b) {
      return (byType[a].ok / byType[a].n) - (byType[b].ok / byType[b].n);
    });
    var weakest = types.filter(function (t) { return byType[t].ok / byType[t].n < 0.7; });

    var rec = {
      studentKey: student.key, studentName: student.name,
      subject: SUBJECT, caseId: CASE.id, caseName: CASE.name,
      level: level, levelName: LEVELS[level-1].name,
      score: score, total: total, pct: pct,
      byType: byType, weakest: weakest,
      missed: results.filter(function (r) { return !r.correct; }).map(function (r) { return r.id; }),
      seen: results.map(function (r) { return r.id; }),
      at: new Date().toISOString()
    };
    // screenSummary is a render function and Back re-runs it, so recording here without a
    // guard wrote the same session again on every return, inflating attempts and the
    // completed-levels list and posting a duplicate row each time.
    if (!results.recorded) {
      results.recorded = true;
      recordSession(rec);
    }

    var html =
      '<div class="who"><span>Session complete · <b>' + esc(student.name) + '</b></span></div>' +
      '<h2>' + esc(LEVELS[level-1].name) + '</h2>' +
      '<p class="score">' + pct + '%<small> &nbsp;' + score + ' of ' + total + '</small></p>' +
      '<div class="breakdown">';
    types.forEach(function (t) {
      var d = byType[t], p = Math.round(d.ok / d.n * 100);
      html += '<div class="brow"><span class="bname">' + esc(t) + '</span>' +
              '<span class="bval">' + d.ok + '/' + d.n + '</span>' +
              '<span class="btrack"><i style="width:' + p + '%;background:' +
              (p >= 70 ? "var(--good)" : "var(--miss)") + '"></i></span></div>';
    });
    html += '</div>';
    html += weakest.length
      ? '<div class="verdict weak"><b>Work on ' + esc(weakest.join(", ")) + '.</b> Go back to ' +
        'those sections of the study guide before the next session.</div>'
      : '<div class="verdict strong"><b>Solid across every category.</b> Move up a level, or come ' +
        'back in a few days to test retention rather than recall.</div>';
    html += '<div class="row"><button class="btn" id="retry">Retry this level</button>' +
            '<button class="btn" id="levels">Another level</button>' +
            '<button class="btn primary" id="prog">Your progress</button></div>';

    app.innerHTML = html;
    on("retry", "click", function () { level = level; startDrill(level, true); });
    on("levels", "click", function () { replace(screenLevels); });
    on("prog", "click", function () { go(screenProgress); });

    syncSession(rec);
  }

  // ------------------------------------------------------------------ progress

  function screenProgress() {
    // a pull may still be in flight from sign-in; repaint once it lands
    if (SYNC && student.key && screenProgress._pulled !== student.key && !answersReady()) {
      // keyed by student, and only counted as done once the pull has actually succeeded,
      // so a failed pull no longer leaves the page showing "nothing drilled yet" forever
      screenProgress._pulled = student.key;
      pullAnswers(function () {
        if (!answersReady()) screenProgress._pulled = "";
        if (stack[stack.length - 1] === screenProgress) paint();
      });
    }

    var rec = studentRec(student.key);
    var sessions = (rec ? rec.sessions : []).filter(function (s) { return s.caseId === CASE.id; });
    sessions = sessions.slice().sort(function (a, b) { return new Date(b.at) - new Date(a.at); });

    var html = '<div class="who"><span>Progress for <b>' + esc(student.name) + '</b> · ' +
               esc(CASE.name) + '</span></div><h2>Where you stand</h2>';

    // Everything below is built from the per-question history rather than from finished
    // sessions. A single answered question counts, which is the whole point: this page used
    // to say "nothing here" to someone who had just answered three.
    var qs = answersForCase(student.key);
    var qids = Object.keys(qs);

    if (!qids.length && !sessions.length) {
      html += '<div class="empty">Nothing drilled yet for this case. Answer a single question ' +
              'and it is kept, so this page fills in as you go, even if you stop part way.</div>' +
              '<div class="row"><button class="btn primary" id="start">Start a session</button>' +
              '<button class="btn" id="switch">Switch person</button></div>' + askHtml();
      app.innerHTML = html;
      on("start", "click", function () { go(screenLevels); });
      on("switch", "click", function () { reset(screenWelcome); });
      wireAsk();
      return;
    }

    var agg = {}, totalQ = 0, totalOk = 0, wrongNow = [];
    qids.forEach(function (id) {
      var r = qs[id], t = r.t || "Uncategorised";
      if (!agg[t]) agg[t] = { ok: 0, n: 0 };
      agg[t].ok += r.ok; agg[t].n += r.n;
      totalQ += r.n; totalOk += r.ok;
      if (!r.last) wrongNow.push(id);
    });

    var seenCount = qids.length;
    var bankSize = bankFor(CASE).length;
    var coverage = bankSize ? Math.round(seenCount / bankSize * 100) : 0;
    var overall = totalQ ? Math.round(totalOk / totalQ * 100) : 0;
    var best = sessions.length
      ? Math.max.apply(null, sessions.map(function (s) { return s.pct; })) : null;

    html += '<div class="stats">' +
      '<div class="stat"><div class="sv">' + seenCount +
        '<span style="font-size:.6em;color:var(--ink-soft)">/' + bankSize + '</span></div>' +
        '<div class="sl">questions met (' + coverage + '%)</div></div>' +
      '<div class="stat"><div class="sv">' + overall + '%</div>' +
        '<div class="sl">answered right, all attempts</div></div>' +
      '<div class="stat"><div class="sv">' + wrongNow.length + '</div>' +
        '<div class="sl">wrong last time</div></div>' +
      '<div class="stat"><div class="sv">' + (best === null ? '&mdash;' : best + '%') + '</div>' +
        '<div class="sl">' + (best === null ? 'no full level yet' : 'best full level') + '</div></div>' +
      '</div>';

    if (wrongNow.length) {
      var byTypeWrong = {};
      wrongNow.forEach(function (id) {
        var t = qs[id].t || "Uncategorised";
        byTypeWrong[t] = (byTypeWrong[t] || 0) + 1;
      });
      var parts = Object.keys(byTypeWrong).sort(function (a, b) {
        return byTypeWrong[b] - byTypeWrong[a];
      }).map(function (t) { return byTypeWrong[t] + " in " + t.toLowerCase(); });
      html += '<div class="verdict weak"><b>' + wrongNow.length + ' question' +
              (wrongNow.length === 1 ? '' : 's') + ' you got wrong the last time you met ' +
              (wrongNow.length === 1 ? 'it' : 'them') + ':</b> ' + esc(parts.join(", ")) +
              '. These are the ones worth going back to first.</div>';
    }

    if (bankSize && seenCount >= bankSize) {
      html += '<div class="verdict info"><b>You have been through every question in this case.</b> ' +
              'Repeating them now tests retention rather than recall, which is the more useful ' +
              'thing this close to an exam. If you want more, ask for the bank to be extended, ' +
              'your results are kept, so new questions slot in alongside these.</div>';
    }

    // cumulative accuracy by topic
    var types = Object.keys(agg).sort(function (a, b) {
      return (agg[a].ok / agg[a].n) - (agg[b].ok / agg[b].n);
    });
    html += '<h3>Accuracy by topic, every attempt</h3><div class="breakdown">';
    types.forEach(function (t) {
      var d = agg[t], p = Math.round(d.ok / d.n * 100);
      html += '<div class="brow"><span class="bname">' + esc(t) + '</span>' +
              '<span class="bval">' + d.ok + '/' + d.n + ' · ' + p + '%</span>' +
              '<span class="btrack"><i style="width:' + p + '%;background:' +
              (p >= 70 ? "var(--good)" : "var(--miss)") + '"></i></span></div>';
    });
    html += '</div>';

    var weak = types.filter(function (t) { return agg[t].ok / agg[t].n < 0.7; });
    if (weak.length) {
      html += '<div class="verdict weak"><b>Consistently weak: ' + esc(weak.join(", ")) + '.</b> ' +
              'These are the sections of the study guide to reread before the next session.</div>';
    }

    html += '<h3>Completed levels</h3><div class="hist">';
    if (!sessions.length) {
      html += '<div class="empty" style="margin:0">No level finished end to end yet. Your ' +
              'answers so far are all kept either way, this list is just the full runs.</div>';
    }
    sessions.forEach(function (s) {
      html += '<div class="hrow"><span class="hl">' + esc(s.levelName || ("Level " + s.level)) + '</span>' +
              '<span class="hd">' + esc(when(s.at)) + '</span>' +
              '<span class="hp ' + (s.pct >= 70 ? 'ok' : 'bad') + '">' + s.pct + '%</span></div>';
    });
    html += '</div>';

    html += '<div class="row" style="margin-top:1.4rem">' +
            '<button class="btn primary" id="again">Drill again</button>' +
            '<button class="btn" id="switch">Switch person</button></div>';

    html += askHtml();

    app.innerHTML = html;
    on("again", "click", function () { replace(screenLevels); });
    on("switch", "click", function () { reset(screenWelcome); });
    wireAsk();
  }

  function brownieLine() {
    var s = store();
    var seen = Array.isArray(s.brownieSeen) ? s.brownieSeen : [];
    if (seen.length >= BROWNIE_LINES.length) seen = [];     // been through them all, start again
    var pool = [];
    for (var i = 0; i < BROWNIE_LINES.length; i++) {
      if (seen.indexOf(i) === -1) pool.push(i);
    }
    var pick = pool[Math.floor(Math.random() * pool.length)];
    seen.push(pick);
    s.brownieSeen = seen;
    save(s);
    return BROWNIE_LINES[pick];
  }

  var BROWNIE_SVG =
    '<svg viewBox="0 0 40 30" width="40" height="30" aria-hidden="true">' +
    '<rect x="1" y="4" width="38" height="24" rx="4" fill="#5a3620"></rect>' +
    '<rect x="1" y="4" width="38" height="7" rx="4" fill="#6b422a"></rect>' +
    '<circle cx="11" cy="15" r="2.4" fill="#2f1b10"></circle>' +
    '<circle cx="24" cy="12" r="2" fill="#2f1b10"></circle>' +
    '<circle cx="30" cy="20" r="2.6" fill="#2f1b10"></circle>' +
    '<circle cx="17" cy="22" r="1.8" fill="#2f1b10"></circle>' +
    '</svg>';

  function showBrownieNote() {
    if (student.key !== "hitha") return;
    if (document.querySelector(".brownie")) return;

    var box = document.createElement("div");
    box.className = "brownie";
    box.setAttribute("role", "button");
    box.tabIndex = 0;
    box.innerHTML = '<span class="brownie-txt"></span>';
    box.querySelector(".brownie-txt").textContent = brownieLine();
    document.body.appendChild(box);
    setTimeout(function () { box.classList.add("in"); }, 16);

    var done = false;
    function dismiss() {
      if (done) return;
      done = true;
      box.classList.add("paid");
      box.innerHTML = BROWNIE_SVG;
      setTimeout(function () { box.classList.add("gone"); }, 1500);
      setTimeout(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 2100);
    }
    box.addEventListener("click", dismiss);
    box.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); dismiss(); }
    });

  // ------------------------------------------------- asking for better questions
  //
  // The viva bank was written without the people who use it, so nothing in the system knows
  // whether a level is pitched right, which case needs more questions, or which question is
  // wrong. This is the only channel that can say so. It is stored locally first and retried,
  // like everything else here, because a request typed on ward wifi should not evaporate.

  function askHtml() {
    return '<div class="ask"><h3>Ask for different questions</h3>' +
           '<textarea id="askbox" rows="3" placeholder="Harder anatomy. More on complications. ' +
           'This question is wrong."></textarea>' +
           '<div class="row end"><button class="btn" id="asksend">Send</button></div>' +
           '<p class="asknote" id="asknote"></p></div>';
  }

  function wireAsk() {
    var box = document.getElementById("askbox");
    var note = document.getElementById("asknote");
    if (!box) return;

    on("asksend", "click", function () {
      var text = box.value.trim();
      if (!text) { box.focus(); return; }

      var rec = {
        id: newId(), studentKey: student.key, subject: SUBJECT, caseId: CASE.id,
        body: text.slice(0, 4000), at: new Date().toISOString(), sent: false
      };
      var s = store();
      s.asks = (s.asks || []).concat([rec]).slice(-200);
      save(s);
      // save() swallows a storage failure, so check rather than assume: if the record did
      // not land, sendAsks has nothing to read and the message is gone.
      var kept = ((store().asks || []).filter(function (a) { return a.id === rec.id; })).length > 0;

      box.value = "";
      note.textContent = "Sending...";
      // Say it has been sent when it has been sent, not when the button was pressed. This
      // said "Noted, thank you" before the request left, and said it just the same when
      // storage had failed and nothing was ever sent at all.
      sendAsk(rec).then(function (ok) {
        if (ok) note.textContent = "Thank you. It goes into the next revision of this case.";
        else if (kept) note.textContent = "No connection just now. It is saved and will go when you are back online.";
        else { note.textContent = "That did not save. Please try again."; box.value = rec.body; }
      });
    });
  }

  // Takes the record itself rather than re-reading storage, so a message still goes out
  // when the browser refused to store it. Resolves true only when the worker accepted it.
  function sendAsk(a) {
    if (!SYNC || !a || !a.studentKey) return Promise.resolve(false);
    return fetch(SYNC + "/api/feedback?student=" + encodeURIComponent(a.studentKey), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ id: a.id, subject: a.subject, caseId: a.caseId,
                             body: a.body, at: a.at })
    }).then(function (r) {
      if (!r.ok) return false;
      var s2 = store();
      (s2.asks || []).forEach(function (x) { if (x.id === a.id) x.sent = true; });
      save(s2);
      return true;
    }).catch(function () { return false; });   // offline; it goes on the next open
  }

  function sendAsks() {
    if (!SYNC) return;
    var s = store();
    var pending = (s.asks || []).filter(function (a) { return a && !a.sent && a.studentKey; });
    pending.slice(-20).forEach(sendAsk);
  }

  // ------------------------------------------------------------------ sync

  // Saving is not something the reader needs told. It happens on every mark, it happens
  // again on leaving, and saying so in a footer only suggests it might not have.
  function syncSession(rec) {
    if (!dbReady || !db) return;        // the website path; recordSession has already stored it
    var id = rec.at.replace(/[^0-9]/g, "") + "-" + Math.random().toString(36).slice(2, 7);
    db.collection("sessions").doc(id).set(rec).catch(function () {});
  }

  // ------------------------------------------------------------------ study guide

  var guideCache = {};   // keyed by case id: the hub keeps every guide the student has opened

  function screenGuide() {
    app.innerHTML = '<div class="loading">Opening the study guide…</div>';

    function mount(html) {
      app.innerHTML = '<div class="readerwrap"><div class="guide" id="guideRoot">' + html + '</div></div>';
      var root = document.getElementById("guideRoot");
      var opts = { guide: root, doc: CASE.id, student: student.key || "_",
                   syncRoot: true, onTheme: function () { renderTopbar(); } };
      if (window.ReaderBoot) window.ReaderBoot(opts);
      else if (window.Reader && window.Reader.remount) window.Reader.remount(opts);
    }

    var id = CASE.id;
    if (guideCache[id]) { mount(guideCache[id]); return; }

    fetch(guideBodyFile(CASE))
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (txt) { guideCache[id] = txt; return txt; })
      // mount separately: chaining it meant any error it threw was reported as "the request
      // did not come back", which sent me hunting a network fault for a plain ReferenceError
      .then(function (txt) { mount(txt); })
      .catch(function (err) {
        if (window.console && console.error) console.error("guide failed to open:", err);
        app.innerHTML =
          '<h2>The study guide could not load</h2>' +
          '<p class="sub">It is published alongside this page but the request did not ' +
          'come back. Reloading usually fixes it. The PDF on the case page has the same ' +
          'content and does not depend on this.</p>' +
          '<div class="row"><button class="btn primary" id="retry">Try again</button></div>';
        on("retry", "click", function () { go(screenGuide); });
      });
  }

  // ------------------------------------------------------------------ pdf

  var IN_ARTIFACT = !!(window.claude && window.claude.use);

  function savePdf() {
    var d = document.getElementById("pdfDesc");
    function say(msg) { if (d) d.textContent = msg; }

    // On the web the sandbox restrictions do not apply, so just open it.
    var file = pdfFile(CASE);

    if (!IN_ARTIFACT) {
      window.open(file, "_blank", "noopener");
      return;
    }

    say("Fetching the PDF…");
    fetch(file)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
      .then(function (blob) {
        return window.claude.use("downloads").then(function (dl) {
          if (!dl) throw new Error("not granted");
          return dl.save({ filename: file, data: blob });
        });
      })
      .then(function () { say("Saved. The whole study guide laid out for paper."); })
      .catch(function () {
        say("Could not save it here, open the study guide above and print it instead, " +
            "which produces the same pages.");
      });
  }

  // ------------------------------------------------------------------ welcome

  function screenWelcome() {
    var others = allStudents();
    var last = store().lastStudent;
    var saved = (last && studentRec(last)) ? studentRec(last).name : "";

    var html =
      '<p class="eyebrow">' + esc(SUBJECT) + ' · MBBS final year</p>' +
      '<h1>Surgery Case Files</h1>' +
      '<label class="fld" for="nm">Your name</label>' +
      '<input type="text" id="nm" autocomplete="off" placeholder="Name" value="' + esc(saved) + '">';

    if (others.length) {
      html += '<div class="known">' + others.map(function (o) {
        return '<button data-k="' + esc(o.key) + '">' + esc(o.name) + '</button>';
      }).join("") + '</div>';
    }
    html += '<div class="row end" style="margin-top:1.3rem">' +
            '<button class="btn primary" id="go">Continue</button></div>';
    app.innerHTML = html;

    function enter(name) {
      var v = String(name).trim();
      if (!v) { document.getElementById("nm").focus(); return; }
      student = { key: keyOf(v), name: v };
      var st = store();
      st.students = st.students || {};
      if (st.students[student.key]) student.name = st.students[student.key].name;
      else st.students[student.key] = { name: student.name, sessions: [] };
      st.lastStudent = student.key;
      save(st);
      if (window.Reader && window.Reader.setStudent) window.Reader.setStudent(student.key);
      // take what the server already has before this device writes anything, so a fresh or
      // evicted browser cannot push its empty counters over a real history
      pullAnswers();
      sendAsks();
      reset(screenIndex);
      showBrownieNote();
    }
    on("go", "click", function () { enter(document.getElementById("nm").value); });
    document.getElementById("nm").addEventListener("keydown", function (e) {
      if (e.key === "Enter") enter(this.value);
    });
    [].forEach.call(app.querySelectorAll(".known button"), function (b) {
      b.addEventListener("click", function () {
        var r = studentRec(b.dataset.k);
        enter(r ? r.name : b.dataset.k);
      });
    });
    document.getElementById("nm").focus();
  }

  // ------------------------------------------------------------------ boot

  reset(screenWelcome);

  // Anything finished while offline goes up now. Deliberately after the first paint, so a
  // slow or failing network never delays the screen the reader is waiting for.
  setTimeout(flushSessions, 1200);
  setTimeout(pushAnswers, 1400);
  setTimeout(sendAsks, 1600);

  // A phone does not reliably fire unload, but it does fire this when the tab is hidden or
  // the app is backgrounded, which is how a session on a phone actually ends.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") { pushAnswers(); flushSessions(); sendAsks(); }
  });

  if (window.claude && window.claude.use) {
    window.claude.use("db").then(function (d) { db = d; dbReady = true; })
                           .catch(function () { db = null; dbReady = true; });
  } else { dbReady = true; }
})();
</script>
